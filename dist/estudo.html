  q: 'O princípio de “holism” da General Systems Theory diz que…',
  o: ['cada componente deve ser otimizado isoladamente', 'o todo é maior do que a soma das partes', 'um sistema fechado não troca nada com o ambiente', 'o output de um sistema volta a ser input'], a: 1,
  e: '**Holism**: o todo é maior do que a soma das partes. Por isso olhamos para relações e interações, não só para componentes.', w: { 3: 'Isso é feedback.', 2: 'Isso é a definição de sistema fechado.' } },
{ id: 'sys-05', t: 'sys', l: 1, les: 'sys-thinking',
  q: 'Os sistemas de engenharia (ex.: um sistema de TI de uma empresa) são tipicamente…',
  o: ["fechados, para poderem ser testados de forma controlada", "abertos, porque trocam algo com o ambiente", "homeostáticos por definição, porque se autorregulam", "naturais, porque seguem leis físicas e não regras humanas"], a: 1,
  e: 'Engenharia lida com **sistemas abertos**: interagem com utilizadores, outros sistemas, leis e ameaças. Reconhecer essa abertura é o que permite identificar fatores externos que geram requisitos.' },
{ id: 'sys-06', t: 'sys', l: 1, les: 'sys-uod', src: 'Slides 00b, p.28',
  q: 'O que é o Universe of Discourse (UoD)?',
  o: ["O diagrama final da arquitetura, aprovado pelos stakeholders", "Tudo o que é pertinente ao sistema; a fonte dos requisitos", "A lista completa de stakeholders e respetivas concerns", "O conjunto de testes de aceitação acordado com o cliente"], a: 1,
  e: 'O **UoD** é a fonte de onde derivam os requisitos: tudo o que é relevante para perceber o problema e o ambiente. Não é produto da análise, é o seu foco, e é **dinâmico**.' },
{ id: 'sys-07', t: 'sys', l: 1, les: 'sys-uod',
  q: 'O “system domain” refere-se a…',
  o: ["o ambiente externo que influencia o sistema sem dele fazer parte", "o ambiente interno: entidades, regras e relações do problema", "o domínio de Internet e a infraestrutura onde o sistema corre", "o conjunto de stakeholders e dos seus interesses no sistema"], a: 1,
  e: '**Domain = interno** (entidades, relações, regras de negócio, representado num domain model). **Context = externo** (atores, leis e fatores fora da fronteira).' },
{ id: 'sys-08', t: 'sys', l: 1, les: 'sys-models', src: 'Slides 00b, p.24',
  q: 'Na definição dada nas aulas, um modelo é…',
  o: ["uma cópia completa e fiel da realidade, sem omissões", "um artefacto que representa algo, para o compreender e comunicar", "sempre um diagrama UML ou BPMN com semântica formal", "o código-fonte gerado automaticamente a partir dos requisitos"], a: 1,
  e: 'Um **modelo é um artefacto que representa algo** e ajuda as pessoas a conhecer, compreender e comunicar o que representa. É seletivo, nunca uma cópia completa.' },
{ id: 'sys-09', t: 'sys', l: 1, les: 'sys-models', src: 'Slides 00b, p.26',
  q: 'Para que serve o RoME (Return on Modelling Effort)?',
  o: ["Para calcular o custo das licenças das ferramentas de modelação", "Como critério de paragem: benefício do modelo face ao esforço", "Para medir quantos diagramas cada stakeholder consegue ler", "Para converter automaticamente os modelos em código executável"], a: 1,
  e: 'O **RoME** é como um ROI aplicado à modelação: quanto ganho a melhorar este modelo, face ao esforço? Quando deixa de compensar, **paras**.' },
{ id: 'sys-10', t: 'sys', l: 1, les: 'sys-42010', src: 'Notas 2.13',
  q: 'Em vez de definir “system”, a norma ISO/IEC/IEEE 42010 introduz o conceito de…',
  o: ['Entity of Interest (EoI)', 'System of Record', 'Universe of Discourse', 'Bounded Context'], a: 0,
  e: 'A 42010 evita uma definição de “system” presa a um domínio e usa **Entity of Interest**: pode ser um sistema físico, software, um processo, uma empresa inteira…' },
{ id: 'sys-11', t: 'sys', l: 2, les: 'sys-thinking',
  q: 'Um termóstato liga o aquecimento quando a temperatura desce e desliga-o quando sobe. Que tipo de feedback é?',
  o: ['Feedback positivo: amplifica a mudança', 'Feedback negativo: estabiliza o sistema', 'Emergence', 'Holism'], a: 1,
  e: 'O output (temperatura) volta como input e corrige o desvio: isso é **feedback negativo**, que **estabiliza**. O positivo **amplifica** (ex.: microfone junto à coluna).' },
{ id: 'sys-12', t: 'sys', l: 2, les: 'sys-thinking',
  q: 'Um sistema crítico mantém a funcionalidade sob stress graças a mecanismos internos de regulação. Que conceito da GST é?',
  o: ['Homeostasis', 'Emergence', 'Open system', 'Decomposition'], a: 0,
  e: '**Homeostasis**: capacidade de manter estabilidade através de mecanismos internos de regulação. Em requisitos, leva a requisitos de robustez e fiabilidade sob falha.' },
{ id: 'sys-13', t: 'sys', l: 2, les: 'sys-cynefin',
  q: 'No Cynefin, construir um edifício (muitas variáveis e peritos, mas planeável com métodos conhecidos) é um problema…',
  o: ['Simple (clear)', 'Complicated', 'Complex', 'Chaotic (wicked)'], a: 1,
  e: '**Complicated**: exige perícia e análise, mas é resolúvel e planeável. Complex = causa-efeito só se percebe depois (experimentar). Wicked = conflito de stakeholders, sem solução certa.' },
{ id: 'sys-14', t: 'sys', l: 2, les: 'sys-cynefin',
  q: 'Uma reforma do sistema de saúde, com stakeholders em conflito e soluções que são “melhores ou piores” e nunca certas, é tipicamente…',
  o: ["Simple, porque há boas práticas conhecidas", "Complicated, porque basta juntar peritos", "Chaotic / wicked", "Confusion, porque ninguém sabe o domínio"], a: 2,
  e: 'Nas notas, **Chaotic / Wicked**: sem relação causa-efeito clara, socialmente complexo, interesses em conflito, soluções com consequências não intencionais. Pobreza e reforma da saúde são os exemplos dados.' },
{ id: 'sys-15', t: 'sys', l: 2, les: 'sys-42010',
  q: 'Qual a diferença entre viewpoint e view?',
  o: ["São sinónimos na ISO 42010 e usam-se indistintamente", "Viewpoint: convenções para tratar concerns; view: a representação concreta", "A view é a especificação e o viewpoint é o diagrama resultante", "O viewpoint pertence a um stakeholder e a view pertence ao sistema"], a: 1,
  e: '**Viewpoint** = a “receita”: convenções, linguagem e model kinds para tratar certas concerns. **View** = o produto: a arquitetura desta EoI vista por esse viewpoint. O viewpoint governa, a view mostra.' },
{ id: 'sys-16', t: 'sys', l: 2, les: 'sys-views', src: 'Slides 00b, p.41',
  q: 'Porque é que structure e behaviour são tratados como viewpoints separados?',
  o: ["Porque a norma UML obriga a separar os diagramas em dois tipos", "Porque as suas concerns se podem, na prática, tratar em separado", "Porque o comportamento só existe em sistemas de software", "Porque a estrutura muda muito mais depressa do que o comportamento"], a: 1,
  e: 'Assume-se que estrutura e comportamento se relacionam com concerns que, na maior parte das vezes, se podem tratar **separadamente**: é a **separação ortogonal de concerns**.' },
{ id: 'sys-17', t: 'sys', l: 2, les: 'sys-views', src: 'Slides 00b, p.48–50',
  q: 'Num context diagram, o que representam as associações entre os stakeholders e o sistema?',
  o: ['Os fluxos de dados técnicos', 'As concerns de cada stakeholder', 'A herança entre stakeholders', 'A ordem temporal das interações'], a: 1,
  e: 'O sistema aparece como **caixa negra** e as **associações** (rotuladas com verbo, substantivo ou verbo+substantivo) exprimem as **concerns** de cada stakeholder. Os stakeholders identificam-se por um substantivo.' },
{ id: 'sys-18', t: 'sys', l: 2, les: 'sys-views', src: 'Slides 00b, p.48',
  q: 'Num context diagram, um “enabling system” é…',
  o: ["um stakeholder com concerns explícitas que exigem use cases próprios", "um sistema que fornece matéria, energia ou informação, sem concerns explícitas", "um subsistema interno, desenhado dentro da caixa do sistema de interesse", "o sistema to-be que vai substituir o sistema atual no fim do projeto"], a: 1,
  e: '**Enabling systems** existem e fornecem algo necessário (energia, informação, matéria), mas não criam concerns explícitas que exijam use cases definidos.' },
{ id: 'sys-19', t: 'sys', l: 2, les: 'sys-lifecycle',
  q: 'No ciclo PDCA, a atividade de “Understanding” (análise) está associada principalmente a que fases?',
  o: ['Do e Act', 'Plan e Check', 'Plan e Do', 'Check e Act'], a: 1,
  e: '**Understanding = Plan + Check** (perceber o problema, validar o estado atual face ao desejado). **Doing = Do + Act** (desenhar e implementar). Na fase de análise não se criam soluções tangíveis.' },
{ id: 'sys-20', t: 'sys', l: 2, les: 'sys-lifecycle',
  q: 'Que método é mais indicado para sistemas safety-critical (aeroespacial, dispositivos médicos) por enfatizar verificação e validação em cada fase?',
  o: ['Agile Systems Engineering', 'V-Model', 'Ad-hoc', 'MAPE-K'], a: 1,
  e: 'O **V-Model** estende o waterfall emparelhando cada fase de desenvolvimento com a respetiva verificação ou validação. É útil quando cada componente tem de estar certo antes de avançar.' },
{ id: 'sys-21', t: 'sys', l: 2, les: 'sys-lifecycle',
  q: 'Qual a diferença essencial entre MBSE e MDE?',
  o: ["MBSE usa só documentos de texto e MDE usa só diagramas visuais", "MBSE: modelos no centro do ciclo de vida; MDE: modelos que geram código", "MDE aplica-se só a hardware e sistemas físicos; MBSE só a software", "Não há diferença: são dois nomes comerciais para a mesma abordagem"], a: 1,
  e: '**MBSE**: modelos como artefacto central desde os requisitos até à validação (não são só documentação). **MDE**: um passo além, com modelos **executáveis** que geram código (ex.: BPMN executado num motor como o Camunda).' },
{ id: 'sys-22', t: 'sys', l: 3, les: 'sys-views', src: 'Slides 00b, p.46',
  q: 'Um rato carregou no botão para receber comida 99 vezes. Ao 100.º ensaio não carrega. Que tipo de modelo explica isto?',
  o: ["Um modelo black-box, porque relaciona inputs com outputs", "Um modelo white-box, porque considera um objetivo interno", "Nenhum: é ruído experimental que se deve descartar", "Um context diagram, porque mostra o rato e o ambiente"], a: 1,
  e: 'Um modelo **black-box** daria sempre a mesma resposta ao mesmo estímulo. Só o **white-box**, que modela o estado e o objetivo interno, explica porque a mesma perturbação produz respostas diferentes em momentos diferentes.' },
{ id: 'sys-23', t: 'sys', l: 3, les: 'sys-boundary',
  q: 'Num sistema de marcações hospitalares em que o doente é externo, qual destas frases é um requisito de sistema bem formado?',
  o: ["“O doente deve fornecer sempre um número de telefone válido.”", "“O sistema deve validar o contacto do doente antes de confirmar.”", "“Os doentes queixam-se de esperar demasiado tempo ao telefone.”", "“A marcação vai ser feita numa app móvel em React Native.”"], a: 1,
  e: 'Um requisito atribui uma **obrigação a algo dentro da fronteira**. O doente é externo, por isso a frase sobre ele é uma assumption ou regra de participação. A queixa é evidência; a app em React Native é uma decisão de design.',
  w: { 0: 'O doente está fora da fronteira: o sistema não o controla, por isso não pode ser obrigado.', 2: 'É uma queixa (evidência do UoD), ainda não um requisito.', 3: 'É uma decisão de design (solução), não um requisito do problema.' } },
{ id: 'sys-24', t: 'sys', l: 3, les: 'sys-uod',
  q: 'Num sistema de controlo de um veículo autónomo (AVCS), onde ficam as leis de trânsito, os peões e o estado da estrada?',
  o: ['No system domain', 'No system context', 'Fora do UoD', 'Na system boundary'], a: 1,
  e: 'São **fatores externos** que impõem restrições e requisitos: **contexto**. O domínio é a representação interna que o AVCS usa (conceitos de estrada, veículo, sinal e as suas relações).' },
{ id: 'sys-25', t: 'sys', l: 3, les: 'sys-cases',
  q: 'Os atrasos do Airbus A380 foram causados por equipas a usar versões incompatíveis de software CAD. Que lição de SysEng ilustram?',
  o: ["Obsolescência planeada imposta pela estratégia de negócio", "Consistência de modelos entre equipas", "Falta de treino dos utilizadores finais no novo sistema", "Wicked problems sociais causados por ignorar o contexto local"], a: 1,
  e: 'As notas apresentam o A380 como caso de **consistência de modelos**: pequenos desalinhamentos entre modelos de equipas diferentes têm consequências enormes.' },
{ id: 'sys-26', t: 'sys', l: 3, les: 'sys-42010',
  q: 'Uma empresa nunca documentou a sua arquitetura. O que é correto dizer?',
  o: ["A empresa não tem arquitetura enquanto não a documentar", "Exibe uma arquitetura; falta-lhe uma architecture description", "Só passa a ter arquitetura depois de modelada em ArchiMate", "A arquitetura e o diagrama são exatamente a mesma coisa"], a: 1,
  e: 'Um sistema **exibe** uma arquitetura, documentada ou não. A **architecture description** é o artefacto que a representa. Na linguagem do dia a dia diz-se “arquitetura” quando, a rigor, se quer dizer a sua representação.' },
{ id: 'sys-27', t: 'sys', l: 3, les: 'sys-boundary',
  q: 'Num sistema composto, o que distingue um port (interaction point) de uma interface?',
  o: ["São a mesma coisa com nomes diferentes conforme a linguagem", "O port é onde se interage; a interface especifica a interação", "A interface é sempre física e o port é sempre lógico", "O port liga dois sistemas e a interface é um tipo de port"], a: 1,
  e: '**Interface** = o “contrato” (o que pode ser fornecido, pedido ou trocado). **Port** = o ponto de interação onde essa interface está disponível. Um **path/connector** liga pontos de interação.' },
{ id: 'sys-28', t: 'sys', l: 4, les: 'sys-uod',
  q: 'Qual destas afirmações sobre o UoD é FALSA?',
  o: ['É a fonte de onde derivam os requisitos', 'É dinâmico e pode evoluir durante a análise', 'É o produto final do processo de análise de requisitos', 'Ajuda a criar uma linguagem comum entre stakeholders'], a: 2, fixed: false,
  e: 'As notas insistem: o UoD **não é um produto** da análise. É o **foco** da análise e a fonte dos requisitos. As restantes afirmações são verdadeiras.' },
{ id: 'sys-29', t: 'sys', l: 4, les: 'sys-models',
  q: 'Segundo Parker (2011), um modelo adequado é aquele que…',
  o: ["acertou numa previsão importante pelo menos uma vez", "tem as propriedades certas para os propósitos de interesse", "tem o maior número possível de elementos e relações", "foi validado e assinado por todos os stakeholders"], a: 1,
  e: 'A adequação vem das **propriedades** do modelo face ao **propósito**, e não de um acerto acidental (“a one-off accurate prediction”).' },
{ id: 'sys-30', t: 'sys', l: 4, les: 'sys-boundary', a: [0, 2],
  q: 'Seleciona TODAS as afirmações corretas sobre a fronteira de um sistema.',
  o: ['É uma decisão conceptual tomada em função das concerns', 'Tem de coincidir com os limites de uma aplicação de software', 'Alterá-la muda as responsabilidades que se podem atribuir ao sistema', 'É igual à fronteira do projeto'],
  e: 'A fronteira é **conceptual** (não tem de seguir aplicações, departamentos ou edifícios) e **mudá-la muda as obrigações atribuíveis**. A fronteira do **projeto** é outra coisa: o projeto pode mudar só parte do sistema.' },
{ id: 'sys-31', t: 'sys', l: 4, les: 'sys-lifecycle',
  q: 'Qual é a diferença entre PDCA e MAPE-K?',
  o: ["PDCA aplica-se a software e MAPE-K aplica-se a hardware", "PDCA é melhoria guiada por humanos; MAPE-K é autoadaptação automática", "MAPE-K não é iterativo, ao contrário do PDCA, que é um ciclo", "São idênticos: MAPE-K é só o nome moderno do PDCA"], a: 1,
  e: '**MAPE-K** (Monitor, Analyse, Plan, Execute sobre Knowledge) é usado em computação autonómica (cloud, sistemas self-managing). O **PDCA** (Shewhart/Deming) é melhoria contínua conduzida por pessoas.' },
{ id: 'sys-32', t: 'sys', l: 4, les: 'sys-cases',
  q: 'No caso Boeing 737 Max, que combinação de fatores é apontada nas notas?',
  o: ["Equipas a usar versões incompatíveis de software CAD", "MCAS com um só sensor, pouca documentação e pilotos sem treino", "Mudanças de requisitos pelo cliente a meio da construção", "Um cartel de fabricantes a limitar a vida útil do produto"], a: 1,
  e: 'O 737 Max junta **requisitos incompletos**, **dependência de um sensor**, falta de **comunicação com os utilizadores finais** (os pilotos) e **ética/governança**. O marketing dizia que não era preciso treino em simulador.' },
]);

/* --- courses/ams/questions/req.js --- */
STUDY.questions('ams', [
/* ===== REQUIREMENTS ===== */
{ id: 'req-01', t: 'req', l: 1, les: 'req-basics',
  q: 'Qual é a progressão típica (não linear) da análise de requisitos, segundo as notas?',
  o: ["Requisito → evidência → design → objetivo, nesta ordem fixa", "Evidência → necessidade → objetivo → requisito → design", "Design → requisito → teste → evidência, num ciclo iterativo", "Objetivo → design → requisito → evidência, de cima para baixo"], a: 1,
  e: 'Parte-se da **evidência** do UoD, identificam-se **concerns e necessidades**, formulam-se **objetivos**, depois **requisitos** (obrigações) e só então **design**. Na prática há idas e voltas.' },
{ id: 'req-02', t: 'req', l: 1, les: 'req-basics',
  q: 'O que distingue um requisito de um simples desejo ou objetivo?',
  o: ["Usar sempre a palavra “shall” ou “deve”", "Impor uma obrigação a um alvo identificado", "Ser escrito e assinado por um gestor", "Estar registado num documento formal"], a: 1,
  e: 'Um requisito **estabelece uma obrigação sobre uma entidade identificada** (quem tem de cumprir). “Shall” não basta para ser um bom requisito.' },
{ id: 'req-03', t: 'req', l: 1, les: 'req-kinds',
  q: '“O sistema deve responder a 95% dos pedidos em menos de 2 segundos.” Que tipo de requisito é?',
  o: ["Functional, porque descreve o que o sistema faz", "Quality (não funcional)", "Constraint, porque limita a solução técnica", "Assumption sobre a carga esperada"], a: 1,
  e: 'Diz **quão bem** o sistema faz algo, de forma mensurável: é um requisito de **qualidade** (desempenho).' },
{ id: 'req-04', t: 'req', l: 1, les: 'req-kinds',
  q: '“A aplicação tem de ser desenvolvida em Java, por imposição contratual do cliente.” Que tipo de requisito é?',
  o: ['Functional', 'Quality', 'Constraint', 'User story'], a: 2,
  e: 'Uma **constraint** restringe a solução, o processo ou o ambiente permitidos. Aqui limita a tecnologia por obrigação contratual.' },
{ id: 'req-05', t: 'req', l: 1, les: 'req-vv',
  q: 'Validation responde à pergunta…',
  o: ['“Estamos a construir bem o sistema?”', '“Estamos a construir o sistema certo?”', '“O código compila?”', '“Os requisitos estão numerados?”'], a: 1,
  e: '**Validation** = o sistema certo (face aos propósitos e ao uso pretendido). **Verification** = o sistema bem feito (face aos requisitos e regras acordadas).' },
{ id: 'req-06', t: 'req', l: 2, les: 'req-basics',
  q: 'Numa entrevista, um gestor diz: “Os doentes faltam muito às consultas.” Isto é…',
  o: ["um requisito funcional implícito que falta escrever", "evidência: uma queixa sobre a situação atual", "uma constraint imposta pela gestão do hospital", "uma decisão de design que já foi tomada"], a: 1,
  e: 'É uma **queixa**, evidência sobre a situação. Daqui pode sair uma necessidade (reduzir faltas), um objetivo e só depois requisitos (ex.: enviar lembretes).' },
{ id: 'req-07', t: 'req', l: 2, les: 'req-kinds',
  q: '“Verificável” significa que um requisito tem de ser testado executando software?',
  o: ["Sim, sempre: só a execução de software é evidência", "Não: também por inspeção, análise ou demonstração", "Só se for um requisito funcional", "Só se for um requisito de qualidade mensurável"], a: 1,
  e: 'As notas sublinham que verificável **não** obriga a execução de software. **Inspeção, análise, demonstração** e **teste** são todas formas válidas de evidência.' },
{ id: 'req-08', t: 'req', l: 2, les: 'req-kinds', a: [0, 2, 3],
  q: 'Seleciona TODAS as propriedades de um bom CONJUNTO de requisitos (não de um requisito individual).',
  o: ['Consistente (sem contradições)', 'Atómico', 'Sem redundância', 'Suficientemente completo'],
  e: 'Um **conjunto** deve ser suficientemente completo, **consistente**, **sem redundância**, priorizado e compatível com a fronteira. **Atómico** é uma propriedade de cada requisito individual (uma obrigação por frase).' },
{ id: 'req-09', t: 'req', l: 2, les: 'req-vv',
  q: 'A rastreabilidade (traceability) de um requisito liga-o…',
  o: ["só ao código-fonte e aos módulos que o implementam no sistema", "à origem (evidência, concerns) e ao que o satisfaz (design, testes)", "só ao stakeholder que o pediu, para saber a quem perguntar mais tarde", "só aos testes de aceitação que o verificam no fim do projeto"], a: 1,
  e: 'Traceability é **bidirecional**: até à origem no UoD e até à evidência de satisfação. É o que permite análise de impacto quando algo muda.' },
{ id: 'req-10', t: 'req', l: 3, les: 'req-basics',
  q: '“O sistema deve usar uma base de dados PostgreSQL” foi proposto pelo analista porque “é a melhor opção”. Sem imposição externa, isto é…',
  o: ["um requisito funcional, porque diz o que o sistema usa", "um requisito de qualidade, porque garante desempenho", "uma decisão de design, não um requisito do problema", "evidência do UoD recolhida junto do analista"], a: 2,
  e: 'Escolher a tecnologia por preferência é **design**: já é solução. Só seria uma **constraint** se fosse imposta (contrato, norma, sistema existente). Confundir requisitos com decisões de design é um erro clássico.' },
{ id: 'req-11', t: 'req', l: 3, les: 'req-kinds',
  q: '“O sistema deve permitir marcar consultas e enviar lembretes por SMS e email e ser rápido.” Qual o principal problema?',
  o: ["Usa “deve” em vez de “shall”, que é a forma obrigatória", "Não é atómico e “rápido” não é verificável", "É uma constraint disfarçada de requisito funcional", "Não tem problema: descreve bem o que se pretende"], a: 1,
  e: 'Junta várias obrigações numa frase (deve ser partido em requisitos **atómicos**) e “rápido” é **ambíguo**, sem critério mensurável, por isso não é **verificável**.' },
{ id: 'req-12', t: 'req', l: 3, les: 'req-vv',
  q: 'Os requisitos foram aprovados, mas o sistema entregue cumpre-os todos e, mesmo assim, os utilizadores não o conseguem usar para o que precisam. O que falhou sobretudo?',
  o: ['Verification', 'Validation', 'Compilação', 'Traceability para a frente'], a: 1,
  e: 'O sistema foi **bem feito** (verificado contra os requisitos), mas **não é o sistema certo**: falhou a **validação** face aos propósitos e ao uso pretendido.' },
{ id: 'req-13', t: 'req', l: 4, les: 'req-basics',
  q: 'Num sistema sociotécnico em que o procedimento de marcação e o papel de profissional de saúde estão dentro da fronteira, “O procedimento deve garantir que pedidos urgentes são revistos por um profissional qualificado” é…',
  o: ["inválido, porque um requisito de sistema tem de falar de software", "um requisito de sistema válido, embora não de software", "uma assumption sobre o comportamento dos profissionais", "uma user story, porque descreve o ponto de vista de um papel"], a: 1,
  e: 'Num sistema **sociotécnico** as obrigações podem recair sobre procedimentos e papéis humanos dentro da fronteira. É um **requisito de sistema**, ainda que **não de software**.' },
{ id: 'req-14', t: 'req', l: 4, les: 'req-basics',
  q: 'Porque é que rótulos como “business requirement” ou “stakeholder requirement” devem ser usados com cuidado?',
  o: ["Porque são proibidos pela norma ISO/IEC/IEEE 29148 e por isso não se usam", "Porque o seu significado depende do esquema adotado e tem de ser definido", "Porque só existem em métodos ágeis, e não em métodos clássicos de engenharia", "Porque correspondem sempre a constraints impostas pela direção do negócio"], a: 1,
  e: 'Estes rótulos aparecem em métodos e normas, mas podem sugerir **origem, viewpoint, nível de abstração ou alvo**. Usa-os só com o significado explícito: um rótulo não substitui identificar **o que** é exigido e **quem** o tem de cumprir.' },
]);

/* --- courses/ams/questions/arch.js --- */
STUDY.questions('ams', [
/* ===== ARCHIMATE & EA ===== */
{ id: 'arch-01', t: 'arch', l: 1, les: 'arch-ea', src: 'Slides 03a, p.3',
  q: 'Qual é a definição de Enterprise Architecture dada nas aulas?',
  o: ["O desenho físico dos edifícios, espaços e instalações de uma empresa", "Princípios, métodos, conceitos e modelos para os artefactos de uma organização", "O inventário de servidores, redes e aplicações que a empresa tem em produção", "O organigrama da empresa, com cargos, departamentos e linhas de reporte"], a: 1,
  e: 'A EA é um **corpo coerente de princípios, métodos, conceitos e modelos**. A organização é o sistema-alvo e os seus artefactos incluem pessoas, estratégia, processos, SI e TI de suporte.' },
{ id: 'arch-02', t: 'arch', l: 1, les: 'arch-ea',
  q: 'Qual a relação entre ArchiMate e TOGAF?',
  o: ["São duas versões da mesma norma da The Open Group", "ArchiMate é uma linguagem; TOGAF é um framework com método", "TOGAF é uma notação gráfica e ArchiMate é um método", "ArchiMate 4 substitui o TOGAF e torna-o obsoleto"], a: 1,
  e: '**ArchiMate não prescreve método**: não define fases, governança nem processo de transformação. Um framework como o **TOGAF** fornece isso. O ArchiMate dá a linguagem para exprimir o conhecimento arquitetural.' },
{ id: 'arch-03', t: 'arch', l: 1, les: 'arch-framework',
  q: 'Quais são os quatro core domains do ArchiMate 4?',
  o: ['Strategy, Business, Application, Technology', 'Common, Business, Application, Technology', 'Motivation, Business, Data, Infrastructure', 'Business, Application, Technology, Physical'], a: 1,
  e: 'No **ArchiMate 4** o core tem **Common, Business, Application e Technology**. Motivation, Strategy e Implementation & Migration são domínios complementares.', w: { 0: 'Strategy é um domínio complementar, não core. Falta o Common Domain, a grande novidade do ArchiMate 4.' } },
{ id: 'arch-04', t: 'arch', l: 1, les: 'arch-framework',
  q: 'Os três aspects do ArchiMate são…',
  o: ["Business, Application, Technology", "Active structure, Behaviour, Passive structure", "Motivation, Strategy, Implementation & Migration", "Process, Function, Service"], a: 1,
  e: '**Active structure** (quem faz), **Behaviour** (o que é feito) e **Passive structure** (sobre o que se faz). São independentes do domínio. Business, Application e Technology são **domains**, não aspects.' },
{ id: 'arch-05', t: 'arch', l: 1, les: 'arch-framework',
  q: 'Na notação ArchiMate, um elemento com cantos ARREDONDADOS é um elemento de…',
  o: ["estrutura (ativa ou passiva)", "comportamento", "motivação", "localização ou agrupamento"], a: 1,
  e: 'Convenção de cantos: **retos = estrutura**, **arredondados = comportamento**, **diagonais (cortados) = motivação**.' },
{ id: 'arch-06', t: 'arch', l: 1, les: 'arch-framework',
  q: 'Que semântica formal têm as cores (amarelo, azul, verde) no ArchiMate?',
  o: ["Amarelo é obrigatório para elementos de negócio", "Nenhuma: a cor fica ao critério do modelador", "Verde indica elementos do estado to-be", "Azul indica elementos externos à empresa"], a: 1,
  e: '**Não há semântica formal nas cores.** O amarelo, azul e verde por camada é só convenção (e ferramentas como o Archi usam-na). Não uses a cor como única forma de transmitir significado.' },
{ id: 'arch-07', t: 'arch', l: 1, les: 'arch-common',
  q: 'Um Service em ArchiMate representa…',
  o: ["o comportamento interno, passo a passo, de um processo", "comportamento oferecido ao ambiente, escondendo o “como”", "um servidor físico ou virtual que aloja aplicações", "um departamento de apoio que presta ajuda a outros"], a: 1,
  e: 'O **Service** é comportamento **externamente visível**, do ponto de vista de quem o usa: uma vista **black-box**. Tem de ter um consumidor identificável.' },
{ id: 'arch-08', t: 'arch', l: 1, les: 'arch-common',
  q: 'Qual a diferença entre Process e Function?',
  o: ["Process é sempre de negócio; Function é sempre de aplicação", "Process tem sequência e resultado; Function agrupa por critério", "Uma Function é sempre composta por vários Processes", "São sinónimos: o ArchiMate 4 fundiu os dois conceitos"], a: 1,
  e: '**Process**: “o que acontece a seguir?”, progressão no tempo. **Function**: “que tipo de trabalho é?”, agrupamento estável por critério. Entre os dois pode haver uma relação n:n.' },
{ id: 'arch-09', t: 'arch', l: 1, les: 'arch-business',
  q: 'O que é uma Business Interface?',
  o: ["Um ecrã de uma aplicação usado por um funcionário no seu posto de trabalho", "Um canal onde um actor disponibiliza serviços (telefone, balcão)", "Uma API REST exposta por um application component a sistemas externos", "Um contrato legal entre a empresa e um fornecedor"], a: 1,
  e: 'A **Business Interface** é o **canal** pelo qual o mesmo serviço pode ser exposto: telefone, Internet, loja física…' },
{ id: 'arch-10', t: 'arch', l: 1, les: 'arch-business',
  q: 'Um Product em ArchiMate é…',
  o: ["um artifact executável vendido a clientes externos através de uma loja online", "um conjunto coerente de serviços e objetos oferecido como um todo", "um business object com preço, descrição e condições comerciais associadas", "um application component comprado a um fornecedor"], a: 1,
  e: 'O **Product** é um elemento composto: um “pacote” de serviços e objetos oferecido **como um todo** a clientes internos ou externos.' },
{ id: 'arch-11', t: 'arch', l: 1, les: 'arch-tech',
  q: 'Um sistema operativo, um SGBD ou um servidor aplicacional modelam-se como…',
  o: ['Application Component', 'System Software', 'Device', 'Artifact'], a: 1,
  e: '**System Software** fornece o ambiente onde o software corre. É distinto de um **Application Component**, que implementa diretamente comportamento ou regras de negócio.' },
{ id: 'arch-12', t: 'arch', l: 1, les: 'arch-tech',
  q: 'Um ficheiro executável, um script ou uma tabela de base de dados modelam-se como…',
  o: ['Data Object', 'Artifact', 'Business Object', 'Material'], a: 1,
  e: 'O **Artifact** é a peça “física” do mundo TI (executáveis, scripts, ficheiros, tabelas, documentos). Pode **realizar** um application component ou um data object.' },
{ id: 'arch-13', t: 'arch', l: 1, les: 'arch-rel', d: { kind: 'rel', r: 'serv', al: 'Serviço Pagamento', ak: 'service', ad: 'common', bl: 'Cliente', bk: 'actor', bd: 'bus' },
  q: 'Que relação está desenhada (linha contínua com seta aberta)?',
  o: ['Triggering', 'Serving', 'Realization', 'Flow'], a: 1,
  e: '**Serving**: linha contínua com ponta de seta aberta, a apontar para o **consumidor**. Lê-se: “o Serviço de Pagamento serve o Cliente”.', w: { 0: 'O triggering tem ponta cheia (triângulo preenchido).' } },
{ id: 'arch-14', t: 'arch', l: 1, les: 'arch-rel', d: { kind: 'rel', r: 'real', al: 'Processar Sinistro', ak: 'process', ad: 'common', bl: 'Serviço Sinistros', bk: 'service', bd: 'common' },
  q: 'Que relação está desenhada (tracejado com triângulo vazio)?',
  o: ['Specialization', 'Realization', 'Influence', 'Access'], a: 1,
  e: '**Realization**: tracejado com triângulo vazio na ponta. O elemento mais concreto (o processo) **realiza** o mais abstrato (o serviço).', w: { 0: 'A specialization tem o mesmo triângulo vazio, mas com linha CONTÍNUA (e só entre elementos do mesmo tipo).' } },
{ id: 'arch-15', t: 'arch', l: 1, les: 'arch-rel', d: { kind: 'rel', r: 'comp', al: 'Gestão Sinistros', ak: 'function', ad: 'common', bl: 'Aceitar Sinistro', bk: 'process', bd: 'common' },
  q: 'O losango PREENCHIDO junto ao primeiro elemento indica…',
  o: ['Aggregation', 'Composition', 'Assignment', 'Association'], a: 1,
  e: '**Composition** (losango cheio do lado do todo): relação todo-parte forte. A **aggregation** usa um losango vazio.' },
{ id: 'arch-16', t: 'arch', l: 1, les: 'arch-rel', d: { kind: 'rel', r: 'assign', al: 'Agente Apoio', ak: 'role', ad: 'bus', bl: 'Rever Pedido', bk: 'process', bd: 'common' },
  q: 'Ponto cheio na origem e seta cheia no destino. Que relação é?',
  o: ['Assignment', 'Triggering', 'Serving', 'Flow'], a: 0,
  e: '**Assignment** (notação atual: ponto na origem, seta no destino): liga a estrutura ativa ao comportamento que executa. “O Agente de Apoio executa Rever Pedido.”' },
{ id: 'arch-17', t: 'arch', l: 2, les: 'arch-rel',
  q: '“O processo Receber Pedido de Reembolso torna disponível o Serviço de Submissão de Reembolsos.” Que relação usar?',
  o: ['Serving', 'Realization', 'Assignment', 'Triggering'], a: 1,
  e: 'O comportamento interno **realiza** o serviço externamente visível. É a ponte do white-box para o black-box: “o serviço existe porque este processo o fornece”.' },
{ id: 'arch-18', t: 'arch', l: 2, les: 'arch-rel',
  q: '“O Serviço de Submissão de Reembolsos é usado pelo Passageiro.” Como se desenha corretamente?',
  o: ['Serving do Passageiro para o Serviço', 'Serving do Serviço para o Passageiro', 'Assignment do Passageiro para o Serviço', 'Realization do Serviço para o Passageiro'], a: 1,
  e: 'Serving vai do **fornecedor para o consumidor**: “o Serviço **serve** o Passageiro”. Inverter a direção é um dos erros mais frequentes.', w: { 0: 'Direção invertida: o passageiro não serve o serviço.' } },
{ id: 'arch-19', t: 'arch', l: 2, les: 'arch-rel',
  q: 'O processo Criar Fatura escreve o objeto Fatura. Que relação usar?',
  o: ["Flow, porque a informação passa do processo para a fatura", "Access (write)", "Composition, porque a fatura é parte do processo", "Serving, porque o processo serve a fatura"], a: 1,
  e: '**Access** liga comportamento a estrutura passiva (ler, criar, alterar, apagar). Com escrita, a ponta aponta para o objeto.' },
{ id: 'arch-20', t: 'arch', l: 2, les: 'arch-rel',
  q: 'A função Avaliação de Sinistros envia decisões à função Liquidação de Sinistros, sem que uma desencadeie a outra. Que relação usar?',
  o: ['Triggering', 'Flow', 'Serving', 'Realization'], a: 1,
  e: '**Flow** = transferência de informação, bens ou dinheiro, e **não implica causalidade**. Deve ser rotulado com o que flui (“decisões”).', w: { 0: 'Triggering afirma precedência temporal ou causal, o que o enunciado exclui.' } },
{ id: 'arch-21', t: 'arch', l: 2, les: 'arch-rel',
  q: '“Contratar Seguro de Viagem” é um tipo particular de “Contratar Seguro”. Que relação usar?',
  o: ["Aggregation", "Specialization", "Realization", "Composition (todo-parte)"], a: 1,
  e: '**Specialization** (inspirada na generalização UML), só entre elementos do **mesmo tipo** (aqui, dois processos).' },
{ id: 'arch-22', t: 'arch', l: 2, les: 'arch-business',
  q: '“Agente de Apoio ao Cliente” é uma responsabilidade desempenhada por muitos funcionários. Como se modela?',
  o: ['Business Actor', 'Role', 'Business Interface', 'Function'], a: 1,
  e: 'Teste do Role: “outro actor podia assumir esta responsabilidade?” Sim, por isso é um **Role**. Os funcionários (ou o departamento) são **Business Actors** com assignment ao role.' },
{ id: 'arch-23', t: 'arch', l: 2, les: 'arch-common',
  q: '“Apoio ao Cliente” existe continuamente, mesmo quando não há pedidos, e agrupa o trabalho dessa área. Como se modela?',
  o: ['Process', 'Function', 'Event', 'Service'], a: 1,
  e: 'Não há sequência pretendida, só um agrupamento estável por responsabilidade: é uma **Function**. Modelá-lo como Process é um erro comum.' },
{ id: 'arch-24', t: 'arch', l: 2, les: 'arch-common',
  q: 'O que é uma Collaboration em ArchiMate?',
  o: ["Um departamento permanente com chefia própria", "Um agregado de roles para um comportamento coletivo", "Uma reunião agendada entre dois actors", "Um tipo especial de service partilhado"], a: 1,
  e: 'Uma **Collaboration** junta roles (ou outros elementos ativos) num comportamento coletivo. Não tem estatuto permanente na organização: é um “papel virtual”. Ex.: “Chamada telefónica” agrega Cliente e Vendedor.' },
{ id: 'arch-25', t: 'arch', l: 2, les: 'arch-app',
  q: 'Qual a relação típica entre Business Object, Data Object e Artifact?',
  o: ['Business Object realiza Data Object, que realiza Artifact', 'Artifact realiza Data Object, que realiza Business Object', 'Os três são compostos uns pelos outros', 'Data Object serve o Business Object'], a: 1,
  e: 'Do mais concreto para o mais abstrato: o **Artifact** (ficheiro, tabela) **realiza** o **Data Object** (dados para processamento automático), que **realiza** o **Business Object** (conceito do negócio).' },
{ id: 'arch-26', t: 'arch', l: 2, les: 'arch-app',
  q: 'Que característica define um Application Component?',
  o: ["É sempre um microserviço implantado na cloud com a sua própria base de dados", "É modular, substituível e independentemente deployable", "É o mesmo que um data object, mas com lógica de negócio incluída", "Só existe dentro de um node de tecnologia"], a: 1,
  e: 'O **Application Component** encapsula funcionalidade alinhada com a estrutura de implementação. É uma unidade autónoma que expõe serviços através de interfaces.' },
{ id: 'arch-27', t: 'arch', l: 2, les: 'arch-tech',
  q: 'Um scanner de ressonância magnética num hospital modela-se como…',
  o: ['Device', 'Equipment', 'Facility', 'Node'], a: 1,
  e: '**Equipment**: máquina física, ferramenta ou instrumento que executa processos físicos. O hospital seria uma **Facility**; o corpo do doente aparece até como **Material** no exemplo das aulas.' },
{ id: 'arch-28', t: 'arch', l: 2, les: 'arch-ea', src: 'Slides 03a, p.5',
  q: 'Segundo o slide “Business – IS – IT Dynamics”, que camada muda mais depressa?',
  o: ["Estratégia (1–3 anos)", "Processos de negócio (< 6 meses)", "Software (3–6 anos)", "Infraestrutura TI (6–10 anos)"], a: 1,
  e: 'O **negócio** (processos, atores, unidades) muda em **menos de 6 meses**; o software em 3–6 anos e a infraestrutura em 6–10. Daí a camada de desacoplamento: os **serviços** Business–IS.' },
{ id: 'arch-29', t: 'arch', l: 2, les: 'arch-motiv',
  q: '“Os custos operacionais estão a subir” e “o reembolso é lento e propenso a erros”. Em Motivation, estes são, respetivamente…',
  o: ['Goal e Requirement', 'Driver e Assessment', 'Assessment e Driver', 'Outcome e Goal'], a: 1,
  e: '**Driver**: fator que cria pressão para mudar (sem juízo ainda). **Assessment**: o que esse fator significa para esta empresa, apoiado em evidência.' },
{ id: 'arch-30', t: 'arch', l: 2, les: 'arch-motiv',
  q: 'Qual a diferença entre Goal e Requirement em ArchiMate?',
  o: ["Nenhuma: são sinónimos no domínio de Motivation e usam-se indistintamente", "O goal dá a direção; o requirement é mais preciso e restringe", "O requirement já é a aplicação escolhida para concretizar o goal", "O goal é técnico e o requirement é de negócio"], a: 1,
  e: 'O **goal** (“reduzir trabalho manual”) dá a direção; o **requirement** (“evitar re-introdução manual de dados submetidos”) é mais preciso. Um requirement **não é** ainda a solução (não prova que um portal foi escolhido).' },
{ id: 'arch-31', t: 'arch', l: 3, les: 'arch-errors', d: { kind: 'archimate', w: 440, h: 110, alt: 'Finance Case System modelado como processo', nodes: [
    { id: 'a', k: 'role', dom: 'bus', lb: 'Agente Apoio', x: 80, y: 55 }, { id: 'b', k: 'process', dom: 'common', lb: 'Finance Case System', x: 330, y: 55, w: 150 }], edges: [{ f: 'a', t: 'b', k: 'assign' }] },
  q: 'O modelador quer dizer que o agente usa a aplicação Finance Case System. O que está errado neste diagrama?',
  o: ["Nada: o diagrama está correto tal como está desenhado", "A aplicação foi modelada como Process; devia ser Application Component", "O Role devia ser um Business Actor com o nome próprio de um funcionário concreto", "Falta pintar a aplicação de azul para se perceber que é software"], a: 1,
  e: 'Erro clássico: **confundir estrutura com comportamento**. O Finance Case System é um **Application Component** (estrutura ativa); “Registar Caso de Reembolso” é o **Process**. Usa substantivos para estrutura e verbos para processos.' },
{ id: 'arch-32', t: 'arch', l: 3, les: 'arch-errors', d: { kind: 'archimate', w: 440, h: 110, alt: 'Serving invertido', nodes: [
    { id: 'a', k: 'actor', dom: 'bus', lb: 'Passageiro', x: 80, y: 55 }, { id: 'b', k: 'service', dom: 'common', lb: 'Serviço Submissão Reembolso', x: 330, y: 55, w: 160 }], edges: [{ f: 'a', t: 'b', k: 'serv' }] },
  q: 'Este diagrama pretende mostrar que o passageiro usa o serviço. Qual é o problema?',
  o: ["O Passageiro devia ser um Role e não um Actor, porque são muitos passageiros", "A direção está invertida: o Serviço serve o Passageiro", "Devia ser realization em vez de serving", "Não há problema nenhum"], a: 1,
  e: 'Lê em voz alta: “o Passageiro serve o Serviço” não faz sentido. **Serving vai do fornecedor para o consumidor.**' },
{ id: 'arch-33', t: 'arch', l: 3, les: 'arch-errors',
  q: 'A descrição do caso diz que a informação é re-introduzida manualmente no Finance Case System. Um estudante acrescenta ao modelo as-is uma “Cloud Platform” e uma “Shared Customer Database” porque “fazem sentido”. O que deve fazer?',
  o: ["Mantê-las: tornam o modelo as-is mais completo", "Removê-las do as-is: não há evidência no UoD", "Transformá-las em Goals de motivação", "Pintá-las de verde para indicar tecnologia"], a: 1,
  e: '**Inventar arquitetura** é um erro: plausibilidade não é evidência. Pergunta de revisão: “que frase do UoD justifica este elemento?” Se nenhuma, sai (ou passa a proposta to-be marcada como tal).' },
{ id: 'arch-34', t: 'arch', l: 3, les: 'arch-errors',
  q: 'Um modelo usa uma relação assignment da aplicação “Public Website” para o processo de negócio “Rever Pedido” feito por um agente humano, “porque o site apoia o trabalho”. É correto?',
  o: ["Sim, porque assignment significa “apoia” em ArchiMate e é o mais usado", "Não: apoiar não é executar; usa-se serving de um serviço do site", "Sim, desde que ambos os elementos tenham a mesma cor no diagrama", "Não: devia ser composition entre o site e o processo"], a: 1,
  e: '“**Supports**” é perigoso porque esconde vários significados. **Assignment** = quem executa. Uma aplicação que **assiste** trabalho humano fornece-lhe um **serviço** (serving), acede a dados ou faz um processo automático próprio.' },
{ id: 'arch-35', t: 'arch', l: 3, les: 'arch-derive',
  q: 'Pela regra de derivação, o Processo P realiza o Serviço S e S serve o Actor A. Que relação derivada se pode afirmar entre P e A?',
  o: ['P realiza A', 'P serve A', 'P é assigned a A', 'Nenhuma'], a: 1,
  e: 'Encadeiam-se duas relações e fica a **mais fraca**: realization e serving dão **serving** (serving é mais fraca do que realization).' },
{ id: 'arch-36', t: 'arch', l: 3, les: 'arch-derive',
  q: 'Ordena da MAIS FRACA para a MAIS FORTE: qual sequência está correta?',
  o: ['composition < aggregation < assignment < realization < serving < access < influence', 'influence < access < serving < realization < assignment < aggregation < composition', 'access < influence < realization < serving < composition < aggregation < assignment', 'serving < access < influence < assignment < realization < aggregation < composition'], a: 1,
  e: 'A ordem do slide das derivation rules: **influence (mais fraca) < access < serving < realization < assignment < aggregation < composition (mais forte)**. As estruturais são mais fortes do que as de dependência.' },
{ id: 'arch-37', t: 'arch', l: 3, les: 'arch-rel', d: { kind: 'archimate', w: 460, h: 130, alt: 'Access com seta para o processo', nodes: [
    { id: 'p', k: 'process', dom: 'common', lb: 'Enviar Fatura', x: 90, y: 65 }, { id: 'o', k: 'bobject', dom: 'bus', lb: 'Fatura', x: 360, y: 65 }], edges: [{ f: 'p', t: 'o', k: 'access', read: true }] },
  q: 'Neste access, a ponta da seta está do lado do processo. O que significa?',
  o: ["O processo escreve a Fatura", "O processo lê a Fatura", "A Fatura executa o processo", "É um erro: o access não tem pontas"], a: 1,
  e: 'No **access**, a ponta indica o **sentido do fluxo de informação**. Ponta junto ao comportamento = a informação vai para ele, ou seja, **leitura**. Ponta junto ao objeto = escrita.' },
{ id: 'arch-38', t: 'arch', l: 3, les: 'arch-common', src: 'Slides 03, p.16',
  q: 'No exemplo de sinistros: o evento Sinistro Registado desencadeia Aceitar Sinistro, que desencadeia Atribuir Sinistro. Depois da adjudicação, Notificar Cliente e Pagar Sinistro correm em paralelo e só quando ambos terminam se dispara Fechar Sinistro. Que conceito junta as duas relações antes de Fechar Sinistro?',
  o: ['Uma OR junction', 'Uma AND junction', 'Uma composition', 'Uma aggregation'], a: 1,
  e: 'Uma **AND junction** (círculo cheio) exprime que vários elementos participam **em conjunto** na relação: Fechar Sinistro só é desencadeado quando ambos terminam. A OR junction (círculo vazio) exprime escolha.' },
{ id: 'arch-39', t: 'arch', l: 3, les: 'arch-v4',
  q: 'No ArchiMate 4, como se indica que um Process é executado por uma aplicação e não por pessoas?',
  o: ["Usando o elemento “Application Process”, que distingue processos automáticos", "Com assignment do Application Component ao Process", "Pintando o processo de azul", "Não é possível em ArchiMate 4"], a: 1,
  e: 'No ArchiMate 4 o comportamento é **unificado** no Common Domain: um Process não é “de negócio” nem “de aplicação”. O executor identifica-se pelo **assignment**, e um mesmo processo pode até ser executado em conjunto por uma pessoa e uma aplicação.', w: { 0: '“Application Process” era ArchiMate 3.2; no ArchiMate 4 deixou de existir.' } },
{ id: 'arch-40', t: 'arch', l: 3, les: 'arch-errors',
  q: 'Quando é que é correto deixar um elemento em black-box numa view?',
  o: ["Nunca: um modelo completo tem de decompor todos os elementos", "Quando o detalhe é desconhecido, desnecessário ou não decidido", "Só quando o elemento pertence a uma entidade externa à empresa", "Só nas views to-be, porque o as-is tem de ser white-box"], a: 1,
  e: '**Esconder detalhe não é falha**: muitas vezes é a decisão certa. Mas não escondas o problema relevante: se a concern é a re-introdução manual, tens de abrir essa parte. Tão simples quanto possível, com detalhe suficiente para responder à concern.' },
{ id: 'arch-41', t: 'arch', l: 4, les: 'arch-v4', a: [0, 2, 3],
  q: 'Seleciona TODAS as alterações corretas de ArchiMate 3.2 para ArchiMate 4.',
  o: ['Business/Application/Technology Process passam a um único Process no Common Domain', 'O Role deixa de existir', 'O Path passa para o Common Domain e a relação com o Path passa de aggregation a realization', 'As relações podem exprimir multiplicidade'],
  e: 'No ArchiMate 4: comportamento **unificado**; **Role genérico** (continua a existir e pode ser assigned a qualquer estrutura ativa interna); **Path** no Common Domain com **realization** em vez de aggregation; **multiplicidade** nas relações. Foram removidos Interaction, Constraint, Contract, Gap e Representation.' },
{ id: 'arch-42', t: 'arch', l: 4, les: 'arch-derive',
  q: 'O Node N é composto pelo Device D, e D está assigned ao Artifact X (X está deployed em D). Que relação derivada é válida entre N e X?',
  o: ['Composition', 'Assignment', 'Aggregation', 'Serving'], a: 1,
  e: 'Composition (mais forte) seguida de assignment dá a **mais fraca das duas: assignment**. Faz sentido: o artifact também está deployed no node.' },
{ id: 'arch-43', t: 'arch', l: 4, les: 'arch-rel',
  q: 'Qual destas afirmações sobre triggering é CORRETA, segundo a especificação citada nas aulas?',
  o: ["A origem tem de iniciar ativamente o destino, como uma chamada de função", "Exprime precedência, sem que a origem tenha de iniciar o destino", "Pode ligar dois business objects para mostrar a ordem em que são criados", "É uma relação estrutural, como a composition"], a: 1,
  e: 'Triggering exprime **precedência temporal ou causal**. Não significa que a origem arranque ativamente o destino: o exemplo do semáforo. É uma relação **dinâmica** entre comportamentos e eventos, não entre objetos passivos.' },
{ id: 'arch-44', t: 'arch', l: 4, les: 'arch-rel', a: [1, 3],
  q: 'Seleciona TODAS as afirmações corretas sobre relações ArchiMate.',
  o: ['Specialization pode ligar um Process a um Service', 'Composition e aggregation são sempre permitidas entre duas instâncias do mesmo tipo de elemento', 'Flow implica que o destino é desencadeado pela origem', 'Association pode ligar uma relação a um elemento (ex.: um flow ao objeto que transporta)'],
  e: '**Composition** e **aggregation** são sempre permitidas entre elementos do mesmo tipo. **Association** pode ligar um elemento a uma relação. Specialization só liga elementos do **mesmo tipo**, e flow **não** implica causalidade.' },
{ id: 'arch-45', t: 'arch', l: 4, les: 'arch-motiv',
  q: 'Um analista modela o Passageiro como Business Actor numa view de serviços e como Stakeholder numa view de motivação. Isto é…',
  o: ["um erro: cada coisa real só pode ter um elemento no modelo", "correto: são significados diferentes, adequados a cada view", "só correto em ArchiMate 3.2, mas não em ArchiMate 4", "correto apenas se os dois elementos tiverem a mesma cor"], a: 1,
  e: 'O mesmo sujeito real pode ser representado por conceitos diferentes em views diferentes. Como **Actor** participa em comportamento; como **Stakeholder** tem interesses e concerns. Não competem: exprimem significados diferentes.' },
{ id: 'arch-46', t: 'arch', l: 4, les: 'arch-errors', d: { kind: 'archimate', w: 520, h: 150, alt: 'Diagrama com triggering entre processos e flow sem rótulo', nodes: [
    { id: 'a', k: 'process', dom: 'common', lb: 'Receber Pedido', x: 80, y: 40, tag: 'A' }, { id: 'b', k: 'process', dom: 'common', lb: 'Rever Pedido', x: 260, y: 40, tag: 'B' }, { id: 'c', k: 'process', dom: 'common', lb: 'Criar Caso', x: 440, y: 40, tag: 'C' },
    { id: 'w', k: 'appcomp', dom: 'app', lb: 'Public Website', x: 80, y: 120, tag: 'D' }, { id: 'f', k: 'appcomp', dom: 'app', lb: 'Finance Case System', x: 440, y: 120, w: 140, tag: 'E' }],
    edges: [{ f: 'a', t: 'b', k: 'trig' }, { f: 'b', t: 'c', k: 'trig' }, { f: 'w', t: 'f', k: 'flow' }] },
  q: 'A concern da view é mostrar onde há trabalho manual na passagem dos dados do Website para o Finance Case System. Qual é a melhoria mais importante?',
  o: ["Trocar os dois triggerings entre os processos A, B e C por flows rotulados", "Rotular o flow D→E com o que passa e como (“re-introdução manual”)", "Juntar A, B e C numa composition sem elemento todo", "Remover os application components, que não interessam a esta concern"], a: 1,
  e: 'Um **flow sem rótulo** diz que algo se move, mas não o quê nem porquê. O problema arquitetural (re-introdução manual) tem de ficar **visível**: rotula o flow. Os triggerings aqui expressam uma ordem causal real (receber → rever → criar).' },
]);

{ id: 'bpm-01', t: 'bpm', l: 1, les: 'bpm-process', src: 'Slides 03a-BPM, p.3',

{ id: 'bpm-07', t: 'bpm', l: 2, les: 'bpm-process', a: [0, 1, 3],

  e: 'Os quatro takeaways: todo o trabalho faz parte de um processo; todos os produtos e serviços resultam de um processo; um processo é realizado pela cooperação de **pessoas (actors) e recursos**; a gestão por processos foca produto e clientes.' },
{ id: 'bpm-08', t: 'bpm', l: 2, les: 'bpm-types',

{ id: 'bpm-09', t: 'bpm', l: 2, les: 'bpm-arch',

{ id: 'bpm-11', t: 'bpm', l: 3, les: 'bpm-arch', src: 'Slides 03a-BPM, p.16',

{ id: 'bpm-13', t: 'bpm', l: 3, les: 'bpm-types',

{ id: 'bpm-14', t: 'bpm', l: 4, les: 'bpm-types',

{ id: 'bpm-15', t: 'bpm', l: 4, les: 'bpm-process',

  e: 'O **AND-split (fork)** divide um fluxo em 2 ou mais fluxos **concorrentes no tempo**. Não há condições.' },
{ id: 'bpmn-19', t: 'bpmn', l: 2, les: 'bpmn-gw', d: { kind: 'bpmn', w: 400, h: 170, alt: 'Inclusive gateway com três condições', nodes: [
    { id: 's', k: 'start', x: 28, y: 85 }, { id: 'g', k: 'or', x: 110, y: 85 }, { id: 'a', k: 'task', x: 270, y: 30, w: 110, h: 44, lb: 'Tarefa A' }, { id: 'b', k: 'task', x: 270, y: 85, w: 110, h: 44, lb: 'Tarefa B' }, { id: 'c', k: 'task', x: 270, y: 140, w: 110, h: 44, lb: 'Tarefa C' }],
    edges: [{ f: 's', t: 'g' }, { f: 'g', t: 'a', lb: 'x > 5', cond: false }, { f: 'g', t: 'b', lb: 'x < 10' }, { f: 'g', t: 'c', lb: 'x > 20' }] },
  q: 'Com x = 7, que tarefas são executadas depois deste inclusive gateway?',
  o: ['Só A', 'A e B', 'A, B e C', 'Só B'], a: 1,
  e: 'O **OR-split** segue **todos** os caminhos cuja condição é verdadeira, em paralelo. 7 > 5 ✓, 7 < 10 ✓, 7 > 20 ✗. Logo **A e B**.' },
{ id: 'bpmn-20', t: 'bpmn', l: 2, les: 'bpmn-gw', d: { kind: 'bpmn', w: 400, h: 170, alt: 'Exclusive gateway com condições e default', nodes: [
    { id: 's', k: 'start', x: 28, y: 85 }, { id: 'g', k: 'xor', x: 110, y: 85 }, { id: 'a', k: 'task', x: 270, y: 30, w: 110, h: 44, lb: 'Tarefa A' }, { id: 'b', k: 'task', x: 270, y: 85, w: 110, h: 44, lb: 'Tarefa B' }, { id: 'c', k: 'task', x: 270, y: 140, w: 110, h: 44, lb: 'Tarefa C' }],
    edges: [{ f: 's', t: 'g' }, { f: 'g', t: 'a', lb: 'x > 5' }, { f: 'g', t: 'b', lb: 'x > 1' }, { f: 'g', t: 'c', def: true, lb: 'default' }] },
  q: 'Com x = 8, que tarefa é executada? (as condições são avaliadas de cima para baixo, como nos slides)',
  o: ['Tarefa A', 'Tarefa B', 'A e B', 'Tarefa C (default)'], a: 0,
  e: 'No **XOR-split** só um caminho é escolhido: o da **primeira condição verdadeira**, de cima para baixo. 8 > 5 é logo verdadeira, por isso **A**. O default só se segue se todas forem falsas (ex.: x = 0).', w: { 2: 'Isso seria um OR (inclusive) gateway. O XOR escolhe um e só um.' } },
{ id: 'bpmn-21', t: 'bpmn', l: 2, les: 'bpmn-gw',
  q: 'Como decide um Event-Based Gateway o caminho a seguir?',
  o: ["Avalia condições sobre os dados do processo", "Segue o primeiro evento que ocorrer", "Segue todos os caminhos em paralelo", "Pergunta ao utilizador qual escolher"], a: 1,
  e: 'A escolha baseia-se em **eventos**, não em expressões de dados: o **primeiro evento** recebido determina o caminho e os outros são descartados. Também pode **iniciar** um processo se não tiver fluxos de entrada.' },
{ id: 'bpmn-22', t: 'bpmn', l: 2, les: 'bpmn-boundary',
  q: 'Num boundary event, o contorno TRACEJADO indica…',
  o: ["Que o evento é de erro e aborta a atividade", "Que é non-interrupting: a atividade continua", "Que é um throw e não um catch", "Que o evento é opcional e pode não ocorrer"], a: 1,
  e: '**Contínuo = interrupting** (a atividade é interrompida e não completa). **Tracejado = non-interrupting** (a atividade continua; o evento gera um fluxo paralelo).' },
{ id: 'bpmn-23', t: 'bpmn', l: 2, les: 'bpmn-boundary', src: 'Slides 04a, p.39',
  q: 'Uma atividade quer reportar uma situação anómala E continuar a executar. O que dizem os slides?',
  o: ["Usar um Error boundary event non-interrupting, com contorno tracejado", "Errors interrompem sempre; usar um Signal non-interrupting", "Usar um Terminate end event dentro da atividade", "Usar um message flow para a própria pool"], a: 1,
  e: 'Depois de um **Error**, a atividade **aborta sempre**. Para avisar sem parar, os slides sugerem um **Signal non-interrupting** (as notas falam também de Escalation).' },
{ id: 'bpmn-24', t: 'bpmn', l: 2, les: 'bpmn-boundary',
  q: 'Queres que o processo espere 3 dias entre “Enviar fatura” e “Verificar pagamento”. Que elemento usas?',
  o: ["Um timer start event entre as duas tarefas", "Um timer intermediate event no fluxo", "Um timer boundary interrupting em “Enviar fatura”", "Um exclusive gateway com condição “3 dias”"], a: 1,
  e: 'Um **atraso** no meio do processo é um **Timer intermediate event** no fluxo. Usar um **start** timer para isso é um erro típico, e o timer em **boundary** exprime outra coisa (um prazo ou duração da tarefa).' },
{ id: 'bpmn-25', t: 'bpmn', l: 2, les: 'bpmn-act', src: 'Slides 04c, p.18',
  q: 'Qual a diferença entre uma Receive Task e um Message Catch Event intermédio?',
  o: ["Nenhuma: são duas notações equivalentes", "Receive task: espera ativa; catch event: espera passiva", "A receive task só pode existir no início do processo", "O catch event consome recursos e a receive task não"], a: 1,
  e: 'Os slides avisam: “these two examples ARE NOT THE SAME”. Na **receive task** há um recurso afetado a esperar (custa tempo, dinheiro, espaço). No **catch event** o recurso fica livre, mas precisa de tempo de preparação para reagir.' },
{ id: 'bpmn-26', t: 'bpmn', l: 2, les: 'bpmn-collab',
  q: 'O que mostra um PUBLIC process?',
  o: ["Todas as atividades internas, com todo o detalhe", "Só as atividades que comunicam com outros participantes", "Só os gateways e as decisões do processo", "O processo interno de um cliente externo"], a: 1,
  e: 'O **public (abstract) process** mostra ao exterior apenas os “**touch-points**”: as atividades e message flows necessários para interagir. O **private** tem todo o detalhe interno.' },
{ id: 'bpmn-27', t: 'bpmn', l: 2, les: 'bpmn-act', src: 'Notas 6.14',
  q: 'Num private process, que elementos consomem recursos (tempo, custo) da entidade que executa o processo?',
  o: ["Gateways e eventos, porque tomam decisões", "Apenas as atividades (tasks e sub-processes)", "Os sequence flows, porque levam tempo", "Todos os elementos do diagrama"], a: 1,
  e: '**Só as atividades** são executadas por pessoas, sistemas ou dispositivos e consomem recursos. Sequence flows e gateways são interpretados pela **infraestrutura** de execução (motor BPM, regras). Atribuir custos ou duração a eventos e fluxos é um erro.' },
{ id: 'bpmn-28', t: 'bpmn', l: 2, les: 'bpmn-collab', src: 'Slides 04c, p.22',
  q: 'Num diagrama, uma lane chama-se “Joana Silva”. Porque é má prática?',
  o: ["Porque os nomes das lanes devem estar em inglês", "Porque lanes são roles, não pessoas", "Porque as lanes só podem ter nomes de departamentos", "Não é má prática: é a forma mais precisa"], a: 1,
  e: 'As **lanes representam roles específicos**. “Joana Silva” é demasiado específico: se a tarefa depende sempre de uma pessoa, há um problema (e o conhecimento sai com ela). Cria antes um role como “Analista de Risco”.' },
{ id: 'bpmn-29', t: 'bpmn', l: 2, les: 'bpmn-boundary',
  q: 'Para que serve a compensação (compensation) em BPMN?',
  o: ["Para pagar horas extra a quem executou a tarefa", "Para desfazer uma atividade já concluída", "Para repetir automaticamente uma tarefa falhada", "Para interromper uma tarefa que está em curso"], a: 1,
  e: 'A **compensação** desfaz trabalho **já feito** (ex.: anular um pagamento se a entrega falhar). A atividade a desfazer tem um boundary event de compensação associado à **compensation activity** (marcador ⏪).' },
{ id: 'bpmn-30', t: 'bpmn', l: 2, les: 'bpmn-boundary',
  q: 'Para que servem os Link events (throw e catch)?',
  o: ["Para enviar mensagens a outras pools", "Para ligar partes do mesmo diagrama", "Para criar novas instâncias do processo", "Para sincronizar dois processos diferentes"], a: 1,
  e: 'Os **link events** funcionam aos pares (throw → catch) **dentro do mesmo processo**: simplificam o desenho, como um conector de página.' },

/* ===== BPMN · Level 3 (diagrams and scenarios) ===== */
{ id: 'bpmn-31', t: 'bpmn', l: 3, les: 'bpmn-gw', d: splitMerge('xor', 'and', 'Aprovar', 'Rejeitar', 'ok', 'não ok', 'Arquivar', 'XOR split fechado por AND join'),
  q: 'O que acontece a uma instância que passe por este processo?',
  o: ["Corre normalmente até ao fim", "Deadlock no AND-join", "“Arquivar” é executada duas vezes", "Aprovar e Rejeitar correm em paralelo"], a: 1,
  e: 'O **XOR-split** envia **um só token** por um dos ramos. O **AND-join** espera tokens de **todos** os ramos de entrada, e o outro nunca chega: **deadlock**. Fecha um XOR com um XOR.' },
{ id: 'bpmn-32', t: 'bpmn', l: 3, les: 'bpmn-gw', d: splitMerge('and', 'xor', 'Faturar', 'Enviar encomenda', '', '', 'Notificar cliente', 'AND split fechado por XOR merge'),
  q: 'Quantas vezes é executada “Notificar cliente” por cada instância?',
  o: ['0 (deadlock)', '1', '2', 'Depende das condições'], a: 2,
  e: 'O **AND-split** cria **dois tokens**. O **XOR-merge** não sincroniza: deixa passar **cada um** quando chega. Resultado: “Notificar cliente” corre **duas vezes**. Para sincronizar usa um AND-join.' },
{ id: 'bpmn-33', t: 'bpmn', l: 3, les: 'bpmn-errors', d: { kind: 'bpmn', w: 560, h: 172, alt: 'Message flow entre lanes da mesma pool', pools: [{ x: 6, y: 6, w: 548, h: 160, lb: 'Empresa', lanes: [{ lb: 'Comercial', h: 80 }, { lb: 'Direção', h: 80 }] }],
    nodes: [{ id: 's', k: 'start', x: 90, y: 46 }, { id: 'a', k: 'task', x: 190, y: 46, lb: 'Pedir aprovação' }, { id: 'b', k: 'task', x: 340, y: 126, lb: 'Aprovar desconto' }, { id: 'e', k: 'end', x: 460, y: 126 }],
    edges: [{ f: 's', t: 'a' }, { f: 'a', t: 'b', k: 'msg' }, { f: 'b', t: 'e' }] },
  q: 'O que está errado neste diagrama?',
  o: ["Nada: o diagrama está correto e cumpre as regras", "Message flow dentro da mesma pool; devia ser sequence flow", "As lanes deviam ser duas pools independentes uma da outra", "Falta um gateway exclusivo antes de “Aprovar desconto”"], a: 1,
  e: 'Uma pool contém **um só processo**, e **message flows não são permitidos dentro de um processo**. Entre lanes da mesma pool usa-se **sequence flow** (pode atravessar lanes).', w: { 2: 'Só faria sentido se Comercial e Direção fossem participantes independentes. Como estão, a ligação certa é um sequence flow.' } },
{ id: 'bpmn-34', t: 'bpmn', l: 3, les: 'bpmn-errors', d: { kind: 'bpmn', w: 560, h: 190, alt: 'Sequence flow a atravessar pools', pools: [{ x: 6, y: 6, w: 548, h: 80, lb: 'Cliente' }, { x: 6, y: 100, w: 548, h: 84, lb: 'Loja' }],
    nodes: [{ id: 's', k: 'start', x: 70, y: 46 }, { id: 'a', k: 'task', x: 170, y: 46, lb: 'Encomendar' }, { id: 'b', k: 'task', x: 320, y: 142, lb: 'Receber encomenda' }, { id: 'c', k: 'task', x: 440, y: 142, w: 86, lb: 'Enviar' }, { id: 'e', k: 'end', x: 520, y: 142 }],
    edges: [{ f: 's', t: 'a' }, { f: 'a', t: 'b' }, { f: 'b', t: 'c' }, { f: 'c', t: 'e' }] },
  q: 'Que erros tem este diagrama de colaboração? Escolhe a descrição mais completa.',
  o: ["Nenhum: a colaboração está bem modelada e respeita as regras das pools", "Sequence flow entre pools; falta start na Loja e end no Cliente", "Só falta um gateway exclusivo entre as duas pools para decidir", "As duas pools deviam ser lanes da mesma pool"], a: 1,
  e: '**Sequence flows não atravessam pools.** Modela cada pool de forma independente (com start e end próprios) e liga-as depois com **message flows**. É o anti-pattern “wrong use of flows in/between pools”.' },
{ id: 'bpmn-35', t: 'bpmn', l: 3, les: 'bpmn-errors', src: 'Slides 04c, Questão 4', d: { kind: 'bpmn', w: 440, h: 150, alt: 'Intermediate event sem saída', nodes: [
    { id: 's', k: 'start', x: 28, y: 70 }, { id: 't', k: 'task', x: 112, y: 70, w: 92, lb: 'Preparar contrato' }, { id: 'g', k: 'and', x: 205, y: 70 },
    { id: 'a', k: 'task', x: 300, y: 30, w: 92, lb: 'Enviar contrato' }, { id: 'e1', k: 'end', tr: 'msg', x: 395, y: 30 },
    { id: 'b', k: 'task', x: 300, y: 112, w: 92, lb: 'Notificar RH' }, { id: 'i', k: 'int', tr: 'msg', th: true, x: 395, y: 112, tag: '?' }],
    edges: [{ f: 's', t: 't' }, { f: 't', t: 'g' }, { f: 'g', t: 'a' }, { f: 'g', t: 'b' }, { f: 'a', t: 'e1' }, { f: 'b', t: 'i' }] },
  q: 'Que problema tem o elemento marcado com “?”?',
  o: ["Nenhum: um throw intermédio pode terminar um caminho", "É um evento intermédio sem saída; devia ser um end event", "Devia ser um catch, porque espera pelo RH", "Não pode haver dois eventos de mensagem no mesmo processo"], a: 1,
  e: 'Um evento intermédio está “a meio” do processo: tem de ter **saída**. Um caminho termina com um **end event** (aqui, um message end, de contorno grosso).' },
{ id: 'bpmn-36', t: 'bpmn', l: 3, les: 'bpmn-errors', src: 'Slides 04c, Questão 2', d: { kind: 'bpmn', w: 470, h: 150, alt: 'Terminate num ramo paralelo', nodes: [
    { id: 's', k: 'start', tr: 'msg', x: 28, y: 70 }, { id: 't', k: 'task', x: 115, y: 70, w: 96, lb: 'Avaliar candidatura' }, { id: 'g', k: 'and', x: 210, y: 70 },
    { id: 'a', k: 'task', x: 320, y: 30, w: 110, lb: 'Publicar resultado' }, { id: 'e1', k: 'end', tr: 'terminate', x: 420, y: 30 },
    { id: 'b', k: 'task', x: 320, y: 112, w: 110, tt: 'send', lb: 'Enviar email ao candidato' }, { id: 'e2', k: 'end', tr: 'msg', x: 420, y: 112 }],
    edges: [{ f: 's', t: 't' }, { f: 't', t: 'g' }, { f: 'g', t: 'a' }, { f: 'g', t: 'b' }, { f: 'a', t: 'e1' }, { f: 'b', t: 'e2' }] },
  q: 'Qual é o risco deste desenho?',
  o: ["Nenhum risco: os dois ramos terminam de forma independente", "O Terminate pode matar o ramo do email antes de este ser enviado", "O message start event é inválido num processo privado", "O AND devia ser um XOR, porque só um ramo deve correr"], a: 1,
  e: 'O **Terminate end event** termina **toda a instância**, incluindo os ramos paralelos ainda ativos. Num processo **concorrente** isto é má prática: usa um None end (ou sincroniza com um AND-join antes de terminar).' },
{ id: 'bpmn-37', t: 'bpmn', l: 3, les: 'bpmn-errors', src: 'Slides 04c, Questão 3', d: { kind: 'bpmn', w: 430, h: 150, alt: 'XOR sem condições', nodes: [
    { id: 's', k: 'start', x: 28, y: 70 }, { id: 't', k: 'task', x: 115, y: 70, w: 96, lb: 'Analisar estudo' }, { id: 'g', k: 'xor', x: 210, y: 70 },
    { id: 'a', k: 'task', x: 310, y: 30, w: 96, lb: 'Configurar portal' }, { id: 'e1', k: 'end', x: 405, y: 30 }, { id: 'b', k: 'task', x: 310, y: 112, w: 96, lb: 'Arquivar estudo' }, { id: 'e2', k: 'end', x: 405, y: 112 }],
    edges: [{ f: 's', t: 't' }, { f: 't', t: 'g' }, { f: 'g', t: 'a' }, { f: 'g', t: 'b' }, { f: 'a', t: 'e1' }, { f: 'b', t: 'e2' }] },
  q: 'Que tipo de problema tem este diagrama?',
  o: ["Deadlock, porque os dois ramos não voltam a juntar-se", "Incerteza lógica: as saídas do XOR não têm condições", "Sequence flow a atravessar pools diferentes", "Falta um AND-join antes dos dois end events"], a: 1,
  e: 'Um **XOR-split** tem de dizer **quando** segue cada caminho: rotula as saídas com condições (ou marca um default). Sem isso há **incerteza lógica**. Os dois ends são aceitáveis se representarem resultados diferentes.' },
{ id: 'bpmn-38', t: 'bpmn', l: 3, les: 'bpmn-errors', d: { kind: 'bpmn', w: 420, h: 90, alt: 'Gateway com uma só saída', nodes: [
    { id: 's', k: 'start', x: 28, y: 45 }, { id: 't', k: 'task', x: 115, y: 45, w: 96, lb: 'Rever pedido' }, { id: 'g', k: 'xor', x: 210, y: 45 }, { id: 'a', k: 'task', x: 305, y: 45, w: 96, lb: 'Aprovar' }, { id: 'e', k: 'end', x: 395, y: 45 }],
    edges: [{ f: 's', t: 't' }, { f: 't', t: 'g' }, { f: 'g', t: 'a' }, { f: 'a', t: 'e' }] },
  q: 'O que está mal com este gateway?',
  o: ["Devia ser um AND, porque não há condição", "Uma decisão precisa de pelo menos duas saídas", "Os gateways não podem vir depois de tarefas", "Nada: é uma forma válida de marcar uma decisão"], a: 1,
  e: 'Nos anti-patterns: “the decision must contain **at least two output flows**”. Este gateway é inútil, ou falta o outro caminho (ex.: rejeitar).' },
{ id: 'bpmn-39', t: 'bpmn', l: 3, les: 'bpmn-gw', d: { kind: 'bpmn', w: 470, h: 180, alt: 'AND com três ramos', nodes: [
    { id: 's', k: 'start', x: 28, y: 90 }, { id: 'g1', k: 'and', x: 95, y: 90 }, { id: 'a', k: 'task', x: 195, y: 30, w: 100, h: 44, lb: 'Verificar crédito' }, { id: 'b', k: 'task', x: 195, y: 90, w: 100, h: 44, lb: 'Verificar stock' }, { id: 'c', k: 'task', x: 195, y: 150, w: 100, h: 44, lb: 'Calcular portes' },
    { id: 'g2', k: 'and', x: 300, y: 90 }, { id: 't', k: 'task', x: 380, y: 90, w: 86, lb: 'Confirmar encomenda' }, { id: 'e', k: 'end', x: 448, y: 90 }],
    edges: [{ f: 's', t: 'g1' }, { f: 'g1', t: 'a' }, { f: 'g1', t: 'b' }, { f: 'g1', t: 'c' }, { f: 'a', t: 'g2' }, { f: 'b', t: 'g2' }, { f: 'c', t: 'g2' }, { f: 'g2', t: 't' }, { f: 't', t: 'e' }] },
  q: 'Quantos tokens existem logo depois do primeiro gateway, e quantas vezes corre “Confirmar encomenda”?',
  o: ['1 token; 3 vezes', '3 tokens; 1 vez', '3 tokens; 3 vezes', '1 token; 1 vez'], a: 1,
  e: 'O **AND-split** cria **3 tokens** (um por ramo). O **AND-join** espera pelos três e junta-os num só: “Confirmar encomenda” corre **uma vez**.' },
{ id: 'bpmn-40', t: 'bpmn', l: 3, les: 'bpmn-gw', d: { kind: 'bpmn', w: 580, h: 160, alt: 'Event-based gateway com mensagem e timer', nodes: [
    { id: 's', k: 'start', x: 26, y: 75 }, { id: 't', k: 'task', x: 112, y: 75, w: 92, tt: 'send', lb: 'Enviar proposta' }, { id: 'g', k: 'evg', x: 205, y: 75 },

{ id: 'bpmn-42', t: 'bpmn', l: 3, les: 'bpmn-collab', src: 'Slides 04c, Pizzeria Pronto',
  q: '“Os clientes da Pizzeria Pronto encomendam por telefone. O empregado recebe e passa ao pizzaiolo, que faz a pizza e a entrega ao estafeta, que a leva ao cliente e recebe o pagamento.” Como modelar os participantes numa collaboration?',

{ id: 'bpmn-48', t: 'bpmn', l: 4, les: 'bpmn-events', src: 'Slides 04a, p.25',

{ id: 'bpmn-49', t: 'bpmn', l: 4, les: 'bpmn-gw',

{ id: 'bpmn-50', t: 'bpmn', l: 4, les: 'bpmn-gw', d: splitMerge('or', 'and', 'Pedir garantia', 'Validar cliente', 'valor > 1000', 'cliente novo', 'Aprovar crédito', 'OR split fechado por AND join'),

{ id: 'bpmn-52', t: 'bpmn', l: 4, les: 'bpmn-gw', src: 'Slides 04a, p.53',

{ id: 'bpmn-54', t: 'bpmn', l: 4, les: 'bpmn-collab', src: 'Slides 04c, p.22–23',

  e: 'Message flows ligam **pools diferentes**: entre elementos de duas pools, ou ao limite de uma pool colapsada. Entre lanes da mesma pool usa-se sequence flow. Os **gateways só se ligam por sequence flows**: uma mensagem não pode influenciar diretamente um gateway.' },

  e: 'Na solução oficial o timer aparece já corrigido para **“48 horas desde a notificação”**, mas **não** foi contado entre as 4 falhas (X08 D, X15 D, X90 E, X92–X94 F). Corrige-o no desenho; na tabela, dá prioridade às falhas estruturais.' },
{ id: 'ex-q6-c', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-collab', src: SRC + ', Q6', d: Q6,
  q: 'X05 prepara a notificação, mas o estudante nunca a recebe no diagrama. Que falha é?',
  o: ["E: falta o message flow para o Estudante", "C: X10 devia ser um sequence flow vindo do estudante", "B: a pool Estudante está a mais neste viewpoint", "A: o sequence flow entre X05 e X08 está a mais"], a: 0,
  e: 'A notificação é uma **mensagem entre participantes**: falta um **message flow** (relação em falta, **E**) de X05 para a pool Estudante. X10 está certo como message flow, porque vem de outra pool.' },
{ id: 'ex-q6-d', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-gw', src: SRC + ', Q6', d: Q6,
  q: 'Que situação do UoD falta representar (omissão F)?',
  o: ["O ramo da desistência do estudante", "A devolução do equipamento pelo estudante no fim do empréstimo", "O cancelamento do pedido inicial antes de haver notificação", "A preparação do equipamento pela equipa técnica em paralelo"], a: 0,
  e: 'Solução oficial (F, X92/X93/X94): **message catch “Desistência”** (X92) após o event-based gateway → tarefa **“Cancelar reserva por desistência”** (X93) → fluxo para o fim que informa o estudante. A própria solução nota que é discutível se este ramo devia ter o seu próprio end event, ou um XOR-merge antes de X21. Devolução e cancelamento do pedido inicial estão fora do âmbito.' },
{ id: 'ex-q6-e', t: 'exam', l: 4, ctx: 'exam-uod', les: 'bpmn-events', src: SRC + ', Q6', d: Q6, a: [0, 2],
  q: 'Seleciona TODOS os outros problemas defensáveis neste diagrama.',
  o: ['X15 é um end event de escalation: “Reserva mantida” é um fim normal (none end)', 'X11 devia ser um timer', 'X21 devia informar o estudante do cancelamento (message end + message flow)', 'A pool Estudante devia estar expandida com o processo interno do estudante'],
  e: 'Solução oficial: **X15 (D)**, porque um end de escalation comunica algo que requer tratamento superior, o que o UoD não prevê; manter a reserva é um fim normal. No corrigido, o cancelamento termina em **X21 como message end** com message flow **X22 “Informar de pedido cancelado”** para o Estudante, que fica **colapsado**.' },

{ id: 'ex-q2-4', t: 'exam', l: 3, ctx: 'exam-uod', les: 'exam-uod', src: SRC + ', Q2.4',
  q: 'Completa: “A motivação de um estudante para pedir um empréstimo é…”',
  o: ['… nenhuma das opções anteriores se pode aplicar', '… fora do âmbito definido para esta versão do problema', '… um requisito já validado por estar explicitamente mencionado no UoD', '… na linguagem BPMN, por descrever comportamento no tempo'], a: 0,
  e: 'Solução oficial: **12, nenhuma**. O UoD **nem menciona** a motivação do estudante: não é “fora do âmbito” (que se aplica ao que o UoD exclui explicitamente) nem requisito. Quando o UoD é omisso, a resposta é “nenhuma”.' },
{ id: 'ex-q5-e', t: 'exam', l: 4, ctx: 'exam-uod', les: 'bpmn-gw', src: SRC + ', Q5', d: Q5,
  q: 'A solução oficial lista X10 como falha **D** (“preparar o equipamento e elaborar o termo devem decorrer em paralelo; o exclusivo permitiria escolher apenas um”). Que tipo de gateway tem de estar em X10?',
  o: ['Parallel (AND-split)', 'Exclusive (XOR-split)', 'Event-based', 'Inclusive (OR-split)'], a: 0,
  e: 'X10 tem de ser **AND-split**. No enunciado em PDF o X10 já aparece como paralelo, por isso a linha oficial parece referir-se a uma versão em que era exclusivo. Lição: em “**em simultâneo**”, verifica **as duas pontas** do paralelo (split **e** join): no teste, ambas eram alvo de falha.' },
{ id: 'ex-q6-f', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-events', src: SRC + ', Q6', d: Q6,
  q: 'Que falha é **X15** (end event de escalation “Reserva mantida”)?',
  o: FALHA4, a: 3, fixed: true,
  e: 'Solução oficial: **D**. Manter a reserva é uma **conclusão normal** (none end); um end de **escalation** comunica uma situação que requer tratamento superior, o que o UoD não prevê. Olha sempre para o **ícone** dentro dos eventos.' },
/* ===== Practice case (Piscina) · ArchiMate responsibilities — reserved for the mock exam ===== */
{ id: 'cs-p1-a', t: 'exam', l: 3, ctx: 'case-adc', reserved: 'exam', les: 'exam-format', d: P1,

{ id: 'cs-p1-b', t: 'exam', l: 3, ctx: 'case-adc', reserved: 'exam', les: 'exam-format', d: P1,
  q: 'Que falha é **R03** (Treinadores → Reservar vaga)?',

{ id: 'cs-p1-c', t: 'exam', l: 3, ctx: 'case-adc', reserved: 'exam', les: 'arch-common', d: P1,
  q: 'Que falha é **C06: Avaliar nível**, desenhado como Business Object?',

{ id: 'cs-p1-d', t: 'exam', l: 3, ctx: 'case-adc', reserved: 'exam', les: 'exam-format', d: P1,
  q: 'C05 “Enviar pedido de pagamento” está no diagrama, mas sem ligação. Que falha é e como se corrige?',
  o: ['E: acrescentar R90, assignment da Secretaria a C05', 'B: retirar C05, que está a mais', 'F: acrescentar um novo actor “Tesouraria” para C05', 'C: trocar C05 por um Service'], a: 0,
  e: 'O UoD diz que é a **secretaria** que envia o pedido de pagamento. O conceito existe; falta a **relação**: **E**.' },
/* ===== Practice case · ArchiMate application support ===== */
{ id: 'cs-p2-a', t: 'exam', l: 3, ctx: 'case-adc', reserved: 'exam', les: 'arch-rel', d: P2,
  q: 'Viewpoint: suporte aplicacional e informação. Que falha é **R11** (serving do Serviço de Pagamentos para o Gateway de Pagamentos)?',
  o: FALHA4, a: 2, fixed: true,

{ id: 'cs-p2-b', t: 'exam', l: 3, ctx: 'case-adc', reserved: 'exam', les: 'arch-app', d: P2,
  q: 'Que falha é **C15: Registo de ocupação**, desenhado como Application Component?',

{ id: 'cs-p2-c', t: 'exam', l: 3, ctx: 'case-adc', reserved: 'exam', les: 'exam-viewpoints', d: P2,
  q: 'Que falha é **C16: Treinadores** com R14?',
  o: FALHA4, a: 1, fixed: true,
  e: 'Equipas humanas não respondem à preocupação de **suporte aplicacional**: conceito **a mais** (com a sua relação), uma só falha **B**.' },
{ id: 'cs-p2-d', t: 'exam', l: 3, ctx: 'case-adc', reserved: 'exam', les: 'exam-format', d: P2,
  q: 'A App ADC também usa o Serviço de Pagamentos. O que falta?',
