/* --- courses/oc/questions/vm.js --- */
STUDY.questions('oc', [
/* ===== MEMÓRIA VIRTUAL E TLB ===== */
{ id: 'vm-01', t: 'vm', l: 1, les: 'v-why',
  q: 'Qual é a principal motivação atual da memória virtual?',
  o: ['Vários programas partilharem a memória física de forma eficiente e protegida, cada um com o seu espaço de endereços', 'Tornar a RAM mais rápida', 'Substituir a cache', 'Poupar energia no disco'], a: 0,
  e: 'Cada programa vê o seu **espaço virtual privado**; a tradução impede-o de mexer na memória dos outros. A motivação antiga era esconder uma RAM pequena.' },
{ id: 'vm-02', t: 'vm', l: 1, les: 'v-why',
  q: 'Na memória virtual, como se chamam o “bloco” e o “miss”?',
  o: ['Página e page fault', 'Linha e TLB miss', 'Segmento e cache miss', 'Moldura e conflito'], a: 0,
  e: 'A RAM funciona como **cache do disco**: o bloco é a **página** e falhar é um **page fault**.' },
{ id: 'vm-03', t: 'vm', l: 1, les: 'v-tlb',
  q: 'Quem trata um page fault?',
  o: ['O sistema operativo (software), chamado através de uma exceção', 'Só o controlador da cache', 'O compilador', 'O linker'], a: 0,
  e: 'Um page fault custa milhões de ciclos (disco): vale a pena tratá-lo em **software**, com algoritmos inteligentes de substituição.' },
{ id: 'vm-04', t: 'vm', l: 1, les: 'v-trans',
  q: 'Que parte do endereço virtual é traduzida?',
  o: ['Só o número de página virtual; o offset passa igual', 'O endereço todo', 'Só o offset', 'Nenhuma: o endereço físico é igual ao virtual'], a: 0,
  e: 'A página virtual e a física têm o mesmo tamanho, por isso a **posição dentro da página** (offset) não muda. Só a VPN é trocada pela PPN.' },
{ id: 'vm-05', t: 'vm', l: 1, les: 'v-trans',
  q: 'Como é indexada a tabela de páginas?',
  o: ['Pelo número de página virtual (VPN)', 'Pelo número de página física', 'Pelo offset', 'Por uma função de hash do endereço físico'], a: 0,
  e: 'É um vetor de PTEs: a entrada número VPN diz onde está essa página. (A tabela **invertida** é que usa hash.)' },
{ id: 'vm-06', t: 'vm', l: 1, les: 'v-trans',
  q: 'Onde está, e como se encontra, a tabela de páginas de um processo?',
  o: ['Na memória principal; o page table register do CPU aponta para ela', 'Na cache L1', 'No disco, sempre', 'Dentro da TLB'], a: 0,
  e: 'A tabela vive na **RAM** (uma por processo). Ao trocar de processo, o SO muda o **page table register**.' },
{ id: 'vm-07', t: 'vm', l: 1, les: 'v-trans',
  q: 'Uma PTE tem o bit de validade a 0. O que quer isso dizer?',
  o: ['A página não está na memória física: o acesso provoca um page fault', 'A página está na RAM mas foi escrita', 'A página é só de leitura', 'A tradução está na TLB'], a: 0,
  e: 'Valid = 0 → **page fault**. A PTE pode guardar onde a página está no disco (swap).' },
{ id: 'vm-08', t: 'vm', l: 1, les: 'v-tlb',
  q: 'O que é a TLB?',
  o: ['Uma pequena cache das traduções VPN → PPN usadas recentemente', 'A tabela de páginas completa', 'Uma cache de dados de segundo nível', 'O buffer de escritas da cache'], a: 0,
  e: 'A TLB (Translation Lookaside Buffer) evita ir à tabela de páginas, em memória, em cada acesso. É a agenda de favoritos em vez da lista telefónica.' },
{ id: 'vm-09', t: 'vm', l: 1, les: 'v-tlb',
  q: 'O que é mais frequente: TLB misses ou page faults?',
  o: ['TLB misses, de longe', 'Page faults', 'São igualmente frequentes', 'Não há relação'], a: 0,
  e: 'A TLB tem poucas entradas; a RAM tem milhares de páginas. Quase sempre a página está na RAM e basta recarregar a tradução.' },
{ id: 'vm-10', t: 'vm', l: 1, les: 'v-why',
  q: 'Para que serve o dirty bit de uma PTE?',
  o: ['Saber se a página foi escrita e, portanto, se tem de ser gravada no disco antes de ser substituída', 'Saber se a página está na RAM', 'Saber se a página foi usada recentemente', 'Proibir escritas na página'], a: 0,
  e: 'Write-back: só se grava no disco o que **mudou**. Páginas limpas podem simplesmente ser descartadas.',
  w: { 1: 'Isso é o bit de validade.', 2: 'Isso é o bit de referência.' } },
{ id: 'vm-11', t: 'vm', l: 2, les: 'v-why',
  q: 'Porque é que as páginas são grandes (4 a 16 KB), muito maiores do que os blocos de cache?',
  o: ['Para amortizar o enorme custo de cada acesso ao disco e reduzir o tamanho das tabelas', 'Porque o disco só lê 16 KB de cada vez', 'Para caberem na TLB', 'Para reduzir o hit time da cache'], a: 0,
  e: 'Um acesso ao disco é lentíssimo a começar, mas depois transfere depressa: vale a pena trazer muito de uma vez. Contra: páginas grandes desperdiçam mais memória.' },
{ id: 'vm-12', t: 'vm', l: 2, les: 'v-why',
  q: 'Porque é que a colocação de páginas na RAM é totalmente associativa (qualquer página em qualquer moldura)?',
  o: ['Porque um page fault é tão caro que vale tudo para reduzir o miss rate', 'Porque é mais barato em hardware', 'Porque não há tags', 'Porque as páginas são todas iguais'], a: 0,
  e: 'Em caches, a associatividade total é cara (comparadores). Na memória virtual a procura faz-se por **tabela**, e a penalty de milhões de ciclos justifica eliminar os misses de conflito.' },

<script>
/* ===== Progress key =====
   Packs a student's progress into a short text that can travel as a link, a QR code or a paste,
   so they can continue on another device without accounts or a server.

   Questions are referred to by their position in the course's ids.json (STUDY.ids), never by
   their order in the source files, so adding questions never breaks old keys.

   Text format:  "E1" + base64url(bytes)
   bytes:        [flags] + payload + [checksum hi, lo]
     flags       bit0 compressed · bit1 includes notes
     payload     deflate-compressed when the browser supports it
     checksum    Fletcher-16 over flags + payload, catches truncated or mistyped keys
   payload (varint = unsigned LEB128, str = varint length + UTF-8):
     varint courseCount
     per course:
       str id · varint xp · varint rounds · varint testDay (0 = none) · byte settings (bit0 unlockAll)
       varint baseDay · varint n
       n × varint gap        (index − previous index − 1, indexes ascending)
       n × byte  c<<4 | w    (each capped at 15)
       n × byte  box<<5 | eb<<3 | ew   (box ≤ 7, eb ≤ 3, ew ≤ 7)
       n × varint lastDay − baseDay
       if notes: varint m, m × (varint index, str text)
   Columns (not rows) because similar bytes side by side compress much better. */
window.PROGRESS_KEY = (() => {
  const PREFIX = 'E1';
  const DAY = 864e5, EPOCH = Math.floor(Date.UTC(2024, 0, 1) / DAY);
  const toDay = ms => ms ? Math.max(0, Math.floor(ms / DAY) - EPOCH) : 0;
  const fromDay = d => (d + EPOCH) * DAY + DAY / 2;
  const cap = (v, m) => Math.max(0, Math.min(m, v | 0));

  /* --- bytes --- */
  function writer() {
    const b = [];
    const w = {
      byte(v) { b.push(v & 255); },
      varint(v) { v = Math.max(0, Math.floor(v)); do { let x = v % 128; v = Math.floor(v / 128); b.push(v ? x | 128 : x); } while (v); },
      str(s) { const u = new TextEncoder().encode(s); w.varint(u.length); u.forEach(x => b.push(x)); },
      out: () => Uint8Array.from(b),
    };
    return w;
  }
  function reader(u) {
    let i = 0;
    const need = () => { if (i >= u.length) throw new Error('truncated'); };
    const r = {
      byte() { need(); return u[i++]; },
      varint() { let v = 0, m = 1, x; do { need(); x = u[i++]; v += (x & 127) * m; m *= 128; } while (x & 128); return v; },
      str() { const n = r.varint(); if (i + n > u.length) throw new Error('truncated'); const s = new TextDecoder().decode(u.subarray(i, i + n)); i += n; return s; },
    };
    return r;
  }
  const b64 = u => { let s = ''; u.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const t = atob(s); return Uint8Array.from(t, c => c.charCodeAt(0)); };
  async function pipe(u, Stream) { const out = new Response(new Blob([u]).stream().pipeThrough(new Stream('deflate-raw'))); return new Uint8Array(await out.arrayBuffer()); }
  const fletcher = u => { let a = 0, b = 0; u.forEach(x => { a = (a + x) % 255; b = (b + a) % 255; }); return [b, a]; };
  const canZip = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';

  /* --- encode: G is the app state ({ c: { courseId: { stats, notes, xp, rounds, settings } } }) --- */
  async function encode(G, courses, opts = {}) {
    const w = writer();
    const list = Object.keys(G.c || {}).filter(id => courses[id] && courses[id].ids);
    w.varint(list.length);
    for (const id of list) {
      const S = G.c[id], ids = courses[id].ids, pos = new Map(ids.map((q, i) => [q, i]));
      const rows = Object.entries(S.stats || {})
        .filter(([q, s]) => pos.has(q) && (s.c || s.w || s.ew))
        .map(([q, s]) => ({ i: pos.get(q), s })).sort((a, b) => a.i - b.i);
      const days = rows.map(r => toDay(r.s.last)); const base = days.length ? Math.min(...days) : 0;
      w.str(id); w.varint(S.xp || 0); w.varint(S.rounds || 0);
      const td = S.settings && S.settings.testDate ? Date.parse(S.settings.testDate + 'T12:00:00Z') : 0;
      w.varint(td ? toDay(td) + 1 : 0); w.byte(S.settings && S.settings.unlockAll ? 1 : 0);
      w.varint(base); w.varint(rows.length);
      let prev = -1; rows.forEach(r => { w.varint(r.i - prev - 1); prev = r.i; });
      rows.forEach(r => w.byte(cap(r.s.c, 15) << 4 | cap(r.s.w, 15)));
      rows.forEach(r => w.byte(cap(r.s.box, 7) << 5 | cap(r.s.eb, 3) << 3 | cap(r.s.ew, 7)));
      days.forEach(d => w.varint(d - base));
      if (opts.notes) {
        const ns = Object.entries(S.notes || {}).filter(([q, t]) => t && pos.has(q));
        w.varint(ns.length); ns.forEach(([q, t]) => { w.varint(pos.get(q)); w.str(t); });
      }
    }
    let payload = w.out(), flags = opts.notes ? 2 : 0;
    if (canZip) { const z = await pipe(payload, CompressionStream); if (z.length < payload.length) { payload = z; flags |= 1; } }
    const body = new Uint8Array(payload.length + 1); body[0] = flags; body.set(payload, 1);
    const all = new Uint8Array(body.length + 2); all.set(body); all.set(fletcher(body), body.length);
    return PREFIX + b64(all);
  }

  /* --- find the key inside whatever was pasted: a link, the key itself, text around it --- */
  function extract(text) {
    const s = String(text || '').trim();
    const m = s.match(/[#?&]k=(E1[A-Za-z0-9_-]+)/) || s.match(/\b(E1[A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  }

  /* --- decode: returns { courses: { id: { stats, notes, xp, rounds, testDate, unlockAll } }, unknown } --- */
  async function decode(text, courses) {
    const key = extract(text); if (!key) throw new Error('Não encontrei uma chave neste texto.');
    let all; try { all = unb64(key.slice(PREFIX.length)); } catch { throw new Error('A chave está incompleta ou foi alterada. Copia-a outra vez.'); }
    const bad = () => new Error('A chave está incompleta ou foi alterada. Copia-a outra vez.');
    if (all.length < 4) throw bad();
    const body = all.subarray(0, all.length - 2), [h, l] = fletcher(body);
    if (all[all.length - 2] !== h || all[all.length - 1] !== l) throw bad();
    const flags = body[0]; let payload = body.subarray(1);
    if (flags & 1) { if (!canZip) throw new Error('Este browser é demasiado antigo para ler a chave.'); try { payload = await pipe(payload, DecompressionStream); } catch { throw bad(); } }
    const r = reader(payload), out = { courses: {}, unknown: 0 };
    try {
      const nc = r.varint();
      for (let k = 0; k < nc; k++) {
        const id = r.str(), ids = (courses[id] && courses[id].ids) || [];
        const C = { stats: {}, notes: {}, xp: r.varint(), rounds: r.varint() };
        const td = r.varint(); C.testDate = td ? new Date(fromDay(td - 1)).toISOString().slice(0, 10) : '';

        const idx = []; let prev = -1; for (let j = 0; j < n; j++) { prev += r.varint() + 1; idx.push(prev); }
        const a = [], b = [], d = [];
        for (let j = 0; j < n; j++) a.push(r.byte());
        for (let j = 0; j < n; j++) b.push(r.byte());
        for (let j = 0; j < n; j++) d.push(r.varint());
        idx.forEach((i, j) => {
          const q = ids[i]; if (!q) { out.unknown++; return; }
          C.stats[q] = { c: a[j] >> 4, w: a[j] & 15, box: b[j] >> 5, eb: (b[j] >> 3) & 3, ew: b[j] & 7, last: fromDay(base + d[j]) };
        });

    if (!Object.keys(out.courses).length) throw new Error('Esta chave não tem progresso de nenhuma cadeira deste site.');

  }

  /* --- merge into G without losing anything on either side --- */
  function merge(G, incoming, blank) {
    const report = { added: 0, updated: 0, notes: 0 };
    for (const [id, R] of Object.entries(incoming.courses)) {
      const L = G.c[id] || (G.c[id] = blank(id));
      L.stats = L.stats || {}; L.notes = L.notes || {}; L.settings = L.settings || {};
      for (const [q, r] of Object.entries(R.stats)) {
        const l = L.stats[q];
        if (!l) { L.stats[q] = { ...r }; report.added++; continue; }
        const before = JSON.stringify(l);
        l.c = Math.max(l.c || 0, r.c); l.w = Math.max(l.w || 0, r.w); l.ew = Math.max(l.ew || 0, r.ew);
        if ((r.last || 0) > (l.last || 0)) { l.box = r.box; l.eb = r.eb; l.last = r.last; }   // review state follows the most recent device
        if (JSON.stringify(l) !== before) report.updated++;

      for (const [q, t] of Object.entries(R.notes)) {
        const mine = L.notes[q];
        if (!mine) { L.notes[q] = t; report.notes++; }
        else if (!mine.includes(t)) { L.notes[q] = mine + '\n\n' + t; report.notes++; }

      if (R.unlockAll) L.settings.unlockAll = true;
    }

  }

  /* --- what a key contains, for the confirmation screen --- */
  const summary = decoded => Object.entries(decoded.courses).map(([id, C]) => ({
    id, answered: Object.keys(C.stats).length, mastered: Object.values(C.stats).filter(s => s.c > 0).length,
    xp: C.xp, notes: Object.keys(C.notes).length,

  return { encode, decode, extract, merge, summary };
})();

/* ===== Estudo IST — engine =====

/* ---------- state ----------

const blank = (topics = {}) => ({ stats: {}, notes: {}, xp: 0, skipped: {}, settings: { topics: Object.keys(topics), known: Object.keys(topics), unlockAll: false, testDate: '', noCalc: false }, rounds: 0, sessions: [] });

function openCourse(id) {

function rebuildBank() {
  const seen = new Set(); BANK = []; BYID = {}; LESSONS = []; LBYID = {};
  const addL = (l, trusted) => { if (!l || !l.id || LBYID[l.id]) return; const x = Object.assign({}, l, { trusted }); LESSONS.push(x); LBYID[l.id] = x; };
  C.lessons.forEach(l => addL(l, true));

function validateQ(q) {
  if (!q || typeof q !== 'object') return { ok: false, why: 'não é um objeto' };
  if (!q.id || typeof q.id !== 'string') return { ok: false, why: 'falta "id" (texto)' };
  if (!TOPICS[q.t]) return { ok: false, why: `"t" tem de ser um de: ${Object.keys(TOPICS).join(', ')}` };
  if (![1, 2, 3, 4].includes(q.l)) return { ok: false, why: '"l" (nível) tem de ser 1, 2, 3 ou 4' };
  if (!q.q || typeof q.q !== 'string') return { ok: false, why: 'falta "q" (enunciado)' };
  if (!Array.isArray(q.o) || q.o.length < 2 || q.o.length > 6 || q.o.some(o => typeof o !== 'string')) return { ok: false, why: '"o" tem de ser uma lista de 2 a 6 opções (texto)' };
  const ans = Array.isArray(q.a) ? q.a : [q.a];
  if (!ans.length || ans.some(i => !Number.isInteger(i) || i < 0 || i >= q.o.length)) return { ok: false, why: '"a" tem de ser o índice (0, 1, …) da opção certa, ou uma lista de índices' };
  if (!q.e || typeof q.e !== 'string') return { ok: false, why: 'falta "e" (explicação)' };
  return { ok: true };
}

function save() { G.updatedAt = Date.now(); ls.set(LS_KEY, G); }

/* ---------- stats helpers ----------
   Per question: c correct, w training mistakes, box training-review box,
   ew exam mistakes, eb correct in a row since the last exam mistake, last (timestamp). */
const ZERO = { c: 0, w: 0, box: 0, ew: 0, eb: 0, last: 0 };
const st = id => { const s = S.stats[id] || (S.stats[id] = { ...ZERO }); for (const k in ZERO) if (s[k] === undefined) s[k] = 0; return s; };
const peek = id => Object.assign({}, ZERO, S.stats[id]);
const shown = q => !(S.settings.noCalc && q.calc);                 // "Só teoria" hides questions with calculations
const inTopics = q => S.settings.topics.includes(q.t) && shown(q);
const hasCalc = () => BANK.some(q => q.calc);
const examCfg = () => Object.assign({ n: EXAM_N, min: EXAM_MIN, penalty: null }, C && C.exam);
const isReserved = q => q.reserved === 'exam';

const trainPool = () => BANK.filter(q => inTopics(q) && !isReserved(q));
function mastery(level, topics = S.settings.topics) {

  const done = qs.filter(q => peek(q.id).c > 0).length; return { pct: done / qs.length, done, total: qs.length };
}
function unlocked(level) { if (level === 1 || S.settings.unlockAll) return true; return mastery(level - 1).pct >= UNLOCK; }
function topLevel() { let t = 1; for (const L of LEVELS) if (unlocked(L.n)) t = L.n; return t; }

/* ---------- sessions ---------- */
function makeItem(q) { const n = q.o.length; const order = q.fixed ? [...Array(n).keys()] : shuffle([...Array(n).keys()]); return { kind: 'q', id: q.id, order }; }
function buildExam() {
  // 1) unseen reserved questions; 2) fill with the usual level mix from training; 3) reserved ones already seen
  const EXAM_N = examCfg().n;
  let qs = shuffle(freshReserved()).slice(0, EXAM_N);
  const used = new Set(qs.map(q => q.id));
  if (qs.length < EXAM_N) {
    const tp = trainPool().filter(q => !used.has(q.id)); const by = (l, n) => pick(tp.filter(q => q.l === l), n);
    const r = EXAM_N / 20; const mix = shuffle([...by(2, Math.ceil(7 * r)), ...by(3, Math.ceil(8 * r)), ...by(4, Math.ceil(5 * r))]).slice(0, EXAM_N - qs.length);
    mix.forEach(q => used.add(q.id)); qs = qs.concat(mix);
  }
  if (qs.length < EXAM_N) qs = qs.concat(shuffle(BANK.filter(q => inTopics(q) && isReserved(q) && !used.has(q.id))).slice(0, EXAM_N - qs.length));

}
function start(mode, opts = {}) {
  let items = [], title = '', timeLimit = 0;

  if (mode === 'level') { const L = opts.level; items = pick(pool.filter(q => q.l === L), 10).map(makeItem); title = `Nível ${L} · ${LEVELS[L - 1].t}`; }
  if (mode === 'review') { items = reviewPool().slice(0, 12).map(makeItem); title = 'Revisão · erros de treino'; if (!items.length) { toast('Ainda não tens erros de treino para rever.'); return; } }
  if (mode === 'skipped') { items = skippedPool().slice(0, 12).map(makeItem); title = 'Revisão · saltadas'; if (!items.length) { toast('Não tens perguntas saltadas.'); return; } }
  if (mode === 'reviewExam') { items = examReviewPool().slice(0, 12).map(makeItem); title = 'Revisão · erros de exame'; if (!items.length) { toast('Ainda não tens erros de exame para rever.'); return; } }
  if (mode === 'extra') { const x = (C.extras || []).find(e => e.id === opts.extra); if (!x) return; items = (x.questions(extraApi()) || []).map(makeItem); title = x.title; }
  if (mode === 'exam') { items = buildExam().map(makeItem); title = 'Exame simulado'; timeLimit = examCfg().min * 60; }
  if (mode === 'learn') {
    const t = opts.topic; title = `Aprender · ${TOPICS[t].short}`;
    LESSONS.filter(l => l.t === t).forEach(l => { items.push({ kind: 'lesson', id: l.id });
      const qs = pool.filter(q => q.les === l.id).sort((a, b) => a.l - b.l || (peek(a.id).c - peek(b.id).c)).slice(0, 2); qs.forEach(q => items.push(makeItem(q))); });
  }
  if (mode === 'retry') { items = opts.ids.map(id => BYID[id]).filter(Boolean).map(makeItem); title = 'Repetir erros'; }
  if (!items.length) { toast('Não há perguntas para estes filtros.'); return; }
  ses = { mode, title, items, i: 0, results: [], picked: new Set(), answered: false, xp: 0, timeLimit, startedAt: Date.now(), level: opts.level, topic: opts.topic, examGrading: mode === 'reviewExam' || !!opts.examGrading, ended: false };
  if (timeLimit) startTimer();
  go(items[0].kind === 'lesson' ? 'lesson' : 'quiz');
}

let tick = null;
function startTimer() { clearInterval(tick); tick = setInterval(() => { if (!ses || ses.ended) { clearInterval(tick); return; } const left = ses.timeLimit - Math.floor((Date.now() - ses.startedAt) / 1000); const el = document.getElementById('timer'); if (el) { el.textContent = fmt(Math.max(0, left)); el.classList.toggle('hot', left <= 120); } if (left <= 0) finish(); }, 250); }
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const curItem = () => ses.items[ses.i];
const qCount = () => ses.items.filter(x => x.kind === 'q').length;
const qIndex = () => ses.items.slice(0, ses.i + 1).filter(x => x.kind === 'q').length;

/* ---------- QUIZ ---------- */
function Quiz() {
  const it = curItem(), q = BYID[it.id]; const T = TOPICS[q.t]; const multi = Array.isArray(q.a);
  const isExam = ses.mode === 'exam';
  const prog = `<div class="progress" aria-hidden="true">${ses.items.filter(x => x.kind === 'q').map((x, i) => { const r = ses.results.find(rr => rr.item === x); const cur = x === it; return `<i class="${r ? (r.skipped ? 'sk' : isExam ? 'cur' : r.ok ? 'ok' : 'ko') : cur ? 'cur' : ''}"></i>`; }).join('')}</div>`;
  const skipBtn = `<button class="btn small skip" data-act="skip" title="${isExam ? 'Deixar em branco (não desconta)' : 'Saltar: fica na lista Saltadas para fazeres depois'}">${isExam ? 'Deixar em branco' : 'Saltar'} ⤼</button>`;
  const opts = it.order.map((oi, pos) => { let cls = ''; const isRight = multi ? q.a.includes(oi) : q.a === oi; const chosen = ses.picked.has(oi);
    if (ses.answered && !isExam) { if (isRight) cls = 'right'; else if (chosen) cls = 'wrong'; } else if (chosen) cls = 'sel';
    return `<button class="opt ${cls}" data-act="opt" data-oi="${oi}" ${ses.answered ? 'disabled' : ''}><span class="k">${multi ? (chosen ? '✓' : pos + 1) : pos + 1}</span><span class="txt">${md(q.o[oi])}</span></button>`; }).join('');
  let fb = '';

  const foot = ses.answered ? (isExam ? '' : `<div class="qfoot"><button class="btn primary" data-act="next" id="nextBtn">${ses.i >= ses.items.length - 1 ? 'Ver resultado' : 'Seguinte'} →</button><span class="kbd">Enter</span><span class="spacer"></span><button class="btn ghost small" data-act="quit">Terminar ronda</button></div>`)
    : `<div class="qfoot">${multi ? `<button class="btn primary" data-act="confirm" ${ses.picked.size ? '' : 'disabled'}>Confirmar</button>` : ''}${skipBtn}<span class="muted" style="font-size:12.5px">Teclas <span class="kbd">1</span>–<span class="kbd">${q.o.length}</span>${multi ? ' marcam, <span class="kbd">Enter</span> confirma' : ''} · <span class="kbd">S</span> ${isExam ? 'branco' : 'salta'}</span><span class="spacer"></span>${isExam ? `<button class="btn ghost small" data-act="finish">Entregar exame</button>` : `<button class="btn ghost small" data-act="quit">Terminar ronda</button>`}</div>`;
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="badge" style="--c:${T.c}"><span class="sw"></span>${T.short}</span><span class="badge">N${q.l}</span>${q.calc ? `<span class="badge calc" title="Pergunta com contas">Contas${q.step ? ` · ${esc(q.step)}` : ''}</span>` : ''}${prog}${(isExam) ? `<span class="timer" id="timer">${fmt(ses.timeLimit - Math.floor((Date.now() - ses.startedAt) / 1000))}</span>` : ''}<span class="mono muted">${qIndex()}/${qCount()}</span></div>
    <article class="card" id="qcard">
      <span class="eyebrow">${esc(ses.title)}</span>
      <p class="qtext" style="margin-top:6px">${md(q.q)}</p>
      ${multi ? '<div class="multi-note">Seleciona todas as corretas</div>' : ''}
      ${q.ctx && LBYID[q.ctx] ? `<details class="lesson-peek" style="margin-top:12px"><summary>Ler o caso: ${esc(LBYID[q.ctx].title)}</summary><div class="lbody lesson">${lessonBody(LBYID[q.ctx])}</div></details>` : ''}

}
function Feedback(q, it) {

    <p class="explain">${md(q.e)}</p>
    ${wrongNotes}
    ${L ? `<details class="lesson-peek" ${ok ? '' : 'open'}><summary>Teoria: ${esc(L.title)}</summary><div class="lbody lesson">${lessonBody(L)}</div></details>` : ''}
    <div class="note-box"><label class="eyebrow" for="note-${esc(q.id)}">A minha nota sobre esta pergunta</label><textarea id="note-${esc(q.id)}" data-act="note" data-id="${esc(q.id)}" placeholder="Escreve aqui o truque para não voltares a errar…">${esc(S.notes[q.id] || '')}</textarea></div>

const pickOne = a => a[Math.floor(Math.random() * a.length)];
const codeBlock = c => `<pre class="codeblk">${esc(c)}</pre>`;
function lessonBody(L) { const body = L.trusted ? L.html : md(L.html || ''); return `${body}${L.d ? `<div class="diagram">${renderD(L.d)}</div>` : ''}${L.key ? `<p class="key">${L.trusted ? L.key : md(L.key)}</p>` : ''}`; }
function afterQuizRender() { const n = document.getElementById('nextBtn'); if (n) n.focus({ preventScroll: true }); }

}

  else if (ses.examGrading) { if (ok) { s.c++; s.eb++; } else { s.ew++; s.eb = 0; } }
  else if (ok) { s.c++; s.box = Math.min(5, s.box + 1); } else { s.w++; s.box = 0; }

  if (ses.mode === 'exam') { next(); return; }
  renderView();
}
// Skip: in training it goes to the "Saltadas" list (not a mistake, no XP); in the mock exam it is a blank answer.
function skip() {

  if (ses.mode !== 'exam') { if (!S.skipped) S.skipped = {}; S.skipped[it.id] = Date.now(); save(); }
  ses.answered = true; next();
}
function next() {
  if (!ses) return;
  if (ses.i >= ses.items.length - 1) { finish(); return; }
  ses.i++; ses.picked = new Set(); ses.answered = false;
  go(curItem().kind === 'lesson' ? 'lesson' : 'quiz');
}
function finish() {
  if (!ses || ses.ended) return; ses.ended = true; clearInterval(tick);

    // real grading: a wrong answer costs 1/(number of options); blank (skipped or unanswered) is 0
    const pen = X.penalty ? ses.results.filter(r => !r.ok && !r.skipped).reduce((a, r) => a + 1 / BYID[r.id].o.length, 0) : 0;
    ses.penalty = pen; ses.grade = Math.max(0, Math.round((ok - pen) / tot * 200) / 10); ses.rawGrade = Math.round(ok / tot * 200) / 10; const g = ses.results.filter(r => r.ok).reduce((a, r) => a + XP[BYID[r.id].l], 0); S.xp += g; ses.xp = g; }
  S.rounds++; S.sessions.push({ m: ses.mode, d: Date.now(), n: ses.results.length, ok: ses.results.filter(r => r.ok).length }); if (S.sessions.length > 400) S.sessions = S.sessions.slice(-400);

/* ---------- LESSON (inside learn session) ---------- */
function LessonScreen() {
  const L = LBYID[curItem().id]; const T = TOPICS[L.t];
  const lessonsTotal = ses.items.filter(x => x.kind === 'lesson').length; const li = ses.items.slice(0, ses.i + 1).filter(x => x.kind === 'lesson').length;
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="badge" style="--c:${T.c}"><span class="sw"></span>${T.short}</span><span class="mono muted">lição ${li}/${lessonsTotal}</span></div>

    <div class="qfoot"><button class="btn primary" data-act="next" id="nextBtn">${ses.items[ses.i + 1] && ses.items[ses.i + 1].kind === 'q' ? 'Testar-me →' : 'Continuar →'}</button><span class="kbd">Enter</span><span class="spacer"></span><button class="btn ghost small" data-act="quit">Terminar</button></div></article>`;
}

/* ---------- RESULTS ---------- */
function Results() {
  const r = ses.results; const ok = r.filter(x => x.ok).length; const skipped = r.filter(x => x.skipped); const tot = r.length - skipped.length; const wrong = r.filter(x => !x.ok && !x.skipped);
  const lvl = ses.level; const nowUnlocked = lvl && lvl < 4 && unlocked(lvl + 1);
  let big = `${ok}/${tot}`, sub = tot ? `${Math.round(ok / tot * 100)}% de acerto` : 'sem respostas';
  if (!ses.mode.startsWith('exam') && skipped.length) sub += ` · ${skipped.length} saltada${skipped.length === 1 ? '' : 's'}`;
  if (ses.mode === 'exam') { const blank = ses.items.length - tot; big = `${ses.grade.toFixed(1)}`;
    sub = `valores em 20 · ${ok} certas, ${wrong.length} erradas, ${blank} em branco${ses.penalty ? ` · os erros descontaram ${(ses.penalty / ses.items.length * 20).toFixed(1)} valores (sem desconto: ${ses.rawGrade.toFixed(1)})` : ''}`; }
  const list = wrong.map(x => { const q = BYID[x.id]; const ans = (Array.isArray(q.a) ? q.a : [q.a]).map(i => md(q.o[i])).join(' · ');
    return `<div class="review-item"><span class="badge" style="--c:${TOPICS[q.t].c};align-self:flex-start"><span class="sw"></span>${TOPICS[q.t].short} · N${q.l}</span><p class="q">${md(q.q)}</p>${q.code ? codeBlock(q.code) : ''}${q.d ? `<div class="diagram">${renderD(q.d)}</div>` : ''}<p class="a">Resposta: <b>${ans}</b></p><p class="x">${md(q.e)}</p></div>`; }).join('');
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="eyebrow">${esc(ses.title)} · resultado</span></div>
    <article class="card stack">
      <div><div class="score-big">${big}</div><p class="muted">${sub}</p></div>
      <div class="result-grid"><div class="kpi"><b>+${ses.xp}</b><span>XP ganho</span></div><div class="kpi"><b>${wrong.length}</b><span>para rever</span></div>${ses.mode === 'exam' ? (ses.items.length - tot ? `<div class="kpi"><b>${ses.items.length - tot}</b><span>em branco</span></div>` : '') : skipped.length ? `<div class="kpi"><b>${skipped.length}</b><span>saltadas</span></div>` : ''}<div class="kpi"><b>${topLevel()}</b><span>nível mais alto aberto</span></div></div>
      ${nowUnlocked ? `<p class="key" style="margin:0">Nível ${lvl + 1} desbloqueado. O token avançou.</p>` : ''}
      <div class="row">${wrong.length ? `<button class="btn primary" data-act="retryWrong">${wrong.length === 1 ? 'Repetir a errada' : `Repetir as ${wrong.length} erradas`}</button>` : ''}${skipped.length ? `<button class="btn${wrong.length ? '' : ' primary'}" data-act="retrySkipped">${skipped.length === 1 ? `Tentar a ${ses.mode === 'exam' ? 'que ficou em branco' : 'saltada'} agora` : `Tentar as ${skipped.length} ${ses.mode === 'exam' ? 'em branco' : 'saltadas'} agora`}</button>` : ''}${lvl ? `<button class="btn" data-act="level" data-n="${nowUnlocked ? lvl + 1 : lvl}">${nowUnlocked ? `Ir para o nível ${lvl + 1}` : `Outra ronda do nível ${lvl}`}</button>` : ''}<button class="btn" data-act="home">Início</button></div>
    </article>
    ${wrong.length ? `<div class="section"><h2>O que falhaste, explicado</h2>${list}</div>` : `<div class="section"><p class="muted">Sem erros nesta ronda.</p></div>`}`;
}

/* ---------- LIBRARY / READER ---------- */
function LearnPick() {
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="eyebrow">Aprender</span></div>
  <h2 style="margin-bottom:6px">Escolhe um tema</h2><p class="muted" style="margin-bottom:14px">Cada lição curta é seguida de duas perguntas sobre ela.</p>
  <div class="lesson-list">${Object.entries(TOPICS).map(([k, t]) => { const n = LESSONS.filter(l => l.t === k).length; return n ? `<button class="lesson-item" style="--c:${t.c}" data-act="learn" data-k="${k}"><span class="sw"></span><span class="lt">${t.label}</span><span class="lc">${n} lições</span></button>` : ''; }).join('')}</div>`;
}
function Library() {
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="eyebrow">Biblioteca de teoria</span></div>
  ${Object.entries(TOPICS).map(([k, t]) => { const ls_ = LESSONS.filter(l => l.t === k); if (!ls_.length) return ''; return `<div class="section"><div class="section-h"><h2>${t.label}</h2></div><div class="lesson-list">${ls_.map(l => `<button class="lesson-item" style="--c:${t.c}" data-act="read" data-id="${esc(l.id)}"><span class="sw"></span><span class="lt">${esc(l.title)}</span><span class="lc">${BANK.filter(q => q.les === l.id && !isReserved(q)).length} perguntas</span></button>`).join('')}</div></div>`; }).join('')}`;
}
function Reader() {
  const L = LBYID[view.id]; if (!L) return Library(); const T = TOPICS[L.t]; const sib = LESSONS.filter(l => l.t === L.t); const idx = sib.indexOf(L);
  const qs = BANK.filter(q => q.les === L.id && !isReserved(q));
  return `<div class="qhead"><button class="btn small" data-act="library" aria-label="Voltar à biblioteca">←</button><span class="badge" style="--c:${T.c}"><span class="sw"></span>${T.short}</span><span class="mono muted">${idx + 1}/${sib.length}</span></div>
  <article class="card"><h2 style="margin-bottom:12px">${esc(L.title)}</h2><div class="lesson">${lessonBody(L)}</div>
  <div class="qfoot">${qs.length ? `<button class="btn primary" data-act="practice" data-id="${esc(L.id)}">Praticar ${qs.length} pergunta${qs.length === 1 ? '' : 's'} desta lição</button>` : ''}<span class="spacer"></span>${idx > 0 ? `<button class="btn small" data-act="read" data-id="${esc(sib[idx - 1].id)}">← Anterior</button>` : ''}${idx < sib.length - 1 ? `<button class="btn small" data-act="read" data-id="${esc(sib[idx + 1].id)}">Seguinte →</button>` : ''}</div></article>`;
}

/* ---------- NOTES ---------- */
function Notes() {
  const ids = Object.keys(S.notes).filter(k => S.notes[k] && BYID[k]);
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="eyebrow">As minhas notas</span></div>
  ${ids.length ? ids.map(id => { const q = BYID[id]; return `<div class="review-item" style="margin-bottom:10px"><span class="badge" style="--c:${TOPICS[q.t].c};align-self:flex-start"><span class="sw"></span>${TOPICS[q.t].short} · N${q.l}</span><p class="q">${md(q.q)}</p><p class="a">Resposta: <b>${(Array.isArray(q.a) ? q.a : [q.a]).map(i => md(q.o[i])).join(' · ')}</b></p><p class="x" style="color:var(--ink)">📝 ${md(S.notes[id])}</p></div>`; }).join('') : '<p class="muted">Ainda não escreveste notas. Depois de responderes a uma pergunta, aparece uma caixa para guardares o teu truque.</p>'}`;
}

/* ---------- BANK / IMPORT ---------- */
function importPrompt() {
  const imp = C.importHelp || {};
  return `Gera perguntas de escolha múltipla para estudar ${C.code} (${C.name}, IST) sobre [TEMA].
Responde APENAS com JSON válido neste formato:
{"name":"Nome do pacote","questions":[{"id":"único-por-pergunta","t":"${Object.keys(TOPICS).join('|')}","l":1,"q":"enunciado","o":["opção A","opção B","opção C","opção D"],"a":0,"e":"explicação teórica de porque a resposta certa é a certa","w":{"1":"porque é que a opção B está errada"}}]}
Regras: "l" é o nível (1 = definições, 2 = distinguir conceitos, 3 = cenários/diagramas, 4 = armadilhas). "a" é o índice (começa em 0) da opção certa, ou uma lista de índices se houver várias certas. ${imp.notes || 'Explicações em português de Portugal.'} Opcional: "les" com o id da lição relacionada.`;
}
function Bank() {
  const counts = Object.keys(TOPICS).map(k => `<span class="chip static" style="--c:${TOPICS[k].c}"><span class="sw"></span>${TOPICS[k].short} ${BANK.filter(q => q.t === k).length}</span>`).join('');
  const all = packs.map((p, i) => ({ ...p, _i: i })).filter(p => p.course === C.id);
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="eyebrow">Banco de perguntas</span></div>
  <div class="stack">
    <h2>${BANK.length} perguntas, ${LESSONS.length} lições</h2><div class="chips">${counts}</div>
    <div class="card stack">
      <h3>Acrescentar perguntas</h3>
      <p class="muted" style="font-size:14px">Cola um pacote JSON (ou escolhe um ficheiro .json).</p>
      <textarea class="code" id="importBox" spellcheck="false" placeholder='{"name":"…","questions":[…]}'>${esc(view.draft || '')}</textarea>
      <div class="row"><button class="btn primary" data-act="import">Importar</button><label class="btn" for="importFile">Escolher ficheiro</label><input type="file" id="importFile" accept=".json,application/json" hidden><span class="spacer"></span><button class="btn small" data-act="copyPrompt">Copiar prompt para gerar perguntas</button><button class="btn small" data-act="example">Ver exemplo</button></div>
      ${view.msg ? `<p class="msg ${view.msgOk ? 'ok' : 'ko'}">${esc(view.msg)}</p>` : ''}
      <details class="lesson-peek"><summary>Formato de cada pergunta</summary><div class="lbody" style="font-size:14px">
        <p><code class="mono">id</code> texto único · <code class="mono">t</code> tema (${Object.keys(TOPICS).join(', ')}) · <code class="mono">l</code> nível 1–4 · <code class="mono">q</code> enunciado · <code class="mono">o</code> 2 a 6 opções · <code class="mono">a</code> índice da certa (0 = primeira) ou lista de índices · <code class="mono">e</code> explicação · opcional <code class="mono">w</code> nota por opção errada, <code class="mono">les</code> lição, <code class="mono">src</code> fonte, <code class="mono">fixed</code> não baralhar opções.</p>
        <textarea class="code" readonly style="min-height:150px" id="promptBox">${esc(importPrompt())}</textarea></div></details>
    </div>
    <div class="stack"><h3>Pacotes importados</h3>
      ${all.length ? all.map(p => `<div class="pack"><b>${esc(p.name || 'Sem nome')}</b><span class="muted mono">${(p.questions || []).length} perguntas · neste browser</span><span class="spacer"></span>${view.confirmDel === p._i ? `<button class="btn small" style="color:var(--bad)" data-act="delPackYes" data-i="${p._i}">Confirmar remoção</button><button class="btn small" data-act="delPackNo">Cancelar</button>` : `<button class="btn small" data-act="delPack" data-i="${p._i}">Remover</button>`}</div>`).join('') : '<p class="muted">Ainda nenhum. As perguntas base estão sempre incluídas.</p>'}
    </div>
  </div>`;
}
function doImport(text) {
  let data; try { data = JSON.parse(text); } catch (e) { return go('bank', { msg: 'O texto não é JSON válido. Confirma as aspas e as vírgulas.', msgOk: false, draft: text }); }
  if (Array.isArray(data)) data = { name: 'Importado', questions: data };
  if (!data || !Array.isArray(data.questions)) return go('bank', { msg: 'Falta a lista "questions".', msgOk: false, draft: text });
  const bad = []; data.questions.forEach((q, i) => { const v = validateQ(q); if (!v.ok) bad.push(`pergunta ${i + 1}: ${v.why}`); });
  if (bad.length) return go('bank', { msg: `Corrige antes de importar — ${bad.slice(0, 3).join('; ')}${bad.length > 3 ? ` (+${bad.length - 3})` : ''}`, msgOk: false, draft: text });
  const pack = { course: C.id, name: String(data.name || 'Pacote importado').slice(0, 80), createdAt: Date.now(), questions: data.questions, lessons: Array.isArray(data.lessons) ? data.lessons : [] };
  packs.push(pack); ls.set(LS_PACKS, packs);
  rebuildBank(); go('bank', { msg: `${pack.questions.length} pergunta(s) importada(s) neste browser.`, msgOk: true, draft: '' });
}
async function copyText(text, fallbackId) {
  try { await navigator.clipboard.writeText(text); toast('Copiado.'); }
  catch { const el = document.getElementById(fallbackId); if (el) { el.closest('details') && (el.closest('details').open = true); el.focus(); el.select(); toast('Seleccionei o texto: copia com Ctrl/Cmd+C.'); } }
}

/* ---------- OTHER DEVICE (progress key) ----------
   Export: a key for all courses, as a link + QR (site) or text (local file), plus Share on phones.
   Import: paste a key/link, or open a #k= link; always merges, never overwrites. */
const KEY = window.PROGRESS_KEY;
const onWeb = /^https?:$/.test(location.protocol);
const touch = matchMedia('(pointer: coarse)').matches;
const keyLink = key => location.origin + location.pathname + '#k=' + key;
const hasProgress = () => Object.values(G.c).some(c => Object.values(c.stats || {}).some(s => s.c || s.w || s.ew));
function Sync() {
  const back = C ? 'home' : 'courses';
  const inc = view.incoming;
  const confirm = inc ? `<article class="card stack sync-confirm">
      <span class="eyebrow">${view.fromLink ? 'Abriste um link de progresso' : 'Chave lida'}</span>
      <h2>Juntar este progresso?</h2>
      <ul class="sync-list">${KEY.summary(inc).map(x => { const c = REG.courses[x.id]; return `<li><b>${esc(c.code)}</b> · ${x.answered} pergunta${x.answered === 1 ? '' : 's'} respondida${x.answered === 1 ? '' : 's'} (${x.mastered} já certas) · ${x.xp} XP${x.notes ? ` · ${x.notes} nota${x.notes === 1 ? '' : 's'}` : ''}</li>`; }).join('')}</ul>
      <p class="muted">Não apaga nada deste dispositivo: para cada pergunta fica o melhor dos dois lados.${inc.unknown ? ` ${inc.unknown} resposta(s) eram de perguntas que este site já não tem e ficam de fora.` : ''}</p>
      <div class="row"><button class="btn primary" data-act="mergeKey">Juntar ao meu progresso</button><button class="btn" data-act="cancelKey">Cancelar</button></div>
    </article>` : '';
  const exportHint = !onWeb ? 'Estás a usar o ficheiro HTML: o código dá o texto da chave. Copia-o e cola-o em “Trazer para aqui” no outro dispositivo.'
    : touch ? 'Carrega em Partilhar e envia para ti próprio (WhatsApp, email, notas). No outro dispositivo, abre o link.'
    : 'No telemóvel, aponta a câmara a este código e abre o link.';
  const exportCard = hasProgress() ? `<article class="card stack">
      <h3>${glyph('qr')} Levar daqui</h3>
      <p class="muted">${exportHint}</p>
      <div class="qr" id="qrBox" aria-label="Código QR com o teu progresso"><span class="muted">A gerar…</span></div>
      <label class="toggle"><input type="checkbox" id="includeNotes" ${view.notes ? 'checked' : ''}> Incluir as minhas notas <span class="muted" style="font-size:12.5px">(a chave fica maior)</span></label>
      <textarea class="code key" id="keyBox" readonly aria-label="${onWeb ? 'Link' : 'Chave'} de progresso"></textarea>
      <div class="row">
        <button class="btn primary" data-act="copyKey">${glyph('copy')} Copiar ${onWeb ? 'link' : 'chave'}</button>
        ${navigator.share ? `<button class="btn" data-act="shareKey">${glyph('share')} Partilhar</button>` : ''}
      </div>
    </article>` : `<article class="card stack"><h3>${glyph('qr')} Levar daqui</h3><p class="muted">Ainda não há progresso neste dispositivo. Responde a algumas perguntas e volta aqui.</p></article>`;
  return `<div class="qhead"><button class="btn small" data-act="${back}" aria-label="Voltar">←</button><span class="eyebrow">Outro dispositivo</span></div>
    <section class="hero"><h1>Continua noutro dispositivo.</h1>
      <p>O progresso fica guardado só neste browser. Para o passares, gera aqui uma chave e abre-a no outro dispositivo. Não há contas e nada é enviado para servidores.</p></section>
    ${confirm}
    <div class="sync-grid">
      ${exportCard}
      <article class="card stack">
        <h3>${glyph('swap')} Trazer para aqui</h3>
        <p class="muted">Cola a chave ou o link que geraste no outro dispositivo.</p>
        <textarea class="code key" id="pasteBox" spellcheck="false" placeholder="https://…#k=E1…  ou  E1…">${esc(view.pasted || '')}</textarea>
        ${view.err ? `<p class="msg ko">${esc(view.err)}</p>` : ''}
        <div class="row"><button class="btn primary" data-act="readKey">Ler chave</button></div>
      </article>
    </div>`;
}
let keyGen = 0;
async function afterSyncRender() {
  const box = document.getElementById('keyBox'), qrBox = document.getElementById('qrBox'); if (!box) return;
  const my = ++keyGen;
  let key; try { key = await KEY.encode(G, REG.courses, { notes: !!view.notes }); } catch { qrBox.innerHTML = '<span class="muted">Não consegui gerar a chave neste browser.</span>'; return; }
  if (my !== keyGen) return;
  const text = onWeb ? keyLink(key) : key;
  view.keyText = text; box.value = text;
  try { const q = qrcode(0, 'L'); q.addData(text, 'Byte'); q.make(); qrBox.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
  catch { qrBox.innerHTML = '<span class="muted">A chave é grande demais para um código QR. Usa Copiar ou Partilhar' + (view.notes ? ', ou tira as notas' : '') + '.</span>'; }
}
async function readKey(text) {
  try { const inc = await KEY.decode(text, REG.courses); go('sync', { incoming: inc, notes: view.notes }); }
  catch (e) { go('sync', { err: e.message, pasted: text, notes: view.notes }); }
}
function mergeKey() {
  const rep = KEY.merge(G, view.incoming, id => blank(REG.courses[id].topics));
  if (C) openCourse(C.id); else { const first = Object.keys(view.incoming.courses)[0]; if (first) openCourse(first); }
  save();
  toast(`Feito: ${rep.added} pergunta(s) novas, ${rep.updated} atualizadas${rep.notes ? `, ${rep.notes} nota(s)` : ''}.`);
  go(C ? 'home' : 'courses');
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (['unlockAll', 'testDate', 'note', 'noCalc'].includes(a)) return;
  switch (a) {
    case 'home': if (ses && !ses.ended && ses.mode === 'exam' && view.name === 'quiz') { finish(); return; } clearInterval(tick); ses = null; go('home'); break;
    case 'courses': if (ses && !ses.ended && ses.mode === 'exam' && view.name === 'quiz') { finish(); return; } clearInterval(tick); ses = null; go('courses'); break;
    case 'sync': go('sync'); break;
    case 'theme': cycleTheme(); renderView(); break;
    case 'skip': skip(); break;
    case 'retrySkipped': { const ids = ses.results.filter(r => r.skipped).map(r => r.id); start('retry', { ids }); if (ses) ses.title = 'Saltadas · com papel e caneta'; break; }
    case 'copyKey': if (view.keyText) copyText(view.keyText, 'keyBox'); break;
    case 'shareKey': if (view.keyText) navigator.share(onWeb ? { title: 'Estudo IST', text: 'O meu progresso no Estudo IST', url: view.keyText } : { title: 'Estudo IST', text: view.keyText }).catch(() => {}); break;
    case 'readKey': readKey(document.getElementById('pasteBox').value); break;
    case 'mergeKey': mergeKey(); break;
    case 'cancelKey': go('sync', { notes: view.notes }); break;
    case 'openC': if (openCourse(b.dataset.id)) { save(); go('home'); } break;
    case 'extra': start('extra', { extra: b.dataset.k }); break;
    case 'startReview': start(b.dataset.k); break;
    case 'topic': { const k = b.dataset.k; const set = new Set(S.settings.topics); set.has(k) ? set.delete(k) : set.add(k); if (!set.size) { toast('Tem de ficar pelo menos um tema.'); return; } S.settings.topics = Object.keys(TOPICS).filter(t => set.has(t)); save(); renderView(); break; }
    case 'level': { const n = +b.dataset.n; if (!unlocked(n)) { toast(`Bloqueado: precisas de ${Math.round(UNLOCK * 100)}% do nível ${n - 1} (ou ativa “Desbloquear todos”).`); return; } start('level', { level: n }); break; }
    case 'mode': { const k = b.dataset.k; if (k === 'learn') go('learnpick'); else if (k === 'library') go('library'); else if (k === 'review') go('reviewpick'); else start(k); break; }
    case 'learn': start('learn', { topic: b.dataset.k }); break;
    case 'library': go('library'); break;
    case 'read': go('reader', { id: b.dataset.id }); break;
    case 'practice': { const ids = BANK.filter(q => q.les === b.dataset.id).sort((x, y) => x.l - y.l).map(q => q.id); start('retry', { ids }); if (ses) ses.title = 'Praticar lição'; break; }
    case 'opt': choose(+b.dataset.oi); break;
    case 'confirm': if (ses && ses.picked.size) grade(); break;
    case 'next': next(); break;
    case 'quit': if (ses && ses.results.length) finish(); else { ses = null; go('home'); } break;
    case 'finish': finish(); break;
    case 'retryWrong': { const ids = ses.results.filter(r => !r.ok).map(r => r.id); start('retry', { ids, examGrading: ses.mode === 'exam' || ses.examGrading }); break; }
    case 'bank': go('bank'); break;
    case 'notes': go('notes'); break;
    case 'import': doImport(document.getElementById('importBox').value); break;
    case 'example': go('bank', { draft: JSON.stringify((C.importHelp && C.importHelp.example) || { name: 'Exemplo', questions: [] }, null, 2) }); break;
    case 'copyPrompt': copyText(importPrompt(), 'promptBox'); break;
    case 'delPack': view.confirmDel = +b.dataset.i; renderView(); break;
    case 'delPackNo': view.confirmDel = null; renderView(); break;
    case 'delPackYes': { packs.splice(+b.dataset.i, 1); ls.set(LS_PACKS, packs); rebuildBank(); view.confirmDel = null; renderView(); break; }
    case 'reset': view.confirmReset = true; renderView(); break;
    case 'resetNo': view.confirmReset = false; renderView(); break;
    case 'resetYes': { const keep = S.settings; G.c[C.id] = blank(TOPICS); G.c[C.id].settings = keep; openCourse(C.id); save(); view.confirmReset = false; toast('Progresso apagado.'); renderView(); break; }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'includeNotes') { view.notes = t.checked; renderView(); return; }
  if (t.id === 'unlockAll') { S.settings.unlockAll = t.checked; save(); renderView(); }
  if (t.id === 'noCalc') { S.settings.noCalc = t.checked; save(); renderView(); }
  if (t.id === 'testDate') { S.settings.testDate = t.value; save(); renderView(); }
  if (t.id === 'importFile' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => doImport(String(r.result || '')); r.readAsText(t.files[0]); }
});
let noteTimer = null;
document.addEventListener('input', ev => { const t = ev.target; if (t.dataset && t.dataset.act === 'note') { S.notes[t.dataset.id] = t.value; clearTimeout(noteTimer); noteTimer = setTimeout(save, 700); } });
document.addEventListener('keydown', ev => {
  if (ev.target.matches('textarea, input')) return;
  if (view.name === 'quiz' && ses) {
    const it = curItem(); const k = ev.key;
    if (/^[1-6]$/.test(k) && !ses.answered) { const pos = +k - 1; if (it.order[pos] !== undefined) { ev.preventDefault(); choose(it.order[pos]); } }
    else if ((k === 's' || k === 'S') && !ses.answered && !ev.ctrlKey && !ev.metaKey) { ev.preventDefault(); skip(); }
    else if (k === 'Enter') { ev.preventDefault(); if (!ses.answered && Array.isArray(BYID[it.id].a) && ses.picked.size) grade(); else if (ses.answered) next(); }
  } else if (view.name === 'lesson' && ev.key === 'Enter') { ev.preventDefault(); next(); }
});

if (G.cur && REG.courses[G.cur]) openCourse(G.cur); else view = { name: 'courses' };
renderView();
// opened from a progress link: show what it brings, then clean the address bar
function openKeyFromHash() {
  const linkKey = KEY.extract(location.hash); if (!linkKey) return;
  try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  if (ses && !ses.ended) { clearInterval(tick); ses = null; }
  KEY.decode(linkKey, REG.courses).then(inc => go('sync', { incoming: inc, fromLink: true }), e => go('sync', { err: e.message, pasted: linkKey }));
}
openKeyFromHash();
window.addEventListener('hashchange', openKeyFromHash);   // link opened in a tab where the site was already open
})();

</script>
</body></html>
