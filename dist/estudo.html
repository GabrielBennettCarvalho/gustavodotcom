STUDY.questions('rc', [
/* ===== APLICAÇÕES, SOCKETS E P2P ===== */
/* --- nível 1 --- */
{ id: 'sk-01', t: 'sock', l: 1, les: 's-arch',
  q: 'O que identifica um processo noutro computador, para lhe enviar uma mensagem?',
  o: ['O endereço IP do host e o número de porto', 'Só o endereço IP', 'Só o número de porto', 'O endereço MAC'], a: 0,
  e: 'O IP leva a mensagem ao **computador**; o **porto** escolhe o **processo** (socket) dentro dele. Muitos processos partilham o mesmo IP.' },
{ id: 'sk-02', t: 'sock', l: 1, les: 's-arch',
  q: 'O que é um socket?',
  o: ['A “porta” entre o processo da aplicação e o protocolo de transporte', 'Um cabo de rede', 'Um tipo de encaminhador', 'O cabeçalho de um segmento TCP'], a: 0,
  e: 'O processo envia e recebe mensagens pelo **socket**, como quem passa cartas por uma porta: do outro lado está o transporte (TCP/UDP) que as leva.' },
{ id: 'sk-03', t: 'sock', l: 1, les: 's-arch',
  q: 'Na arquitetura cliente-servidor, qual destas é uma característica do servidor?',
  o: ['Está sempre ligado, com um endereço conhecido, e espera que os clientes o contactem', 'Inicia o contacto com os clientes', 'Muda frequentemente de endereço IP', 'Comunica diretamente com outros servidores para servir cada pedido'], a: 0,
  e: 'O servidor é o ponto fixo: **sempre ligado**, endereço **permanente e conhecido**. Os clientes iniciam o contacto e não falam diretamente entre si.' },
{ id: 'sk-04', t: 'sock', l: 1, les: 's-arch',
  q: 'Qual é a grande vantagem de uma arquitetura P2P?',
  o: ['Autoescalabilidade: cada par novo traz também capacidade de serviço', 'Os pares têm sempre IP fixo', 'Não precisa de nenhum protocolo de transporte', 'É mais fácil de gerir do que cliente-servidor'], a: 0,
  e: 'Cada par que chega pede ficheiros mas também os **envia** a outros: a capacidade total cresce com o número de pares. O preço: pares instáveis e gestão mais difícil.' },
{ id: 'sk-05', t: 'sock', l: 1, les: 's-arch',
  q: 'Que serviço NENHUM dos protocolos de transporte da Internet (TCP ou UDP) oferece?',
  o: ['Garantias de atraso ou de débito', 'Entrega fiável e ordenada', 'Multiplexagem por portos', 'Deteção de erros com checksum'], a: 0,
  e: 'O TCP dá fiabilidade, ordem, controlo de fluxo e de congestão. O UDP dá multiplexagem e checksum. **Nenhum** garante atraso ou débito mínimo: a rede é best effort.' },
{ id: 'sk-06', t: 'sock', l: 1, les: 's-arch',
  q: 'Que porto usa por omissão um servidor SMTP, e sobre que transporte?',
  o: ['25, TCP', '25, UDP', '53, UDP', '110, TCP'], a: 0,
  e: 'SMTP: **TCP 25**. DNS: UDP 53. POP3: TCP 110. IMAP: TCP 143. HTTP: TCP 80.' },
{ id: 'sk-07', t: 'sock', l: 1, les: 's-api',
  q: 'Qual das seguintes chamadas de sistema associa um porto bem-conhecido a um socket?',
  o: ['bind()', 'socket()', 'gethostname()', 'connect()'], a: 0, src: 'Exame 2022/23, P4',
  e: '**bind()** associa o socket a um endereço local (IP e **porto**). É o que um servidor faz para ficar no porto que os clientes conhecem.' },
{ id: 'sk-08', t: 'sock', l: 1, les: 's-api',
  q: 'Que função permite a uma aplicação consultar o DNS para obter o endereço IP de um nome?',
  o: ['getaddrinfo()', 'gethostname()', 'bind()', 'listen()'], a: 0, src: 'Exame 2021/22, P4',
  e: '**getaddrinfo()** resolve um nome (e serviço) em endereços. gethostname() só devolve o nome da **própria** máquina.',
  w: { 1: 'gethostname() devolve o nome do teu próprio computador, não consulta o DNS.' } },
{ id: 'sk-09', t: 'sock', l: 1, les: 's-select',
  q: 'Qual é o objetivo da função select()?',
  o: ['De um conjunto de descritores bloqueantes, indicar quais têm dados prontos para ler', 'Escolher o socket para onde enviar a próxima mensagem', 'Escolher o processo que lê os dados', 'Escolher se a aplicação é cliente ou servidor'], a: 0,
  e: 'select() bloqueia até **algum** dos descritores do conjunto (sockets, stdin…) estar pronto, e diz qual. Assim um só processo atende várias fontes.' },

/* --- nível 2 --- */
{ id: 'sk-20', t: 'sock', l: 4, les: 's-api',
  q: 'Qual destas chamadas só se encontra no código de um servidor TCP?',
  o: ['accept()', 'bind()', 'connect()', 'socket()'], a: 0, src: 'Exame 2020/21, P1',
  e: '**accept()** retira uma ligação da fila e devolve um **socket novo** para esse cliente. bind() também é usado por servidores UDP (e pode ser usado por clientes); connect() é do cliente.' },
{ id: 'sk-21', t: 'sock', l: 4, les: 's-api',
  q: 'Qual das chamadas seguintes NÃO aparece numa aplicação cliente-servidor com sockets UDP?',
  o: ['accept()', 'bind()', 'getaddrinfo()', 'sendto()'], a: 0, src: 'Exame 2020/21, 2.ª época, P1',
  e: 'UDP não tem ligações: não há listen() nem **accept()**. O servidor faz bind() e usa recvfrom()/sendto(); o cliente usa getaddrinfo() e sendto().' },
{ id: 'sk-22', t: 'sock', l: 2, les: 's-api',
  q: 'Num servidor UDP, a leitura de um socket específico…',
  o: ['Pode ler dados de clientes diferentes, em momentos diferentes', 'Lê sempre dados do mesmo cliente', 'Só funciona depois de accept()', 'Não é possível: servidores devem usar TCP'], a: 0, src: 'Exame 2020/21, 2.ª época, P2',
  e: 'O servidor UDP tem **um** socket; cada recvfrom() devolve um datagrama e o endereço de **quem** o enviou, que pode ser um cliente diferente de cada vez.' },
{ id: 'sk-23', t: 'sock', l: 2, les: 's-api',
  q: 'Um cliente UDP envia uma mensagem com sendto(). Qual é a afirmação verdadeira?',
  o: ['A mensagem chega completa (eventualmente com erros detetados) ou não chega nada', 'Chega garantidamente, mas pode ter erros', 'Pode ser recebida só uma parte da mensagem', 'É dividida em vários segmentos UDP se for grande'], a: 0, src: 'Exame 2020/21, 2.ª época, P3',
  e: 'UDP preserva as fronteiras das mensagens: **um sendto() = um datagrama**, entregue inteiro ou perdido. Não há garantia de entrega.' },
{ id: 'sk-24', t: 'sock', l: 2, les: 's-api',
  q: 'Uma aplicação faz dois write() seguidos num socket TCP, de 100 bytes cada. O que pode acontecer?',
  o: ['Os 200 bytes podem ir num só segmento, ou repartidos de outra forma: o TCP é um fluxo de bytes', 'Vão garantidamente em dois segmentos de 100 bytes', 'O segundo write() falha até chegar o ACK do primeiro', 'O recetor recebe sempre duas mensagens separadas'], a: 0,
  e: 'TCP não preserva fronteiras: é um **fluxo de bytes**. O emissor junta ou parte os bytes como lhe convier; do outro lado um read() pode devolver 200, 150… bytes. Por isso os protocolos sobre TCP usam delimitadores ou tamanhos.' },
{ id: 'sk-25', t: 'sock', l: 2, les: 's-api',
  q: 'Um servidor TCP tem dois clientes ligados ao mesmo porto 50001 (lab 6). Como distingue as duas ligações?',
  o: ['Pelo tuplo (IP origem, porto origem, IP destino, porto destino): cada ligação tem o seu socket', 'Pelo porto de destino, que é diferente', 'Pelo endereço MAC dos clientes', 'Não distingue: os dados misturam-se'], a: 0,
  e: 'Cada accept() devolve um socket identificado pelos **4 valores**. Os dois clientes têm IPs e/ou portos de origem diferentes, por isso os segmentos vão para sockets diferentes.' },
{ id: 'sk-26', t: 'sock', l: 4, les: 's-select',
  q: 'Um servidor TCP tem de atender vários clientes ao mesmo tempo. Qual destas abordagens funciona?',
  o: ['Um único processo que guarda os descritores devolvidos por accept() e os acrescenta ao conjunto do select()', 'Ler todos os clientes no socket do porto indicado em bind()', 'fork() para cada cliente, mas continuando a usar o socket de escuta para falar com todos', 'Usar connect() no servidor para cada cliente'], a: 0, src: 'Exame 2020/21, P3',
  e: 'Com select(), o fd_set junta o socket de escuta e os sockets aceites. Com fork(), o filho usa o **socket novo** devolvido por accept(), não o de escuta.',
  w: { 1: 'O socket de escuta só recebe pedidos de ligação; os dados de cada cliente chegam ao socket devolvido por accept().', 2: 'Com fork() o filho fala com o cliente pelo socket novo de accept(); o de escuta só aceita ligações.' } },
{ id: 'sk-28', t: 'sock', l: 2, les: 's-arch',
  q: 'Uma aplicação quer controlo de erros e de fluxo, mas não quer ficar sujeita ao controlo de congestão. O que pode fazer?',
  o: ['Usar UDP e implementar ela própria o controlo de erros e de fluxo na camada de aplicação', 'Usar TCP e desligar o controlo de congestão', 'Usar TCP, que só tem controlo de erros e de fluxo', 'Não é possível com TCP/IP'], a: 0, src: 'Exame 2020/21, P8',
  e: 'O controlo de congestão faz parte do TCP: não se escolhe à la carte. Com **UDP** a aplicação tem liberdade total e pode implementar o que quiser por cima (é o que faz o QUIC).' },
{ id: 'sk-29', t: 'sock', l: 2, les: 's-arch',
  q: 'Verdadeiro ou falso (slides): “Uma aplicação desenvolvida com UDP não pode ter entrega fiável de dados.”',
  o: ['Falso: a fiabilidade pode ser implementada na própria aplicação, por cima do UDP', 'Verdadeiro: só o TCP é fiável', 'Verdadeiro: o UDP descarta pacotes de propósito', 'Falso: o UDP também retransmite'], a: 0,
  e: 'O UDP não dá fiabilidade, mas a **aplicação** pode adicioná-la (números de sequência, ACKs, retransmissões). Exemplos: QUIC, muitos protocolos de jogos.' },
{ id: 'sk-30', t: 'sock', l: 2, les: 's-p2p',
  q: 'Distribuir um ficheiro a N estações. Como cresce o tempo mínimo com N em cliente-servidor e em P2P?',
  o: ['Cliente-servidor cresce linearmente com N; P2P cresce muito mais devagar', 'Ambos crescem linearmente', 'P2P cresce linearmente; cliente-servidor fica constante', 'Nenhum depende de N'], a: 0,
  e: 'Em cliente-servidor o servidor envia N cópias: N·F/u_s. Em P2P os pares também enviam: N·F/(u_s + Σu_i), e o denominador cresce com N.' },
{ id: 'sk-31', t: 'sock', l: 2, les: 's-p2p',
  q: 'No BitTorrent, que pedaços (chunks) pede um par primeiro?',
  o: ['Os mais raros entre os vizinhos', 'Os primeiros do ficheiro, por ordem', 'Os mais comuns', 'Pedaços aleatórios ao servidor'], a: 0,
  e: '**Rarest first**: assim os pedaços raros espalham-se depressa e não desaparecem se um par sair. Para enviar, usa **tit-for-tat**: privilegia quem lhe envia mais.' },

/* --- nível 3: contas P2P --- */
{ id: 'sk-40', t: 'sock', l: 3, les: 's-p2p', calc: true, ch: 'p2p-2122', step: '1/3', src: 'Exame 2021/22, Parte II.2',
  q: 'Servidor com ficheiro de 1 Gbit para 4 estações; servidor e estações com ligações de 200 Mbit/s. Passo 1: quanto tempo leva o servidor a enviar UMA cópia (F/u_s)?',
  o: ['5 s', '0,2 s', '20 s', '4 s'], a: 0,
  e: 'F/u_s = 10⁹ / 2×10⁸ = **5 s**. Em P2P o servidor tem de enviar pelo menos uma cópia inteira.' },
{ id: 'sk-41', t: 'sock', l: 3, les: 's-p2p', calc: true, ch: 'p2p-2122', step: '2/3',
  q: 'Mesmo problema (F = 1 Gbit, N = 4, u_s = u_i = 200 Mbit/s). Passo 2: quanto vale N·F/(u_s + Σu_i)?',
  o: ['4 s', '5 s', '20 s', '0,8 s'], a: 0,
  e: 'u_s + Σu_i = 200 + 4×200 = 1000 Mbit/s. N·F = 4 Gbit. 4×10⁹ / 10⁹ = **4 s**.' },
{ id: 'sk-42', t: 'sock', l: 3, les: 's-p2p', calc: true, ch: 'p2p-2122', step: '3/3',
  q: 'Mesmo problema: F/u_s = 5 s, F/d_min = 5 s, N·F/(u_s+Σu_i) = 4 s. Qual é o tempo mínimo até todas as estações terem o ficheiro? E se fosse cliente-servidor?',
  o: ['5 s em P2P; 20 s em cliente-servidor', '4 s em P2P; 20 s em cliente-servidor', '14 s em P2P; 20 s em cliente-servidor', '5 s em ambos'], a: 0,
  e: 'D_P2P = **max**(5, 5, 4) = **5 s**. Cliente-servidor: max(N·F/u_s, F/d_min) = max(20, 5) = **20 s**.',

  e: '**Tahoe** trata qualquer perda como um timeout: cwnd = 1 MSS. **Reno** distingue: só no timeout volta a 1.' },
{ id: 'cg-23', t: 'cong', l: 2, les: 'c-princ',
  q: 'Slides: “o controlo de congestão fim-a-fim é melhor do que o controlo de congestão com auxílio da rede.” Verdadeiro ou falso?',
  o: ['Falso: cada um tem vantagens (o assistido reage mais cedo e com mais informação; o fim-a-fim não exige nada da rede)', 'Verdadeiro: a rede não deve participar', 'Verdadeiro: o assistido não funciona com TCP', 'Falso: o fim-a-fim nunca funciona'], a: 0,
  e: 'Não há um “sempre melhor”. O TCP clássico é fim-a-fim (rede simples); ECN e outros mecanismos dão sinais explícitos da rede e evitam esperar por perdas.' },
{ id: 'cg-24', t: 'cong', l: 2, les: 'c-princ',
  q: 'O emissor TCP tem cwnd = 8 MSS e o recetor anuncia rwnd = 3 MSS. Quantos segmentos pode ter por confirmar?',
  o: ['3', '8', '11', '5'], a: 0,
  e: 'Janela efetiva = **min(cwnd, rwnd)** = 3. Aqui quem limita é o recetor (controlo de fluxo).' },
{ id: 'cg-25', t: 'cong', l: 2, les: 'c-aimd',
  q: 'Quatro ligações TCP partilham um gargalo de 100 Mbit/s com RTTs iguais. Que débito tende a ter cada uma?',
  o: ['25 Mbit/s', '100 Mbit/s', 'Depende de qual começou primeiro, para sempre', '50 Mbit/s'], a: 0,
  e: 'O AIMD converge para a **partilha justa**: R/K = 100/4 = **25 Mbit/s**. (Na prática, RTTs diferentes desequilibram.)' },
{ id: 'cg-26', t: 'cong', l: 2, les: 'c-aimd',
  q: 'Uma aplicação abre 9 ligações TCP paralelas num gargalo onde já existe 1 outra ligação. Que fração da capacidade tende a ter?',
  o: ['9/10', '1/2', '1/10', '1/9'], a: 0,
  e: 'A justiça do TCP é **por ligação**: 10 ligações → cada uma 1/10. A aplicação com 9 fica com **9/10**. É por isso que os browsers limitam as ligações paralelas.' },
{ id: 'cg-27', t: 'cong', l: 2, les: 'c-aimd',
  q: 'Como se comporta a janela do TCP CUBIC depois de uma perda?',
  o: ['Cresce depressa enquanto está longe do tamanho onde houve perda (Wmax) e devagar perto dele', 'Cresce sempre 1 MSS por RTT, como o Reno', 'Volta sempre a 1 MSS', 'Cresce depressa perto de Wmax e devagar longe'], a: 0,
  e: 'O CUBIC usa uma curva cúbica centrada em **Wmax**: recupera depressa a capacidade que sabe existir e só “tateia” com cuidado na zona onde houve congestão.' },
{ id: 'cg-28', t: 'cong', l: 2, les: 'c-ss',
  q: 'O diagrama mostra uma transferência em slow start (MSS 1000 B, sem delayed ACK). Porque é que a ronda 3 tem 4 segmentos?',
  d: SS_DIAGRAM,
  o: ['Na ronda 2 chegaram 2 ACKs e cada um somou 1 MSS: cwnd passou de 2 para 4', 'Porque o recetor pediu 4', 'Porque a cwnd soma 2 MSS por RTT', 'Porque passou a congestion avoidance'], a: 0,
  e: 'Slow start: **+1 MSS por ACK**. Ronda 1: 1 segmento → 1 ACK → cwnd 2. Ronda 2: 2 ACKs → cwnd 4.' },

/* --- nível 3: contas --- */
{ id: 'cg-30', t: 'cong', l: 3, les: 'c-ss', calc: true,
  q: 'Uma ligação começa em slow start com ssthresh = 16 MSS. Ao fim de quantos RTT a cwnd chega a 16 MSS (sem perdas)?',
  o: ['4', '16', '5', '8'], a: 0,
  e: 'Início de cada ronda: 1, 2, 4, 8, **16** → passam **4 RTT**.' },
{ id: 'cg-31', t: 'cong', l: 3, les: 'c-ss', calc: true,
  q: 'Slow start a partir de 1 MSS com ssthresh = 8 MSS, sem perdas. Qual é a cwnd no início da 6.ª ronda?',
  o: ['10 MSS', '32 MSS', '8 MSS', '12 MSS'], a: 0,
  e: 'Rondas: 1, 2, 4, **8** (chega ao limiar → linear), 9, **10**.',

{ id: 'cg-32', t: 'cong', l: 3, les: 'c-events', calc: true,
  q: 'Um TCP Reno tem cwnd = 20 MSS e recebe 3 ACKs duplicados. Que valores ficam ssthresh e cwnd (em fast recovery)?',
  o: ['ssthresh = 10; cwnd = 13 MSS', 'ssthresh = 10; cwnd = 1 MSS', 'ssthresh = 20; cwnd = 10 MSS', 'ssthresh = 10; cwnd = 10 MSS'], a: 0,
  e: 'ssthresh = 20/2 = **10**; cwnd = ssthresh + 3 MSS (pelos 3 duplicados) = **13**. Quando chegar um ACK novo, cwnd = 10 e segue em congestion avoidance.',
  w: { 3: 'Essa é a versão resumida (sem os +3 do fast recovery), que também aparece em perguntas de escolha múltipla. Aqui pede-se o valor em fast recovery.' } },
{ id: 'cg-33', t: 'cong', l: 3, les: 'c-events', calc: true,
  q: 'O mesmo TCP (cwnd = 20 MSS) tem antes um timeout. Que valores ficam ssthresh e cwnd?',
  o: ['ssthresh = 10; cwnd = 1 MSS', 'ssthresh = 10; cwnd = 10 MSS', 'ssthresh = 20; cwnd = 1 MSS', 'ssthresh = 1; cwnd = 1 MSS'], a: 0,
  e: 'Timeout: ssthresh = cwnd/2 = **10**, cwnd = **1 MSS**, slow start.' },
{ id: 'cg-34', t: 'cong', l: 3, les: 'c-ss', calc: true,
  q: 'Em congestion avoidance com MSS = 1000 B e cwnd = 10 000 B. Quanto aumenta a cwnd por cada ACK?',
  o: ['100 bytes', '1000 bytes', '10 bytes', '10 000 bytes'], a: 0,
  e: 'MSS·MSS/cwnd = 1000 × 1000 / 10 000 = **100 B**. Ao fim de 10 ACKs (≈ um RTT) soma 1000 B = 1 MSS.' },
{ id: 'cg-35', t: 'cong', l: 3, les: 'c-aimd', calc: true,
  q: 'Uma ligação TCP oscila em dente de serra entre W/2 e W, com W = 40 segmentos de 1500 B e RTT = 100 ms. Qual é o débito médio aproximado?',
  o: ['3,6 Mbit/s', '4,8 Mbit/s', '2,4 Mbit/s', '0,45 Mbit/s'], a: 0,
  e: 'Máximo: W·MSS/RTT = 40 × 12 000 / 0,1 = 4,8 Mbit/s. Médio ≈ 0,75 × 4,8 = **3,6 Mbit/s**.' },

/* problema guiado: tabela de slow start (ao estilo das Partes III) */
{ id: 'cg-40', t: 'cong', l: 3, les: 'c-table', calc: true, ch: 'ss-table', step: '1/5',
  q: 'A envia 7000 bytes a B. MSS = 1000 B; ISN de A = 49, de B = 199; slow start, sem delayed ACK; RTT ≫ tempo de transmissão. Passo 1: que SN e AN leva o SYN+ACK de B?',
  o: ['SN = 199, AN = 50', 'SN = 200, AN = 50', 'SN = 199, AN = 49', 'SN = 50, AN = 199'], a: 0,
  e: 'B usa o **seu** ISN (199) e confirma o SYN de A: 49 + 1 = **50**.' },
{ id: 'cg-41', t: 'cong', l: 3, les: 'c-table', calc: true, ch: 'ss-table', step: '2/5',
  q: 'Mesmo problema (7000 B, MSS 1000, ISN de A = 49). Passo 2: qual é o SN do primeiro segmento de dados de A, e a cwnd quando o envia?',
  o: ['SN = 50, cwnd = 1 MSS', 'SN = 49, cwnd = 1 MSS', 'SN = 50, cwnd = 2 MSS', 'SN = 1, cwnd = 1 MSS'], a: 0,

{ id: 'cg-42', t: 'cong', l: 3, les: 'c-table', calc: true, ch: 'ss-table', step: '3/5',
  q: 'Mesmo problema. Passo 3: depois do ACK 1050, que segmentos envia A na ronda seguinte, e que ACKs devolve B?',

  e: 'cwnd = 2: dois segmentos, **1050** e **2050**. Cada ACK = SN + 1000: **2050** e **3050**.' },
{ id: 'cg-43', t: 'cong', l: 3, les: 'c-table', calc: true, ch: 'ss-table', step: '4/5',
  q: 'Mesmo problema. Passo 4: na ronda 3, com que cwnd envia A, que segmentos, e qual é o último ACK de B?',
  o: ['cwnd = 4 MSS; SN 3050, 4050, 5050, 6050; último ACK 7050', 'cwnd = 3 MSS; SN 3050, 4050, 5050; último ACK 6050', 'cwnd = 4 MSS; SN 3050 a 6050; último ACK 7049', 'cwnd = 8 MSS; SN 3050 a 10050; último ACK 11050'], a: 0,
  e: 'Dois ACKs na ronda 2 → cwnd = **4**. Faltam 4000 B = 4 segmentos: 3050…6050. O último byte é 7049 → ACK **7050**.' },
{ id: 'cg-44', t: 'cong', l: 4, les: 'c-table', calc: true, ch: 'ss-table', step: '5/5',
  q: 'Mesmo problema, mas agora B anuncia rwnd = 2000 bytes. Quantos RTT desde o SYN até A receber o último ACK?',
  o: ['5 RTT', '4 RTT', '3 RTT', '7 RTT'], a: 0,
  e: 'Handshake: 1 RTT. Janela efetiva = min(cwnd, 2 MSS): rondas de 1, 2, 2, 2 segmentos = 7 → 4 RTT. Total **5 RTT** (sem o limite seriam 1 + 3 = 4).' },

{ id: 'cg-50', t: 'cong', l: 4, les: 'c-events', src: 'Exame 2022/23, P7',

{ id: 'cg-52', t: 'cong', l: 4, les: 'c-events', src: 'Exame 2021/22, Parte III.1.2b',

{ id: 'cg-53', t: 'http', l: 4, les: 'h-persist', src: 'Exame 2021/22, Parte III.1.2c',

  e: 'TTL = 1, 2, 3… Cada encaminhador onde o TTL chega a 0 denuncia-se com um ICMP **TTL exceeded**.' },
{ id: 'ip-29', t: 'ip', l: 2, les: 'i-v6',
  q: 'Para atravessar uma zona só IPv4, coloca-se o datagrama IPv6 inteiro no campo de dados de um datagrama IPv4. Como se chama e qual a vantagem?',
  o: ['Túnel; o datagrama IPv6 chega ao outro lado sem perder informação', 'Dual stack; mais rápido', 'NAT; poupa endereços', 'Fragmentação; reduz o tamanho'], a: 0,
  e: '**Túnel**: IPv6 embrulhado em IPv4, desembrulhado à saída, intacto. Com dual stack e tradução de cabeçalhos perdem-se campos que só existem no IPv6.' },
{ id: 'ip-30', t: 'ip', l: 2, les: 'i-frag',
  q: 'Onde são reagrupados os fragmentos de um datagrama IPv4?',
  o: ['Só no destino final', 'No primeiro encaminhador depois da ligação com MTU pequeno', 'Em cada encaminhador', 'Na origem, que os volta a enviar inteiros'], a: 0,
  e: 'Os encaminhadores fragmentam mas **nunca reagrupam**: os fragmentos podem seguir caminhos diferentes. Só o **destino** junta tudo.' },
{ id: 'ip-31', t: 'ip', l: 2, les: 'i-fw',
  q: 'Num Linux que funciona como encaminhador, em que cadeia do iptables se filtram os pacotes que só passam por ele (de uma rede para outra)?',
  o: ['FORWARD', 'INPUT', 'OUTPUT', 'PREROUTING da tabela filter'], a: 0,
  e: '**INPUT**: para a própria máquina. **OUTPUT**: gerados por ela. **FORWARD**: a passar. (Lab 5.)' },
{ id: 'ip-32', t: 'ip', l: 2, les: 'i-fw',
  q: 'Queres que ligações vindas da Internet para o porto 8080 do encaminhador cheguem a um servidor interno 10.0.0.20:80. Que regra do iptables?',
  o: ['DNAT na cadeia PREROUTING da tabela nat (port forwarding)', 'SNAT na cadeia POSTROUTING', 'DROP na cadeia INPUT', 'ACCEPT na cadeia OUTPUT'], a: 0,
  e: '**Port forwarding** = trocar o **destino** à entrada, antes de decidir o encaminhamento: **DNAT em PREROUTING**. SNAT/MASQUERADE em POSTROUTING troca a **origem** à saída (o NAT normal).' },
{ id: 'ip-33', t: 'ip', l: 2, les: 'i-fw',
  q: 'A cadeia INPUT tem: 1) ACCEPT tcp porto 22; 2) DROP tcp. Chega uma ligação ao porto 22. O que acontece? E se a ordem fosse ao contrário?',
  o: ['É aceite; com a ordem trocada seria descartada', 'É descartada nos dois casos', 'É aceite nos dois casos', 'Depende da política por omissão'], a: 0,
  e: 'A **primeira** regra que bate decide. Por isso as exceções vêm antes das regras gerais (e -I insere no início, -A no fim).' },

/* --- nível 3: sub-redes (com o endereço em binário) --- */
{ id: 'sb-01', t: 'ip', l: 3, les: 'i-addr', calc: true, ex: 'sub',
  d: { ip: [{ a: '10.1.2.200', p: 26, l: 'host' }] },
  q: 'Qual é o endereço de rede de 10.1.2.200/26?',
  o: ['10.1.2.192', '10.1.2.128', '10.1.2.0', '10.1.2.200'], a: 0,
  e: '/26 → máscara .192 → blocos de 64: 0, 64, 128, **192**. 200 está no bloco 192–255. Rede: **10.1.2.192/26**.' },
{ id: 'sb-02', t: 'ip', l: 3, les: 'i-addr', calc: true, ex: 'sub',
  d: { ip: [{ a: '192.168.5.77', p: 27, l: 'host' }] },
  q: 'Qual é o endereço de broadcast da sub-rede de 192.168.5.77/27?',
  o: ['192.168.5.95', '192.168.5.255', '192.168.5.79', '192.168.5.127'], a: 0,
  e: '/27 → blocos de 32: 64–95 contém o 77. Broadcast = último: **192.168.5.95**. Rede: .64.' },
{ id: 'sb-03', t: 'ip', l: 3, les: 'i-addr', calc: true, ex: 'sub',
  q: 'Quantos hosts se podem endereçar numa sub-rede /26?',
  o: ['62', '64', '26', '126'], a: 0,
  e: '32 − 26 = 6 bits de host → 2⁶ = 64 endereços, menos rede e broadcast = **62**.' },
{ id: 'sb-04', t: 'ip', l: 3, les: 'i-addr', calc: true, ex: 'sub',
  q: 'Que máscara corresponde a /21?',
  o: ['255.255.248.0', '255.255.240.0', '255.255.252.0', '255.255.255.248'], a: 0,
  e: '21 = 16 + 5 → terceiro octeto com 5 uns: 11111000 = **248**. Máscara 255.255.248.0.' },
{ id: 'sb-05', t: 'ip', l: 3, les: 'i-same', calc: true, ex: 'sub',
  d: { ip: [{ a: '172.16.5.10', p: 22, l: 'origem' }, { a: '172.16.6.200', p: 22, l: 'destino' }] },
  q: 'Um host 172.16.5.10/22 quer enviar para 172.16.6.200. Envia diretamente ou ao default gateway?',
  o: ['Diretamente: estão na mesma sub-rede 172.16.4.0/22', 'Ao gateway: o terceiro octeto é diferente', 'Ao gateway: um /22 só tem 254 hosts', 'Depende do DNS'], a: 0,
  e: '/22 → blocos de 4 no 3.º octeto: 4–7. 5 e 6 estão os dois em **172.16.4.0/22** → mesma sub-rede, entrega **direta**. Repara no desenho: os 22 bits de rede são iguais.' },
{ id: 'sb-06', t: 'ip', l: 3, les: 'i-same', calc: true, ex: 'sub',
  d: { ip: [{ a: '10.0.0.100', p: 25, l: 'origem' }, { a: '10.0.0.130', p: 25, l: 'destino' }] },
  q: 'Um host 10.0.0.100 envia para 10.0.0.130. Com qual destas máscaras do host é que o datagrama vai para o default gateway?',
  o: ['255.255.255.128 (/25)', '255.255.255.0 (/24)', '255.255.254.0 (/23)', '255.0.0.0 (/8)'], a: 0,
  e: 'Com /25 há dois blocos: 0–127 e 128–255. 100 e 130 ficam em blocos **diferentes** → gateway. Com /24, /23 ou /8 estão na mesma rede.' },
{ id: 'sb-07', t: 'ip', l: 3, les: 'i-lpm', calc: true, ex: 'sub', d: LPM_TABLE,
  q: 'Tabela de expedição (acima). Por que interface sai um datagrama para 200.23.18.130?',
  o: ['1', '0', '2', '3'], a: 0,
  e: '/21 cobre 16–23 (bate); /23 cobre 18–19 (bate); /22 cobre 20–23 (não). Ganha o **maior prefixo**: /23 → interface **1**.',
  w: { 1: 'A /21 também bate, mas a /23 é mais específica.' } },
{ id: 'sb-08', t: 'ip', l: 3, les: 'i-lpm', calc: true, ex: 'sub', d: LPM_TABLE,
  q: 'Mesma tabela. Por que interfaces saem os datagramas para 200.23.21.5, 200.23.17.9 e 200.23.24.1, respetivamente?',
  o: ['2, 0, 3', '0, 0, 3', '2, 1, 0', '2, 0, 0'], a: 0,
  e: '21.5: /21 e /22 (20–23) batem → **2**. 17.9: só a /21 (16–23) → **0**. 24.1: nenhuma (a /21 acaba no 23) → default **3**.' },
{ id: 'sb-09', t: 'ip', l: 3, les: 'i-nat', calc: true,
  q: 'Uma rede privada partilha 1 IP público por NAT. Cada estação pode ter até 32 processos a comunicar com o exterior. Quantas estações suporta (porto de 16 bits)?',
  o: ['2048', '65 536', '1024', '32'], a: 0,
  e: '2¹⁶ = 65 536 portos por IP público. 65 536 / 32 = **2048** estações.' },

/* problema guiado: blocos de um ISP (exame 2022/23, Parte III.2.1) */
{ id: 'ip-40', t: 'ip', l: 3, les: 'i-alloc', calc: true, ex: 'sub', ch: 'isp-2223', step: '1/4', src: 'Exame 2022/23, Parte III.2.1',
  q: 'Um ISP gere 194.24.160.0/19 e recebe, por esta ordem, pedidos de 500 (A), 2000 (B) e 1000 (C) endereços; dá sempre a base mais baixa disponível. Passo 1: que tamanho de bloco recebe A?',
  o: ['/23 (512 endereços)', '/24 (256)', '/22 (1024)', '/9 (500)'], a: 0,
  e: '500 → próxima potência de 2: **512 = 2⁹** → 9 bits de host → **/23**.' },
{ id: 'ip-41', t: 'ip', l: 3, les: 'i-alloc', calc: true, ex: 'sub', ch: 'isp-2223', step: '2/4',
  q: 'Mesmo problema: A ficou com 194.24.160.0/23 (160.0 a 161.255). Passo 2: onde começa o bloco de B (2000 → /21)?',
  o: ['194.24.168.0/21', '194.24.162.0/21', '194.24.164.0/21', '194.24.160.0/21'], a: 0,
  e: 'Um /21 tem 2048 endereços = 8 valores do 3.º octeto: tem de começar num **múltiplo de 8**. 160 está ocupado (A), o seguinte é **168**.',
  w: { 1: '162 não é múltiplo de 8: um /21 a começar em 162 não é um prefixo válido.' } },
{ id: 'ip-42', t: 'ip', l: 3, les: 'i-alloc', calc: true, ex: 'sub', ch: 'isp-2223', step: '3/4',
  q: 'Mesmo problema: A = 160.0/23, B = 168.0/21. Passo 3: onde fica C (1000 → /22)?',
  o: ['194.24.164.0/22', '194.24.162.0/22', '194.24.176.0/22', '194.24.172.0/22'], a: 0,
  e: '/22 → múltiplo de 4 no 3.º octeto. 160 ocupado; **164** livre (164–167) e é o mais baixo. Fica um buraco em 162–163 (cabe lá um /23 futuro).' },
{ id: 'ip-43', t: 'ip', l: 3, les: 'i-alloc', calc: true, ex: 'sub', ch: 'isp-2223', step: '4/4',
  q: 'Mesmo problema. Passo 4: que máscaras de rede correspondem aos blocos de A (/23), B (/21) e C (/22)?',
  o: ['255.255.254.0, 255.255.248.0, 255.255.252.0', '255.255.255.0, 255.255.240.0, 255.255.252.0', '255.255.254.0, 255.255.252.0, 255.255.248.0', '255.255.252.0, 255.255.248.0, 255.255.254.0'], a: 0,
  e: '/23 → 11111110 = 254; /21 → 11111000 = 248; /22 → 11111100 = 252.' },

/* problema guiado: fragmentação (exame 2020/21, Parte III.1.2) */
{ id: 'ip-45', t: 'ip', l: 3, les: 'i-frag', calc: true, ch: 'frag-2021', step: '1/3', src: 'Exame 2020/21, Parte III.1.2',
  q: 'Datagrama IPv4 com 1200 B de dados (cabeçalho 20 B) atravessa uma rede com MTU = 1000 B e depois outra com MTU = 500 B. Passo 1: que fragmentos saem da primeira rede?',
  o: ['2 fragmentos: 976 B e 224 B de dados', '2 fragmentos: 980 B e 220 B de dados', '2 fragmentos: 1000 B e 200 B de dados', '3 fragmentos de 400 B'], a: 0,
  e: 'Cabem 1000 − 20 = 980 B, mas tem de ser **múltiplo de 8** → **976**. Resta 1200 − 976 = **224**.',
  w: { 1: '980 não é múltiplo de 8: o offset é medido em blocos de 8 bytes.' } },
{ id: 'ip-46', t: 'ip', l: 3, les: 'i-frag', calc: true, ch: 'frag-2021', step: '2/3',
  q: 'Mesmo problema: fragmentos de 976 B e 224 B chegam à rede com MTU = 500. Passo 2: quantos fragmentos chegam ao destino?',
  o: ['4', '3', '2', '5'], a: 0,
  e: 'Cabem 480 B (múltiplo de 8). 976 → 480 + 480 + 16 (3 fragmentos). 224 passa inteiro (1). Total **4**.' },
{ id: 'ip-47', t: 'ip', l: 4, les: 'i-frag', calc: true, ch: 'frag-2021', step: '3/3',
  q: 'Mesmo problema: os 4 fragmentos têm 480, 480, 16 e 224 B de dados. Quais são o total length, o offset e a flag MF de cada um?',
  d: { tbl: { h: ['Fragmento', '1', '2', '3', '4'], r: [['Total length', '?', '?', '?', '?'], ['Offset', '?', '?', '?', '?'], ['MF', '?', '?', '?', '?']] } },
  o: ['500, 500, 36, 244 · offsets 0, 60, 120, 122 · MF 1, 1, 1, 0', '480, 480, 16, 224 · offsets 0, 480, 960, 976 · MF 1, 1, 1, 0', '500, 500, 36, 244 · offsets 0, 60, 120, 122 · MF 1, 1, 0, 0', '500, 500, 36, 244 · offsets 0, 61, 122, 124 · MF 1, 1, 1, 0'], a: 0,
  e: 'Total length = dados + 20. Offset = posição/8: 0, 480/8 = 60, 960/8 = 120, 976/8 = 122. MF = 1 em todos menos no **último** fragmento do datagrama original.',
  w: { 1: 'Total length inclui o cabeçalho (20 B), e o offset conta-se em blocos de 8 bytes.', 2: 'O fragmento de 16 B não é o último do datagrama original: ainda vem o de 224.' } },

/* --- nível 4: exames antigos --- */
{ id: 'ip-50', t: 'ip', l: 4, les: 'i-fwd', src: 'Exame 2021/22, 2.ª época, P4',
  q: 'Sobre a distinção entre forwarding e routing, qual afirmação é verdadeira?',
  o: ['A expedição (forwarding) toma uma decisão local sobre para onde enviar um datagrama que chega a um encaminhador', 'O algoritmo de encaminhamento (routing) toma uma decisão local sobre cada datagrama que chega', 'O routing faz a gestão do meio de transmissão', 'A expedição garante a consistência das tabelas de todos os encaminhadores'], a: 0,
  e: '**Forwarding**: local, por datagrama, plano de dados. **Routing**: calcula e mantém as tabelas, plano de controlo.' },
{ id: 'ip-51', t: 'ip', l: 4, les: 'i-addr', calc: true, ex: 'sub', src: 'Exame 2021/22, 2.ª época, P5',
  d: { ip: [{ a: '193.136.143.89', p: 25 }] },
  q: 'O endereço 193.136.143.89 tem máscara 255.255.255.128. Qual é o endereço de rede?',
  o: ['193.136.143.0/25', '193.136.143.0/24', '193.136.142.0/23', '193.136.143.128/25'], a: 0,
  e: '.128 → blocos de 128: 0–127 e 128–255. 89 está no primeiro → **193.136.143.0/25**.' },
{ id: 'ip-52', t: 'ip', l: 4, les: 'i-addr', calc: true, ex: 'sub', src: 'Exame 2020/21, 2.ª época, Parte II.2',
  d: { ip: [{ a: '193.136.143.26', p: 23 }] },
  q: 'O endereço 193.136.143.26 tem máscara 255.255.254.0. Qual é o endereço de rede?',
  o: ['193.136.142.0/23', '193.136.143.0/23', '193.136.143.0/24', '193.136.140.0/23'], a: 0,
  e: '254 → blocos de 2 no 3.º octeto: 142–143. 143 AND 254 = **142**. Rede: **193.136.142.0/23**.',
  w: { 1: '143 é ímpar: com /23 o bloco começa sempre num valor par.' } },
{ id: 'ip-53', t: 'ip', l: 4, les: 'i-lpm', calc: true, ex: 'sub', src: 'Exame 2020/21, 2.ª época, P10',
  q: 'Um datagrama para 193.136.143.26 chega a um encaminhador que tem rotas para as três sub-redes das opções. Por qual delas é enviado?',
  o: ['193.136.143.0/25', '193.136.143.0/24', '193.136.0.0/16', 'Para as três (cópias)'], a: 0,
  e: 'As três contêm o destino (26 &lt; 128). Ganha o **prefixo mais longo**: **/25**.' },
{ id: 'ip-54', t: 'ip', l: 4, les: 'i-same', src: 'Exame 2020/21, P10',
  q: 'Uma estação tem IP 193.136.128.43, máscara 255.255.255.0 e gateway 193.136.128.254. Vai enviar para 193.136.124.96 (tabela ARP vazia). Qual é a primeira mensagem?',
  o: ['Um broadcast ARP a perguntar quem tem 193.136.128.254', 'Um broadcast ARP a perguntar quem tem 193.136.124.96', 'Um datagrama IP enviado ao gateway', 'Um pedido DNS'], a: 0,
  e: '124 ≠ 128 com /24 → **outra sub-rede** → vai pelo gateway. Para lhe enviar a trama precisa do MAC dele: **ARP para 193.136.128.254**.',
  w: { 1: 'O destino está noutra rede: nunca responderia a um ARP aqui. Pergunta-se o MAC do gateway.', 2: 'Ainda não pode enviar o datagrama: falta o MAC do gateway.' } },
{ id: 'ip-55', t: 'ip', l: 4, les: 'i-same', src: 'Exame 2021/22, P10',
  q: 'Entre o cliente pc1 e o servidor web há um comutador seguido de um encaminhador. Qual é o MAC de ORIGEM das tramas no troço entre o encaminhador e o servidor?',
  o: ['MAC do encaminhador', 'MAC do cliente pc1', 'MAC do comutador', 'MAC do servidor'], a: 0,
  e: 'Em cada salto a trama é refeita: no último troço quem envia é o **encaminhador**. O MAC do cliente só aparece no troço até ao encaminhador.' },
{ id: 'ip-56', t: 'ip', l: 4, les: 'i-nat', src: 'Exame 2022/23, P9',
  q: 'Rede privada 192.168.1.0/24 com NAT de IP público 193.136.123.91. O host 192.168.1.32 envia uma mensagem ao servidor web 193.136.128.169. Que (IP origem, porto origem, IP destino, porto destino) pode ter a mensagem que o NAT envia ao servidor?',
  o: ['(193.136.123.91; 46531; 193.136.128.169; 80)', '(192.168.1.32; 54532; 193.136.128.169; 80)', '(192.168.1.32; 54532; 193.136.123.91; 46531)', '(193.136.123.91; 80; 193.136.128.169; 46531)'], a: 0,
  e: 'O NAT troca a **origem** pelo seu IP público e um porto seu; o destino continua a ser o servidor, porto 80.' },
{ id: 'ip-57', t: 'ip', l: 4, les: 'i-dhcp', src: 'Exame 2021/22, P9',
  q: 'No DHCP, que mensagem se envia para prolongar a utilização do endereço atribuído?',
  o: ['DHCP Request', 'DHCP Discover', 'DHCP Renew', 'DHCP Offer'], a: 0,
  e: 'Renova-se com **DHCP Request** (não existe uma mensagem “Renew”: renovar é o nome do procedimento).',
  w: { 2: 'Não há uma mensagem chamada “DHCP Renew”; o procedimento de renovação usa DHCP Request.' } },
{ id: 'ip-58', t: 'ip', l: 4, les: 'i-alloc', calc: true, ex: 'sub', src: 'Exame 2021/22, Parte II.3',
  q: 'Um ISP tem 193.136.64.0/18 e atribui, por ordem e sempre na base mais baixa, blocos de 500 (A), 1800 (B) e 950 (C) endereços. Resultado?',
  o: ['A: 193.136.64.0/23; B: 193.136.72.0/21; C: 193.136.68.0/22', 'A: 193.136.64.0/23; B: 193.136.66.0/21; C: 193.136.74.0/22', 'A: 193.136.64.0/22; B: 193.136.72.0/21; C: 193.136.80.0/22', 'A: 193.136.64.0/23; B: 193.136.72.0/21; C: 193.136.80.0/22'], a: 0,
  e: 'A: 512 → /23 em 64. B: 2048 → /21, múltiplo de 8 → **72**. C: 1024 → /22, múltiplo de 4, mais baixo livre → **68**.',
  w: { 3: '68–71 ainda está livre e é mais baixo do que 80.' } },
{ id: 'ip-59', t: 'ip', l: 4, les: 'i-alloc', calc: true, ex: 'sub', src: 'Exame 2020/21, Parte III.1.1',
  q: 'Um ISP tem 193.136.160.0/19 e atribui, por ordem e na base mais baixa, 700 (A), 2000 (B) e 500 (C) endereços. Resultado?',
  o: ['A: 193.136.160.0/22; B: 193.136.168.0/21; C: 193.136.164.0/23', 'A: 193.136.160.0/23; B: 193.136.168.0/21; C: 193.136.162.0/23', 'A: 193.136.160.0/22; B: 193.136.164.0/21; C: 193.136.172.0/23', 'A: 193.136.160.0/22; B: 193.136.168.0/21; C: 193.136.176.0/23'], a: 0,
  e: 'A: 700 → 1024 → **/22** em 160 (160–163). B: /21 → múltiplo de 8 → **168**. C: 512 → /23 → par mais baixo livre → **164**.',
  w: { 1: '700 endereços não cabem num /23 (512).' } },
{ id: 'ip-60', t: 'ip', l: 4, les: 'i-frag', calc: true, src: 'Exame 2021/22, 2.ª época, Parte III.1.3',
  q: 'Datagrama IPv4 com 2000 B de dados (cabeçalho 20 B) atravessa MTU1 = 1600 B e depois MTU2 = 800 B. Quantos fragmentos depois de cada rede, e quais os (total length, offset, MF) no fim?',
  o: ['2 e depois 4: (796, 0, 1), (796, 97, 1), (44, 194, 1), (444, 197, 0)', '2 e depois 3: (800, 0, 1), (800, 100, 1), (460, 200, 0)', '2 e depois 4: (796, 0, 1), (796, 97, 1), (44, 194, 0), (444, 197, 0)', '3 e depois 4: (780, 0, 1), (780, 97, 1), (480, 194, 1), (40, 254, 0)'], a: 0,
  e: 'Rede 1: 1580 → 1576 (múltiplo de 8) + 424. Rede 2: máx. 776. 1576 → 776 + 776 + 24; 424 inteiro. Offsets: 0, 776/8 = 97, 1552/8 = 194, 1576/8 = 197. Total length = dados + 20.' },
{ id: 'ip-61', t: 'ip', l: 4, les: 'i-same', ch: 'nat-2122', step: '1/3', src: 'Exame 2021/22, 2.ª época, Parte III.2.1',
  q: 'A, B e C estão na rede privada 192.168.1.0/24 (C = 192.168.1.6), gateway 192.168.1.254, ligados a um comutador; NAT com IP público 142.64.52.37. C quer aceder a www.rc.pt (193.136.128.1) e tem as tabelas vazias. Qual é a primeira mensagem que envia?',
  o: ['ARP Query em broadcast, origem MAC de C: “qual o MAC de 192.168.1.254?”', 'ARP Query: “qual o MAC de 193.136.128.1?”', 'TCP SYN para 193.136.128.1', 'DNS query para www.rc.pt'], a: 0,
  e: 'O destino está fora da sub-rede → vai pelo **gateway** → precisa do MAC dele → **ARP** em broadcast. (C já sabe o IP do servidor, por isso não há DNS.)' },
{ id: 'ip-62', t: 'ip', l: 4, les: 'i-same', ch: 'nat-2122', step: '2/3',
  q: 'Mesmo cenário (C atrás de um comutador; o comutador liga ao gateway/NAT). Numa mensagem de C para o servidor, qual é o MAC de origem da trama entre o comutador e o gateway?',
  o: ['MAC de C', 'MAC do comutador', 'MAC do gateway', 'MAC do servidor'], a: 0,
  e: 'O comutador é transparente: a trama sai de C e chega ao gateway com o **MAC de C** como origem.' },
{ id: 'ip-63', t: 'ip', l: 4, les: 'i-nat', ch: 'nat-2122', step: '3/3',
  q: 'Mesmo cenário. Na primeira mensagem HTTP que chega ao servidor S, quais são (IP origem, porto origem, IP destino, porto destino)?',
  o: ['(142.64.52.37, porto escolhido pelo NAT, 193.136.128.1, 80)', '(192.168.1.6, porto efémero, 193.136.128.1, 80)', '(142.64.52.37, 80, 193.136.128.1, porto efémero)', '(192.168.1.254, porto efémero, 193.136.128.1, 80)'], a: 0,
  e: 'Depois do NAT a origem é o **IP público** e um porto do NAT; o destino é o servidor no porto **80**.' },

{ id: 'rcx-06', t: 'exam', l: 4, les: 'h-cache', reserved: 'exam', src: 'Exames 2025/26 P6 e 2023/24 P3',
  q: 'Um browser tem guardado em cache um determinado objeto. O que deve fazer quando esse objeto é de novo solicitado pelo utilizador?',
  o: ['Pedir (GET) de forma condicional ao servidor para enviar o objeto', 'Apresentar o objeto que está guardado em cache', 'Verificar se o objeto foi recebido com “Not Modified” e só nesse caso apresentá-lo', 'Perguntar ao utilizador se quer o da cache ou uma versão mais recente'], a: 0,
  e: '**GET condicional** (If-Modified-Since): se não mudou, 304 e usa a cópia; se mudou, 200 com o novo.' },
{ id: 'rcx-07', t: 'exam', l: 4, les: 's-p2p', reserved: 'exam', calc: true, src: 'Exame 2025/26, P7',
  q: 'Aplicação P2P: um servidor envia um ficheiro de 1 Gbit a 10 estações. A ligação do servidor tem 10 Mbit/s; a de cada estação 100 Mbit/s; o interior da Internet é muito rápido. Qual é o tempo mínimo ao fim do qual todas as estações receberam garantidamente o ficheiro?',
  o: ['2 minutos', '10 segundos', '5 minutos', '10 minutos'], a: 0,
  e: 'F/u_s = 10⁹ / 10⁷ = 100 s; F/d = 10 s; N·F/(u_s + Σu_i) = 10¹⁰ / 1,01×10⁹ ≈ 9,9 s. Máximo = 100 s: das opções, a primeira que garante é **2 minutos**.' },
{ id: 'rcx-08', t: 'exam', l: 4, les: 'i-nat', reserved: 'exam', src: 'Exame 2025/26, P8',
  q: 'Rede privada 192.168.1.0/24 com NAT de IP público 193.136.128.99. O host 192.168.1.26 troca mensagens com um servidor web 153.98.18.19. Qual é o (IP origem, porto origem, IP destino, porto destino) de uma mensagem enviada pelo servidor?',
  o: ['(153.98.18.19; 80; 193.136.128.99; 58017)', '(153.98.18.19; 80; 192.168.1.26; 58017)', '(193.136.128.99; 58017; 153.98.18.19; 80)', '(192.168.1.26; 58017; 153.98.18.19; 80)'], a: 0,
  e: 'O servidor responde para o **IP público do NAT** e o porto que o NAT escolheu; nunca vê o IP privado.' },
{ id: 'rcx-09', t: 'exam', l: 4, les: 'r-ls', reserved: 'exam', src: 'Exame 2025/26, P9',
  q: 'Rede com encaminhamento por estado da ligação. Após estabilizar, o nó A escolheu o caminho A-B-C-D-E-F para F. O que é necessariamente correto sobre o caminho usado por B para alcançar F?',
  o: ['O custo do caminho usado por B é igual ao custo de B-C-D-E-F', 'O caminho calculado em B tem três nós intermédios', 'B usa o caminho B-C-D-E-F', 'O caminho de B passa necessariamente por E'], a: 0,
  e: 'B-C-D-E-F é um caminho mais curto de B para F, mas B pode ter **outro com o mesmo custo**. Só o **custo** é garantido.' },
{ id: 'rcx-10', t: 'exam', l: 4, les: 'i-same', reserved: 'exam', src: 'Exame 2025/26, P10',
  q: 'Um cliente HTTP na estação rc_lab envia uma mensagem ao servidor www.tecnico.ulisboa.pt. Entre os dois há um comutador Ethernet seguido de um encaminhador. Qual é o MAC de destino das tramas no troço entre a estação e o comutador?',
  o: ['Endereço MAC do encaminhador', 'Endereço MAC do comutador', 'Endereço MAC do servidor', 'Endereço MAC da estação rc_lab'], a: 0,
  e: 'O servidor está noutra rede → a trama vai para o **gateway**. O comutador é transparente.' },

/* ---------- 2024/25, Parte I ---------- */
{ id: 'rcx-11', t: 'exam', l: 4, les: 'n-proto', reserved: 'exam', src: 'Exame 2024/25, P1',
  q: 'No âmbito da comunicação entre computadores, um protocolo especifica:',
  o: ['O tipo e formato das mensagens trocadas entre entidades da mesma camada (potencialmente em máquinas distintas)', 'O tipo e formato das mensagens que o programa de aplicação passa à API de sockets', 'As instruções que devem ser usadas para programar a funcionalidade desejada', 'O tipo e formato das mensagens que devem ser apresentadas ao utilizador'], a: 0,
  e: 'Protocolo = mensagens entre **pares da mesma camada** (formato, ordem, ações).' },
{ id: 'rcx-12', t: 'exam', l: 4, les: 'n-switch', reserved: 'exam', calc: true, src: 'Exame 2024/25, P2',
  q: 'Quatro canais partilham o mesmo suporte físico por TDM, transmitindo periodicamente um byte de cada canal na sua vez. Se cada canal transmitir 100 bytes/s, qual é o ritmo total do sistema?',
  o: ['3200 bit/s', '400 bit/s', '800 bit/s', '1600 bit/s'], a: 0,
  e: '4 × 100 B/s = 400 B/s = **3200 bit/s**.' },
{ id: 'rcx-13', t: 'exam', l: 4, les: 'n-sf', reserved: 'exam', src: 'Exame 2024/25, P4',
  q: 'O modo de funcionamento “store-and-forward” é usado:',
  o: ['Apenas quando se considera comutação de pacotes', 'Apenas quando se considera comutação de circuitos', 'Em ambas, nomeadamente se o tempo de propagação não puder ser desprezado', 'Em nenhuma das duas'], a: 0,
  e: 'É o funcionamento dos **encaminhadores de pacotes**: receber o pacote inteiro antes de o reenviar. Num circuito os bits fluem diretamente.' },
{ id: 'rcx-14', t: 'exam', l: 4, les: 's-select', reserved: 'exam', src: 'Exame 2024/25, P5',
  q: 'Qual é o objetivo da função select()?',
  o: ['Selecionar um descritor com dados prontos para ler, de um conjunto de descritores com leituras bloqueantes', 'Selecionar o socket para onde a aplicação enviará a próxima mensagem', 'Selecionar o processo que deve ler os dados recebidos', 'Selecionar o modo de funcionamento da aplicação (cliente ou servidor)'], a: 0,
  e: 'select() espera por **vários** descritores e diz quais estão prontos.' },
{ id: 'rcx-15', t: 'exam', l: 4, les: 'h-cache', reserved: 'exam', src: 'Exame 2024/25, P6',
  q: 'Um browser HTTP/1.1 pede uma página e, passado algum tempo, volta a pedi-la. Sabendo que não faz pedidos condicionais, qual será a status line da resposta ao segundo pedido?',
  o: ['HTTP/1.1 200 OK\\r\\n', 'HTTP/1.1 304 Not Modified\\r\\n', 'HTTP/1.1 400 Bad Request\\r\\n', 'HTTP/1.1 407 Proxy Authentication Required\\r\\n'], a: 0,
  e: 'Sem GET condicional não há 304: o servidor responde **200 OK** com o objeto.' },
{ id: 'rcx-16', t: 'exam', l: 4, les: 'd-mail', reserved: 'exam', src: 'Exame 2024/25, P7',
  q: 'A: enviar um email do cliente para o seu servidor. B: descarregar cabeçalhos e mensagens da caixa no servidor para memória. C: ler o email num browser. Que protocolos de aplicação se usam em A, B e C?',
  o: ['SMTP, IMAP, HTTPS', 'SMTP, HTTPS, IMAP', 'SMTP, POP, IMAP', 'SMTP, IMAP, POP'], a: 0,
  e: 'Enviar: **SMTP**. Aceder à caixa no servidor: **IMAP**. Webmail no browser: **HTTPS**.' },
{ id: 'rcx-17', t: 'exam', l: 4, les: 'd-rr', reserved: 'exam', src: 'Exame 2024/25, P8',
  d: { tbl: { h: ['Nome', 'Tipo', 'Valor'], r: [['www.rc.ulisboa.pt', 'CNAME', 'labserver.rc.ulisboa.pt'], ['rc.ulisboa.pt', 'NS', 'ns1.rc.ulisboa.pt'], ['labserver.rc.ulisboa.pt', 'A', '193.136.166.14'], ['ns1.rc.ulisboa.pt', 'A', '193.136.166.200']] } },
  q: 'Com estes Resource Records, o endereço IP associado a www.rc.ulisboa.pt:',
  o: ['É 193.136.166.14', 'É 193.136.166.200', 'Só pode ser obtido por consulta a labserver.rc.ulisboa.pt', 'Só pode ser obtido por consulta a ns1.rc.ulisboa.pt'], a: 0,
  e: 'www é alias (CNAME) de labserver, cujo A é **193.136.166.14**. .200 é o servidor de nomes.' },
{ id: 'rcx-18', t: 'exam', l: 4, les: 'i-dhcp', reserved: 'exam', src: 'Exame 2024/25, P9',
  q: 'No DHCP, ao fim de quanto tempo deve ser feito o primeiro pedido para prolongar (renew) o endereço atribuído?',
  o: ['50% do lease time', '85% do lease time', '90% do lease time', 'A renovação é automática enquanto o endereço estiver em uso'], a: 0,
  e: 'A **50%** do lease envia DHCP Request ao servidor. Se falhar, volta a tentar perto do fim.' },
{ id: 'rcx-19', t: 'exam', l: 4, les: 'c-ss', reserved: 'exam', src: 'Exame 2024/25, P10',
  q: 'CongWin é a janela de congestionamento (bytes). Em congestion avoidance, como se altera ao receber o ACK de um segmento transmitido? (MSS = máximo de bytes num segmento)',
  o: ['CongWin aumenta MSS × MSS / CongWin bytes', 'CongWin aumenta MSS bytes', 'CongWin reduz-se para MSS bytes', 'CongWin reduz-se para CongWin/2 bytes'], a: 0,
  e: 'Em congestion avoidance cada ACK soma **MSS²/CongWin** → +1 MSS por RTT. +MSS por ACK é o slow start.' },

/* ---------- 2023/24, Parte I ---------- */
{ id: 'rcx-21', t: 'exam', l: 4, les: 's-select', reserved: 'exam', src: 'Exame 2023/24, P2',
  q: 'Uma aplicação implementa um servidor UDP, um cliente UDP e lê comandos do stdin. Não sabendo qual será a próxima fonte com dados, como pode lidar com isso?',
  o: ['Pode usar a função select() para as várias fontes', 'Tem obrigatoriamente de criar um processo concorrente por fonte', 'A lógica do programa deve garantir que só há dados de uma fonte de cada vez', 'Deve ler sempre o stdin primeiro e os sockets depois'], a: 0,
  e: 'select() sobre stdin e sockets. Processos concorrentes também funcionariam, mas não são obrigatórios.' },
{ id: 'rcx-23', t: 'exam', l: 4, les: 'd-query', reserved: 'exam', src: 'Exame 2023/24, P4',
  q: 'Quando o servidor DNS local não tem a tradução de um nome, começa por consultar:',
  o: ['Um servidor raiz (root DNS)', 'Um servidor de topo (TLD)', 'Um servidor autoritativo', 'O servidor DHCP'], a: 0,
  e: 'Sem nada em cache, a resolução iterativa começa na **raiz**, que indica o TLD, que indica o autoritativo.' },
{ id: 'rcx-25', t: 'exam', l: 4, les: 'i-icmp', reserved: 'exam', src: 'Exame 2023/24, P6',
  q: 'O campo “time to live (TTL)” do cabeçalho IPv4 serve para indicar:',
  o: ['Em quantas ligações (hops) o datagrama ainda pode ser enviado antes de ser descartado', 'O instante em que o datagrama foi enviado', 'Quantos segundos faltam para o datagrama ser descartado', 'Quanto tempo o destino deve guardar o datagrama'], a: 0,
  e: 'Apesar do nome, conta **saltos**: cada encaminhador decrementa 1.' },
{ id: 'rcx-26', t: 'exam', l: 4, les: 'i-same', reserved: 'exam', calc: true, src: 'Exame 2023/24, P7',
  d: { ip: [{ a: '193.136.143.127', l: 'origem' }, { a: '193.136.143.65', l: 'destino' }] },
  q: 'Um computador 193.136.143.127 vai enviar para 193.136.143.65. Com qual destas máscaras do computador é que o datagrama é enviado ao default gateway?',
  o: ['255.255.255.224 (/27)', '255.255.255.192 (/26)', '255.255.255.0 (/24)', 'Nunca é enviado ao default gateway'], a: 0,
  e: '/26: blocos de 64 → 64–127 contém os dois → direto. /27: blocos de 32 → 127 está em 96–127, 65 em 64–95 → **gateway**.' },
{ id: 'rcx-27', t: 'exam', l: 4, les: 'i-v6', reserved: 'exam', src: 'Exame 2023/24, P8',
  q: 'Relativamente a IPv4 e IPv6:',
  o: ['Pode criar-se um túnel através da zona IPv4, com os datagramas IPv6 no campo de dados dos datagramas IPv4, sem perder informação', 'São compatíveis e coexistem sem qualquer tratamento especial', 'Encaminhadores dual stack convertem cabeçalhos IPv6 em IPv4 sem perder qualquer informação', 'Um encaminhador IPv4 encaminha datagramas IPv6 se tiver a tabela atualizada'], a: 0,
  e: 'O **túnel** transporta o datagrama IPv6 intacto. A tradução de cabeçalhos perde campos que só existem no IPv6.' },
{ id: 'rcx-28', t: 'exam', l: 4, les: 'i-same', reserved: 'exam', src: 'Exame 2023/24, P9',
  q: 'Um cliente HTTP em rc_lab pede uma página a www.tecnico.ulisboa.pt. Entre os dois há um comutador seguido de um encaminhador. Qual é o MAC de destino das tramas no troço entre o comutador e o encaminhador?',
  o: ['Endereço MAC do encaminhador', 'Endereço MAC do comutador', 'Endereço MAC do servidor', 'Endereço MAC do cliente'], a: 0,
  e: 'A trama sai do cliente endereçada ao **gateway** e passa pelo comutador sem mudar.' },
{ id: 'rcx-29', t: 'exam', l: 4, les: 'i-same', reserved: 'exam', calc: true, src: 'Exame 2023/24, P10',
  q: 'A e B estão em LANs Ethernet diferentes, ligadas por um encaminhador. Todas as tabelas ARP estão vazias. Quantas tramas são transmitidas no total até o primeiro datagrama IP de A chegar a B?',
  o: ['6', '2', '4', '3'], a: 0,
  e: 'LAN de A: ARP request (gateway), ARP reply, trama com o datagrama = 3. LAN de B: o encaminhador faz ARP request (B), reply, e envia a trama = 3. Total **6**.' },

/* ---------- Partes II e III ---------- */
{ id: 'rcx-30', t: 'exam', l: 4, les: 'n-sf', reserved: 'exam', calc: true, src: 'Exame 2025/26, Parte II.1',
  q: 'A envia ao servidor B um ficheiro de 8 Mbit pelo caminho A-X-Y-Z-B, em pacotes de 8 kbit. Ligações a 100 Mbit/s; RTT de propagação 100 ms; sem outro tráfego. Tempo desde o início do envio até B receber tudo?',
  o: ['130,24 ms', '180,24 ms', '130,32 ms', '80,24 ms'], a: 0,
  e: 'N = 1000, L/R = 80 µs. t = 1000 × 0,08 + 3 × 0,08 + 50 = **130,24 ms** (3 encaminhadores, propagação de ida = 50 ms).' },
{ id: 'rcx-31', t: 'exam', l: 4, les: 'i-same', reserved: 'exam', src: 'Exame 2025/26, Parte II.2',
  q: 'O computador 193.136.143.128 quer enviar um datagrama para 193.136.143.64. Para onde, e em que condições, é enviada a primeira mensagem?',
  o: ['Se pela máscara o destino estiver na mesma sub-rede, vai para o MAC do destino; senão para o MAC do default gateway; o MAC obtém-se por ARP', 'Vai sempre para o default gateway, porque os endereços são diferentes', 'Vai sempre diretamente, porque os três primeiros octetos são iguais', 'Vai para o servidor DNS, que indica o caminho'], a: 0,
  e: 'Tudo depende da **máscara**: com /24 → mesma rede, direto; com /25 → .0–.127 e .128–.255 → gateway. Se a tabela ARP estiver vazia, a primeira mensagem é um ARP.' },
{ id: 'rcx-32', t: 'exam', l: 4, les: 'r-cti', reserved: 'exam', calc: true, src: 'Exame 2025/26, Parte II.3',
  q: 'Vetor-distância. X tem vizinhos Y1–Y4, com estimativas para Z de 15, 17, 9 e 11 via Y1, Y2, Y3, Y4. A ligação (X, Y3) falha. Que distâncias anuncia X a Y1, Y2, Y4: (a) sem e (b) com separação de horizontes e envenenamento?',
  o: ['(a) 11, 11, 11; (b) 11, 11, ∞', '(a) 15, 17, 11; (b) 15, 17, ∞', '(a) 11, 11, 11; (b) ∞, ∞, 11', '(a) 9, 9, 9; (b) 9, 9, ∞'], a: 0,
  e: 'Sem Y3, o melhor é **11 via Y4**. Anuncia 11 a todos; com envenenamento, **∞ a Y4**.' },
{ id: 'rcx-33', t: 'exam', l: 4, les: 't-tcp', reserved: 'exam', calc: true, src: 'Exame 2025/26, Parte II.4',
  q: 'A envia 3 segmentos de dados, cada um com 250 bytes; o número de sequência inicial de A é 150. O 3.º segmento perde-se. Que números de sequência têm os 3 segmentos, e que ACKs chegam?',
  o: ['Seq 151, 401, 651; ACKs 401 e 651', 'Seq 150, 400, 650; ACKs 400 e 650', 'Seq 151, 401, 651; ACKs 401, 651 e 901', 'Seq 151, 402, 653; ACKs 402 e 653'], a: 0,
  e: 'O SYN gasta o 150: dados a partir de **151**, depois +250. O 3.º perdeu-se, por isso só há ACKs **401** e **651**.' },
{ id: 'rcx-34', t: 'exam', l: 4, les: 't-ack', reserved: 'exam', calc: true, src: 'Exame 2025/26, Parte II.4.iii',
  q: 'Mesmo cenário (seq 151, 401, 651; ACKs 401 e 651). Se o ACK do 1.º segmento se perder, qual é a base da janela de A depois de receber as restantes confirmações?',
  o: ['651', '401', '151', '901'], a: 0,
  e: 'ACKs cumulativos: o ACK 651 confirma tudo até 650, incluindo o 1.º segmento. A base avança para **651**.' },
{ id: 'rcx-35', t: 'exam', l: 4, les: 'n-sf', reserved: 'exam', calc: true, src: 'Exame 2024/25, Parte II.1',
  q: 'A e B ligados a 100 Mbit/s, propagação de 1 ms entre A e B, dois encaminhadores. A envia 8 Mbit em pacotes de 1 kByte. Quando chega o último bit a B?',
  o: ['81,16 ms', '82,16 ms', '81,24 ms', '80,16 ms'], a: 0,
  e: 'N = 1000, L/R = 80 µs. t = 80 + 2 × 0,08 + 1 = **81,16 ms**.' },
{ id: 'rcx-36', t: 'exam', l: 4, les: 'n-tput', reserved: 'exam', calc: true, src: 'Exame 2024/25, Parte II.2',
  q: 'A transmite a 100 Mbit/s para B por um cabo de 20 km; propagação a 2×10⁸ m/s. Quantos bits podem estar em trânsito no cabo?',
  o: ['10 kbit', '1 kbit', '100 kbit', '20 kbit'], a: 0,
  e: 'Propagação = 2×10⁴ / 2×10⁸ = 100 µs. Bits = 10⁸ × 10⁻⁴ = **10 kbit**.' },
{ id: 'rcx-37', t: 'exam', l: 4, les: 't-ack', reserved: 'exam', calc: true, src: 'Exame 2024/25, Parte II.3',
  q: 'MSS = 1000 B. Um cliente envia 5 segmentos (seq 1, 1001, 2001, 3001, 4001). O servidor confirma tudo com 3 ACKs: N, N+2000, N+3000. Qual é N, e qual o motivo?',
  o: ['N = 2001; delayed ACK', 'N = 1001; perderam-se dois ACKs', 'N = 3001; slow start', 'N = 2001; perderam-se dois segmentos'], a: 0,
  e: 'O último confirma tudo: N + 3000 = 5001 → **N = 2001** (1.º e 2.º juntos, 3.º e 4.º juntos, 5.º sozinho). **Delayed ACK**.' },
{ id: 'rcx-38', t: 'exam', l: 4, les: 'i-lpm', reserved: 'exam', calc: true, d: LPM_2425, src: 'Exame 2024/25, Parte III.2.2',
  q: 'Tabela de expedição acima. Por que interfaces saem os pacotes para 128.96.171.92 e 128.96.167.151?',
  o: ['A e C', 'B e C', 'A e D', 'E e C'], a: 0,
  e: '170.0/23 cobre 170–171 → **A**. 167: 166.0/23 (166–167) e 164.0/22 (164–167) batem; ganha a /23 → **C**.' },
{ id: 'rcx-39', t: 'exam', l: 4, les: 'i-lpm', reserved: 'exam', calc: true, d: LPM_2425, src: 'Exame 2024/25, Parte III.2.2',
  q: 'Mesma tabela. Por que interfaces saem os pacotes para 128.96.163.121 e 128.96.165.121?',
  o: ['E e D', 'D e D', 'E e C', 'D e C'], a: 0,
  e: '163 não está em nenhum bloco (o mais baixo começa em 164) → default **E**. 165: só 164.0/22 (164–167) → **D**.' },
{ id: 'rcx-40', t: 'exam', l: 4, les: 'n-sf', reserved: 'exam', calc: true, src: 'Exame 2023/24, Parte II.1',
  q: 'A e B ligados a 1 Gbit/s, RTT de 1 ms, dois encaminhadores. A envia 16 Mbit em pacotes de 1 kByte. Quando chega o último bit a B?',
  o: ['16,516 ms', '17,016 ms', '16,524 ms', '16,016 ms'], a: 0,
  e: 'N = 2000, L/R = 8 µs. t = 16 + 2 × 0,008 + 0,5 = **16,516 ms**.' },
{ id: 'rcx-41', t: 'exam', l: 4, les: 'i-nat', reserved: 'exam', calc: true, src: 'Exame 2023/24, Parte II.2',
  q: 'Rede privada ligada à Internet por NAT com 2 endereços públicos partilhados. Cada estação pode ter até 128 processos em execução. Quantas estações se podem ligar? (IPv4 = 32 bits, porto = 16 bits)',
  o: ['1024', '512', '65 536', '256'], a: 0,
  e: '2 × 2¹⁶ = 131 072 portos públicos. / 128 = **1024** estações.' },
{ id: 'rcx-42', t: 'exam', l: 4, les: 'r-cti', reserved: 'exam', src: 'Exame 2023/24, Parte II.3',
  q: 'Rede com vetor-distância, estável. Uma ligação no caminho de A para X fica indisponível. O nó A descobre imediatamente o novo caminho para X?',
  o: ['Não: os vizinhos ainda anunciam caminhos antigos e as distâncias sobem aos poucos (contagem até ao infinito)', 'Sim: o vetor-distância propaga as falhas numa só ronda', 'Sim, porque conhece o mapa completo', 'Não: A nunca mais chega a X'], a: 0,
  e: 'Más notícias viajam devagar no DV: é preciso várias trocas até os valores convergirem.' },
{ id: 'rcx-43', t: 'exam', l: 4, les: 'c-ss', reserved: 'exam', src: 'Exame 2023/24, Parte III.2.2a-b',
  q: 'Em que estado fica uma entidade TCP quando se estabelece uma sessão nova, com que cwnd, e como cresce a janela nesse estado?',
  o: ['Slow start; cwnd = 1 MSS; +1 MSS por cada ACK recebido', 'Congestion avoidance; cwnd = 1 MSS; +1 MSS por RTT', 'Slow start; cwnd = rwnd; duplica por ACK', 'Fast recovery; cwnd = 3 MSS; +1 MSS por ACK duplicado'], a: 0,
  e: 'Ligação nova: **slow start**, **1 MSS**, **+1 MSS por ACK** (duplica por RTT).' },
{ id: 'rcx-44', t: 'exam', l: 4, les: 'c-events', reserved: 'exam', src: 'Exame 2023/24, Parte III.2.2c',
  q: 'Em slow start, que acontece ao estado, ao threshold e à cwnd perante: 3 ACKs duplicados, e timeout?',
  o: ['3 dup ACKs: fast recovery, thr = cwnd/2, cwnd = thr + 3 MSS. Timeout: slow start, thr = cwnd/2, cwnd = 1 MSS', '3 dup ACKs: slow start, cwnd = 1 MSS. Timeout: fast recovery, cwnd = cwnd/2', 'Ambos: congestion avoidance, thr e cwnd iguais', '3 dup ACKs: thr = cwnd, cwnd = 1. Timeout: thr = cwnd/2, cwnd igual'], a: 0,
  e: 'Em ambos **thr = cwnd/2**. Os 3 duplicados levam a **fast recovery** (cwnd = thr + 3); o timeout volta a **1 MSS** e slow start. (E cwnd > thr leva a congestion avoidance.)' },
{ id: 'rcx-45', t: 'exam', l: 4, les: 'c-aimd', reserved: 'exam', src: 'Exame 2023/24, Parte III.2.2d',
  q: 'O controlo de congestão do TCP usa geralmente AIMD. Qual é a vantagem do TCP CUBIC?',
  o: ['Estima a janela que causa congestão: cresce mais depressa quando está abaixo desse valor e mais devagar ao aproximar-se dele', 'Nunca reduz a janela', 'Usa sempre slow start, mesmo depois de perdas', 'Dispensa ACKs'], a: 0,
  e: 'CUBIC: curva cúbica centrada em Wmax → recupera débito depressa sem provocar logo nova perda.' },
{ id: 'rcx-46', t: 'exam', l: 4, les: 'c-table', reserved: 'exam', calc: true, src: 'Exame 2023/24, Parte III.2.1',
  q: 'A envia 4000 bytes a B. MSS = 1000 B; ambos anunciam rwnd = 2000 B; RTT ≫ tempo de transmissão; slow start, sem delayed ACK. ISN de A = 49. Qual é o SN do 1.º segmento de dados e quantos segmentos envia A, no máximo, por RTT?',
  o: ['SN 50; no máximo 2 segmentos por RTT', 'SN 49; no máximo 4 segmentos por RTT', 'SN 50; 1, 2, 4… sem limite', 'SN 1050; no máximo 2 segmentos por RTT'], a: 0,
  e: 'O SYN gasta o 49 → dados em **50**. A janela efetiva é min(cwnd, rwnd = 2 MSS): rondas de 1, 2, 1 segmentos.' },
{ id: 'rcx-47', t: 'exam', l: 4, les: 'c-table', reserved: 'exam', calc: true, src: 'Exame 2025/26, Parte III.2.1',
  q: 'O cliente A pede um objeto de 10 kByte ao servidor B. MSS = 1000 B; slow start; sem delayed ACK; RTT ≫ transmissão. Quantos segmentos envia B em cada RTT, e qual é a cwnd quando envia o último grupo?',
  o: ['1, 2, 4, 3; cwnd = 8 MSS', '1, 2, 4, 3; cwnd = 4 MSS', '1, 2, 3, 4; cwnd = 4 MSS', '2, 4, 4; cwnd = 4 MSS'], a: 0,
  e: '10 segmentos. cwnd: 1 → 2 → 4 → 8. Na 4.ª ronda a cwnd já é **8**, mas só faltam **3** segmentos.' },
{ id: 'rcx-48', t: 'exam', l: 4, les: 'd-mail', reserved: 'exam', code: SMTP_2526, src: 'Exame 2025/26, Parte III.2.2',
  q: 'Sessão SMTP capturada com “Follow TCP stream” (acima). Qual é o servidor de correio, o porto, e quais os comandos SMTP usados?',
  o: ['tecnico.ulisboa.pt, porto 25; EHLO, MAIL FROM, RCPT TO, DATA, QUIT', 'rc.pt, porto 25; EHLO, MAIL FROM, RCPT TO, DATA, QUIT', 'tecnico.ulisboa.pt, porto 110; EHLO, From, To, Subject, QUIT', 'tecnico.ulisboa.pt, porto 25; 220, 250, 354, 221'], a: 0,
  e: 'O servidor apresenta-se no **220**. Porto **25**. Comandos: **EHLO, MAIL FROM, RCPT TO, DATA, QUIT** (From/To/Subject são cabeçalhos; 220/250/354/221 são respostas).' },
{ id: 'rcx-49', t: 'exam', l: 4, les: 'd-mail', reserved: 'exam', code: SMTP_2526, src: 'Exame 2025/26, Parte III.2.2',
  q: 'Na mesma sessão: porque diferem os destinatários dos RCPT TO e do cabeçalho To:? E porque se usa base64 na imagem?',
  o: ['Um destinatário foi posto em Bcc; o SMTP só transporta ASCII de 7 bits, por isso dados binários têm de ser codificados', 'Erro do cliente; base64 serve para encriptar a imagem', 'O servidor rejeitou um destinatário; base64 comprime a imagem', 'O To: só mostra o primeiro; base64 é exigido pelo IMAP'], a: 0,
  e: 'RCPT TO = envelope (quem recebe). To: = texto mostrado. O outro estava em **Bcc**. **Base64** converte bytes arbitrários em ASCII seguro para o SMTP.' },
]);

<script>
/* ===== Progress key =====
   Packs a student's progress into a short text that can travel as a link, a QR code or a paste,
   so they can continue on another device without accounts or a server.

   Questions are referred to by their position in the course's ids.json (STUDY.ids), never by
   their order in the source files, so adding questions never breaks old keys.

   Text format:  "E1" + base64url(bytes)
   bytes:        [flags] + payload + [checksum hi, lo]
     flags       bit0 compressed · bit1 includes notes
     payload     deflate-compressed when the browser supports it
     checksum    Fletcher-16 over flags + payload, catches truncated or mistyped keys
   payload (varint = unsigned LEB128, str = varint length + UTF-8):
     varint courseCount
     per course:
       str id · varint xp · varint rounds · varint testDay (0 = none) · byte settings (bit0 unlockAll)
       varint baseDay · varint n
       n × varint gap        (index − previous index − 1, indexes ascending)
       n × byte  c<<4 | w    (each capped at 15)
       n × byte  box<<5 | eb<<3 | ew   (box ≤ 7, eb ≤ 3, ew ≤ 7)
       n × varint lastDay − baseDay
       if notes: varint m, m × (varint index, str text)
   Columns (not rows) because similar bytes side by side compress much better. */
window.PROGRESS_KEY = (() => {
  const PREFIX = 'E1';
  const DAY = 864e5, EPOCH = Math.floor(Date.UTC(2024, 0, 1) / DAY);
  const toDay = ms => ms ? Math.max(0, Math.floor(ms / DAY) - EPOCH) : 0;
  const fromDay = d => (d + EPOCH) * DAY + DAY / 2;
  const cap = (v, m) => Math.max(0, Math.min(m, v | 0));

  /* --- bytes --- */
  function writer() {
    const b = [];
    const w = {
      byte(v) { b.push(v & 255); },
      varint(v) { v = Math.max(0, Math.floor(v)); do { let x = v % 128; v = Math.floor(v / 128); b.push(v ? x | 128 : x); } while (v); },
      str(s) { const u = new TextEncoder().encode(s); w.varint(u.length); u.forEach(x => b.push(x)); },
      out: () => Uint8Array.from(b),
    };
    return w;
  }
  function reader(u) {
    let i = 0;
    const need = () => { if (i >= u.length) throw new Error('truncated'); };
    const r = {
      byte() { need(); return u[i++]; },
      varint() { let v = 0, m = 1, x; do { need(); x = u[i++]; v += (x & 127) * m; m *= 128; } while (x & 128); return v; },
      str() { const n = r.varint(); if (i + n > u.length) throw new Error('truncated'); const s = new TextDecoder().decode(u.subarray(i, i + n)); i += n; return s; },
    };
    return r;
  }
  const b64 = u => { let s = ''; u.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const t = atob(s); return Uint8Array.from(t, c => c.charCodeAt(0)); };
  async function pipe(u, Stream) { const out = new Response(new Blob([u]).stream().pipeThrough(new Stream('deflate-raw'))); return new Uint8Array(await out.arrayBuffer()); }
  const fletcher = u => { let a = 0, b = 0; u.forEach(x => { a = (a + x) % 255; b = (b + a) % 255; }); return [b, a]; };
  const canZip = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';

  /* --- encode: G is the app state ({ c: { courseId: { stats, notes, xp, rounds, settings } } }) --- */
  async function encode(G, courses, opts = {}) {
    const w = writer();
    const list = Object.keys(G.c || {}).filter(id => courses[id] && courses[id].ids);
    w.varint(list.length);
    for (const id of list) {
      const S = G.c[id], ids = courses[id].ids, pos = new Map(ids.map((q, i) => [q, i]));
      const rows = Object.entries(S.stats || {})
        .filter(([q, s]) => pos.has(q) && (s.c || s.w || s.ew))
        .map(([q, s]) => ({ i: pos.get(q), s })).sort((a, b) => a.i - b.i);
      const days = rows.map(r => toDay(r.s.last)); const base = days.length ? Math.min(...days) : 0;
      w.str(id); w.varint(S.xp || 0); w.varint(S.rounds || 0);
      const td = S.settings && S.settings.testDate ? Date.parse(S.settings.testDate + 'T12:00:00Z') : 0;
      w.varint(td ? toDay(td) + 1 : 0); w.byte(S.settings && S.settings.unlockAll ? 1 : 0);
      w.varint(base); w.varint(rows.length);
      let prev = -1; rows.forEach(r => { w.varint(r.i - prev - 1); prev = r.i; });
      rows.forEach(r => w.byte(cap(r.s.c, 15) << 4 | cap(r.s.w, 15)));
      rows.forEach(r => w.byte(cap(r.s.box, 7) << 5 | cap(r.s.eb, 3) << 3 | cap(r.s.ew, 7)));
      days.forEach(d => w.varint(d - base));
      if (opts.notes) {
        const ns = Object.entries(S.notes || {}).filter(([q, t]) => t && pos.has(q));
        w.varint(ns.length); ns.forEach(([q, t]) => { w.varint(pos.get(q)); w.str(t); });
      }

    let payload = w.out(), flags = opts.notes ? 2 : 0;
    if (canZip) { const z = await pipe(payload, CompressionStream); if (z.length < payload.length) { payload = z; flags |= 1; } }
    const body = new Uint8Array(payload.length + 1); body[0] = flags; body.set(payload, 1);
    const all = new Uint8Array(body.length + 2); all.set(body); all.set(fletcher(body), body.length);
    return PREFIX + b64(all);
  }

  /* --- find the key inside whatever was pasted: a link, the key itself, text around it --- */
  function extract(text) {
    const s = String(text || '').trim();
    const m = s.match(/[#?&]k=(E1[A-Za-z0-9_-]+)/) || s.match(/\b(E1[A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  }

  /* --- decode: returns { courses: { id: { stats, notes, xp, rounds, testDate, unlockAll } }, unknown } --- */
  async function decode(text, courses) {
    const key = extract(text); if (!key) throw new Error('Não encontrei uma chave neste texto.');
    let all; try { all = unb64(key.slice(PREFIX.length)); } catch { throw new Error('A chave está incompleta ou foi alterada. Copia-a outra vez.'); }
    const bad = () => new Error('A chave está incompleta ou foi alterada. Copia-a outra vez.');
    if (all.length < 4) throw bad();
    const body = all.subarray(0, all.length - 2), [h, l] = fletcher(body);
    if (all[all.length - 2] !== h || all[all.length - 1] !== l) throw bad();
    const flags = body[0]; let payload = body.subarray(1);
    if (flags & 1) { if (!canZip) throw new Error('Este browser é demasiado antigo para ler a chave.'); try { payload = await pipe(payload, DecompressionStream); } catch { throw bad(); } }
    const r = reader(payload), out = { courses: {}, unknown: 0 };
    try {
      const nc = r.varint();
      for (let k = 0; k < nc; k++) {
        const id = r.str(), ids = (courses[id] && courses[id].ids) || [];
        const C = { stats: {}, notes: {}, xp: r.varint(), rounds: r.varint() };
        const td = r.varint(); C.testDate = td ? new Date(fromDay(td - 1)).toISOString().slice(0, 10) : '';
        C.unlockAll = !!(r.byte() & 1);

        const idx = []; let prev = -1; for (let j = 0; j < n; j++) { prev += r.varint() + 1; idx.push(prev); }
        const a = [], b = [], d = [];
        for (let j = 0; j < n; j++) a.push(r.byte());
        for (let j = 0; j < n; j++) b.push(r.byte());
        for (let j = 0; j < n; j++) d.push(r.varint());
        idx.forEach((i, j) => {
          const q = ids[i]; if (!q) { out.unknown++; return; }
          C.stats[q] = { c: a[j] >> 4, w: a[j] & 15, box: b[j] >> 5, eb: (b[j] >> 3) & 3, ew: b[j] & 7, last: fromDay(base + d[j]) };
        });
        if (flags & 2) { const m = r.varint(); for (let j = 0; j < m; j++) { const i = r.varint(), t = r.str(); if (ids[i]) C.notes[ids[i]] = t; } }
        if (courses[id]) out.courses[id] = C; else out.unknown += n;
      }
    } catch { throw bad(); }
    if (!Object.keys(out.courses).length) throw new Error('Esta chave não tem progresso de nenhuma cadeira deste site.');
    return out;
  }

  /* --- merge into G without losing anything on either side --- */
  function merge(G, incoming, blank) {
    const report = { added: 0, updated: 0, notes: 0 };
    for (const [id, R] of Object.entries(incoming.courses)) {
      const L = G.c[id] || (G.c[id] = blank(id));
      L.stats = L.stats || {}; L.notes = L.notes || {}; L.settings = L.settings || {};
      for (const [q, r] of Object.entries(R.stats)) {
        const l = L.stats[q];
        if (!l) { L.stats[q] = { ...r }; report.added++; continue; }
        const before = JSON.stringify(l);
        l.c = Math.max(l.c || 0, r.c); l.w = Math.max(l.w || 0, r.w); l.ew = Math.max(l.ew || 0, r.ew);
        if ((r.last || 0) > (l.last || 0)) { l.box = r.box; l.eb = r.eb; l.last = r.last; }   // review state follows the most recent device
        if (JSON.stringify(l) !== before) report.updated++;
      }
      for (const [q, t] of Object.entries(R.notes)) {
        const mine = L.notes[q];
        if (!mine) { L.notes[q] = t; report.notes++; }
        else if (!mine.includes(t)) { L.notes[q] = mine + '\n\n' + t; report.notes++; }
      }
      L.xp = Math.max(L.xp || 0, R.xp); L.rounds = Math.max(L.rounds || 0, R.rounds);
      if (!L.settings.testDate && R.testDate) L.settings.testDate = R.testDate;
      if (R.unlockAll) L.settings.unlockAll = true;
    }
    return report;
  }

  /* --- what a key contains, for the confirmation screen --- */
  const summary = decoded => Object.entries(decoded.courses).map(([id, C]) => ({
    id, answered: Object.keys(C.stats).length, mastered: Object.values(C.stats).filter(s => s.c > 0).length,
    xp: C.xp, notes: Object.keys(C.notes).length,
  }));

  return { encode, decode, extract, merge, summary };
})();

/* ===== Estudo IST — engine =====

(() => {

const blank = (topics = {}) => ({ stats: {}, notes: {}, xp: 0, skipped: {}, settings: { topics: Object.keys(topics), known: Object.keys(topics), unlockAll: false, testDate: '', noCalc: false }, rounds: 0, sessions: [] });

let C = null, S = null, TOPICS = {}, LEVELS = DEFAULT_LEVELS;

function rebuildBank() {
  const seen = new Set(); BANK = []; BYID = {}; LESSONS = []; LBYID = {};
  const addL = (l, trusted) => { if (!l || !l.id || LBYID[l.id]) return; const x = Object.assign({}, l, { trusted }); LESSONS.push(x); LBYID[l.id] = x; };

  if (![1, 2, 3, 4].includes(q.l)) return { ok: false, why: '"l" (nível) tem de ser 1, 2, 3 ou 4' };

/* ---------- stats helpers ----------

  const done = qs.filter(q => peek(q.id).c > 0).length; return { pct: done / qs.length, done, total: qs.length };
}

const examReviewPool = () => BANK.filter(q => inTopics(q) && peek(q.id).ew > 0 && peek(q.id).eb < EXAM_CLEAR).sort((a, b) => peek(a.id).eb - peek(b.id).eb || peek(a.id).last - peek(b.id).last);

  return bands.flatMap(b => shuffle(b)).slice(0, n);

const totalXp = () => Object.values(G.c).reduce((a, c) => a + (c.xp || 0), 0);

/* ---------- sessions ---------- */
function makeItem(q) { const n = q.o.length; const order = q.fixed ? [...Array(n).keys()] : shuffle([...Array(n).keys()]); return { kind: 'q', id: q.id, order }; }
function buildExam() {
  // 1) unseen reserved questions; 2) fill with the usual level mix from training; 3) reserved ones already seen
  const EXAM_N = examCfg().n;
  let qs = shuffle(freshReserved()).slice(0, EXAM_N);
  const used = new Set(qs.map(q => q.id));
  if (qs.length < EXAM_N) {
    const tp = trainPool().filter(q => !used.has(q.id)); const by = (l, n) => pick(tp.filter(q => q.l === l), n);
    const r = EXAM_N / 20; const mix = shuffle([...by(2, Math.ceil(7 * r)), ...by(3, Math.ceil(8 * r)), ...by(4, Math.ceil(5 * r))]).slice(0, EXAM_N - qs.length);
    mix.forEach(q => used.add(q.id)); qs = qs.concat(mix);
  }
  if (qs.length < EXAM_N) qs = qs.concat(shuffle(BANK.filter(q => inTopics(q) && isReserved(q) && !used.has(q.id))).slice(0, EXAM_N - qs.length));
  return shuffle(qs);
}
function start(mode, opts = {}) {
  let items = [], title = '', timeLimit = 0;
  const pool = trainPool();
  if (!BANK.some(inTopics)) { toast('Escolhe pelo menos um tema.'); return; }
  if (mode === 'level') { const L = opts.level; items = pick(pool.filter(q => q.l === L), 10).map(makeItem); title = `Nível ${L} · ${LEVELS[L - 1].t}`; }
  if (mode === 'review') { items = reviewPool().slice(0, 12).map(makeItem); title = 'Revisão · erros de treino'; if (!items.length) { toast('Ainda não tens erros de treino para rever.'); return; } }
  if (mode === 'skipped') { items = skippedPool().slice(0, 12).map(makeItem); title = 'Revisão · saltadas'; if (!items.length) { toast('Não tens perguntas saltadas.'); return; } }
  if (mode === 'reviewExam') { items = examReviewPool().slice(0, 12).map(makeItem); title = 'Revisão · erros de exame'; if (!items.length) { toast('Ainda não tens erros de exame para rever.'); return; } }
  if (mode === 'extra') { const x = (C.extras || []).find(e => e.id === opts.extra); if (!x) return; items = (x.questions(extraApi()) || []).map(makeItem); title = x.title; }
  if (mode === 'exam') { items = buildExam().map(makeItem); title = 'Exame simulado'; timeLimit = examCfg().min * 60; }
  if (mode === 'learn') {
    const t = opts.topic; title = `Aprender · ${TOPICS[t].short}`;
    LESSONS.filter(l => l.t === t).forEach(l => { items.push({ kind: 'lesson', id: l.id });
      const qs = pool.filter(q => q.les === l.id).sort((a, b) => a.l - b.l || (peek(a.id).c - peek(b.id).c)).slice(0, 2); qs.forEach(q => items.push(makeItem(q))); });
  }
  if (mode === 'retry') { items = opts.ids.map(id => BYID[id]).filter(Boolean).map(makeItem); title = 'Repetir erros'; }
  if (!items.length) { toast('Não há perguntas para estes filtros.'); return; }
  ses = { mode, title, items, i: 0, results: [], picked: new Set(), answered: false, xp: 0, timeLimit, startedAt: Date.now(), level: opts.level, topic: opts.topic, examGrading: mode === 'reviewExam' || !!opts.examGrading, ended: false };
  if (timeLimit) startTimer();
  go(items[0].kind === 'lesson' ? 'lesson' : 'quiz');
}

let tick = null;
function startTimer() { clearInterval(tick); tick = setInterval(() => { if (!ses || ses.ended) { clearInterval(tick); return; } const left = ses.timeLimit - Math.floor((Date.now() - ses.startedAt) / 1000); const el = document.getElementById('timer'); if (el) { el.textContent = fmt(Math.max(0, left)); el.classList.toggle('hot', left <= 120); } if (left <= 0) finish(); }, 250); }
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const curItem = () => ses.items[ses.i];
const qCount = () => ses.items.filter(x => x.kind === 'q').length;
const qIndex = () => ses.items.slice(0, ses.i + 1).filter(x => x.kind === 'q').length;

/* ---------- QUIZ ---------- */
function Quiz() {
  const it = curItem(), q = BYID[it.id]; const T = TOPICS[q.t]; const multi = Array.isArray(q.a);
  const isExam = ses.mode === 'exam';
  const prog = `<div class="progress" aria-hidden="true">${ses.items.filter(x => x.kind === 'q').map((x, i) => { const r = ses.results.find(rr => rr.item === x); const cur = x === it; return `<i class="${r ? (r.skipped ? 'sk' : isExam ? 'cur' : r.ok ? 'ok' : 'ko') : cur ? 'cur' : ''}"></i>`; }).join('')}</div>`;
  const skipBtn = `<button class="btn small skip" data-act="skip" title="${isExam ? 'Deixar em branco (não desconta)' : 'Saltar: fica na lista Saltadas para fazeres depois'}">${isExam ? 'Deixar em branco' : 'Saltar'} ⤼</button>`;

    : `<div class="qfoot">${multi ? `<button class="btn primary" data-act="confirm" ${ses.picked.size ? '' : 'disabled'}>Confirmar</button>` : ''}${skipBtn}<span class="muted" style="font-size:12.5px">Teclas <span class="kbd">1</span>–<span class="kbd">${q.o.length}</span>${multi ? ' marcam, <span class="kbd">Enter</span> confirma' : ''} · <span class="kbd">S</span> ${isExam ? 'branco' : 'salta'}</span><span class="spacer"></span>${isExam ? `<button class="btn ghost small" data-act="finish">Entregar exame</button>` : `<button class="btn ghost small" data-act="quit">Terminar ronda</button>`}</div>`;
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="badge" style="--c:${T.c}"><span class="sw"></span>${T.short}</span><span class="badge">N${q.l}</span>${q.calc ? `<span class="badge calc" title="Pergunta com contas">Contas${q.step ? ` · ${esc(q.step)}` : ''}</span>` : ''}${prog}${(isExam) ? `<span class="timer" id="timer">${fmt(ses.timeLimit - Math.floor((Date.now() - ses.startedAt) / 1000))}</span>` : ''}<span class="mono muted">${qIndex()}/${qCount()}</span></div>
    <article class="card" id="qcard">
      <span class="eyebrow">${esc(ses.title)}</span>

      ${q.ctx && LBYID[q.ctx] ? `<details class="lesson-peek" style="margin-top:12px"><summary>Ler o caso: ${esc(LBYID[q.ctx].title)}</summary><div class="lbody lesson">${lessonBody(LBYID[q.ctx])}</div></details>` : ''}

}
function Feedback(q, it) {

    <div class="verdict">${C.verdict ? `<span class="vtag">${esc(ok ? C.verdict.ok : C.verdict.ko)}</span>` : ''}${ok ? pickOne(['Certo.', 'Exatamente.', 'Na mouche.', 'Isso mesmo.']) : pickOne(['Ainda não.', 'Quase, mas não.', 'Falhou. Bora perceber porquê.'])}</div>
