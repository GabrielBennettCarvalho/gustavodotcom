{ id: 'bpmn-12', t: 'bpmn', l: 1, les: 'bpmn-act',
  q: 'Uma tarefa executada automaticamente por um sistema, sem intervenção humana, é uma…',
  o: ['User task', 'Manual task', 'Service task', 'Receive task'], a: 2,
  e: '**Service task**: sistema ou API, sem humano. **User task**: humano com apoio de sistema. **Manual task**: humano sem sistema (ex.: arquivar papel).' },
{ id: 'bpmn-13', t: 'bpmn', l: 1, les: 'bpmn-core',
  q: 'No “token game”, o que cria uma nova instância de processo e o respetivo token?',
  o: ['Um end event', 'Um start event', 'Um gateway paralelo', 'Uma lane'], a: 1,
  e: 'Os **start events** iniciam o processo: **criam uma process instance e o token** que vai percorrer os sequence flows.' },
{ id: 'bpmn-14', t: 'bpmn', l: 1, les: 'bpmn-events', d: { kind: 'bpmn', w: 280, h: 70, alt: 'Três end events A, B, C', nodes: [{ id: 'a', k: 'end', tr: 'msg', x: 50, y: 36, tag: 'A' }, { id: 'b', k: 'end', tr: 'terminate', x: 140, y: 36, tag: 'B' }, { id: 'c', k: 'end', tr: 'error', x: 230, y: 36, tag: 'C' }] },
  q: 'Qual destes end events é o TERMINATE?',
  o: ['A', 'B', 'C', 'Nenhum'], a: 1, fixed: true,
  e: 'O **Terminate end event** tem um círculo preenchido no interior. A tem um envelope (message end) e C um raio (error end).' },

/* ===== BPMN · Nível 2 ===== */
{ id: 'bpmn-15', t: 'bpmn', l: 2, les: 'bpmn-events',
  q: 'Qual a diferença entre um Message e um Signal?',
  o: ["Não há diferença: são dois nomes para o mesmo trigger", "Message tem destinatário específico; Signal é broadcast", "Signal só serve para assinalar erros técnicos", "Message só pode existir em start events"], a: 1,
  e: '**Message** = comunicação dirigida a um participante concreto. **Signal** = difusão (como um anúncio de altifalante): qualquer processo à escuta pode reagir.' },
{ id: 'bpmn-16', t: 'bpmn', l: 2, les: 'bpmn-events', src: 'Slides 04a, p.22',
  q: 'Queres que um Message End Event avise outro processo que está NA MESMA POOL. O que dizem os slides?',
  o: ["Está correto: a mensagem chega a qualquer processo", "Não pode: dentro da mesma pool usa-se um Signal", "Usa-se um message flow entre as duas lanes", "Usa-se um Error end event para avisar"], a: 1,
  e: 'O Message End Event **só envia para outra pool**. Se o alvo está na mesma pool, os slides dizem para usar **Signals**.' },
{ id: 'bpmn-17', t: 'bpmn', l: 2, les: 'bpmn-gw',
  q: 'Como se comporta um XOR-merge (exclusive gateway a convergir)?',
  o: ["Espera por todos os fluxos de entrada", "Continua assim que chega um fluxo", "Bloqueia o processo até haver decisão", "Escolhe aleatoriamente uma das saídas"], a: 1,
  e: 'O **XOR-merge** não sincroniza: deixa passar **cada token assim que chega**. Quem espera por todos é o **AND-join**.' },
{ id: 'bpmn-18', t: 'bpmn', l: 2, les: 'bpmn-gw',
  q: 'O que faz um AND-split (parallel gateway a divergir)?',
  o: ["Escolhe um só caminho de saída", "Cria tokens em todos os caminhos", "Espera por um evento externo", "Avalia condições de cima para baixo"], a: 1,
  e: 'O **AND-split (fork)** divide um fluxo em 2 ou mais fluxos **concorrentes no tempo**. Não há condições.' },
{ id: 'bpmn-19', t: 'bpmn', l: 2, les: 'bpmn-gw', d: { kind: 'bpmn', w: 400, h: 170, alt: 'Inclusive gateway com três condições', nodes: [
    { id: 's', k: 'start', x: 28, y: 85 }, { id: 'g', k: 'or', x: 110, y: 85 }, { id: 'a', k: 'task', x: 270, y: 30, w: 110, h: 44, lb: 'Tarefa A' }, { id: 'b', k: 'task', x: 270, y: 85, w: 110, h: 44, lb: 'Tarefa B' }, { id: 'c', k: 'task', x: 270, y: 140, w: 110, h: 44, lb: 'Tarefa C' }],
    edges: [{ f: 's', t: 'g' }, { f: 'g', t: 'a', lb: 'x > 5', cond: false }, { f: 'g', t: 'b', lb: 'x < 10' }, { f: 'g', t: 'c', lb: 'x > 20' }] },
  q: 'Com x = 7, que tarefas são executadas depois deste inclusive gateway?',
  o: ['Só A', 'A e B', 'A, B e C', 'Só B'], a: 1,
  e: 'O **OR-split** segue **todos** os caminhos cuja condição é verdadeira, em paralelo. 7 > 5 ✓, 7 < 10 ✓, 7 > 20 ✗. Logo **A e B**.' },
{ id: 'bpmn-20', t: 'bpmn', l: 2, les: 'bpmn-gw', d: { kind: 'bpmn', w: 400, h: 170, alt: 'Exclusive gateway com condições e default', nodes: [
    { id: 's', k: 'start', x: 28, y: 85 }, { id: 'g', k: 'xor', x: 110, y: 85 }, { id: 'a', k: 'task', x: 270, y: 30, w: 110, h: 44, lb: 'Tarefa A' }, { id: 'b', k: 'task', x: 270, y: 85, w: 110, h: 44, lb: 'Tarefa B' }, { id: 'c', k: 'task', x: 270, y: 140, w: 110, h: 44, lb: 'Tarefa C' }],
    edges: [{ f: 's', t: 'g' }, { f: 'g', t: 'a', lb: 'x > 5' }, { f: 'g', t: 'b', lb: 'x > 1' }, { f: 'g', t: 'c', def: true, lb: 'default' }] },
  q: 'Com x = 8, que tarefa é executada? (as condições são avaliadas de cima para baixo, como nos slides)',
  o: ['Tarefa A', 'Tarefa B', 'A e B', 'Tarefa C (default)'], a: 0,
  e: 'No **XOR-split** só um caminho é escolhido: o da **primeira condição verdadeira**, de cima para baixo. 8 > 5 é logo verdadeira, por isso **A**. O default só se segue se todas forem falsas (ex.: x = 0).', w: { 2: 'Isso seria um OR (inclusive) gateway. O XOR escolhe um e só um.' } },
{ id: 'bpmn-21', t: 'bpmn', l: 2, les: 'bpmn-gw',
  q: 'Como decide um Event-Based Gateway o caminho a seguir?',
  o: ["Avalia condições sobre os dados do processo", "Segue o primeiro evento que ocorrer", "Segue todos os caminhos em paralelo", "Pergunta ao utilizador qual escolher"], a: 1,
  e: 'A escolha baseia-se em **eventos**, não em expressões de dados: o **primeiro evento** recebido determina o caminho e os outros são descartados. Também pode **iniciar** um processo se não tiver fluxos de entrada.' },
{ id: 'bpmn-22', t: 'bpmn', l: 2, les: 'bpmn-boundary',
  q: 'Num boundary event, o contorno TRACEJADO indica…',
  o: ["Que o evento é de erro e aborta a atividade", "Que é non-interrupting: a atividade continua", "Que é um throw e não um catch", "Que o evento é opcional e pode não ocorrer"], a: 1,
  e: '**Contínuo = interrupting** (a atividade é interrompida e não completa). **Tracejado = non-interrupting** (a atividade continua; o evento gera um fluxo paralelo).' },
{ id: 'bpmn-23', t: 'bpmn', l: 2, les: 'bpmn-boundary', src: 'Slides 04a, p.39',
  q: 'Uma atividade quer reportar uma situação anómala E continuar a executar. O que dizem os slides?',
  o: ["Usar um Error boundary event non-interrupting, com contorno tracejado", "Errors interrompem sempre; usar um Signal non-interrupting", "Usar um Terminate end event dentro da atividade", "Usar um message flow para a própria pool"], a: 1,
  e: 'Depois de um **Error**, a atividade **aborta sempre**. Para avisar sem parar, os slides sugerem um **Signal non-interrupting** (as notas falam também de Escalation).' },
{ id: 'bpmn-24', t: 'bpmn', l: 2, les: 'bpmn-boundary',
  q: 'Queres que o processo espere 3 dias entre “Enviar fatura” e “Verificar pagamento”. Que elemento usas?',
  o: ["Um timer start event entre as duas tarefas", "Um timer intermediate event no fluxo", "Um timer boundary interrupting em “Enviar fatura”", "Um exclusive gateway com condição “3 dias”"], a: 1,
  e: 'Um **atraso** no meio do processo é um **Timer intermediate event** no fluxo. Usar um **start** timer para isso é um erro típico, e o timer em **boundary** exprime outra coisa (um prazo ou duração da tarefa).' },
{ id: 'bpmn-25', t: 'bpmn', l: 2, les: 'bpmn-act', src: 'Slides 04c, p.18',
  q: 'Qual a diferença entre uma Receive Task e um Message Catch Event intermédio?',
  o: ["Nenhuma: são duas notações equivalentes", "Receive task: espera ativa; catch event: espera passiva", "A receive task só pode existir no início do processo", "O catch event consome recursos e a receive task não"], a: 1,
  e: 'Os slides avisam: “these two examples ARE NOT THE SAME”. Na **receive task** há um recurso afetado a esperar (custa tempo, dinheiro, espaço). No **catch event** o recurso fica livre, mas precisa de tempo de preparação para reagir.' },
{ id: 'bpmn-26', t: 'bpmn', l: 2, les: 'bpmn-collab',
  q: 'O que mostra um PUBLIC process?',
  o: ["Todas as atividades internas, com todo o detalhe", "Só as atividades que comunicam com outros participantes", "Só os gateways e as decisões do processo", "O processo interno de um cliente externo"], a: 1,
  e: 'O **public (abstract) process** mostra ao exterior apenas os “**touch-points**”: as atividades e message flows necessários para interagir. O **private** tem todo o detalhe interno.' },
{ id: 'bpmn-27', t: 'bpmn', l: 2, les: 'bpmn-act', src: 'Notas 6.14',
  q: 'Num private process, que elementos consomem recursos (tempo, custo) da entidade que executa o processo?',
  o: ["Gateways e eventos, porque tomam decisões", "Apenas as atividades (tasks e sub-processes)", "Os sequence flows, porque levam tempo", "Todos os elementos do diagrama"], a: 1,
  e: '**Só as atividades** são executadas por pessoas, sistemas ou dispositivos e consomem recursos. Sequence flows e gateways são interpretados pela **infraestrutura** de execução (motor BPM, regras). Atribuir custos ou duração a eventos e fluxos é um erro.' },
{ id: 'bpmn-28', t: 'bpmn', l: 2, les: 'bpmn-collab', src: 'Slides 04c, p.22',
  q: 'Num diagrama, uma lane chama-se “Joana Silva”. Porque é má prática?',
  o: ["Porque os nomes das lanes devem estar em inglês", "Porque lanes são roles, não pessoas", "Porque as lanes só podem ter nomes de departamentos", "Não é má prática: é a forma mais precisa"], a: 1,
  e: 'As **lanes representam roles específicos**. “Joana Silva” é demasiado específico: se a tarefa depende sempre de uma pessoa, há um problema (e o conhecimento sai com ela). Cria antes um role como “Analista de Risco”.' },
{ id: 'bpmn-29', t: 'bpmn', l: 2, les: 'bpmn-boundary',
  q: 'Para que serve a compensação (compensation) em BPMN?',
  o: ["Para pagar horas extra a quem executou a tarefa", "Para desfazer uma atividade já concluída", "Para repetir automaticamente uma tarefa falhada", "Para interromper uma tarefa que está em curso"], a: 1,
  e: 'A **compensação** desfaz trabalho **já feito** (ex.: anular um pagamento se a entrega falhar). A atividade a desfazer tem um boundary event de compensação associado à **compensation activity** (marcador ⏪).' },
{ id: 'bpmn-30', t: 'bpmn', l: 2, les: 'bpmn-boundary',
  q: 'Para que servem os Link events (throw e catch)?',
  o: ["Para enviar mensagens a outras pools", "Para ligar partes do mesmo diagrama", "Para criar novas instâncias do processo", "Para sincronizar dois processos diferentes"], a: 1,
  e: 'Os **link events** funcionam aos pares (throw → catch) **dentro do mesmo processo**: simplificam o desenho, como um conector de página.' },

/* ===== BPMN · Nível 3 (diagramas e cenários) ===== */
{ id: 'bpmn-31', t: 'bpmn', l: 3, les: 'bpmn-gw', d: splitMerge('xor', 'and', 'Aprovar', 'Rejeitar', 'ok', 'não ok', 'Arquivar', 'XOR split fechado por AND join'),
  q: 'O que acontece a uma instância que passe por este processo?',
  o: ["Corre normalmente até ao fim", "Deadlock no AND-join", "“Arquivar” é executada duas vezes", "Aprovar e Rejeitar correm em paralelo"], a: 1,
  e: 'O **XOR-split** envia **um só token** por um dos ramos. O **AND-join** espera tokens de **todos** os ramos de entrada, e o outro nunca chega: **deadlock**. Fecha um XOR com um XOR.' },
{ id: 'bpmn-32', t: 'bpmn', l: 3, les: 'bpmn-gw', d: splitMerge('and', 'xor', 'Faturar', 'Enviar encomenda', '', '', 'Notificar cliente', 'AND split fechado por XOR merge'),
  q: 'Quantas vezes é executada “Notificar cliente” por cada instância?',
  o: ['0 (deadlock)', '1', '2', 'Depende das condições'], a: 2,
  e: 'O **AND-split** cria **dois tokens**. O **XOR-merge** não sincroniza: deixa passar **cada um** quando chega. Resultado: “Notificar cliente” corre **duas vezes**. Para sincronizar usa um AND-join.' },
{ id: 'bpmn-33', t: 'bpmn', l: 3, les: 'bpmn-errors', d: { kind: 'bpmn', w: 560, h: 172, alt: 'Message flow entre lanes da mesma pool', pools: [{ x: 6, y: 6, w: 548, h: 160, lb: 'Empresa', lanes: [{ lb: 'Comercial', h: 80 }, { lb: 'Direção', h: 80 }] }],
    nodes: [{ id: 's', k: 'start', x: 90, y: 46 }, { id: 'a', k: 'task', x: 190, y: 46, lb: 'Pedir aprovação' }, { id: 'b', k: 'task', x: 340, y: 126, lb: 'Aprovar desconto' }, { id: 'e', k: 'end', x: 460, y: 126 }],
    edges: [{ f: 's', t: 'a' }, { f: 'a', t: 'b', k: 'msg' }, { f: 'b', t: 'e' }] },
  q: 'O que está errado neste diagrama?',
  o: ["Nada: o diagrama está correto e cumpre as regras", "Message flow dentro da mesma pool; devia ser sequence flow", "As lanes deviam ser duas pools independentes uma da outra", "Falta um gateway exclusivo antes de “Aprovar desconto”"], a: 1,
  e: 'Uma pool contém **um só processo**, e **message flows não são permitidos dentro de um processo**. Entre lanes da mesma pool usa-se **sequence flow** (pode atravessar lanes).', w: { 2: 'Só faria sentido se Comercial e Direção fossem participantes independentes. Como estão, a ligação certa é um sequence flow.' } },
{ id: 'bpmn-34', t: 'bpmn', l: 3, les: 'bpmn-errors', d: { kind: 'bpmn', w: 560, h: 190, alt: 'Sequence flow a atravessar pools', pools: [{ x: 6, y: 6, w: 548, h: 80, lb: 'Cliente' }, { x: 6, y: 100, w: 548, h: 84, lb: 'Loja' }],
    nodes: [{ id: 's', k: 'start', x: 70, y: 46 }, { id: 'a', k: 'task', x: 170, y: 46, lb: 'Encomendar' }, { id: 'b', k: 'task', x: 320, y: 142, lb: 'Receber encomenda' }, { id: 'c', k: 'task', x: 440, y: 142, w: 86, lb: 'Enviar' }, { id: 'e', k: 'end', x: 520, y: 142 }],
    edges: [{ f: 's', t: 'a' }, { f: 'a', t: 'b' }, { f: 'b', t: 'c' }, { f: 'c', t: 'e' }] },
  q: 'Que erros tem este diagrama de colaboração? Escolhe a descrição mais completa.',
  o: ["Nenhum: a colaboração está bem modelada e respeita as regras das pools", "Sequence flow entre pools; falta start na Loja e end no Cliente", "Só falta um gateway exclusivo entre as duas pools para decidir", "As duas pools deviam ser lanes da mesma pool"], a: 1,
  e: '**Sequence flows não atravessam pools.** Modela cada pool de forma independente (com start e end próprios) e liga-as depois com **message flows**. É o anti-pattern “wrong use of flows in/between pools”.' },
{ id: 'bpmn-35', t: 'bpmn', l: 3, les: 'bpmn-errors', src: 'Slides 04c, Questão 4', d: { kind: 'bpmn', w: 440, h: 150, alt: 'Intermediate event sem saída', nodes: [
    { id: 's', k: 'start', x: 28, y: 70 }, { id: 't', k: 'task', x: 112, y: 70, w: 92, lb: 'Preparar contrato' }, { id: 'g', k: 'and', x: 205, y: 70 },
    { id: 'a', k: 'task', x: 300, y: 30, w: 92, lb: 'Enviar contrato' }, { id: 'e1', k: 'end', tr: 'msg', x: 395, y: 30 },
    { id: 'b', k: 'task', x: 300, y: 112, w: 92, lb: 'Notificar RH' }, { id: 'i', k: 'int', tr: 'msg', th: true, x: 395, y: 112, tag: '?' }],
    edges: [{ f: 's', t: 't' }, { f: 't', t: 'g' }, { f: 'g', t: 'a' }, { f: 'g', t: 'b' }, { f: 'a', t: 'e1' }, { f: 'b', t: 'i' }] },
  q: 'Que problema tem o elemento marcado com “?”?',
  o: ["Nenhum: um throw intermédio pode terminar um caminho", "É um evento intermédio sem saída; devia ser um end event", "Devia ser um catch, porque espera pelo RH", "Não pode haver dois eventos de mensagem no mesmo processo"], a: 1,
  e: 'Um evento intermédio está “a meio” do processo: tem de ter **saída**. Um caminho termina com um **end event** (aqui, um message end, de contorno grosso).' },
{ id: 'bpmn-36', t: 'bpmn', l: 3, les: 'bpmn-errors', src: 'Slides 04c, Questão 2', d: { kind: 'bpmn', w: 470, h: 150, alt: 'Terminate num ramo paralelo', nodes: [
    { id: 's', k: 'start', tr: 'msg', x: 28, y: 70 }, { id: 't', k: 'task', x: 115, y: 70, w: 96, lb: 'Avaliar candidatura' }, { id: 'g', k: 'and', x: 210, y: 70 },
    { id: 'a', k: 'task', x: 320, y: 30, w: 110, lb: 'Publicar resultado' }, { id: 'e1', k: 'end', tr: 'terminate', x: 420, y: 30 },
    { id: 'b', k: 'task', x: 320, y: 112, w: 110, tt: 'send', lb: 'Enviar email ao candidato' }, { id: 'e2', k: 'end', tr: 'msg', x: 420, y: 112 }],
    edges: [{ f: 's', t: 't' }, { f: 't', t: 'g' }, { f: 'g', t: 'a' }, { f: 'g', t: 'b' }, { f: 'a', t: 'e1' }, { f: 'b', t: 'e2' }] },
  q: 'Qual é o risco deste desenho?',
  o: ["Nenhum risco: os dois ramos terminam de forma independente", "O Terminate pode matar o ramo do email antes de este ser enviado", "O message start event é inválido num processo privado", "O AND devia ser um XOR, porque só um ramo deve correr"], a: 1,
  e: 'O **Terminate end event** termina **toda a instância**, incluindo os ramos paralelos ainda ativos. Num processo **concorrente** isto é má prática: usa um None end (ou sincroniza com um AND-join antes de terminar).' },
{ id: 'bpmn-37', t: 'bpmn', l: 3, les: 'bpmn-errors', src: 'Slides 04c, Questão 3', d: { kind: 'bpmn', w: 430, h: 150, alt: 'XOR sem condições', nodes: [
    { id: 's', k: 'start', x: 28, y: 70 }, { id: 't', k: 'task', x: 115, y: 70, w: 96, lb: 'Analisar estudo' }, { id: 'g', k: 'xor', x: 210, y: 70 },
    { id: 'a', k: 'task', x: 310, y: 30, w: 96, lb: 'Configurar portal' }, { id: 'e1', k: 'end', x: 405, y: 30 }, { id: 'b', k: 'task', x: 310, y: 112, w: 96, lb: 'Arquivar estudo' }, { id: 'e2', k: 'end', x: 405, y: 112 }],
    edges: [{ f: 's', t: 't' }, { f: 't', t: 'g' }, { f: 'g', t: 'a' }, { f: 'g', t: 'b' }, { f: 'a', t: 'e1' }, { f: 'b', t: 'e2' }] },
  q: 'Que tipo de problema tem este diagrama?',
  o: ["Deadlock, porque os dois ramos não voltam a juntar-se", "Incerteza lógica: as saídas do XOR não têm condições", "Sequence flow a atravessar pools diferentes", "Falta um AND-join antes dos dois end events"], a: 1,
  e: 'Um **XOR-split** tem de dizer **quando** segue cada caminho: rotula as saídas com condições (ou marca um default). Sem isso há **incerteza lógica**. Os dois ends são aceitáveis se representarem resultados diferentes.' },
{ id: 'bpmn-38', t: 'bpmn', l: 3, les: 'bpmn-errors', d: { kind: 'bpmn', w: 420, h: 90, alt: 'Gateway com uma só saída', nodes: [
    { id: 's', k: 'start', x: 28, y: 45 }, { id: 't', k: 'task', x: 115, y: 45, w: 96, lb: 'Rever pedido' }, { id: 'g', k: 'xor', x: 210, y: 45 }, { id: 'a', k: 'task', x: 305, y: 45, w: 96, lb: 'Aprovar' }, { id: 'e', k: 'end', x: 395, y: 45 }],
    edges: [{ f: 's', t: 't' }, { f: 't', t: 'g' }, { f: 'g', t: 'a' }, { f: 'a', t: 'e' }] },
  q: 'O que está mal com este gateway?',
  o: ["Devia ser um AND, porque não há condição", "Uma decisão precisa de pelo menos duas saídas", "Os gateways não podem vir depois de tarefas", "Nada: é uma forma válida de marcar uma decisão"], a: 1,
  e: 'Nos anti-patterns: “the decision must contain **at least two output flows**”. Este gateway é inútil, ou falta o outro caminho (ex.: rejeitar).' },
{ id: 'bpmn-39', t: 'bpmn', l: 3, les: 'bpmn-gw', d: { kind: 'bpmn', w: 470, h: 180, alt: 'AND com três ramos', nodes: [
    { id: 's', k: 'start', x: 28, y: 90 }, { id: 'g1', k: 'and', x: 95, y: 90 }, { id: 'a', k: 'task', x: 195, y: 30, w: 100, h: 44, lb: 'Verificar crédito' }, { id: 'b', k: 'task', x: 195, y: 90, w: 100, h: 44, lb: 'Verificar stock' }, { id: 'c', k: 'task', x: 195, y: 150, w: 100, h: 44, lb: 'Calcular portes' },
    { id: 'g2', k: 'and', x: 300, y: 90 }, { id: 't', k: 'task', x: 380, y: 90, w: 86, lb: 'Confirmar encomenda' }, { id: 'e', k: 'end', x: 448, y: 90 }],
    edges: [{ f: 's', t: 'g1' }, { f: 'g1', t: 'a' }, { f: 'g1', t: 'b' }, { f: 'g1', t: 'c' }, { f: 'a', t: 'g2' }, { f: 'b', t: 'g2' }, { f: 'c', t: 'g2' }, { f: 'g2', t: 't' }, { f: 't', t: 'e' }] },
  q: 'Quantos tokens existem logo depois do primeiro gateway, e quantas vezes corre “Confirmar encomenda”?',
  o: ['1 token; 3 vezes', '3 tokens; 1 vez', '3 tokens; 3 vezes', '1 token; 1 vez'], a: 1,
  e: 'O **AND-split** cria **3 tokens** (um por ramo). O **AND-join** espera pelos três e junta-os num só: “Confirmar encomenda” corre **uma vez**.' },
{ id: 'bpmn-40', t: 'bpmn', l: 3, les: 'bpmn-gw', d: { kind: 'bpmn', w: 580, h: 160, alt: 'Event-based gateway com mensagem e timer', nodes: [

  e: '“Serviço… **realizado pela** aplicação…” = **realization** da aplicação para o serviço (tracejado com triângulo vazio). Estão corretas.' },
/* ===== Teste modelo · Q5 (BPMN interno) ===== */
{ id: 'ex-q5-a', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-gw', src: SRC + ', Q5', d: Q5,
  q: 'Viewpoint “tratamento interno do pedido”. Que falha é o gateway **X06**, a seguir à verificação?',
  o: FALHA4, a: 3, fixed: true,
  e: 'As saídas têm **condições alternativas** (elegível ou não): é uma decisão **exclusiva (XOR)**, não um AND. Conceito de tipo errado: **D**.' },
{ id: 'ex-q5-b', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-gw', src: SRC + ', Q5', d: Q5,
  q: 'E o gateway **X12**, antes de “Notificar disponibilidade”?',
  o: FALHA4, a: 3, fixed: true,
  e: '“**Quando** a preparação **e** o termo estão concluídos”: é uma **sincronização**, por isso tem de ser um **AND-join**. Um XOR-merge deixaria passar cada ramo sozinho. Falha **D**.' },
{ id: 'ex-q5-c', t: 'exam', l: 3, ctx: 'exam-uod', les: 'exam-format', src: SRC + ', Q5', d: Q5,
  q: 'Depois de X10 (AND-split) só há um ramo. Que omissão F falta?',
  o: ["“Elaborar termo” na lane de atendimento", "Uma pool colapsada “Estudante” ligada por message flows à notificação", "Um timer de 48 horas logo a seguir a “Notificar disponibilidade”", "A tarefa “Registar empréstimo” na lane técnica, antes do join"], a: 0,
  e: 'Solução oficial: **F X90** “Elaborar termo de responsabilidade” na lane da equipa de atendimento, ligada à bifurcação e à sincronização paralelas (X10 e X12).' },
{ id: 'ex-q5-d', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-errors', src: SRC + ', Q5', d: Q5,
  q: 'Na solução oficial, o caminho da recusa (X07) não foi contado como falha. Como aparece no diagrama corrigido?',
  o: ["Como message end event “Pedido recusado” (informa o estudante e termina)", "Ligado ao AND-split X10 para retomar o fluxo da reserva", "Como uma pool própria do estudante, colapsada", "Como um timer intermédio à espera do estudante"], a: 0,
  e: 'No corrigido, X07 é um **message end event** “Pedido recusado”: termina **e** comunica numa só forma. Como não está entre as 4 falhas, não gastes uma linha da tabela com isto: as 4 oficiais são X06 (D), X10 (D), X12 (D) e X90 (F).' },
/* ===== Teste modelo · Q6 (BPMN colaboração) ===== */
{ id: 'ex-q6-a', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-gw', src: SRC + ', Q6', d: Q6,
  q: 'Viewpoint “interação e resposta à notificação”. Que falha é o gateway **X08**?',
  o: FALHA4, a: 3, fixed: true,
  e: 'A escolha depende do **primeiro evento** (termo assinado, desistência ou fim do prazo), não de dados: tem de ser um **event-based gateway**. Conceito de tipo errado: **D** (é exatamente o Q1.4 do teste).' },
{ id: 'ex-q6-b', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-events', src: SRC + ', Q6', d: Q6,
  q: 'O que está errado em **X17**?',
  o: ['O prazo: o UoD fala de 48 horas e o diagrama diz 24 horas', 'Devia ser um message catch, porque o estudante responde', 'Devia ser um timer start event', 'Nada: o timer está correto'], a: 0,
  e: 'Na solução oficial o timer aparece já corrigido para **“48 horas desde a notificação”**, mas **não** foi contado entre as 4 falhas (X08 D, X15 D, X90 E, X92–X94 F). Corrige-o no desenho; na tabela, dá prioridade às falhas estruturais.' },
{ id: 'ex-q6-c', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-collab', src: SRC + ', Q6', d: Q6,
  q: 'X05 prepara a notificação, mas o estudante nunca a recebe no diagrama. Que falha é?',
  o: ["E: falta o message flow para o Estudante", "C: X10 devia ser um sequence flow vindo do estudante", "B: a pool Estudante está a mais neste viewpoint", "A: o sequence flow entre X05 e X08 está a mais"], a: 0,
  e: 'A notificação é uma **mensagem entre participantes**: falta um **message flow** (relação em falta, **E**) de X05 para a pool Estudante. X10 está certo como message flow, porque vem de outra pool.' },
{ id: 'ex-q6-d', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-gw', src: SRC + ', Q6', d: Q6,
  q: 'Que situação do UoD falta representar (omissão F)?',
  o: ["O ramo da desistência do estudante", "A devolução do equipamento pelo estudante no fim do empréstimo", "O cancelamento do pedido inicial antes de haver notificação", "A preparação do equipamento pela equipa técnica em paralelo"], a: 0,
  e: 'Solução oficial (F, X92/X93/X94): **message catch “Desistência”** (X92) após o event-based gateway → tarefa **“Cancelar reserva por desistência”** (X93) → fluxo para o fim que informa o estudante. A própria solução nota que é discutível se este ramo devia ter o seu próprio end event, ou um XOR-merge antes de X21. Devolução e cancelamento do pedido inicial estão fora do âmbito.' },
{ id: 'ex-q6-e', t: 'exam', l: 4, ctx: 'exam-uod', les: 'bpmn-events', src: SRC + ', Q6', d: Q6, a: [0, 2],
  q: 'Seleciona TODOS os outros problemas defensáveis neste diagrama.',
  o: ['X15 é um end event de escalation: “Reserva mantida” é um fim normal (none end)', 'X11 devia ser um timer', 'X21 devia informar o estudante do cancelamento (message end + message flow)', 'A pool Estudante devia estar expandida com o processo interno do estudante'],
  e: 'Solução oficial: **X15 (D)**, porque um end de escalation comunica algo que requer tratamento superior, o que o UoD não prevê; manter a reserva é um fim normal. No corrigido, o cancelamento termina em **X21 como message end** com message flow **X22 “Informar de pedido cancelado”** para o Estudante, que fica **colapsado**.' },

{ id: 'ex-q2-4', t: 'exam', l: 3, ctx: 'exam-uod', les: 'exam-uod', src: SRC + ', Q2.4',
  q: 'Completa: “A motivação de um estudante para pedir um empréstimo é…”',
  o: ['… nenhuma das opções anteriores se pode aplicar', '… fora do âmbito definido para esta versão do problema', '… um requisito já validado por estar explicitamente mencionado no UoD', '… na linguagem BPMN, por descrever comportamento no tempo'], a: 0,
  e: 'Solução oficial: **12, nenhuma**. O UoD **nem menciona** a motivação do estudante: não é “fora do âmbito” (que se aplica ao que o UoD exclui explicitamente) nem requisito. Quando o UoD é omisso, a resposta é “nenhuma”.' },
{ id: 'ex-q5-e', t: 'exam', l: 4, ctx: 'exam-uod', les: 'bpmn-gw', src: SRC + ', Q5', d: Q5,
  q: 'A solução oficial lista X10 como falha **D** (“preparar o equipamento e elaborar o termo devem decorrer em paralelo; o exclusivo permitiria escolher apenas um”). Que tipo de gateway tem de estar em X10?',
  o: ['Parallel (AND-split)', 'Exclusive (XOR-split)', 'Event-based', 'Inclusive (OR-split)'], a: 0,
  e: 'X10 tem de ser **AND-split**. No enunciado em PDF o X10 já aparece como paralelo, por isso a linha oficial parece referir-se a uma versão em que era exclusivo. Lição: em “**em simultâneo**”, verifica **as duas pontas** do paralelo (split **e** join): no teste, ambas eram alvo de falha.' },
{ id: 'ex-q6-f', t: 'exam', l: 3, ctx: 'exam-uod', les: 'bpmn-events', src: SRC + ', Q6', d: Q6,
  q: 'Que falha é **X15** (end event de escalation “Reserva mantida”)?',
  o: FALHA4, a: 3, fixed: true,
  e: 'Solução oficial: **D**. Manter a reserva é uma **conclusão normal** (none end); um end de **escalation** comunica uma situação que requer tratamento superior, o que o UoD não prevê. Olha sempre para o **ícone** dentro dos eventos.' },
/* ===== Caso de treino (Piscina) · ArchiMate responsabilidades ===== */
{ id: 'cs-p1-a', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'exam-format', d: P1,
  q: 'Viewpoint: responsabilidades (coordenador desportivo quer saber quem faz o quê). Que falha é **R02** (Secretaria → Reservar vaga, desenhada como triggering)?',
  o: FALHA4, a: 2, fixed: true,
  e: 'É de facto a secretaria que reserva a vaga, por isso a ligação faz sentido, mas o **tipo** está errado: “quem executa” é **assignment**, não triggering. Falha **C**.' },
{ id: 'cs-p1-b', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'exam-format', d: P1,
  q: 'Que falha é **R03** (Treinadores → Reservar vaga)?',
  o: FALHA4, a: 0, fixed: true,
  e: 'Reservar a vaga é da **secretaria**. Os treinadores avaliam o nível. A relação está **a mais**: **A**.' },
{ id: 'cs-p1-c', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'arch-common', d: P1,
  q: 'Que falha é **C06: Avaliar nível**, desenhado como Business Object?',
  o: FALHA4, a: 3, fixed: true,
  e: '“Avaliar nível” é **comportamento** (verbo): é um **Process**, não um objeto passivo. Conceito de tipo errado: **D**.' },
{ id: 'cs-p1-d', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'exam-format', d: P1,
  q: 'C05 “Enviar pedido de pagamento” está no diagrama, mas sem ligação. Que falha é e como se corrige?',
  o: ['E: acrescentar R90, assignment da Secretaria a C05', 'B: retirar C05, que está a mais', 'F: acrescentar um novo actor “Tesouraria” para C05', 'C: trocar C05 por um Service'], a: 0,
  e: 'O UoD diz que é a **secretaria** que envia o pedido de pagamento. O conceito existe; falta a **relação**: **E**.' },
/* ===== Caso de treino · ArchiMate suporte aplicacional ===== */
{ id: 'cs-p2-a', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'arch-rel', d: P2,
  q: 'Viewpoint: suporte aplicacional e informação. Que falha é **R11** (serving do Serviço de Pagamentos para o Gateway de Pagamentos)?',
  o: FALHA4, a: 2, fixed: true,
  e: '“Serviço… **realizado pela** aplicação Gateway”: devia ser **realization** de C13 para C11. Relação de tipo errado: **C**.' },
{ id: 'cs-p2-b', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'arch-app', d: P2,
  q: 'Que falha é **C15: Registo de ocupação**, desenhado como Application Component?',
  o: FALHA4, a: 3, fixed: true,
  e: 'O Registo é **informação mantida** pela aplicação: **Data Object**. Uma aplicação faz coisas; um registo é passivo. Falha **D**.' },
{ id: 'cs-p2-c', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'exam-viewpoints', d: P2,
  q: 'Que falha é **C16: Treinadores** com R14?',
  o: FALHA4, a: 1, fixed: true,
  e: 'Equipas humanas não respondem à preocupação de **suporte aplicacional**: conceito **a mais** (com a sua relação), uma só falha **B**.' },
{ id: 'cs-p2-d', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'exam-format', d: P2,
  q: 'A App ADC também usa o Serviço de Pagamentos. O que falta?',
  o: ['E: um serving de C11 para C14', 'F: uma nova aplicação de pagamentos', 'A: retirar R12', 'C: trocar R10 por serving'], a: 0,
  e: '“A app **usa** o Serviço de Pagamentos” = o serviço **serve** a app. A relação não existe: **E**.' },
/* ===== Caso de treino · BPMN interno ===== */
{ id: 'cs-p3-a', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'bpmn-events', d: P3,
  q: 'Viewpoint: tratamento interno da inscrição. Que falha é **Y01** (start event de timer “Inscrição recebida”)?',
  o: FALHA4, a: 3, fixed: true,
  e: 'O processo começa quando **chega** a inscrição submetida na app: é um **message start event**, não um timer. Falha **D**.' },
{ id: 'cs-p3-b', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'bpmn-gw', d: P3,
  q: 'Que falha é o gateway **Y06**?',
  o: FALHA4, a: 3, fixed: true,
  e: '“**Em simultâneo**, um treinador avalia e a secretaria reserva”: tem de ser **AND-split**. Com um XOR só um dos ramos corria, e o AND-join Y09 ficaria em **deadlock**. Falha **D**.' },
{ id: 'cs-p3-c', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'bpmn-collab', d: P3,
  q: 'Que falha é **Y11**, o message flow entre “Reservar vaga” e “Avaliar nível”?',
  o: FALHA4, a: 0, fixed: true,
  e: 'Entre lanes da mesma pool **não há message flows**. E aqui nem é preciso nenhum fluxo, porque as duas tarefas são paralelas e sincronizam no AND-join. Relação a mais: **A**. (Também se pode defender C, se o autor quisesse um sequence flow, mas o paralelo dispensa-o.)' },
{ id: 'cs-p3-d', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'exam-format', d: P3,
  q: 'O que falta entre o join Y09 e o fim?',
  o: ["F: “Enviar pedido de pagamento” na Secretaria", "E: um message flow do join Y09 para o end Y10", "F: uma lane “Atleta” com o pagamento e a desistência", "F: um timer de 72 horas na lane dos Treinadores"], a: 0,
  e: '“Quando ambos terminam, a secretaria **envia ao atleta o pedido de pagamento**”. Falta essa atividade (com os seus fluxos). O atleta e o prazo são do viewpoint de interação.' },
/* ===== Caso de treino · BPMN colaboração ===== */
{ id: 'cs-p4-a', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'bpmn-collab', d: P4,
  q: 'Viewpoint: mensagens com o atleta e desfechos. Z02 envia o pedido de pagamento. O que falta?',
  o: ['E: o message flow de Z02 para a pool Atleta', 'D: Z02 devia ser uma receive task', 'A: o sequence flow Z02→Z03 está a mais', 'B: a pool Atleta está a mais'], a: 0,
  e: 'Uma send task sem message flow não mostra **a quem** envia. Falta a relação entre pools: **E**.' },
{ id: 'cs-p4-b', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'bpmn-events', d: P4,
  q: 'O que está errado em **Z07**?',
  o: ["O prazo: o UoD dá 72 horas", "Devia ser um signal event", "Devia ser non-interrupting", "Nada: está correto"], a: 0,
  e: 'É a armadilha do teste modelo: o tipo (timer) está certo, mas o **valor** não corresponde ao UoD.' },
{ id: 'cs-p4-c', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'exam-viewpoints', d: P4,
  q: 'Que falha é **Z10: Avaliar nível do atleta**, depois do pagamento?',
  o: FALHA4, a: 1, fixed: true,
  e: 'A avaliação de nível acontece **antes** (no tratamento interno) e não é uma interação com o atleta. Neste viewpoint é um **conceito a mais**: **B**.' },
{ id: 'cs-p4-d', t: 'exam', l: 3, ctx: 'case-adc', reservada: 'exame', les: 'bpmn-gw', d: P4,
  q: 'Que desfecho do UoD falta no event-based gateway Z03?',
  o: ["A desistência do atleta", "A lesão do atleta durante as aulas de natação", "A renovação da inscrição para a época seguinte", "Um segundo pagamento parcial depois de 72 horas"], a: 0,
  e: 'Três desfechos: **pagamento**, **desistência**, **falta de pagamento em 72 h**. Falta o ramo da desistência (que também leva a anular e informar). Lesões e renovações estão fora do âmbito.' },
{ id: 'cs-p4-e', t: 'exam', l: 2, ctx: 'case-adc', reservada: 'exame', les: 'bpmn-gw', d: P4,
  q: 'Z03 é um event-based gateway. Está correto aqui?',
  o: ["Sim: segue o primeiro evento que ocorrer", "Não: devia ser um AND, porque os eventos são simultâneos", "Não: devia ser um XOR com a condição “pagou?”", "Não: devia ser um inclusive gateway com três condições"], a: 0,
  e: 'É o mesmo raciocínio do Q1.4 do teste: respostas de um participante externo ou um prazo → **event-based**. Um XOR com “pagou?” obrigaria o processo a avaliar dados que ainda não existem.' },

/* ===== Viewpoint e âmbito (estilo Q1/Q2) ===== */
{ id: 'ex-vp-1', t: 'exam', l: 2, ctx: 'case-adc', reservada: 'exame', les: 'exam-viewpoints',
  q: 'O coordenador quer perceber que aplicações e informação suportam a consulta de vagas e o pagamento. Que diagrama faz sentido?',
  o: ["ArchiMate: services, aplicações e data objects", "BPMN collaboration com a pool do Atleta e message flows", "ArchiMate: business actors com assignment a processes", "BPMN private com lanes Secretaria e Treinadores"], a: 0,
  e: 'É um viewpoint de **suporte aplicacional e informação**: serviços, aplicações (realization), quem os usa (serving) e dados (access).' },
{ id: 'ex-vp-2', t: 'exam', l: 2, ctx: 'case-adc', reservada: 'exame', les: 'exam-uod',
  q: '“Notificações por SMS” no caso da Piscina são…',
  o: ["ideias para o futuro, a não modelar", "um requisito confirmado, a modelar em BPMN já", "um message flow obrigatório para o atleta", "um Data Object do Registo de ocupação"], a: 0,
  e: 'O UoD diz que são **ideias para o futuro**. Pô-las no diagrama seria um **excesso** (A ou B).' },
{ id: 'ex-vp-3', t: 'exam', l: 2, ctx: 'case-adc', reservada: 'exame', les: 'exam-uod',
  q: 'Num diagrama BPMN do caso Piscina aparece a tarefa “Registar falta à aula”. Como se classifica?',
  o: ["B: conceito a mais (fora do âmbito)", "D: devia ser um evento intermédio em vez de tarefa", "F: falta todo o ramo das faltas às aulas", "Está correto, porque as faltas acontecem nas aulas"], a: 0,
  e: 'Faltas, renovações e lesões estão **fora do âmbito**: qualquer elemento sobre elas é **excesso** (B, porque é um conceito).' },
{ id: 'ex-vp-4', t: 'exam', l: 2, les: 'exam-format',
  q: 'No teste, como se responde a uma OMISSÃO num diagrama ArchiMate?',
  o: ["Desenha-se o elemento com ID C90–C99 ou R90–R99", "Circunda-se o elemento existente mais próximo da omissão", "Escreve-se só a letra E ou F, sem desenhar nada", "Riscam-se as relações que deviam estar noutro sítio"], a: 0,
  e: 'Excessos e erros: **circundar** o ID. Omissões: **acrescentar** o elemento com C90–C99 / R90–R99 (em BPMN X90–X99) e explicar sucintamente.' },
{ id: 'ex-vp-5', t: 'exam', l: 2, les: 'exam-format',
  q: 'Um conceito errado arrasta consigo duas relações que só existem por causa dele. Quantas falhas conta?',
  o: ["Uma só falha (B ou D)", "Três falhas: o conceito e as duas relações arrastadas", "Duas falhas: o conceito e uma das relações", "Nenhuma, se as relações estiverem bem desenhadas"], a: 0,
  e: 'As definições B e D dizem “**por arrasto**… mas totalizando tudo isso **apenas uma falha**”. Não gastes linhas da tabela com relações arrastadas.' },
{ id: 'ex-vp-6', t: 'exam', l: 4, les: 'exam-format',
  q: 'No Q1, uma resposta certa vale 1 valor e uma errada −0,25 (4 opções). Se só consegues eliminar UMA opção, compensa arriscar?',
  o: ["Sim: o valor esperado é ≈ +0,17", "Não: o valor esperado passa a ser negativo", "Só compensa se conseguires eliminar duas opções", "É indiferente: o valor esperado é exatamente zero"], a: 0,
  e: 'Com 3 opções: (1/3) × 1 − (2/3) × 0,25 = 0,333 − 0,167 ≈ **+0,17**. Mesmo sem eliminar nenhuma: 0,25 − 0,75 × 0,25 ≈ **+0,06**. Responder tem valor esperado positivo; o risco só é variância.' },

/* ===== Ligações ArchiMate (que relação usar) ===== */
{ id: 'lk-a01', t: 'arch', l: 2, les: 'arch-rel', q: 'A aplicação Gestão Académica **realiza** o Serviço de Dados Académicos. Que relação, de onde para onde?', o: ['Realization: Gestão Académica → Serviço', 'Serving: Gestão Académica → Serviço', 'Realization: Serviço → Gestão Académica', 'Composition: Serviço → Gestão Académica'], a: 0, e: 'O concreto (aplicação) **realiza** o abstrato (serviço): tracejado com triângulo vazio a apontar para o serviço.' },
{ id: 'lk-a02', t: 'arch', l: 2, les: 'arch-rel', q: 'A Equipa de atendimento é composta por três funcionários (todos Business Actors). Que relação?', o: ["Composition (ou aggregation)", "Assignment da Equipa para cada funcionário", "Specialization do funcionário para a Equipa", "Serving da Equipa para cada funcionário"], a: 0, e: 'Todo-parte entre actors: **composition** (ou aggregation, se a pessoa puder pertencer a vários grupos). Assignment é estrutura → comportamento, ou actor → role.' },
{ id: 'lk-a03', t: 'arch', l: 2, les: 'arch-business', q: 'O funcionário Rui desempenha o papel de Técnico de Equipamento. Que relação?', o: ["Assignment: Rui → Técnico", "Specialization: Técnico → Rui", "Realization: Rui → Técnico", "Aggregation: Técnico → Rui"], a: 0, e: '**Actor → Role** é assignment: o actor assume o papel.' },
{ id: 'lk-a04', t: 'arch', l: 2, les: 'arch-rel', q: 'O processo Reservar equipamento escreve no Registo de reservas (Data Object). Que relação?', o: ['Access (write), do processo para o registo', 'Flow, do processo para o registo', 'Assignment, do registo para o processo', 'Serving, do registo para o processo'], a: 0, e: 'Comportamento ↔ objeto passivo = **access**; na escrita, a ponta aponta para o objeto.' },
{ id: 'lk-a05', t: 'arch', l: 2, les: 'arch-common', q: 'O evento “Pedido recebido” dá início ao processo Verificar elegibilidade. Que relação?', o: ['Triggering, do evento para o processo', 'Flow, do evento para o processo', 'Access, do processo para o evento', 'Serving, do evento para o processo'], a: 0, e: 'Event → behaviour em ordem causal = **triggering** (linha contínua com seta cheia).' },
{ id: 'lk-a06', t: 'arch', l: 2, les: 'arch-app', q: 'A interface web do Portal expõe o Serviço de Pedidos. Que relação entre a Application Interface e o Service?', o: ['Assignment, da interface para o serviço', 'Realization, do serviço para a interface', 'Composition, do serviço para a interface', 'Triggering, da interface para o serviço'], a: 0, e: 'Nos slides: “o Payment Interface é **assigned** ao Payment Service”. A interface é estrutura ativa que disponibiliza o serviço.' },

<script>
/* ===== Estudo IST — motor =====
   Igual para todas as cadeiras: menu de cadeiras, níveis, modos padrão
   (Aprender, Revisão, Exame simulado, Biblioteca) e gravação do progresso.
   O conteúdo e as secções extra vêm de cada cadeira (src/cadeiras/<id>). */
(() => {
const REG = window.ESTUDO;
const DEFAULT_LEVELS = [
  { n: 1, t: 'Fundamentos', d: 'Definições e símbolos' },
  { n: 2, t: 'Aplicação', d: 'Distinguir e escolher' },
  { n: 3, t: 'Análise', d: 'Cenários e diagramas' },
  { n: 4, t: 'Boss', d: 'Armadilhas de exame' },
];
const XP = { 1: 10, 2: 15, 3: 20, 4: 30 };
const UNLOCK = 0.6;
const EXAM_N = 20, EXAM_MIN = 30;   // perguntas e minutos do exame simulado
const EXAM_CLEAR = 2;               // acertos seguidos para tirar um erro de exame da revisão
const LS_KEY = 'estudo-ist-v2', LS_PACKS = 'estudo-ist-packs-v2';
const LEGACY = { state: 'ams-treino-v1', packs: 'ams-treino-packs-v1', cadeira: 'ams' };

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// light markup for text fields: **bold**, `code`, line breaks
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code class="mono">$1</code>').replace(/\n/g, '<br>');
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------- state ----------
   G guarda tudo; S aponta para a fatia da cadeira aberta (G.c[id]). */
const blank = (temas = {}) => ({ stats: {}, notes: {}, xp: 0, settings: { topics: Object.keys(temas), known: Object.keys(temas), unlockAll: false, testDate: '' }, rounds: 0, sessions: [] });
let G = ls.get(LS_KEY);
if (!G || G.v !== 2) {
  G = { v: 2, cur: null, c: {}, updatedAt: 0 };
  const old = ls.get(LEGACY.state);   // progresso da versão só-AMS
  if (old && old.stats) { const { bestSprint, v, updatedAt, ...rest } = old; G.c[LEGACY.cadeira] = rest; G.cur = LEGACY.cadeira; G.updatedAt = updatedAt || Date.now(); }
}
let packs = ls.get(LS_PACKS);
if (!packs) { packs = (ls.get(LEGACY.packs) || []).map(p => Object.assign({ cadeira: LEGACY.cadeira }, p)); ls.set(LS_PACKS, packs); }

let C = null, S = null, TOPICS = {}, LEVELS = DEFAULT_LEVELS;
let BANK = [], BYID = {}, LESSONS = [], LBYID = {};
const renderD = d => !d ? '' : typeof d === 'string' ? d : (C && C.render ? C.render(d) : '');

function openCadeira(id) {
  C = REG.cadeiras[id]; if (!C) return false;
  TOPICS = C.temas; LEVELS = C.niveis || DEFAULT_LEVELS;
  if (!G.c[id]) G.c[id] = blank(TOPICS);
  S = G.c[id];
  const b = blank(TOPICS); for (const k in b) if (S[k] === undefined) S[k] = b[k];
  S.settings = Object.assign(b.settings, S.settings || {});
  // temas novos ficam ligados para quem já tinha progresso
  const known = S.settings.known; Object.keys(TOPICS).forEach(k => { if (!known.includes(k)) { known.push(k); if (!S.settings.topics.includes(k)) S.settings.topics.push(k); } });
  S.settings.topics = S.settings.topics.filter(k => TOPICS[k]); if (!S.settings.topics.length) S.settings.topics = Object.keys(TOPICS);
  G.cur = id; rebuildBank(); return true;
}

function rebuildBank() {
  const seen = new Set(); BANK = []; BYID = {}; LESSONS = []; LBYID = {};
  const addL = (l, trusted) => { if (!l || !l.id || LBYID[l.id]) return; const x = Object.assign({}, l, { trusted }); LESSONS.push(x); LBYID[l.id] = x; };
  C.licoes.forEach(l => addL(l, true));
  const addQ = (q, origin) => { const v = validateQ(q); if (!v.ok) return; let id = q.id; while (seen.has(id)) id = id + '+'; seen.add(id); const x = Object.assign({}, q, { id, origin }); BANK.push(x); BYID[id] = x; };
  C.perguntas.forEach(q => addQ(q, 'base'));
  packs.filter(p => p.cadeira === C.id).forEach(p => { (p.lessons || []).forEach(l => addL(l, false)); (p.questions || []).forEach(q => addQ(q, p.name || 'pacote')); });
}
function validateQ(q) {
  if (!q || typeof q !== 'object') return { ok: false, why: 'não é um objeto' };
  if (!q.id || typeof q.id !== 'string') return { ok: false, why: 'falta "id" (texto)' };
  if (!TOPICS[q.t]) return { ok: false, why: `"t" tem de ser um de: ${Object.keys(TOPICS).join(', ')}` };
  if (![1, 2, 3, 4].includes(q.l)) return { ok: false, why: '"l" (nível) tem de ser 1, 2, 3 ou 4' };
  if (!q.q || typeof q.q !== 'string') return { ok: false, why: 'falta "q" (enunciado)' };
  if (!Array.isArray(q.o) || q.o.length < 2 || q.o.length > 6 || q.o.some(o => typeof o !== 'string')) return { ok: false, why: '"o" tem de ser uma lista de 2 a 6 opções (texto)' };
  const ans = Array.isArray(q.a) ? q.a : [q.a];
  if (!ans.length || ans.some(i => !Number.isInteger(i) || i < 0 || i >= q.o.length)) return { ok: false, why: '"a" tem de ser o índice (0, 1, …) da opção certa, ou uma lista de índices' };
  if (!q.e || typeof q.e !== 'string') return { ok: false, why: 'falta "e" (explicação)' };
  return { ok: true };
}

function save() { G.updatedAt = Date.now(); ls.set(LS_KEY, G); }

/* ---------- stats helpers ----------
   Por pergunta: c acertos, w erros de treino, box caixa da revisão de treino,
   ew erros em exame, eb acertos seguidos desde o último erro de exame, last. */
const ZERO = { c: 0, w: 0, box: 0, ew: 0, eb: 0, last: 0 };
const st = id => { const s = S.stats[id] || (S.stats[id] = { ...ZERO }); for (const k in ZERO) if (s[k] === undefined) s[k] = 0; return s; };
const peek = id => Object.assign({}, ZERO, S.stats[id]);
const inTopics = q => S.settings.topics.includes(q.t);
const isReserved = q => q.reservada === 'exame';
const fresh = q => { const s = peek(q.id); return !s.c && !s.w && !s.ew; };
const trainPool = () => BANK.filter(q => inTopics(q) && !isReserved(q));
function mastery(level, topics = S.settings.topics) {
  const qs = BANK.filter(q => q.l === level && topics.includes(q.t) && !isReserved(q)); if (!qs.length) return { pct: 0, done: 0, total: 0 };
  const done = qs.filter(q => peek(q.id).c > 0).length; return { pct: done / qs.length, done, total: qs.length };
}
function unlocked(level) { if (level === 1 || S.settings.unlockAll) return true; return mastery(level - 1).pct >= UNLOCK; }
function topLevel() { let t = 1; for (const L of LEVELS) if (unlocked(L.n)) t = L.n; return t; }
const reviewPool = () => trainPool().filter(q => peek(q.id).w > 0 && peek(q.id).box < 3).sort((a, b) => peek(a.id).box - peek(b.id).box || peek(a.id).last - peek(b.id).last);
const examReviewPool = () => BANK.filter(q => inTopics(q) && peek(q.id).ew > 0 && peek(q.id).eb < EXAM_CLEAR).sort((a, b) => peek(a.id).eb - peek(b.id).eb || peek(a.id).last - peek(b.id).last);
const freshReserved = () => BANK.filter(q => inTopics(q) && isReserved(q) && fresh(q));
function pick(pool, n) { // unseen first, then weakest, randomized within bands
  const bands = [[], [], []]; pool.forEach(q => { const s = peek(q.id); if (!s.c && !s.w && !s.ew) bands[0].push(q); else if (s.box < 2) bands[1].push(q); else bands[2].push(q); });
  return bands.flatMap(b => shuffle(b)).slice(0, n);
}
function cadeiraProgress(c) {
  const st_ = (G.c[c.id] && G.c[c.id].stats) || {}; const qs = c.perguntas.filter(q => !isReserved(q));
  const done = qs.filter(q => st_[q.id] && st_[q.id].c > 0).length; return { done, total: qs.length, xp: (G.c[c.id] && G.c[c.id].xp) || 0 };
}

/* ---------- view router ---------- */
let view = { name: 'home' };
let ses = null; // active session
function go(name, extra = {}) { view = Object.assign({ name }, extra); renderView(); window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' }); }
function renderView() {
  const v = C ? view.name : 'cadeiras';

/* ---------- HOME (da cadeira) ---------- */
function daysLeft() { if (!S.settings.testDate) return null; const d = new Date(S.settings.testDate + 'T09:00:00'); const n = Math.ceil((d - new Date()) / 864e5); return isNaN(n) ? null : n; }

        <span class="spacer"></span>
        ${view.confirmReset ? `<span class="muted" style="font-size:13px">Apagar o progresso de ${esc(C.sigla)}?</span><button class="btn small" data-act="resetYes" style="color:var(--bad)">Sim, apagar</button><button class="btn small" data-act="resetNo">Cancelar</button>` : `<button class="btn ghost small" data-act="reset">Recomeçar do zero</button>`}
      </div>

}
function glyph(k) {
  const p = { book: '<path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4z M24 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/>', loop: '<path d="M6 13a8 8 0 0 1 14-5l2 2 M22 15a8 8 0 0 1-14 5l-2-2 M22 4v6h-6 M6 24v-6h6"/>', lens: '<circle cx="12" cy="12" r="7"/><path d="M17 17l6 6 M9 12h6 M12 9v6"/>', bolt: '<path d="M15 3L6 16h7l-1 9 9-13h-7z"/>', clock: '<circle cx="14" cy="14" r="10"/><path d="M14 8v6l4 3"/>', list: '<path d="M9 7h14 M9 14h14 M9 21h14"/><circle cx="5" cy="7" r="1.3"/><circle cx="5" cy="14" r="1.3"/><circle cx="5" cy="21" r="1.3"/>', plus: '<path d="M14 6v16 M6 14h16"/>', pen: '<path d="M6 22l2-6 11-11 4 4-11 11z M16 7l4 4"/>', star: '<path d="M14 3l3.2 7 7.3.6-5.6 4.8 1.8 7.3L14 18.8 7.3 22.7l1.8-7.3L3.5 10.6l7.3-.6z"/>', flag: '<path d="M6 25V4 M6 5h14l-3 5 3 5H6"/>' }[k] || '';
  return `<svg class="glyph" viewBox="0 0 28 28" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}

/* ---------- REVISÃO: dois separadores ---------- */

  <div class="modes">
    <button class="mode" data-act="startReview" data-k="review" ${a ? '' : 'disabled'}><h3>${glyph('loop')}Erros de treino</h3><p>Perguntas que falhaste nos níveis, em Aprender e nas secções da cadeira. Saem quando as acertares três vezes seguidas.</p><span class="meta">${a ? `${a} por rever` : 'nada por rever'}</span></button>

/* ---------- sessions ---------- */
function makeItem(q) { const n = q.o.length; const order = q.fixed ? [...Array(n).keys()] : shuffle([...Array(n).keys()]); return { kind: 'q', id: q.id, order }; }
function buildExam() {
  // 1) perguntas reservadas ainda inéditas; 2) completar com a mistura de níveis do treino; 3) reservadas já vistas
  let qs = shuffle(freshReserved()).slice(0, EXAM_N);
  const used = new Set(qs.map(q => q.id));
  if (qs.length < EXAM_N) {
    const tp = trainPool().filter(q => !used.has(q.id)); const by = (l, n) => pick(tp.filter(q => q.l === l), n);
    const mix = shuffle([...by(2, 7), ...by(3, 8), ...by(4, 5)]).slice(0, EXAM_N - qs.length);
    mix.forEach(q => used.add(q.id)); qs = qs.concat(mix);
  }
  if (qs.length < EXAM_N) qs = qs.concat(shuffle(BANK.filter(q => inTopics(q) && isReserved(q) && !used.has(q.id))).slice(0, EXAM_N - qs.length));
  return shuffle(qs);
}
function start(mode, opts = {}) {
  let items = [], title = '', timeLimit = 0;
  const pool = trainPool();
  if (!BANK.some(inTopics)) { toast('Escolhe pelo menos um tema.'); return; }
  if (mode === 'level') { const L = opts.level; items = pick(pool.filter(q => q.l === L), 10).map(makeItem); title = `Nível ${L} · ${LEVELS[L - 1].t}`; }
  if (mode === 'review') { items = reviewPool().slice(0, 12).map(makeItem); title = 'Revisão · erros de treino'; if (!items.length) { toast('Ainda não tens erros de treino para rever.'); return; } }
  if (mode === 'reviewExam') { items = examReviewPool().slice(0, 12).map(makeItem); title = 'Revisão · erros de exame'; if (!items.length) { toast('Ainda não tens erros de exame para rever.'); return; } }
  if (mode === 'extra') { const x = (C.extras || []).find(e => e.id === opts.extra); if (!x) return; items = (x.perguntas(extraApi()) || []).map(makeItem); title = x.titulo; }
  if (mode === 'exam') { items = buildExam().map(makeItem); title = 'Exame simulado'; timeLimit = EXAM_MIN * 60; }
  if (mode === 'learn') {
    const t = opts.topic; title = `Aprender · ${TOPICS[t].short}`;
    LESSONS.filter(l => l.t === t).forEach(l => { items.push({ kind: 'lesson', id: l.id });
      const qs = pool.filter(q => q.les === l.id).sort((a, b) => a.l - b.l || (peek(a.id).c - peek(b.id).c)).slice(0, 2); qs.forEach(q => items.push(makeItem(q))); });
  }
  if (mode === 'retry') { items = opts.ids.map(id => BYID[id]).filter(Boolean).map(makeItem); title = 'Repetir erros'; }
  if (!items.length) { toast('Não há perguntas para estes filtros.'); return; }
  ses = { mode, title, items, i: 0, results: [], picked: new Set(), answered: false, xp: 0, timeLimit, startedAt: Date.now(), level: opts.level, topic: opts.topic, examGrading: mode === 'reviewExam' || !!opts.examGrading, ended: false };
  if (timeLimit) startTimer();
  go(items[0].kind === 'lesson' ? 'lesson' : 'quiz');
}

let tick = null;
function startTimer() { clearInterval(tick); tick = setInterval(() => { if (!ses || ses.ended) { clearInterval(tick); return; } const left = ses.timeLimit - Math.floor((Date.now() - ses.startedAt) / 1000); const el = document.getElementById('timer'); if (el) { el.textContent = fmt(Math.max(0, left)); el.classList.toggle('hot', left <= 120); } if (left <= 0) finish(); }, 250); }
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const curItem = () => ses.items[ses.i];
const qCount = () => ses.items.filter(x => x.kind === 'q').length;
const qIndex = () => ses.items.slice(0, ses.i + 1).filter(x => x.kind === 'q').length;

/* ---------- QUIZ ---------- */
function Quiz() {
  const it = curItem(), q = BYID[it.id]; const T = TOPICS[q.t]; const multi = Array.isArray(q.a);
  const isExam = ses.mode === 'exam';
  const prog = `<div class="progress" aria-hidden="true">${ses.items.filter(x => x.kind === 'q').map((x, i) => { const r = ses.results.find(rr => rr.item === x); const cur = x === it; return `<i class="${r ? (isExam ? 'cur' : r.ok ? 'ok' : 'ko') : cur ? 'cur' : ''}"></i>`; }).join('')}</div>`;
  const opts = it.order.map((oi, pos) => { let cls = ''; const isRight = multi ? q.a.includes(oi) : q.a === oi; const chosen = ses.picked.has(oi);
    if (ses.answered && !isExam) { if (isRight) cls = 'right'; else if (chosen) cls = 'wrong'; } else if (chosen) cls = 'sel';
    return `<button class="opt ${cls}" data-act="opt" data-oi="${oi}" ${ses.answered ? 'disabled' : ''}><span class="k">${multi ? (chosen ? '✓' : pos + 1) : pos + 1}</span><span class="txt">${md(q.o[oi])}</span></button>`; }).join('');
  let fb = '';
  if (ses.answered && !isExam) fb = Feedback(q, it);
  const foot = ses.answered ? (isExam ? '' : `<div class="qfoot"><button class="btn primary" data-act="next" id="nextBtn">${ses.i >= ses.items.length - 1 ? 'Ver resultado' : 'Seguinte'} →</button><span class="kbd">Enter</span><span class="spacer"></span><button class="btn ghost small" data-act="quit">Terminar ronda</button></div>`)
    : `<div class="qfoot">${multi ? `<button class="btn primary" data-act="confirm" ${ses.picked.size ? '' : 'disabled'}>Confirmar</button>` : ''}<span class="muted" style="font-size:12.5px">Teclas <span class="kbd">1</span>–<span class="kbd">${q.o.length}</span>${multi ? ' marcam, <span class="kbd">Enter</span> confirma' : ''}</span><span class="spacer"></span>${isExam ? `<button class="btn ghost small" data-act="finish">Entregar exame</button>` : `<button class="btn ghost small" data-act="quit">Terminar ronda</button>`}</div>`;
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="badge" style="--c:${T.c}"><span class="sw"></span>${T.short}</span><span class="badge">N${q.l}</span>${prog}${(isExam) ? `<span class="timer" id="timer">${fmt(ses.timeLimit - Math.floor((Date.now() - ses.startedAt) / 1000))}</span>` : ''}<span class="mono muted">${qIndex()}/${qCount()}</span></div>
    <article class="card" id="qcard">
      <span class="eyebrow">${esc(ses.title)}</span>
      <p class="qtext" style="margin-top:6px">${md(q.q)}</p>
      ${multi ? '<div class="multi-note">Seleciona todas as corretas</div>' : ''}
      ${q.ctx && LBYID[q.ctx] ? `<details class="lesson-peek" style="margin-top:12px"><summary>Ler o caso: ${esc(LBYID[q.ctx].title)}</summary><div class="lbody lesson">${lessonBody(LBYID[q.ctx])}</div></details>` : ''}
      ${q.d ? `<div class="diagram">${renderD(q.d)}</div>` : ''}
      <div class="opts" role="group" aria-label="Opções">${opts}</div>
      ${fb}
      ${foot}
    </article>`;
}
function Feedback(q, it) {
  const r = ses.results.find(rr => rr.item === it); const ok = r && r.ok;
  const wrongNotes = [...ses.picked].filter(oi => (Array.isArray(q.a) ? !q.a.includes(oi) : q.a !== oi) && q.w && q.w[oi]).map(oi => `<p class="why-wrong"><b>Porque não “${md(q.o[oi])}”:</b> ${md(q.w[oi])}</p>`).join('');
  const L = q.les && LBYID[q.les];
  return `<div class="feedback ${ok ? 'ok' : 'ko'}" aria-live="polite">
    <div class="verdict">${ok ? pickOne(['Certo.', 'Exatamente.', 'Na mouche.', 'Isso mesmo.']) : pickOne(['Ainda não.', 'Quase, mas não.', 'Falhou. Bora perceber porquê.'])}</div>
    <p class="explain">${md(q.e)}</p>
    ${wrongNotes}
    ${L ? `<details class="lesson-peek" ${ok ? '' : 'open'}><summary>Teoria: ${esc(L.title)}</summary><div class="lbody lesson">${lessonBody(L)}</div></details>` : ''}
    <div class="note-box"><label class="eyebrow" for="note-${esc(q.id)}">A minha nota sobre esta pergunta</label><textarea id="note-${esc(q.id)}" data-act="note" data-id="${esc(q.id)}" placeholder="Escreve aqui o truque para não voltares a errar…">${esc(S.notes[q.id] || '')}</textarea></div>
    ${q.src ? `<span class="src">Fonte: ${esc(q.src)}</span>` : ''}
  </div>`;
}
const pickOne = a => a[Math.floor(Math.random() * a.length)];
function lessonBody(L) { const body = L.trusted ? L.html : md(L.html || ''); return `${body}${L.d ? `<div class="diagram">${renderD(L.d)}</div>` : ''}${L.key ? `<p class="key">${L.trusted ? L.key : md(L.key)}</p>` : ''}`; }
function afterQuizRender() { const n = document.getElementById('nextBtn'); if (n) n.focus({ preventScroll: true }); }

function choose(oi) {
  if (!ses || ses.answered) return; const q = BYID[curItem().id];
  if (Array.isArray(q.a)) { ses.picked.has(oi) ? ses.picked.delete(oi) : ses.picked.add(oi); renderView(); return; }
  ses.picked = new Set([oi]); grade();
}
function grade() {
  const it = curItem(), q = BYID[it.id]; const picked = [...ses.picked];
  const ok = Array.isArray(q.a) ? (picked.length === q.a.length && q.a.every(x => ses.picked.has(x))) : picked[0] === q.a;
  ses.answered = true; ses.results.push({ item: it, id: q.id, ok, picked });
  const s = st(q.id); s.last = Date.now();
  if (ses.mode === 'exam') { if (ok) s.c++; else { s.ew++; s.eb = 0; } }           // erro de exame: vai para a revisão de exame
  else if (ses.examGrading) { if (ok) { s.c++; s.eb++; } else { s.ew++; s.eb = 0; } }
  else if (ok) { s.c++; s.box = Math.min(5, s.box + 1); } else { s.w++; s.box = 0; }
  if (ses.mode !== 'exam') { const gain = ok ? XP[q.l] + (s.c === 1 && !s.w && !s.ew ? 5 : 0) : 0; S.xp += gain; ses.xp += gain; }
  save();
  if (ses.mode === 'exam') { next(); return; }
  renderView();
}
function next() {
  if (!ses) return;
  if (ses.i >= ses.items.length - 1) { finish(); return; }
  ses.i++; ses.picked = new Set(); ses.answered = false;
  go(curItem().kind === 'lesson' ? 'lesson' : 'quiz');
}
function finish() {
  if (!ses || ses.ended) return; ses.ended = true; clearInterval(tick);
  if (ses.mode === 'exam') { const tot = ses.items.length, ok = ses.results.filter(r => r.ok).length; ses.grade = Math.round(ok / tot * 200) / 10; const g = ses.results.filter(r => r.ok).reduce((a, r) => a + XP[BYID[r.id].l], 0); S.xp += g; ses.xp = g; }
  S.rounds++; S.sessions.push({ m: ses.mode, d: Date.now(), n: ses.results.length, ok: ses.results.filter(r => r.ok).length }); if (S.sessions.length > 400) S.sessions = S.sessions.slice(-400);
  save(); go('results');
}

/* ---------- LESSON (inside learn session) ---------- */
function LessonScreen() {
  const L = LBYID[curItem().id]; const T = TOPICS[L.t];
  const lessonsTotal = ses.items.filter(x => x.kind === 'lesson').length; const li = ses.items.slice(0, ses.i + 1).filter(x => x.kind === 'lesson').length;
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="badge" style="--c:${T.c}"><span class="sw"></span>${T.short}</span><span class="mono muted">lição ${li}/${lessonsTotal}</span></div>
    <article class="card"><span class="eyebrow">Teoria</span><h2 style="margin:6px 0 12px">${esc(L.title)}</h2><div class="lesson">${lessonBody(L)}</div>
    <div class="qfoot"><button class="btn primary" data-act="next" id="nextBtn">${ses.items[ses.i + 1] && ses.items[ses.i + 1].kind === 'q' ? 'Testar-me →' : 'Continuar →'}</button><span class="kbd">Enter</span><span class="spacer"></span><button class="btn ghost small" data-act="quit">Terminar</button></div></article>`;
}

/* ---------- RESULTS ---------- */
function Results() {
  const r = ses.results; const ok = r.filter(x => x.ok).length; const tot = r.length; const wrong = r.filter(x => !x.ok);
  const lvl = ses.level; const nowUnlocked = lvl && lvl < 4 && unlocked(lvl + 1);
  let big = `${ok}/${tot}`, sub = tot ? `${Math.round(ok / tot * 100)}% de acerto` : 'sem respostas';
  if (ses.mode === 'exam') { big = `${ses.grade.toFixed(1)}`; sub = `valores em 20 · ${ok} de ${ses.items.length} certas${tot < ses.items.length ? ` (${ses.items.length - tot} por responder)` : ''}`; }
  const list = wrong.map(x => { const q = BYID[x.id]; const ans = (Array.isArray(q.a) ? q.a : [q.a]).map(i => md(q.o[i])).join(' · ');
    return `<div class="review-item"><span class="badge" style="--c:${TOPICS[q.t].c};align-self:flex-start"><span class="sw"></span>${TOPICS[q.t].short} · N${q.l}</span><p class="q">${md(q.q)}</p>${q.d ? `<div class="diagram">${renderD(q.d)}</div>` : ''}<p class="a">Resposta: <b>${ans}</b></p><p class="x">${md(q.e)}</p></div>`; }).join('');
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="eyebrow">${esc(ses.title)} · resultado</span></div>
    <article class="card stack">
      <div><div class="score-big">${big}</div><p class="muted">${sub}</p></div>
      <div class="result-grid"><div class="kpi"><b>+${ses.xp}</b><span>XP ganho</span></div><div class="kpi"><b>${wrong.length}</b><span>para rever</span></div><div class="kpi"><b>${topLevel()}</b><span>nível mais alto aberto</span></div></div>
      ${nowUnlocked ? `<p class="key" style="margin:0">Nível ${lvl + 1} desbloqueado. O token avançou.</p>` : ''}
      <div class="row">${wrong.length ? `<button class="btn primary" data-act="retryWrong">Repetir as ${wrong.length} erradas</button>` : ''}${lvl ? `<button class="btn" data-act="level" data-n="${nowUnlocked ? lvl + 1 : lvl}">${nowUnlocked ? `Ir para o nível ${lvl + 1}` : `Outra ronda do nível ${lvl}`}</button>` : ''}<button class="btn" data-act="home">Início</button></div>
    </article>
    ${wrong.length ? `<div class="section"><h2>O que falhaste, explicado</h2>${list}</div>` : `<div class="section"><p class="muted">Sem erros nesta ronda.</p></div>`}`;
}

/* ---------- LIBRARY / READER ---------- */
function LearnPick() {
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="eyebrow">Aprender</span></div>
  <h2 style="margin-bottom:6px">Escolhe um tema</h2><p class="muted" style="margin-bottom:14px">Cada lição curta é seguida de duas perguntas sobre ela.</p>
  <div class="lesson-list">${Object.entries(TOPICS).map(([k, t]) => { const n = LESSONS.filter(l => l.t === k).length; return n ? `<button class="lesson-item" style="--c:${t.c}" data-act="learn" data-k="${k}"><span class="sw"></span><span class="lt">${t.label}</span><span class="lc">${n} lições</span></button>` : ''; }).join('')}</div>`;
}
function Library() {
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="eyebrow">Biblioteca de teoria</span></div>
  ${Object.entries(TOPICS).map(([k, t]) => { const ls_ = LESSONS.filter(l => l.t === k); if (!ls_.length) return ''; return `<div class="section"><div class="section-h"><h2>${t.label}</h2></div><div class="lesson-list">${ls_.map(l => `<button class="lesson-item" style="--c:${t.c}" data-act="read" data-id="${esc(l.id)}"><span class="sw"></span><span class="lt">${esc(l.title)}</span><span class="lc">${BANK.filter(q => q.les === l.id && !isReserved(q)).length} perguntas</span></button>`).join('')}</div></div>`; }).join('')}`;
}
function Reader() {
  const L = LBYID[view.id]; if (!L) return Library(); const T = TOPICS[L.t]; const sib = LESSONS.filter(l => l.t === L.t); const idx = sib.indexOf(L);
  const qs = BANK.filter(q => q.les === L.id && !isReserved(q));
  return `<div class="qhead"><button class="btn small" data-act="library" aria-label="Voltar à biblioteca">←</button><span class="badge" style="--c:${T.c}"><span class="sw"></span>${T.short}</span><span class="mono muted">${idx + 1}/${sib.length}</span></div>
  <article class="card"><h2 style="margin-bottom:12px">${esc(L.title)}</h2><div class="lesson">${lessonBody(L)}</div>
  <div class="qfoot">${qs.length ? `<button class="btn primary" data-act="practice" data-id="${esc(L.id)}">Praticar ${qs.length} pergunta${qs.length === 1 ? '' : 's'} desta lição</button>` : ''}<span class="spacer"></span>${idx > 0 ? `<button class="btn small" data-act="read" data-id="${esc(sib[idx - 1].id)}">← Anterior</button>` : ''}${idx < sib.length - 1 ? `<button class="btn small" data-act="read" data-id="${esc(sib[idx + 1].id)}">Seguinte →</button>` : ''}</div></article>`;
}

/* ---------- NOTES ---------- */
function Notes() {
  const ids = Object.keys(S.notes).filter(k => S.notes[k] && BYID[k]);
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="eyebrow">As minhas notas</span></div>
  ${ids.length ? ids.map(id => { const q = BYID[id]; return `<div class="review-item" style="margin-bottom:10px"><span class="badge" style="--c:${TOPICS[q.t].c};align-self:flex-start"><span class="sw"></span>${TOPICS[q.t].short} · N${q.l}</span><p class="q">${md(q.q)}</p><p class="a">Resposta: <b>${(Array.isArray(q.a) ? q.a : [q.a]).map(i => md(q.o[i])).join(' · ')}</b></p><p class="x" style="color:var(--ink)">📝 ${md(S.notes[id])}</p></div>`; }).join('') : '<p class="muted">Ainda não escreveste notas. Depois de responderes a uma pergunta, aparece uma caixa para guardares o teu truque.</p>'}`;
}

/* ---------- BANK / IMPORT ---------- */
function importPrompt() {
  const imp = C.importar || {};
  return `Gera perguntas de escolha múltipla para estudar ${C.sigla} (${C.nome}, IST) sobre [TEMA].
Responde APENAS com JSON válido neste formato:
{"name":"Nome do pacote","questions":[{"id":"único-por-pergunta","t":"${Object.keys(TOPICS).join('|')}","l":1,"q":"enunciado","o":["opção A","opção B","opção C","opção D"],"a":0,"e":"explicação teórica de porque a resposta certa é a certa","w":{"1":"porque é que a opção B está errada"}}]}
Regras: "l" é o nível (1 = definições, 2 = distinguir conceitos, 3 = cenários/diagramas, 4 = armadilhas). "a" é o índice (começa em 0) da opção certa, ou uma lista de índices se houver várias certas. ${imp.notas || 'Explicações em português de Portugal.'} Opcional: "les" com o id da lição relacionada.`;
}
function Bank() {
  const counts = Object.keys(TOPICS).map(k => `<span class="chip static" style="--c:${TOPICS[k].c}"><span class="sw"></span>${TOPICS[k].short} ${BANK.filter(q => q.t === k).length}</span>`).join('');
  const all = packs.map((p, i) => ({ ...p, _i: i })).filter(p => p.cadeira === C.id);
  return `<div class="qhead"><button class="btn small" data-act="home" aria-label="Voltar ao início">←</button><span class="eyebrow">Banco de perguntas</span></div>
  <div class="stack">
    <h2>${BANK.length} perguntas, ${LESSONS.length} lições</h2><div class="chips">${counts}</div>
    <div class="card stack">
      <h3>Acrescentar perguntas</h3>
      <p class="muted" style="font-size:14px">Cola um pacote JSON (ou escolhe um ficheiro .json). Também podes pedir-me no chat para acrescentar perguntas: entram aqui sozinhas.</p>
      <textarea class="code" id="importBox" spellcheck="false" placeholder='{"name":"…","questions":[…]}'>${esc(view.draft || '')}</textarea>
      <div class="row"><button class="btn primary" data-act="import">Importar</button><label class="btn" for="importFile">Escolher ficheiro</label><input type="file" id="importFile" accept=".json,application/json" hidden><span class="spacer"></span><button class="btn small" data-act="copyPrompt">Copiar prompt para gerar perguntas</button><button class="btn small" data-act="example">Ver exemplo</button></div>
      ${view.msg ? `<p class="msg ${view.msgOk ? 'ok' : 'ko'}">${esc(view.msg)}</p>` : ''}
      <details class="lesson-peek"><summary>Formato de cada pergunta</summary><div class="lbody" style="font-size:14px">
        <p><code class="mono">id</code> texto único · <code class="mono">t</code> tema (${Object.keys(TOPICS).join(', ')}) · <code class="mono">l</code> nível 1–4 · <code class="mono">q</code> enunciado · <code class="mono">o</code> 2 a 6 opções · <code class="mono">a</code> índice da certa (0 = primeira) ou lista de índices · <code class="mono">e</code> explicação · opcional <code class="mono">w</code> nota por opção errada, <code class="mono">les</code> lição, <code class="mono">src</code> fonte, <code class="mono">fixed</code> não baralhar opções.</p>
        <textarea class="code" readonly style="min-height:150px" id="promptBox">${esc(importPrompt())}</textarea></div></details>
    </div>
    <div class="stack"><h3>Pacotes importados</h3>
      ${all.length ? all.map(p => `<div class="pack"><b>${esc(p.name || 'Sem nome')}</b><span class="muted mono">${(p.questions || []).length} perguntas · neste browser</span><span class="spacer"></span>${view.confirmDel === p._i ? `<button class="btn small" style="color:var(--bad)" data-act="delPackYes" data-i="${p._i}">Confirmar remoção</button><button class="btn small" data-act="delPackNo">Cancelar</button>` : `<button class="btn small" data-act="delPack" data-i="${p._i}">Remover</button>`}</div>`).join('') : '<p class="muted">Ainda nenhum. As perguntas base estão sempre incluídas.</p>'}
    </div>
  </div>`;
}
function doImport(text) {
  let data; try { data = JSON.parse(text); } catch (e) { return go('bank', { msg: 'O texto não é JSON válido. Confirma as aspas e as vírgulas.', msgOk: false, draft: text }); }
  if (Array.isArray(data)) data = { name: 'Importado', questions: data };
  if (!data || !Array.isArray(data.questions)) return go('bank', { msg: 'Falta a lista "questions".', msgOk: false, draft: text });
  const bad = []; data.questions.forEach((q, i) => { const v = validateQ(q); if (!v.ok) bad.push(`pergunta ${i + 1}: ${v.why}`); });
  if (bad.length) return go('bank', { msg: `Corrige antes de importar — ${bad.slice(0, 3).join('; ')}${bad.length > 3 ? ` (+${bad.length - 3})` : ''}`, msgOk: false, draft: text });
  const pack = { cadeira: C.id, name: String(data.name || 'Pacote importado').slice(0, 80), createdAt: Date.now(), questions: data.questions, lessons: Array.isArray(data.lessons) ? data.lessons : [] };
  packs.push(pack); ls.set(LS_PACKS, packs);
  rebuildBank(); go('bank', { msg: `${pack.questions.length} pergunta(s) importada(s) neste browser.`, msgOk: true, draft: '' });
}
async function copyText(text, fallbackId) {
  try { await navigator.clipboard.writeText(text); toast('Copiado.'); }
  catch { const el = document.getElementById(fallbackId); if (el) { el.closest('details') && (el.closest('details').open = true); el.focus(); el.select(); toast('Seleccionei o texto: copia com Ctrl/Cmd+C.'); } }
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
  if (['unlockAll', 'testDate', 'note'].includes(a)) return;
  switch (a) {
    case 'home': if (ses && !ses.ended && ses.mode === 'exam' && view.name === 'quiz') { finish(); return; } clearInterval(tick); ses = null; go('home'); break;
    case 'cadeiras': if (ses && !ses.ended && ses.mode === 'exam' && view.name === 'quiz') { finish(); return; } clearInterval(tick); ses = null; go('cadeiras'); break;
    case 'openC': if (openCadeira(b.dataset.id)) { save(); go('home'); } break;
    case 'extra': start('extra', { extra: b.dataset.k }); break;
    case 'startReview': start(b.dataset.k); break;
    case 'topic': { const k = b.dataset.k; const set = new Set(S.settings.topics); set.has(k) ? set.delete(k) : set.add(k); if (!set.size) { toast('Tem de ficar pelo menos um tema.'); return; } S.settings.topics = Object.keys(TOPICS).filter(t => set.has(t)); save(); renderView(); break; }
    case 'level': { const n = +b.dataset.n; if (!unlocked(n)) { toast(`Bloqueado: precisas de ${Math.round(UNLOCK * 100)}% do nível ${n - 1} (ou ativa “Desbloquear todos”).`); return; } start('level', { level: n }); break; }
    case 'mode': { const k = b.dataset.k; if (k === 'learn') go('learnpick'); else if (k === 'library') go('library'); else if (k === 'review') go('reviewpick'); else start(k); break; }
    case 'learn': start('learn', { topic: b.dataset.k }); break;
    case 'library': go('library'); break;
    case 'read': go('reader', { id: b.dataset.id }); break;
    case 'practice': { const ids = BANK.filter(q => q.les === b.dataset.id).sort((x, y) => x.l - y.l).map(q => q.id); start('retry', { ids }); if (ses) ses.title = 'Praticar lição'; break; }
    case 'opt': choose(+b.dataset.oi); break;
    case 'confirm': if (ses && ses.picked.size) grade(); break;
    case 'next': next(); break;
    case 'quit': if (ses && ses.results.length) finish(); else { ses = null; go('home'); } break;
    case 'finish': finish(); break;
    case 'retryWrong': { const ids = ses.results.filter(r => !r.ok).map(r => r.id); start('retry', { ids, examGrading: ses.mode === 'exam' || ses.examGrading }); break; }
    case 'bank': go('bank'); break;
    case 'notes': go('notes'); break;
    case 'import': doImport(document.getElementById('importBox').value); break;
    case 'example': go('bank', { draft: JSON.stringify((C.importar && C.importar.exemplo) || { name: 'Exemplo', questions: [] }, null, 2) }); break;
    case 'copyPrompt': copyText(importPrompt(), 'promptBox'); break;
    case 'delPack': view.confirmDel = +b.dataset.i; renderView(); break;
    case 'delPackNo': view.confirmDel = null; renderView(); break;
    case 'delPackYes': { packs.splice(+b.dataset.i, 1); ls.set(LS_PACKS, packs); rebuildBank(); view.confirmDel = null; renderView(); break; }
    case 'reset': view.confirmReset = true; renderView(); break;
    case 'resetNo': view.confirmReset = false; renderView(); break;
    case 'resetYes': { const keep = S.settings; G.c[C.id] = blank(TOPICS); G.c[C.id].settings = keep; openCadeira(C.id); save(); view.confirmReset = false; toast('Progresso apagado.'); renderView(); break; }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'unlockAll') { S.settings.unlockAll = t.checked; save(); renderView(); }
  if (t.id === 'testDate') { S.settings.testDate = t.value; save(); renderView(); }
  if (t.id === 'importFile' && t.files && t.files[0]) { const r = new FileReader(); r.onload = () => doImport(String(r.result || '')); r.readAsText(t.files[0]); }
});
let noteTimer = null;
document.addEventListener('input', ev => { const t = ev.target; if (t.dataset && t.dataset.act === 'note') { S.notes[t.dataset.id] = t.value; clearTimeout(noteTimer); noteTimer = setTimeout(save, 700); } });
document.addEventListener('keydown', ev => {
  if (ev.target.matches('textarea, input')) return;
  if (view.name === 'quiz' && ses) {
    const it = curItem(); const k = ev.key;
    if (/^[1-6]$/.test(k) && !ses.answered) { const pos = +k - 1; if (it.order[pos] !== undefined) { ev.preventDefault(); choose(it.order[pos]); } }
    else if (k === 'Enter') { ev.preventDefault(); if (!ses.answered && Array.isArray(BYID[it.id].a) && ses.picked.size) grade(); else if (ses.answered) next(); }
  } else if (view.name === 'lesson' && ev.key === 'Enter') { ev.preventDefault(); next(); }
});

if (G.cur && REG.cadeiras[G.cur]) openCadeira(G.cur); else view = { name: 'cadeiras' };
renderView();
})();

</script>
</body></html>
