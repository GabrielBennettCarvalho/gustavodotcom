<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Estudo IST</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: one 860px study column on a faint modelling-canvas dot grid; the level map is drawn as a BPMN process with a token. */
:root{
  --paper:#F2F4F7; --panel:#FFFFFF; --panel-2:#F7F8FA; --ink:#141C29; --muted:#566275; --line:#D6DCE5; --dot:rgba(20,28,41,.07);
  --accent:#2747C9; --accent-ink:#FFFFFF; --token:#E4632A;
  --good:#1D8655; --good-bg:#E5F4EC; --bad:#C2392F; --bad-bg:#FBEAE8;
  --sheet:#FFFFFF; --sheet-ink:#1B2433; --sheet-line:#C9D0DA;
  --f-display:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --shadow:0 1px 2px rgba(20,28,41,.06),0 4px 14px rgba(20,28,41,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E131A; --panel:#161D27; --panel-2:#1B2330; --ink:#E5EAF1; --muted:#97A3B5; --line:#2B3545; --dot:rgba(229,234,241,.05);
  --accent:#7E9BFF; --accent-ink:#0E131A; --token:#FF8A4F;
  --good:#4CC98A; --good-bg:#14301F; --bad:#FF7468; --bad-bg:#3A1A18;
  --sheet:#E8ECF1; --sheet-ink:#1B2433; --sheet-line:#B9C1CD;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E131A; --panel:#161D27; --panel-2:#1B2330; --ink:#E5EAF1; --muted:#97A3B5; --line:#2B3545; --dot:rgba(229,234,241,.05);
  --accent:#7E9BFF; --accent-ink:#0E131A; --token:#FF8A4F;
  --good:#4CC98A; --good-bg:#14301F; --bad:#FF7468; --bad-bg:#3A1A18;
  --sheet:#E8ECF1; --sheet-ink:#1B2433; --sheet-line:#B9C1CD;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:18px 18px;color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:18px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(26px,5vw,36px);font-weight:800;font-stretch:118%;line-height:1.05}
h2{font-size:21px;font-weight:750;font-stretch:112%}
h3{font-size:16px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.02em}
.eyebrow{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand-mark{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-stretch:120%;font-weight:800;font-size:18px;letter-spacing:-.01em}
.stat-pill{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.stat-pill i{width:8px;height:8px;border-radius:50%;background:var(--token);display:inline-block}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* hero */
.hero{display:grid;gap:8px;margin-bottom:20px}
.hero p{max-width:62ch;color:var(--muted)}

/* level map as a BPMN process */
.flow-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px 14px;box-shadow:var(--shadow);margin-bottom:18px}
.flow{display:flex;align-items:center;gap:0;overflow-x:auto;padding:14px 4px 8px}
.flow .ev{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);flex:none;display:grid;place-items:center}
.flow .ev.end{border-width:4px}
.flow .seq{flex:1 0 18px;height:2px;background:var(--ink);position:relative;min-width:18px}
.flow .seq::after{content:"";position:absolute;right:-1px;top:-4px;border-left:7px solid var(--ink);border-top:5px solid transparent;border-bottom:5px solid transparent}
.lvl{position:relative;flex:0 0 132px;min-height:96px;border:2px solid var(--ink);border-radius:12px;background:var(--panel);padding:9px 10px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .12s ease}
.lvl:hover{transform:translateY(-2px)}
.lvl.locked{border-style:dashed;border-color:var(--muted);color:var(--muted);cursor:pointer}
.lvl .n{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}
.lvl .t{font-family:var(--f-display);font-weight:750;font-stretch:110%;font-size:15px;line-height:1.1}
.lvl .bar{margin-top:auto;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.lvl .bar span{display:block;height:100%;background:var(--good)}
.lvl .pct{font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.lvl .tok{position:absolute;top:-11px;right:-11px;width:22px;height:22px;border-radius:50%;background:var(--token);box-shadow:0 0 0 4px color-mix(in srgb,var(--token) 25%,transparent);animation:pulse 2.2s ease-in-out infinite}
.lvl .lock{position:absolute;top:8px;right:9px;font-size:12px}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--token) 10%,transparent)}}
@media (prefers-reduced-motion:reduce){.lvl .tok{animation:none}.lvl:hover{transform:none}}
.flow-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}

/* topics */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px;font-weight:600}
.chip .sw{width:10px;height:10px;border-radius:3px;background:var(--c,var(--muted))}
.chip[aria-pressed="false"]{opacity:.5;background:transparent}
.chip.static{cursor:default}

/* mode grid */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:4px}
.mode{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s}
.mode:hover{border-color:var(--accent)}
.mode h3{display:flex;align-items:center;gap:8px}
.mode p{font-size:13.5px;color:var(--muted)}
.mode .glyph{width:26px;height:26px;flex:none}
.mode .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:auto}

.section{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.section-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

/* mastery table */
.mastery{display:grid;grid-template-columns:minmax(120px,1fr) repeat(4,minmax(44px,64px));gap:6px 8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto}
.mastery .h{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center}
.mastery .tn{display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px}
.cell{height:22px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);position:relative;overflow:hidden;font-family:var(--f-mono);font-size:10.5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cell span{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--good) 35%,transparent)}
.cell em{position:relative;font-style:normal}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.progress{display:flex;gap:4px;flex:1;min-width:120px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.ok{background:var(--good)}
.progress i.ko{background:var(--bad)}
.progress i.cur{background:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid var(--line);background:var(--panel)}
.badge .sw{width:8px;height:8px;border-radius:2px;background:var(--c)}
.timer{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
.timer.hot{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.qtext{font-size:18px;line-height:1.45;font-weight:600;max-width:70ch}
.qhint{font-size:13px;color:var(--muted);margin-top:6px}
.diagram{margin-top:14px;background:var(--sheet);color:var(--sheet-ink);border:1px solid var(--sheet-line);border-radius:10px;padding:10px;overflow-x:auto}
.diagram svg{display:block;width:100%;height:auto;margin:0 auto}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;font-size:15px;line-height:1.4;min-width:0}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--panel-2)}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--muted)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.opt.sel .k{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{border-color:var(--good);background:var(--good);color:var(--panel)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{border-color:var(--bad);background:var(--bad);color:var(--panel)}
.opt[disabled]{cursor:default}
.opt .txt{min-width:0;overflow-wrap:anywhere}
.multi-note{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-top:10px;text-transform:uppercase;letter-spacing:.08em}

.feedback{margin-top:16px;border-radius:12px;padding:16px;border:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;gap:10px}
.feedback.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.feedback.ko{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.verdict{font-family:var(--f-display);font-weight:800;font-stretch:115%;font-size:18px}
.feedback.ok .verdict{color:var(--good)}
.feedback.ko .verdict{color:var(--bad)}
.explain{font-family:var(--f-read);font-size:16px;line-height:1.6;max-width:68ch}
.explain b{font-family:var(--f-body)}
.why-wrong{font-size:14px;border-left:3px solid var(--bad);padding-left:10px;color:var(--ink)}
.lesson-peek{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
.lesson-peek summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:8px}
.lesson-peek summary::-webkit-details-marker{display:none}
.lesson-peek summary::before{content:"▸";font-size:12px;color:var(--accent);transition:transform .15s}
.lesson-peek[open] summary::before{transform:rotate(90deg)}
.lesson-peek .lbody{margin-top:10px}
.note-box{display:flex;flex-direction:column;gap:6px}
.note-box textarea{width:100%;min-height:60px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);color:var(--ink);font:14px/1.45 var(--f-body)}
.src{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.qfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--muted)}

/* lessons */
.lesson{font-family:var(--f-read);font-size:16.5px;line-height:1.65}
.lesson p+p{margin-top:10px}
.lesson ul{margin:8px 0 0;padding-left:20px}
.lesson li{margin:4px 0}
.lesson b,.lesson strong{font-family:var(--f-body);font-weight:700;font-size:.95em}
.lesson table{border-collapse:collapse;font-family:var(--f-body);font-size:13.5px;margin-top:10px;width:100%}
.lesson th,.lesson td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.lesson th{background:var(--panel-2)}
.tbl-wrap{overflow-x:auto}
.key{margin-top:12px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--token) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--token) 35%,var(--line));font-family:var(--f-body);font-size:14.5px}
.key::before{content:"Para levar: ";font-weight:800}
.lesson-list{display:grid;gap:8px}
.lesson-item{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;cursor:pointer;width:100%}
.lesson-item:hover{border-color:var(--accent)}
.lesson-item .sw{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.lesson-item .lt{font-weight:650;min-width:0}
.lesson-item .lc{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none}

/* results */
.score-big{font-family:var(--f-display);font-weight:800;font-stretch:125%;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-family:var(--f-display);font-size:22px;font-stretch:115%;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.review-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.review-item .q{font-weight:650}
.review-item .a{font-size:14px}
.review-item .a b{color:var(--good)}
.review-item .x{font-family:var(--f-read);font-size:15px;color:var(--muted)}

/* bank */
textarea.code{width:100%;min-height:180px;font:12.5px/1.5 var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);color:var(--ink)}
.msg{font-size:13.5px;padding:8px 12px;border-radius:8px}
.msg.ok{background:var(--good-bg);color:var(--good)}
.msg.ko{background:var(--bad-bg);color:var(--bad)}
.pack{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);flex-wrap:wrap}
.pack b{min-width:0;overflow-wrap:anywhere}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}


.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:8px;font-size:13.5px;z-index:20;max-width:calc(100% - 32px)}

@media (max-width:560px){
  .flow{flex-direction:column;align-items:stretch;gap:0;overflow:visible}
  .flow .ev{align-self:center}
  .flow .seq{flex:0 0 22px;width:2px;height:22px;min-width:2px;align-self:center}
  .flow .seq::after{right:auto;top:auto;bottom:-1px;left:-4px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--ink);border-bottom:0}
  .lvl{flex:none;min-height:0}
  .qtext{font-size:16.5px}
  .card{padding:16px}
  .score-big{font-size:44px}
}

/* diagram ink (sheet stays paper-light in both themes) */
.dg{color:var(--sheet-ink);font-family:var(--f-body)}
.dg .s{stroke:currentColor;fill:none;stroke-linejoin:round;stroke-linecap:round}
.dg .thin{stroke-width:1.1}
.dg .f{fill:var(--sheet)}
.dg .f2{fill:color-mix(in srgb,var(--sheet) 92%,#8aa0c0)}
.dg .fi{fill:currentColor;stroke:currentColor}
.dg .fo{fill:var(--sheet);stroke:currentColor;stroke-width:1.3}
.dg .inv{fill:none;stroke:var(--sheet);stroke-width:1.2}
.dg .dash{stroke-dasharray:4 3}
.dg .tx{fill:currentColor}
.dg .lbl{paint-order:stroke;stroke:var(--sheet);stroke-width:3px}
.dg .tagc{fill:#E4632A}
.dg .tagt{fill:#fff}
.dg .a-bus{fill:#FFF5B8}.dg .a-app{fill:#C9EDF8}.dg .a-tech{fill:#D3F1C6}.dg .a-mot{fill:#E3D9F5}.dg .a-strat{fill:#F7DFC4}.dg .a-com{fill:#ECEEF2}.dg .a-impl{fill:#FBE0E4}


/* course menu and review picker */
.mode.course-card h3{font-size:22px}
.mode.course-card .code{font-family:var(--f-display);font-weight:800;font-stretch:120%;letter-spacing:-.01em}
.lvl-bar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.lvl-bar span{display:block;height:100%;background:var(--good)}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.mode[disabled]:hover{border-color:var(--line)}

/* other device (progress key) */
.sync-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:4px;align-items:start}
.sync-grid h3{display:flex;align-items:center;gap:8px}
.sync-confirm{margin-bottom:16px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.sync-list{margin:0;padding-left:18px;display:grid;gap:4px}
.qr{background:var(--sheet);color:var(--sheet-ink);border:1px solid var(--sheet-line);border-radius:10px;padding:12px;display:grid;place-items:center;min-height:180px;text-align:center}
.qr svg{display:block;width:100%;max-width:260px;height:auto}
textarea.key{min-height:84px;word-break:break-all}
@media (max-width:480px){.hide-narrow{display:none}}

/* theme button, skip, calc badge, code blocks */
.theme-btn{min-width:36px;gap:6px}
.stat-pill .muted{margin-left:2px}
.btn.skip{border-style:dashed;color:var(--muted)}
.btn.skip:hover{color:var(--ink)}
.progress i.sk{background:repeating-linear-gradient(90deg,var(--muted) 0 3px,transparent 3px 6px)}
.badge.calc{border-style:dashed;color:var(--muted)}
.codeblk{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);font:13px/1.55 var(--f-mono);overflow-x:auto;white-space:pre;color:var(--ink)}
.lesson .codeblk{font-size:13px}
.lesson code,.explain code{font-size:.88em}

/* level map variant drawn as buses between memory levels (a course sets map: { link: 'bus', start, end }) */
.flow-bus{align-items:flex-end}
.flow .hier{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);flex:none;text-align:center;padding-bottom:20px}
.flow .hier svg{width:38px;height:38px;color:var(--ink)}
.flow .bus{flex:1 0 18px;min-width:18px;height:8px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin-bottom:44px;position:relative}
.flow .bus::after{content:"";position:absolute;right:-6px;top:-7px;border-left:8px solid var(--ink);border-top:9px solid transparent;border-bottom:9px solid transparent}
.flow-bus .lvl{border-radius:6px}
.flow-bus .lvl.l1{flex-basis:146px;min-height:120px}.flow-bus .lvl.l2{flex-basis:138px;min-height:110px}.flow-bus .lvl.l3{flex-basis:130px;min-height:100px}.flow-bus .lvl.l4{flex-basis:122px;min-height:92px}
.flow-bus .lvl .tok{border-radius:4px;width:20px;height:20px}
.lvl .lat{font-family:var(--f-mono);font-size:10.5px;color:var(--accent);font-weight:600}
.lvl.locked .n{padding-right:16px}
.lvl.locked .lat{color:var(--muted)}
@media (max-width:560px){
  .flow-bus{align-items:stretch}
  .flow .hier{align-self:center;padding-bottom:0}
  .flow .bus{flex:0 0 22px;width:8px;height:22px;min-width:8px;margin:0;align-self:center;border:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}
  .flow .bus::after{right:auto;top:auto;bottom:-7px;left:-7px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:8px solid var(--ink);border-bottom:0}
  .flow-bus .lvl.l1,.flow-bus .lvl.l2,.flow-bus .lvl.l3,.flow-bus .lvl.l4{min-height:0}
}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';

      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;

        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;

      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +

      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {

          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];

        ascii += '\n';

<script>
/* ===== Course registry =====
   Each course calls, from its own files:
     STUDY.course({ id, code, name, topics, ... })   → configuration
     STUDY.lessons(id, [ ... ])                        → lessons (theory)
     STUDY.questions(id, [ ... ])                      → questions
   The order of these calls doesn't matter. Each course is wrapped in its own scope by the build. */
window.STUDY = (() => {
  const courses = {}, order = [];
  const get = id => {
    if (!courses[id]) { order.push(id); courses[id] = { id, lessons: [], questions: [], extras: [] }; }
    return courses[id];
  };
  return {
    courses, order,
    course(cfg) { const c = get(cfg.id); const { lessons, questions } = c; Object.assign(c, cfg, { lessons, questions }); if (!c.extras) c.extras = []; },
    lessons(id, arr) { get(id).lessons.push(...arr); },
    questions(id, arr) { get(id).questions.push(...arr); },
    // Injected by build.py from courses/<id>/ids.json: the fixed position of every question id.
    ids(id, arr) { get(id).ids = arr; },
  };
})();

      case 'driver': { let t = `<circle cx="${x + 9}" cy="${y + 7}" r="5" class="s thin"/>`; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; t += `<line x1="${(x + 9 + Math.cos(a) * 5).toFixed(1)}" y1="${(y + 7 + Math.sin(a) * 5).toFixed(1)}" x2="${(x + 9 + Math.cos(a) * 7).toFixed(1)}" y2="${(y + 7 + Math.sin(a) * 7).toFixed(1)}" class="s thin"/>`; } return t; }
      case 'assess': return `<circle cx="${x + 7}" cy="${y + 6}" r="4.5" class="s thin"/><path d="M${x + 10} ${y + 9.5} l5 4.5" class="s thin"/>`;
      case 'req': return `<path d="M${x + 4} ${y + 2} h13 l-3 10 h-13 Z" class="s thin"/>`;
      case 'stake': return `<path d="M${x + 4} ${y + 2} h9 M${x + 4} ${y + 12} h9" class="s thin"/><ellipse cx="${x + 4}" cy="${y + 7}" rx="2.5" ry="5" class="s thin"/><ellipse cx="${x + 13}" cy="${y + 7}" rx="2.5" ry="5" class="s thin"/>`;
      case 'outcome': return `<circle cx="${x + 8}" cy="${y + 8}" r="5.5" class="s thin"/><circle cx="${x + 8}" cy="${y + 8}" r="2.5" class="s thin"/><path d="M${x + 8} ${y + 8} l7 -7 M${x + 12} ${y + 1} h3 v3" class="s thin"/>`;
      case 'principle': return `<rect x="${x + 3}" y="${y + 1}" width="12" height="12" class="s thin"/><path d="M${x + 9} ${y + 3} v5 M${x + 9} ${y + 10} v1" class="s" stroke-width="1.6"/>`;
      case 'capability': return `<path d="M${x + 1} ${y + 13} h15 v-12 h-5 v4 h-5 v4 h-5 Z" class="s thin"/>`;
      case 'course': return `<circle cx="${x + 6}" cy="${y + 9}" r="4" class="s thin"/><path d="M${x + 9} ${y + 6} q3 -5 8 -4 l-2 -1.5 M${x + 17} ${y + 2} l-1.5 2" class="s thin"/>`;
      case 'resource': return `<rect x="${x + 1}" y="${y + 3}" width="14" height="8" rx="2" class="s thin"/><path d="M${x + 15} ${y + 5.5} h2 v3 h-2 M${x + 4} ${y + 5} v4 M${x + 7} ${y + 5} v4" class="s thin"/>`;
      case 'equipment': return `<circle cx="${x + 6}" cy="${y + 9}" r="3.5" class="s thin"/><circle cx="${x + 13}" cy="${y + 4}" r="2.5" class="s thin"/>`;
      case 'facility': return `<path d="M${x + 1} ${y + 13} v-10 h3 v5 l4 -3 v3 l4 -3 v3 l5 -3 v8 Z" class="s thin"/>`;
      case 'material': return `<path d="M${x + 4} ${y + 1} h10 l3 6 l-3 6 h-10 l-3 -6 Z" class="s thin"/>`;
      case 'network': return `<path d="M${x + 4} ${y + 4} h12 l-3 7 h-12 Z" class="s thin"/><circle cx="${x + 4}" cy="${y + 4}" r="1.6" class="fi"/><circle cx="${x + 16}" cy="${y + 4}" r="1.6" class="fi"/><circle cx="${x + 13}" cy="${y + 11}" r="1.6" class="fi"/><circle cx="${x + 1}" cy="${y + 11}" r="1.6" class="fi"/>`;
      case 'path': return `<path d="M${x + 1} ${y + 7} h16" class="s thin" stroke-dasharray="2 2"/><path d="M${x + 4} ${y + 4} l-3 3 l3 3 M${x + 14} ${y + 4} l3 3 l-3 3" class="s thin"/>`;
      case 'location': return `<path d="M${x + 9} ${y + 14} l-5 -7 a5.5 5.5 0 1 1 10 0 Z" class="s thin"/>`;
      default: return '';
    }
  }
  function aBox(n) {
    const w = n.w || 124, h = n.h || 54, x = n.x - w / 2, y = n.y - h / 2; const fill = AFILL[n.dom || 'common'];
    let s = '';
    if (n.k === 'junction') return `<circle cx="${n.x}" cy="${n.y}" r="6" class="${n.or ? 's f' : 'fi'}" stroke-width="1.4"/>`;
    if (n.k === 'grouping') return `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="s" stroke-width="1.2" stroke-dasharray="7 4" fill="none"/><text x="${x + 8}" y="${y + 13}" font-size="10.5" font-weight="700" class="tx">${esc(n.lb)}</text>`;
    if (MOTIV.includes(n.k)) s += `<path d="M${x + 8} ${y} H${x + w - 8} L${x + w} ${y + 8} V${y + h - 8} L${x + w - 8} ${y + h} H${x + 8} L${x} ${y + h - 8} V${y + 8} Z" class="s ${fill}" stroke-width="1.3"/>`;
    else s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${BEHAV.includes(n.k) ? 11 : 1.5}" class="s ${fill}" stroke-width="1.3"/>`;
    s += aIcon(n.k, x + w - 22, y + 5);
    s += textBlock(n.x - 4, n.y + 3, n.lb, Math.floor((w - 26) / 6.1), 10.5, 'middle', 600);
    if (n.tag) s += `<circle cx="${x + 2}" cy="${y + 2}" r="9" class="tagc"/><text x="${x + 2}" y="${y + 2}" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="800" class="tagt">${esc(n.tag)}</text>`;
    return s;
  }
  function clip(n, px, py) { // intersection of segment center->(px,py) with box border
    if (n.k === 'junction') { const dx = px - n.x, dy = py - n.y, L = Math.hypot(dx, dy) || 1; return [n.x + dx / L * 6, n.y + dy / L * 6]; }
    const w = (n.w || 124) / 2, h = (n.h || 54) / 2; const dx = px - n.x, dy = py - n.y;
    if (!dx && !dy) return [n.x, n.y]; const sx = dx ? w / Math.abs(dx) : Infinity, sy = dy ? h / Math.abs(dy) : Infinity; const s = Math.min(sx, sy);
    return [n.x + dx * s, n.y + dy * s];
  }
  function archimate(spec) {
    const id = 'd' + (++uid); const nodes = {}; (spec.nodes || []).forEach(n => nodes[n.id] = n);
    let out = `<svg viewBox="0 0 ${spec.w} ${spec.h}" width="${spec.w}" height="${spec.h}" class="dg" style="max-width:${spec.w}px" role="img" aria-label="${esc(spec.alt || 'Diagrama ArchiMate')}" xmlns="http://www.w3.org/2000/svg"><defs>`;
    out += `<marker id="${id}fa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 Z" class="fi"/></marker>`;
    out += `<marker id="${id}oa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0.5 L10 5 L0 9.5" class="s" stroke-width="1.3" fill="none"/></marker>`;
    out += `<marker id="${id}sa" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L10 5 L0 9" class="s" stroke-width="1.3" fill="none"/></marker>`;
    out += `<marker id="${id}tri" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L12 6 L0 12 Z" class="fo" stroke-width="1.1"/></marker>`;
    out += `<marker id="${id}fd" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto"><path d="M0 5 L8 0 L16 5 L8 10 Z" class="fi"/></marker>`;
    out += `<marker id="${id}od" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto"><path d="M0.6 5 L8 0.6 L15.4 5 L8 9.4 Z" class="fo" stroke-width="1.1"/></marker>`;
    out += `<marker id="${id}dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" class="fi"/></marker></defs>`;
    const groups = (spec.nodes || []).filter(n => n.k === 'grouping'); groups.forEach(g => out += aBox(g));
    for (const e of spec.edges || []) {
      const s = nodes[e.f], t = nodes[e.t]; if (!s || !t) continue;
      const via = e.via || []; const p1 = via[0] || [t.x, t.y], pN = via[via.length - 1] || [s.x, s.y];
      const pts = [clip(s, p1[0], p1[1]), ...via, clip(t, pN[0], pN[1])];
      const d = pathD(pts); let st = '', ms = '', me = '';
      switch (e.k) {
        case 'comp': ms = `${id}fd`; break; case 'aggr': ms = `${id}od`; break;
        case 'assign': ms = `${id}dot`; me = `${id}fa`; break;
        case 'real': st = 'stroke-dasharray="5 3"'; me = `${id}tri`; break;
        case 'serv': me = `${id}oa`; break;
        case 'access': st = 'stroke-dasharray="1.5 3"'; me = (e.read || e.noarrow) ? '' : `${id}sa`; break;
        case 'infl': st = 'stroke-dasharray="6 4"'; me = `${id}oa`; break;
        case 'trig': me = `${id}fa`; break;
        case 'flow': st = 'stroke-dasharray="7 4"'; me = `${id}fa`; break;
        case 'spec': me = `${id}tri`; break;
        default: break;
      }
      let line = `<path d="${d}" class="s" stroke-width="1.3" fill="none" ${st}`;
      if (ms) line += ` marker-start="url(#${ms})"`;
      if (me) line += ` marker-end="url(#${me})"`;
      out += line + '/>';
      if (e.k === 'access' && e.read && !e.noarrow) { // arrowhead at the behaviour end: information flows object -> behaviour (read)
        const a = pts[0], b = pts[1];
        const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, ux = (a[0] - b[0]) / L, uy = (a[1] - b[1]) / L;
        out += `<path d="M${a[0] - ux * 7 - uy * 4} ${a[1] - uy * 7 + ux * 4} L${a[0]} ${a[1]} L${a[0] - ux * 7 + uy * 4} ${a[1] - uy * 7 - ux * 4}" class="s" stroke-width="1.3" fill="none"/>`;
      }
      if (e.lb) { const i = Math.floor((pts.length - 1) / 2); const m = pts[i], n2 = pts[i + 1]; out += `<text x="${(m[0] + n2[0]) / 2 + (e.dx || 0)}" y="${(m[1] + n2[1]) / 2 - 7 + (e.dy || 0)}" text-anchor="middle" font-size="10" font-weight="700" class="tx lbl">${esc(e.lb)}</text>`; }
    }
    (spec.nodes || []).filter(n => n.k !== 'grouping').forEach(n => out += aBox(n));
    for (const t of spec.texts || []) out += `<text x="${t.x}" y="${t.y}" text-anchor="${t.a || 'middle'}" font-size="${t.s || 11}" font-weight="${t.w || 700}" class="tx">${esc(t.t)}</text>`;
    return out + '</svg>';
  }
  // single relationship sample: A --k--> B
  function rel(k, opts = {}) {
    return archimate({ w: 360, h: 90, alt: 'Relação ArchiMate entre dois elementos', nodes: [
      { id: 'a', k: opts.ak || 'process', dom: opts.ad || 'common', lb: opts.al || 'A', x: 70, y: 45, w: 112 },
      { id: 'b', k: opts.bk || 'service', dom: opts.bd || 'common', lb: opts.bl || 'B', x: 290, y: 45, w: 112 }],
      edges: [{ f: 'a', t: 'b', k, read: opts.read }] });
  }
  function render(d) { if (!d) return ''; if (typeof d === 'string') return d; if (d.kind === 'bpmn') return bpmn(d); if (d.kind === 'archimate') return archimate(d); if (d.kind === 'rel') return rel(d.r, d); return ''; }
  return { render, bpmn, archimate, rel, esc, aIcon, AFILL };
})();
