/* ===== RC lessons: Internet and application layer. Each card: analogy → theory → example → key line. ===== */
STUDY.lessons('rc', [
/* ---------------- INTERNET, SWITCHING, DELAYS ---------------- */
{ id: 'n-inet', t: 'net', title: 'O que é a Internet',
  html: `<p>Pensa na rede de estradas de um país: há ruas de bairro (onde estão as casas), estradas nacionais e autoestradas, cada uma gerida por uma entidade diferente, mas todas ligadas. A Internet é isso para pacotes de dados.</p>
  <ul><li><b>Borda (edge)</b>: os computadores terminais (hosts): portáteis, telemóveis, servidores. É aqui que correm as aplicações.</li>
  <li><b>Redes de acesso</b>: ligam a borda ao resto (ADSL, cabo, fibra, Wi-Fi, 4G/5G, Ethernet da empresa).</li>
  <li><b>Núcleo (core)</b>: a malha de <b>encaminhadores</b> (routers) e ligações que leva os pacotes de rede em rede.</li></ul>
  <p>Os princípios que o professor sublinha:</p>
  <ul><li><b>Rede de redes</b>: milhares de ISPs (locais, regionais, globais) interligados.</li>
  <li><b>Serviço “best effort”</b>: a rede faz o melhor possível para entregar, mas não promete nada (nem entrega, nem atraso, nem ordem).</li>
  <li><b>Inteligência na borda</b> (princípio fim-a-fim): a rede é simples; as funções complicadas (fiabilidade, controlo de congestão) ficam nos hosts. Foi isto que permitiu inovar sem mudar a rede.</li>
  <li><b>Camadas</b> e <b>encapsulamento</b> (próximas lições).</li></ul>`,
  key: 'Borda = hosts e aplicações. Núcleo = encaminhadores. A rede é “best effort”; a inteligência está nas pontas.' },
{ id: 'n-proto', t: 'net', title: 'Protocolo e interface de serviço',
  html: `<p>Quando cumprimentas alguém: dizes “olá”, esperas o “olá” de volta e só depois perguntas as horas. Se a outra pessoa não responder, fazes outra coisa. Isso é um protocolo humano.</p>
  <p>Um <b>protocolo</b> define o <b>formato e a ordem das mensagens trocadas entre entidades da mesma camada</b> (normalmente em máquinas diferentes) e as <b>ações</b> tomadas ao enviar ou receber cada mensagem.</p>
  <p>Já a <b>interface de serviço</b> é outra coisa: é o <b>conjunto de primitivas que uma camada oferece à camada de cima</b> na mesma máquina (por exemplo, a API de sockets que o transporte oferece à aplicação).</p>
  <div class="tbl-wrap"><table><tr><th></th><th>Protocolo</th><th>Interface de serviço</th></tr>
  <tr><td>Entre quem?</td><td>Pares da mesma camada (horizontal)</td><td>Camada N e camada N+1 (vertical)</td></tr>
  <tr><td>Exemplo</td><td>HTTP entre browser e servidor</td><td>socket(), connect(), send()</td></tr></table></div>
  <p>Armadilha de exame: um protocolo <b>não</b> especifica as mensagens que a aplicação passa à API, nem as instruções para o programar, nem o que se mostra ao utilizador.</p>`,
  key: 'Protocolo = conversa entre pares da mesma camada. Interface de serviço = o que uma camada oferece à de cima.' },
{ id: 'n-layers', t: 'net', title: 'Camadas e encapsulamento',
  html: `<p>Uma carta: escreves o texto (aplicação), metes num envelope com o nome do primo (transporte), os correios põem-na num saco com o código postal da cidade (rede), e o saco vai num camião até à estação seguinte (ligação). Cada nível só olha para a sua “embalagem”.</p>
  <div class="tbl-wrap"><table><tr><th>Camada</th><th>Pergunta que resolve</th><th>Exemplos</th><th>Unidade</th></tr>
  <tr><td>Aplicação</td><td>Lógica da aplicação</td><td>HTTP, SMTP, DNS, FTP</td><td>mensagem</td></tr>
  <tr><td>Transporte</td><td>Como comunicam processos distantes?</td><td>TCP, UDP</td><td>segmento</td></tr>
  <tr><td>Rede</td><td>Como comunicam computadores distantes?</td><td>IP</td><td>datagrama</td></tr>
  <tr><td>Ligação</td><td>Como comunicam dois nós vizinhos?</td><td>Ethernet, Wi-Fi</td><td>trama</td></tr>
  <tr><td>Física</td><td>Como se transmitem os bits?</td><td>cobre, fibra, rádio</td><td>bit</td></tr></table></div>
  <p><b>Encapsulamento</b>: cada camada junta o seu cabeçalho ao que recebe de cima. Os <b>hosts</b> implementam as 5 camadas; um <b>encaminhador</b> só até à rede; um <b>comutador</b> (switch) só até à ligação.</p>
  <p><b>Regra de ouro dos exames</b> (“A usa X e B usa Y, é possível?”): aplicação e transporte são <b>fim-a-fim</b>, por isso têm de ser iguais nas duas pontas (não pode ser TCP de um lado e UDP do outro, nem HTTP de um lado e SMTP do outro). IP é igual em todo o caminho. Mas a <b>ligação é salto a salto</b>: A pode estar em Wi-Fi (CSMA/CA) e B em Ethernet (CSMA/CD).</p>`,
  key: 'Aplicação e transporte: iguais nas duas pontas. Rede: IP em todo o lado. Ligação: pode mudar em cada salto.' },
{ id: 'n-switch', t: 'net', title: 'Comutação de circuitos vs de pacotes',
  html: `<p><b>Circuitos</b> = uma chamada telefónica clássica: antes de falar reserva-se um “tubo” fim-a-fim; enquanto dura, ninguém mais o usa, mesmo em silêncio. <b>Pacotes</b> = os correios: cada carta segue sozinha e partilha o camião com as outras.</p>
  <ul><li><b>Comutação de circuitos</b>: estabelecimento prévio, recursos reservados (por <b>FDM</b> — bandas de frequência, ou <b>TDM</b> — fatias de tempo). Depois do circuito estabelecido <b>não há filas nem atrasos de congestão</b> nos nós: o ritmo está garantido. Desperdiça capacidade quando o utilizador está calado.</li>
  <li><b>Comutação de pacotes</b>: sem reserva; a capacidade é partilhada por <b>multiplexagem estatística</b>. Aproveita melhor a ligação, mas quando muitos falam ao mesmo tempo formam-se <b>filas</b> (atrasos de congestão) e há <b>perdas</b>.</li></ul>
  <p>Exemplo dos slides: ligação de 1 Mbit/s, cada utilizador precisa de 100 kbit/s quando ativo e está ativo 10% do tempo. Com circuitos cabem <b>10</b> utilizadores. Com pacotes, 35 utilizadores dão uma probabilidade de mais de 10 ativos ao mesmo tempo menor que 0,0004.</p>
  <p><b>TDM</b>: se 4 canais de 100 B/s partilham o meio em fatias, o ritmo total é 4 × 100 B/s = 400 B/s = <b>3200 bit/s</b>.</p>
  <p>Dentro da comutação de pacotes há <b>datagramas</b> (cada pacote é encaminhado sozinho, podem seguir caminhos diferentes — é o IP) e <b>circuitos virtuais</b> (caminho fixado no início, o identificador de circuito no cabeçalho muda em cada salto).</p>`,
  key: 'Circuitos: reserva, sem filas depois de estabelecido. Pacotes: partilha, com filas e perdas.' },
{ id: 'n-sf', t: 'net', title: 'Store-and-forward',
  html: `<p>Imagina uma caravana de 10 carros numa autoestrada com portagens: a portagem só deixa a caravana seguir quando o <b>último</b> carro passou. Um encaminhador faz o mesmo com os bits de um pacote.</p>
  <p><b>Store-and-forward</b>: na comutação de pacotes, um encaminhador tem de <b>receber o pacote completo</b> antes de começar a transmiti-lo na ligação seguinte. Por isso o tempo de transmissão <b>L/R</b> repete-se em cada ligação.</p>
  <p>Fórmula do problema que sai em <b>todos</b> os exames (N pacotes de L bits, caminho com M ligações iguais de ritmo R, sem outro tráfego):</p>
  <p style="text-align:center"><b>t = N·L/R + (M−1)·L/R + propagação</b></p>
  <ul><li><b>N·L/R</b>: o emissor despeja os N pacotes, uns atrás dos outros.</li>
  <li><b>(M−1)·L/R</b>: o último pacote ainda tem de ser retransmitido em cada um dos M−1 encaminhadores.</li>
  <li><b>propagação</b> fim-a-fim: se te dão o <b>RTT</b>, a propagação de ida é <b>RTT/2</b>.</li></ul>
  <p>Exemplo (exame 2025/26): 8 Mbit em pacotes de 8 kbit (N = 1000), caminho A-X-Y-Z-B (M = 4), 100 Mbit/s, RTT 100 ms. L/R = 80 µs. t = 1000 × 0,08 + 3 × 0,08 + 50 = <b>130,24 ms</b>.</p>
  <p>Se as ligações têm ritmos diferentes, o <b>gargalo</b> manda: o tempo é ~ o primeiro pacote a chegar ao gargalo + N × (L/R do gargalo) + o último a sair dele + propagação.</p>`,
  key: 't = N·L/R + (nº de encaminhadores)·L/R + RTT/2. Conta ligações, não nós.' },
{ id: 'n-delay', t: 'net', title: 'Os quatro atrasos',
  html: `<p>Uma ida aos correios: a pessoa ao balcão vê o envelope (<b>processamento</b>), esperas na fila (<b>fila</b>), o funcionário carimba carta a carta, mais devagar se forem muitas (<b>transmissão</b>), e depois a carrinha leva tempo a chegar a outra cidade (<b>propagação</b>).</p>
  <div class="tbl-wrap"><table><tr><th>Atraso</th><th>Depende de</th><th>Fórmula</th></tr>
  <tr><td>Processamento</td><td>ver cabeçalho, erros, decidir a saída</td><td>µs</td></tr>
  <tr><td>Fila</td><td>tráfego que chega (congestão)</td><td>varia: intensidade La/R</td></tr>
  <tr><td>Transmissão</td><td>tamanho do pacote e ritmo da ligação</td><td><b>L / R</b></td></tr>
  <tr><td>Propagação</td><td>distância e velocidade do sinal</td><td><b>d / v</b></td></tr></table></div>
  <p>Transmissão ≠ propagação: transmitir é “empurrar” os bits para o cabo; propagar é o bit viajar no cabo. Um pacote maior ou uma ligação mais lenta aumentam a transmissão, nunca a propagação.</p>
  <p><b>RTT</b> nos exames = tempo de ida-e-volta <b>devido à propagação</b> (2·d/v). Por isso, mudar R ou L <b>não muda o RTT</b> — pergunta que já saiu três vezes.</p>
  <p><b>Intensidade de tráfego</b> La/R (a = pacotes/s que chegam): se tende para 1, a fila cresce sem limite; se a fila enche, há <b>perdas</b>.</p>`,
  key: 'Transmissão = L/R. Propagação = d/v. O RTT dos exames é só propagação: não depende de R nem de L.' },
{ id: 'n-tput', t: 'net', title: 'Débito, gargalo e bits em trânsito',
  html: `<p>Água a passar por canos de grossuras diferentes: o caudal no fim é o do cano mais fino.</p>
  <p><b>Débito</b> (throughput) fim-a-fim = taxa a que os bits chegam ao destino. Num caminho servidor (Rs) → cliente (Rc), o débito é <b>min(Rs, Rc)</b>: a ligação mais lenta é o <b>gargalo</b>. Se N fluxos partilham uma ligação de núcleo R, cada um tem no máximo R/N.</p>
  <p><b>Bits em trânsito</b> (produto largura de banda × atraso): quantos bits “cabem” no cabo ao mesmo tempo = <b>R × d/v</b>.</p>
  <p>Exemplo (exame 2024/25): 20 km, v = 2×10⁸ m/s → propagação 100 µs; a 100 Mbit/s cabem <b>10⁸ × 10⁻⁴ = 10 kbit</b> no cabo.</p>
  <p>Unidades: em redes, k = 10³ e M = 10⁶ (não 1024). Bytes → bits: ×8. Nos exames, “1 kByte” = 8 kbit.</p>
  <p><b>Taxa de erros (BER)</b> = bits com erro / bits transmitidos. Ex.: 128 erros em 100 min a 2048 kbit/s → 128 / (6000 × 2,048×10⁶) ≈ 1,04×10⁻⁸.</p>`,
  key: 'Débito = ritmo do gargalo. Bits em trânsito = R × tempo de propagação.' },

/* ---------------- APPLICATIONS, SOCKETS, P2P ---------------- */
{ id: 's-arch', t: 'sock', title: 'Arquiteturas e o que as aplicações pedem',
  html: `<p>Um restaurante (cliente-servidor): a cozinha está sempre no mesmo sítio e todos lhe pedem. Um jantar de partilha (P2P): cada convidado traz comida e também come a dos outros.</p>
  <ul><li><b>Cliente-servidor</b>: o servidor está sempre ligado, com endereço IP fixo e conhecido; os clientes iniciam o contacto e não falam diretamente entre si. Ex.: Web, correio.</li>
  <li><b>P2P</b>: pares que comunicam diretamente, ligam-se e desligam-se, mudam de IP; cada par que chega traz <b>capacidade de serviço</b> (escalabilidade própria). Ex.: BitTorrent.</li></ul>
  <p>Um <b>processo</b> é um programa a correr; processos em máquinas diferentes trocam mensagens através de <b>sockets</b> (a “porta” entre a aplicação e o transporte). Para identificar um processo remoto é preciso o <b>endereço IP</b> do host <b>e</b> o <b>número de porto</b>.</p>
  <p>O que uma aplicação pode precisar do transporte: <b>fiabilidade</b>, <b>débito</b>, <b>tempo</b> (atraso) e <b>segurança</b>. O TCP dá fiabilidade, controlo de fluxo e de congestão; o UDP não dá nada disso. <b>Nenhum</b> dá garantias de atraso ou de débito.</p>
  <div class="tbl-wrap"><table><tr><th>Protocolo</th><th>Transporte</th><th>Porto</th></tr>
  <tr><td>HTTP / HTTPS</td><td>TCP (HTTP/3: QUIC sobre UDP)</td><td>80 / 443</td></tr><tr><td>SMTP</td><td>TCP</td><td>25</td></tr>
  <tr><td>DNS</td><td>UDP (normalmente)</td><td>53</td></tr><tr><td>FTP</td><td>TCP</td><td>21 controlo, 20 dados</td></tr>
  <tr><td>POP3 / IMAP</td><td>TCP</td><td>110 / 143</td></tr></table></div>`,
  key: 'Processo remoto = IP + porto. TCP dá fiabilidade e controlo de congestão; nenhum transporte garante atraso ou débito.' },
{ id: 's-api', t: 'sock', title: 'A API de sockets',
  html: `<p>Uma central telefónica de empresa: o número da empresa é publicado (bind), a rececionista fica à espera (listen) e, quando alguém liga, passa a chamada para um ramal novo (accept) para continuar a atender outras.</p>
  <div class="tbl-wrap"><table><tr><th>Chamada</th><th>Para quê</th><th>Quem usa</th></tr>
  <tr><td>getaddrinfo()</td><td>consulta o <b>DNS</b>: nome → endereço IP</td><td>sobretudo clientes</td></tr>
  <tr><td>socket()</td><td>cria o socket (TCP: SOCK_STREAM; UDP: SOCK_DGRAM)</td><td>todos</td></tr>
  <tr><td>bind()</td><td>associa um <b>porto (bem-conhecido)</b> ao socket</td><td>servidores</td></tr>
  <tr><td>listen()</td><td>marca o socket TCP como passivo, à espera de ligações</td><td>servidor TCP</td></tr>
  <tr><td>accept()</td><td>aceita uma ligação e devolve um <b>socket novo</b> para esse cliente</td><td><b>só servidor TCP</b></td></tr>
  <tr><td>connect()</td><td>estabelece a ligação TCP (three-way handshake)</td><td>cliente TCP</td></tr>
  <tr><td>write()/read()</td><td>enviar/receber bytes numa ligação TCP</td><td>TCP</td></tr>
  <tr><td>sendto()/recvfrom()</td><td>enviar/receber um datagrama, com o endereço do outro lado</td><td>UDP</td></tr></table></div>
  <p><b>TCP é um fluxo de bytes</b>: os bytes de um write() podem ir em vários segmentos, e dois write() podem ir num só. <b>UDP preserva as mensagens</b>: cada sendto() dá exatamente <b>um</b> datagrama UDP, que chega inteiro ou não chega.</p>
  <p>Num servidor <b>UDP</b> há um só socket e o mesmo recvfrom() pode ler de clientes diferentes. Num servidor <b>TCP</b> cada cliente tem o seu socket (devolvido por accept), distinguido pelo tuplo (IP origem, porto origem, IP destino, porto destino).</p>`,
  key: 'bind = porto bem-conhecido; accept só no servidor TCP; getaddrinfo = DNS. UDP: 1 sendto = 1 datagrama. TCP: fluxo de bytes.' },
{ id: 's-select', t: 'sock', title: 'Vários clientes ao mesmo tempo: fork e select',
  html: `<p>Um empregado de mesa sozinho não fica parado à frente de uma mesa à espera que decidam: dá uma volta e atende quem levantar a mão. Isso é o <b>select()</b>.</p>
  <p>As leituras (read, recvfrom, accept, ler do stdin) <b>bloqueiam</b>: se o programa ficar à espera numa fonte, não atende as outras. Há duas soluções:</p>
  <ul><li><b>Processos concorrentes</b>: depois de cada accept(), um <b>fork()</b> cria um processo filho que trata desse cliente com o <b>socket novo</b>; o pai volta ao accept() no socket de escuta.</li>
  <li><b>select()</b>: num <b>só processo</b>, indica-se um conjunto de descritores (fd_set) — socket de escuta, sockets de clientes aceites, stdin, socket UDP… — e o select() bloqueia até <b>algum estar pronto para ler</b>, dizendo qual.</li></ul>
  <p>Num servidor TCP com select(), cada descritor devolvido por accept() é guardado (por exemplo num vetor) e acrescentado ao fd_set.</p>`,
  key: 'select() devolve, de um conjunto de descritores bloqueantes, os que já têm dados prontos para ler.' },
{ id: 's-p2p', t: 'sock', title: 'Tempo de distribuição: cliente-servidor vs P2P',
  html: `<p>Distribuir um ficheiro de F bits a N estações. u<sub>s</sub> = ritmo de upload do servidor, d<sub>min</sub> = menor ritmo de download, u<sub>i</sub> = upload de cada par.</p>
  <ul><li><b>Cliente-servidor</b>: o servidor tem de enviar N cópias. <b>D<sub>cs</sub> ≥ max( N·F/u<sub>s</sub> , F/d<sub>min</sub> )</b> → cresce linearmente com N.</li>
  <li><b>P2P</b>: o servidor só precisa de enviar <b>uma</b> cópia; os pares redistribuem. <b>D<sub>P2P</sub> ≥ max( F/u<sub>s</sub> , F/d<sub>min</sub> , N·F/(u<sub>s</sub> + Σu<sub>i</sub>) )</b> → cresce muito mais devagar.</li></ul>
  <p>Exemplo (exame 2021/22): F = 1 Gbit, N = 4, todos com 200 Mbit/s. F/u<sub>s</sub> = 5 s; F/d = 5 s; N·F/(u<sub>s</sub>+Σu<sub>i</sub>) = 4/1 = 4 s. D<sub>P2P</sub> = <b>5 s</b> (em cliente-servidor seria 20 s).</p>
  <p>Truque: o termo F/u<sub>s</sub> é muitas vezes o maior (o servidor tem de despejar pelo menos uma cópia inteira).</p>
  <p><b>BitTorrent</b>: o ficheiro é dividido em pedaços (chunks); pede-se primeiro o <b>mais raro</b>; envia-se aos pares que nos enviam mais (<b>tit-for-tat</b>), com um par “optimistamente desbloqueado” de vez em quando.</p>`,
  key: 'P2P: max(F/us, F/dmin, NF/(us+Σui)). O servidor só tem de enviar uma cópia.' },

/* ---------------- WEB AND HTTP ---------------- */
{ id: 'h-basics', t: 'http', title: 'HTTP: pedidos, respostas e estado',
  html: `<p>Uma página web é um ficheiro base (HTML) que referencia <b>objetos</b> (imagens, scripts…), cada um com o seu URL. O browser pede cada objeto com uma mensagem HTTP; o servidor responde. HTTP corre sobre <b>TCP, porto 80</b>.</p>
  <p>HTTP é <b>stateless</b>: o servidor não guarda nada sobre pedidos anteriores do cliente (para memória usa-se cookies). FTP e IMAP, pelo contrário, mantêm estado.</p>
  <p>Pedido: <code>GET /index.html HTTP/1.1\\r\\n</code> + cabeçalhos (<code>Host:</code>, <code>Connection:</code>, <code>If-Modified-Since:</code>…) + linha vazia. Métodos: GET, POST (dados no corpo), HEAD (só cabeçalhos), PUT, DELETE.</p>
  <p>Resposta: <b>status line</b> + cabeçalhos (<code>Date</code>, <code>Last-Modified</code>, <code>Content-Length</code>, <code>Content-Type</code>…) + objeto.</p>
  <div class="tbl-wrap"><table><tr><th>Código</th><th>Significado</th></tr><tr><td>200 OK</td><td>sucesso, objeto vai na resposta</td></tr>
  <tr><td>301 Moved Permanently</td><td>objeto mudou (novo URL em Location:)</td></tr><tr><td>304 Not Modified</td><td>resposta a GET condicional: usa a tua cópia</td></tr>
  <tr><td>400 Bad Request</td><td>pedido mal formado</td></tr><tr><td>404 Not Found</td><td>não existe</td></tr><tr><td>407 Proxy Authentication Required</td><td>o proxy exige autenticação</td></tr></table></div>
  <p><b>Virtual hosting</b> (lab 3): vários sites no mesmo IP; o servidor sabe qual servir pelo cabeçalho <b>Host:</b>.</p>`,
  key: 'HTTP: pedido/resposta sobre TCP 80, stateless. O cabeçalho Host permite vários sites no mesmo IP.' },
{ id: 'h-persist', t: 'http', title: 'Contar RTTs: persistente, paralelo, pipelining',
  html: `<p>Como pedir vários pratos: podes chamar o empregado, pedir um, esperar, despedi-lo e voltar a chamá-lo (não persistente); chamá-lo uma vez e pedir um de cada vez (persistente); ou pedir tudo de seguida (pipelining).</p>
  <ul><li><b>Não persistente</b> (padrão no HTTP/1.0): uma ligação TCP por objeto. Cada objeto custa <b>2 RTT</b> (1 para estabelecer TCP + 1 pedido/resposta) + tempo de transmissão.</li>
  <li><b>Persistente</b> (padrão no HTTP/1.1; no 1.0 com <code>Connection: keep-alive</code>): a ligação fica aberta. 1 RTT de TCP e depois <b>1 RTT por objeto</b>.</li>
  <li><b>Pipelining</b> (HTTP/1.1): numa ligação persistente, pede todos os objetos referenciados de uma vez → <b>1 RTT</b> para todos.</li>
  <li><b>Ligações paralelas</b>: k ligações ao mesmo tempo dividem os objetos em rondas.</li></ul>
  <div class="tbl-wrap"><table><tr><th>Base + N imagens</th><th>RTTs (sem contar transmissão)</th></tr>
  <tr><td>Não persistente, série</td><td>2 + 2N</td></tr><tr><td>Não persistente, k paralelas</td><td>2 + 2·⌈N/k⌉</td></tr>
  <tr><td>Persistente sem pipelining</td><td>2 + N</td></tr><tr><td>Persistente com pipelining</td><td>2 + 1 = 3</td></tr></table></div>
  <p>Exemplo (exame 2020/21): base + 4 imagens em HTTP/1.0: série = 10 RTT; com 2 paralelas = 2 + 2×2 = 6 RTT → poupa <b>4 RTT</b>. A transmissão dos objetos soma-se igual nos dois casos.</p>`,
  key: 'Não persistente: 2 RTT por objeto. Persistente: 1 RTT por objeto. Pipelining: 1 RTT para todos os referenciados.' },
{ id: 'h-ver', t: 'http', title: 'HTTP/1.0, 1.1, 2 e 3',
  html: `<ul><li><b>HTTP/1.0</b>: não persistente por omissão, mas o cabeçalho <code>Connection: keep-alive</code> torna a ligação persistente.</li>
  <li><b>HTTP/1.1</b>: persistente por omissão, pipelining, cabeçalho Host obrigatório. Problema: <b>head-of-line blocking</b> — um objeto grande à frente atrasa os pequenos atrás (as respostas vêm por ordem).</li>
  <li><b>HTTP/2</b>: <b>mantém a semântica</b> (métodos, códigos, cabeçalhos) mas muda o transporte das mensagens: enquadramento binário, objetos divididos em <b>tramas intercaladas</b> numa só ligação TCP (multiplexagem), prioridades, compressão de cabeçalhos e <b>server push</b> (o servidor envia objetos que não foram pedidos explicitamente).</li>
  <li><b>HTTP/3</b>: corre sobre <b>QUIC</b>, que corre sobre <b>UDP</b> (não TCP). QUIC junta estabelecimento de ligação e segurança num só RTT e evita o head-of-line blocking entre streams.</li></ul>
  <p>No exame 2022/23: base + 2 imagens com HTTP/1.1 e pipelining = 3 RTT + transmissões; com HTTP/2 e push, 2 RTT + transmissões.</p>`,
  key: 'HTTP/2 = mesma semântica, transporte mais eficiente (multiplexagem, push). HTTP/3 = QUIC sobre UDP.' },
{ id: 'h-cookie', t: 'http', title: 'Cookies',
  html: `<p>O cartão de cliente de uma loja: na primeira compra dão-te um número; das próximas vezes mostras o cartão e eles sabem quem és e o que compraste.</p>
  <p>Como o HTTP é stateless, os sites usam <b>cookies</b> para guardar estado. Quatro componentes:</p>
  <ol><li>cabeçalho <code>Set-Cookie:</code> na <b>resposta</b> HTTP (o servidor atribui um ID);</li>
  <li>cabeçalho <code>Cookie:</code> nos <b>pedidos</b> seguintes;</li>
  <li>ficheiro de cookies guardado no browser;</li>
  <li>base de dados no site, indexada pelo ID.</li></ol>
  <p>Servem para autenticação, carrinhos de compras, recomendações, estado de sessão. O preço: <b>privacidade</b> (cookies de terceiros seguem-te entre sites).</p>`,
  key: 'Set-Cookie na resposta, Cookie nos pedidos seguintes: estado por cima de um protocolo sem estado.' },
{ id: 'h-cache', t: 'http', title: 'Caches e GET condicional',
  html: `<p>Tens o jornal de ontem em casa. Antes de sair para comprar o de hoje, telefonas ao quiosque: “mudou alguma coisa desde ontem?”. Se não, ficas com o teu.</p>
  <p>Uma <b>cache web</b> (proxy, ou a cache do próprio browser) guarda objetos recentes: menos atraso para o cliente e menos tráfego na ligação de acesso da instituição.</p>
  <p>Problema: a cópia pode estar <b>desatualizada</b>. Solução: o <b>GET condicional</b>. Quando o objeto volta a ser pedido, o cliente envia o GET com <code>If-Modified-Since: &lt;data da cópia&gt;</code> (a data veio do <code>Last-Modified</code> da primeira resposta).</p>
  <ul><li>Se não mudou → <b>304 Not Modified</b>, sem o objeto. Usa-se a cópia.</li>
  <li>Se mudou → <b>200 OK</b> com o objeto novo.</li></ul>
  <p>Se o browser fizer um pedido <b>normal</b> (não condicional), o servidor simplesmente responde <b>200 OK</b> com o objeto inteiro, mesmo que não tenha mudado.</p>`,
  key: 'Objeto em cache pedido de novo → GET condicional (If-Modified-Since). Não mudou: 304. Pedido normal: sempre 200.' },
{ id: 'h-ftp', t: 'http', title: 'FTP: controlo fora de banda',
  html: `<p>Uma encomenda por telefone: falas com a loja numa linha (controlo) e a encomenda chega por outro caminho, numa carrinha (dados).</p>
  <ul><li>O cliente abre uma ligação TCP de <b>controlo</b> para o porto <b>21</b> do servidor: autenticação, mudar de diretoria, listar, pedir ficheiros.</li>
  <li>Cada ficheiro vai numa ligação TCP de <b>dados</b> separada (porto <b>20</b> do lado do servidor, no modo ativo), que fecha no fim do ficheiro.</li>
  <li>O controlo vai <b>fora de banda</b> (out-of-band), num canal diferente dos dados — ao contrário do HTTP, que vai dentro de banda.</li>
  <li>FTP é <b>stateful</b>: o servidor lembra-se do utilizador e da diretoria atual durante a sessão.</li></ul>`,
  key: 'FTP: controlo no porto 21 (fora de banda), uma ligação de dados por ficheiro, e guarda estado.' },

/* ---------------- E-MAIL AND DNS ---------------- */
{ id: 'd-mail', t: 'dns', title: 'Correio eletrónico: SMTP, POP3, IMAP',
  html: `<p>O correio em papel: levas a carta à tua estação de correios (SMTP), ela envia-a à estação do destinatário (SMTP), e o destinatário vai buscá-la à sua caixa (POP3, IMAP ou webmail).</p>
  <p><b>SMTP</b>: <b>TCP, porto 25</b>, protocolo de <b>envio (push)</b>, mensagens em <b>ASCII de 7 bits</b>. O HTTP, pelo contrário, é <b>pull</b>. Uma sessão típica:</p>
  <p><code>220</code> (servidor pronto) → <code>EHLO</code>/<code>HELO</code> → <code>MAIL FROM:</code> → <code>RCPT TO:</code> (um por destinatário) → <code>DATA</code> → <code>354</code> → cabeçalhos + corpo, terminado por uma linha com “.” → <code>250</code> → <code>QUIT</code> → <code>221</code>.</p>
  <p><b>Envelope vs cabeçalho</b>: os <code>RCPT TO:</code> dizem a quem entregar; o <code>To:</code>/<code>Cc:</code> dentro de DATA é só texto mostrado ao leitor. Por isso podem ser diferentes: um destinatário em <b>Bcc</b> tem um RCPT TO mas não aparece no cabeçalho.</p>
  <p><b>MIME</b>: cabeçalhos (<code>Content-Type</code>, <code>Content-Transfer-Encoding</code>) para anexos e multipart. Dados binários (imagens) são codificados em <b>base64</b> porque o SMTP só transporta ASCII de 7 bits.</p>
  <p>Acesso à caixa: <b>POP3</b> (descarrega, simples, não guarda estado entre sessões), <b>IMAP</b> (mensagens e pastas ficam no servidor, guarda estado), <b>HTTPS</b> (webmail no browser).</p>`,
  key: 'SMTP = envio (push, TCP 25, ASCII 7 bits → base64). Ler: POP3/IMAP, ou HTTPS no browser. RCPT TO ≠ To: (Bcc).' },
{ id: 'd-dns', t: 'dns', title: 'DNS: uma base de dados distribuída',
  html: `<p>Uma lista telefónica gigante não cabe num só livro nem numa só biblioteca: há um índice geral (raiz) que te manda para a lista de cada país (TLD), que te manda para a lista da empresa (autoritativo).</p>
  <p>O DNS traduz <b>nomes em endereços IP</b> (e mais: aliases, servidores de correio, distribuição de carga). Corre sobre <b>UDP, porto 53</b>. Não é centralizado porque um só servidor seria um ponto único de falha, teria tráfego enorme, ficaria longe de muitos e seria impossível de manter.</p>
  <ul><li><b>Servidores raiz</b>: sabem onde estão os servidores TLD.</li>
  <li><b>TLD</b> (.pt, .com, .org…): sabem os servidores autoritativos de cada domínio.</li>
  <li><b>Autoritativos</b>: têm os registos de um domínio (ex.: tecnico.ulisboa.pt).</li>
  <li><b>Servidor local</b> (do ISP ou da instituição): não pertence à hierarquia; recebe as perguntas dos hosts e resolve por eles, guardando em <b>cache</b>.</li></ul>`,
  key: 'Raiz → TLD → autoritativo. O servidor local faz o trabalho pelo host e guarda tudo em cache.' },
{ id: 'd-query', t: 'dns', title: 'Consultas iterativas, recursivas e cache',
  html: `<ul><li><b>Iterativa</b>: o servidor contactado responde “não sei, pergunta a este”. O servidor local vai perguntando: raiz → TLD → autoritativo. É o habitual.</li>
  <li><b>Recursiva</b>: o servidor contactado assume a tarefa e devolve a resposta final. O host faz uma pergunta recursiva ao servidor local; se a raiz e os TLD também resolvessem recursivamente, ficariam sobrecarregados.</li></ul>
  <p>Quando o servidor local não tem a tradução (nem nada útil em cache), começa por consultar <b>um servidor raiz</b>. Na prática os endereços dos TLD costumam estar em cache, poupando a raiz.</p>
  <p><b>Cache</b>: cada servidor que aprende uma tradução guarda-a durante o <b>TTL</b> do registo. Desvantagem: uma entrada pode ficar desatualizada até o TTL expirar.</p>
  <p>Lab 4: <code>dig +trace</code> mostra o caminho iterativo desde a raiz.</p>`,
  key: 'Host → local: recursiva. Local → raiz → TLD → autoritativo: iterativas. Cache durante o TTL.' },
{ id: 'd-rr', t: 'dns', title: 'Registos DNS (RR) e o dig',
  html: `<p>Formato: <b>(nome, TTL, classe, tipo, valor)</b>.</p>
  <div class="tbl-wrap"><table><tr><th>Tipo</th><th>Nome</th><th>Valor</th></tr>
  <tr><td><b>A</b></td><td>nome de host</td><td>endereço IPv4</td></tr><tr><td><b>AAAA</b></td><td>nome de host</td><td>endereço IPv6</td></tr>
  <tr><td><b>NS</b></td><td>domínio</td><td>nome do servidor autoritativo do domínio</td></tr>
  <tr><td><b>CNAME</b></td><td>alias</td><td>nome canónico (o “verdadeiro”)</td></tr>
  <tr><td><b>MX</b></td><td>domínio</td><td>servidor de correio do domínio (com prioridade)</td></tr>
  <tr><td><b>SOA</b></td><td>zona</td><td>servidor principal, email do administrador, número de série</td></tr></table></div>
  <p>Ler uma cadeia: <code>www.rc.pt CNAME lab.rc.pt</code> e <code>lab.rc.pt A 193.136.138.76</code> → www e lab são <b>a mesma máquina</b>, com IP 193.136.138.76. Um <code>NS</code> diz o <b>nome</b> do servidor; o IP desse servidor vem num <code>A</code> (no dig, na secção ADDITIONAL).</p>
  <p>Saída do dig: QUESTION (o que se perguntou), ANSWER (a resposta), AUTHORITY (servidores NS do domínio), ADDITIONAL (os A desses servidores). Vários registos A para o mesmo nome = distribuição de carga.</p>`,
  key: 'A = IP. NS = nome do servidor do domínio (o IP dele vem noutro A). CNAME = alias. MX = correio.' },
]);

/* ===== RC lessons: transport layer (UDP, reliable transfer, TCP, flow and congestion control) ===== */
STUDY.lessons('rc', [
{ id: 't-mux', t: 'tcp', title: 'Multiplexagem e desmultiplexagem',
  html: `<p>A história dos slides: os 3 porquinhos vivem em casa da tia Alice e escrevem a 3 primos em casa do tio Bob. A tia junta as cartas e manda-as pelos CTT; o tio recebe e distribui pelos primos. <b>Casas</b> = computadores, <b>porquinhos</b> = processos, <b>cartas</b> = mensagens, <b>envelopes</b> = segmentos, <b>tios</b> = transporte, <b>CTT</b> = rede (IP).</p>
  <p>A rede (IP) leva datagramas de <b>computador</b> a <b>computador</b>. O transporte usa os <b>portos</b> para entregar ao <b>processo</b> certo:</p>
  <ul><li><b>Multiplexagem</b> (no emissor): juntar dados de vários sockets, cada um com o seu cabeçalho de transporte (porto origem, porto destino).</li>
  <li><b>Desmultiplexagem</b> (no recetor): usar os cabeçalhos para entregar cada segmento ao socket certo.</li></ul>
  <div class="tbl-wrap"><table><tr><th></th><th>Socket identificado por</th><th>Consequência</th></tr>
  <tr><td><b>UDP</b></td><td>(IP destino, porto destino)</td><td>datagramas de clientes diferentes para o mesmo porto vão para o <b>mesmo</b> socket</td></tr>
  <tr><td><b>TCP</b></td><td>(IP origem, porto origem, IP destino, porto destino)</td><td>cada ligação tem o seu socket; um servidor web tem um socket por cliente no porto 80</td></tr></table></div>
  <p>Os protocolos de transporte só correm nos <b>hosts</b>, não nos encaminhadores nem nos comutadores.</p>`,
  key: 'UDP desmultiplexa por (IP destino, porto destino). TCP precisa dos 4 valores.' },
{ id: 't-udp', t: 'tcp', title: 'UDP: o mínimo possível',
  html: `<p>Um postal: escreves, metes no correio e não sabes se chegou. Sem envelope de ida e volta, sem confirmação.</p>
  <p>O UDP acrescenta ao IP só duas coisas: <b>multiplexagem</b> (portos) e <b>deteção de erros</b> (checksum). Cabeçalho de <b>8 bytes</b>: porto origem, porto destino, comprimento, checksum.</p>
  <ul><li><b>Sem ligação</b>: não há handshake (não se perde um RTT a começar).</li>
  <li><b>Sem estado</b> nas pontas: um servidor aguenta mais clientes.</li>
  <li><b>Sem controlo de congestão</b>: envia ao ritmo que a aplicação quiser.</li>
  <li><b>Não fiável</b>: segmentos podem perder-se ou chegar fora de ordem.</li></ul>
  <p>Usado em DNS, streaming, jogos, VoIP, SNMP, e no <b>QUIC</b> (HTTP/3), que põe fiabilidade e controlo de congestão por cima.</p>`,
  key: 'UDP = IP + portos + checksum. Sem ligação, sem estado, sem controlo de congestão.' },
{ id: 't-rdt', t: 'tcp', title: 'Transferência fiável: stop-and-wait',
  html: `<p>Ditar um número de telefone: dizes um algarismo e esperas o “sim” antes de dizer o seguinte. Se não ouves nada, repetes.</p>
  <p>Ingredientes de qualquer protocolo fiável:</p>
  <ul><li><b>Checksum</b>: detetar bits trocados.</li><li><b>ACK</b>: o recetor confirma.</li>
  <li><b>Números de sequência</b>: distinguir um pacote novo de uma retransmissão (se um ACK se perder).</li>
  <li><b>Temporizador</b>: se o ACK não chega, retransmite.</li></ul>
  <p><b>Stop-and-wait</b>: envia um pacote e espera o ACK. Eficiência (utilização do emissor):</p>
  <p style="text-align:center"><b>U = (L/R) / (RTT + L/R)</b></p>
  <p>Exemplo (exame 2021/22): 8 Mbit/s, 200 km a 200 000 km/s, tramas de 1000 bytes. L/R = 8000/8×10⁶ = 1 ms. Propagação = 1 ms → RTT = 2 ms. U = 1 / (2 + 1) = <b>0,33</b>.</p>
  <p>Em ligações longas e rápidas (RTT grande, L/R pequeno) o stop-and-wait desperdiça quase tudo: a solução é ter vários pacotes em voo (janela deslizante).</p>`,
  key: 'Stop-and-wait: U = (L/R) / (RTT + L/R). Péssimo quando o RTT é grande face a L/R.' },
{ id: 't-pipe', t: 'tcp', title: 'Janela deslizante: Go-Back-N e Selective Repeat',
  html: `<p>Em vez de esperar por cada ACK, o emissor pode ter até <b>W</b> pacotes enviados e ainda não confirmados (“em voo”).</p>
  <div class="tbl-wrap"><table><tr><th></th><th>Go-Back-N</th><th>Selective Repeat</th></tr>
  <tr><td>Janela do emissor</td><td>W &gt; 1</td><td>W &gt; 1</td></tr>
  <tr><td>Janela do recetor</td><td><b>1</b>: só aceita o pacote esperado, descarta os fora de ordem</td><td>W: guarda os fora de ordem</td></tr>
  <tr><td>ACKs</td><td><b>cumulativos</b></td><td>individuais</td></tr>
  <tr><td>Perda</td><td>retransmite esse e <b>todos os seguintes</b></td><td>retransmite só o perdido</td></tr>
  <tr><td>Temporizadores</td><td>um (o do mais antigo)</td><td>um por pacote</td></tr></table></div>
  <p>Stop-and-wait é o caso W = 1 nos dois lados.</p>
  <p><b>Janela para 100% de eficiência</b>: o emissor tem de estar sempre a transmitir até chegar o primeiro ACK, ou seja, W·L/R ≥ L/R + RTT:</p>
  <p style="text-align:center"><b>W ≥ (L/R + RTT) / (L/R) = 1 + RTT·R/L</b> pacotes</p>
  <p>Exemplo (exame 2022/23): 10 Mbit/s, propagação 2 ms em cada sentido (RTT 4 ms), pacotes de 10 kbit → L/R = 1 ms → W ≥ (1 + 4)/1 = <b>5</b>. Se não te derem o tamanho dos pacotes, usa o produto <b>R × RTT</b> (bits em voo).</p>`,
  key: 'GBN: recetor com janela 1 e ACKs cumulativos. SR: recetor guarda fora de ordem. Janela mínima = 1 + RTT/(L/R).' },
{ id: 't-tcp', t: 'tcp', title: 'TCP: números de sequência, ACKs e handshake',
  html: `<p>O TCP vê os dados como um <b>fluxo de bytes numerados</b>. Como as páginas de um livro enviado por partes: cada parte diz “começo na página 1001” e o leitor responde “já tenho tudo até à 1500, manda a partir da 1501”.</p>
  <ul><li><b>Número de sequência</b> de um segmento = número do <b>primeiro byte</b> de dados que leva.</li>
  <li><b>Número de ACK</b> = número do <b>próximo byte que o recetor espera</b>. Os ACKs são <b>cumulativos</b>: ACK n confirma tudo até n−1.</li></ul>
  <p><b>Three-way handshake</b>: <code>SYN, seq=x</code> → <code>SYN+ACK, seq=y, ack=x+1</code> → <code>ACK, seq=x+1, ack=y+1</code>. x e y são números iniciais aleatórios (32 bits). O SYN “gasta” um número: o primeiro byte de dados é <b>x+1</b>. O cliente já pode levar dados (ex.: o pedido HTTP) no <b>3.º segmento</b>.</p>
  <p>Exemplo: ISN = 300, três segmentos de 200 bytes → seq <b>301, 501, 701</b>; ACKs <b>501, 701, 901</b>.</p>
  <p><b>Portos</b>: o servidor usa o bem-conhecido (80 para HTTP); o cliente usa um porto efémero (&gt; 1023), escolhido pelo sistema. Na resposta trocam de lugar.</p>
  <p><b>Fecho</b>: cada lado envia FIN e recebe o ACK (FIN, ACK, FIN, ACK). O primeiro a fechar espera um tempo (TIME_WAIT).</p>`,
  key: 'seq = 1.º byte do segmento. ACK = próximo byte esperado (cumulativo). Depois de SYN x, os dados começam em x+1.' },
{ id: 't-ack', t: 'tcp', title: 'Quando o TCP envia ACKs (e retransmite)',
  html: `<p>Regras do recetor TCP (RFC 5681):</p>
  <div class="tbl-wrap"><table><tr><th>Chega…</th><th>O recetor…</th></tr>
  <tr><td>segmento na ordem, tudo antes já confirmado</td><td><b>delayed ACK</b>: espera até 500 ms por outro segmento; se chegar, um só ACK confirma os dois</td></tr>
  <tr><td>segmento na ordem, há outro à espera de ACK</td><td>envia logo um ACK cumulativo (confirma os dois)</td></tr>
  <tr><td>segmento <b>fora de ordem</b> (falta um)</td><td>envia logo um <b>ACK duplicado</b> com o byte que falta</td></tr>
  <tr><td>segmento que preenche o buraco</td><td>envia logo um ACK cumulativo</td></tr></table></div>
  <p>Por isso, menos ACKs do que segmentos é normal: <b>delayed ACK</b>. Exemplo (exame 2021/22, 2.ª época): 6 segmentos (seq 1 a 5001) e 4 ACKs: N, N+2000, N+4000, N+5000 → o último confirma tudo: N+5000 = 6001 → <b>N = 1001</b> (o 1.º segmento foi confirmado sozinho, os outros aos pares).</p>
  <p><b>Fast retransmit</b>: 3 ACKs duplicados → retransmite logo o segmento em falta, sem esperar o timeout.</p>
  <p><b>Timeout</b>: tem de ser maior que o RTT, que varia. TimeoutInterval = EstimatedRTT + 4·DevRTT, com médias móveis exponenciais.</p>
  <p>Um ACK perdido não obriga a retransmitir se chegar um ACK maior antes do timeout: é cumulativo.</p>`,
  key: 'Delayed ACK: 1 ACK por cada 2 segmentos. Fora de ordem: ACK duplicado imediato. 3 duplicados: fast retransmit.' },
{ id: 't-flow', t: 'tcp', title: 'Controlo de fluxo: a janela anunciada',
  html: `<p>Encher um copo a partir de uma garrafa: quem bebe diz quanto espaço ainda há no copo, e quem serve não deita mais do que isso.</p>
  <p>O recetor tem um buffer; a aplicação lê dele ao seu ritmo. Em cada segmento o recetor anuncia o <b>espaço livre</b> no campo <b>receive window (rwnd)</b>. O emissor nunca tem mais do que rwnd bytes por confirmar. Assim o emissor não afoga o <b>recetor</b> (a congestão protege a <b>rede</b>).</p>
  <p style="text-align:center"><b>rwnd novo = rwnd anterior − bytes que chegaram + bytes que a aplicação leu</b></p>
  <p>Exemplo (exame 2020/21): o cliente enviou ACK 3250 e janela 2000. Chega um segmento com 1250 bytes; entretanto a aplicação leu 750. Novo ACK = 3250 + 1250 = <b>4500</b>; nova janela = 2000 − 1250 + 750 = <b>1500</b>.</p>`,
  key: 'rwnd = espaço livre no buffer do recetor. Protege o recetor; a congestão protege a rede.' },
{ id: 'c-princ', t: 'cong', title: 'Congestão: porquê e quem a controla',
  html: `<p>Uma autoestrada à hora de ponta: carros a mais e todos andam devagar; se ainda por cima as saídas estão entupidas, o trânsito pára mesmo com muita gente a tentar entrar.</p>
  <p><b>Congestão</b> = demasiadas fontes a enviar depressa demais para a rede aguentar. Sintomas: <b>atrasos de fila longos</b> e <b>perdas</b> (buffers cheios). Custos: retransmissões desnecessárias e capacidade desperdiçada em pacotes que acabam descartados mais à frente.</p>
  <ul><li><b>Fim-a-fim</b> (o TCP clássico): a rede não diz nada; os hosts <b>inferem</b> a congestão a partir de perdas e atrasos.</li>
  <li><b>Assistido pela rede</b>: os encaminhadores avisam explicitamente (bits ECN, ritmo indicado). Mais informação, mas exige que a rede colabore.</li></ul>
  <p>Nenhum é “sempre melhor”: o fim-a-fim encaixa no princípio de rede simples; o assistido reage mais cedo.</p>
  <p>Controlo de <b>fluxo</b> ≠ controlo de <b>congestão</b>: o primeiro protege o recetor (rwnd), o segundo a rede (cwnd). O emissor respeita os dois: janela efetiva = <b>min(cwnd, rwnd)</b>.</p>`,
  key: 'TCP: controlo de congestão fim-a-fim, inferido por perdas. Janela efetiva = min(cwnd, rwnd).' },
{ id: 'c-ss', t: 'cong', title: 'Slow start e congestion avoidance',
  html: `<p>Encher um balão sem saber quanto aguenta: primeiro sopras com força (duplicas), e quando te aproximas do tamanho em que rebentou da última vez, passas a soprar devagar.</p>
  <p>O emissor envia ~<b>cwnd</b> bytes por RTT (débito ≈ cwnd/RTT).</p>
  <ul><li><b>Slow start</b> (início da ligação): cwnd = <b>1 MSS</b>; por cada ACK recebido, <b>cwnd += 1 MSS</b> → a janela <b>duplica a cada RTT</b> (1, 2, 4, 8…). Começa devagar mas cresce exponencialmente.</li>
  <li>Quando cwnd chega ao <b>limiar (ssthresh)</b> → passa a <b>congestion avoidance</b>: por cada ACK, <b>cwnd += MSS·MSS/cwnd</b> → cresce <b>1 MSS por RTT</b> (linear).</li></ul>
  <p>Exemplo: ssthresh = 8 MSS. Rondas (em MSS): 1, 2, 4, 8 (chega ao limiar), 9, 10, 11…</p>`,
  key: 'Slow start: +1 MSS por ACK (duplica por RTT). Congestion avoidance: +MSS²/cwnd por ACK (+1 MSS por RTT).' },
{ id: 'c-events', t: 'cong', title: 'Perdas: timeout vs 3 ACKs duplicados',
  html: `<p>O TCP trata as duas formas de perda de maneira diferente, porque dizem coisas diferentes sobre a rede:</p>
  <div class="tbl-wrap"><table><tr><th>Evento</th><th>O que sugere</th><th>ssthresh</th><th>cwnd</th><th>Estado seguinte</th></tr>
  <tr><td><b>Timeout</b></td><td>congestão grave: nada está a passar</td><td>cwnd/2</td><td><b>1 MSS</b></td><td>slow start</td></tr>
  <tr><td><b>3 ACKs duplicados</b> (TCP Reno)</td><td>congestão ligeira: os segmentos seguintes chegam</td><td>cwnd/2</td><td>ssthresh + 3 MSS</td><td>fast recovery</td></tr>
  <tr><td>ACK novo em fast recovery</td><td>a perda foi recuperada</td><td>igual</td><td>= ssthresh</td><td>congestion avoidance</td></tr>
  <tr><td>cwnd ≥ ssthresh em slow start</td><td>—</td><td>igual</td><td>igual</td><td>congestion avoidance</td></tr></table></div>
  <p>Resumo usado em perguntas de escolha múltipla: com 3 ACKs duplicados, ssthresh e cwnd passam (aproximadamente) a <b>cwnd/2</b> e continua em crescimento <b>linear</b>; com timeout, cwnd volta a <b>1 MSS</b> e recomeça o slow start.</p>
  <p>O TCP <b>Tahoe</b> (antigo) volta a 1 MSS nos dois casos.</p>`,
  key: 'Timeout: cwnd = 1 MSS, slow start. 3 dup ACKs: cwnd ≈ cwnd/2, fast recovery → linear. Em ambos ssthresh = cwnd/2.' },
{ id: 'c-aimd', t: 'cong', title: 'AIMD, justiça e CUBIC',
  html: `<p>No regime normal o TCP faz <b>AIMD</b>: aumento aditivo (+1 MSS por RTT) e diminuição multiplicativa (÷2 a cada perda). O gráfico de cwnd é um <b>dente de serra</b>.</p>
  <p>Se a janela anda entre W/2 e W, o débito médio é ≈ <b>0,75 · W / RTT</b>.</p>
  <p><b>Justiça</b>: K ligações TCP no mesmo gargalo de ritmo R tendem a ficar com R/K cada (o AIMD converge para a partilha igual). Mas: uma aplicação que abre várias ligações paralelas leva mais; e o UDP não abranda nada.</p>
  <p><b>TCP CUBIC</b> (o padrão no Linux): lembra-se de W<sub>max</sub>, o tamanho onde houve perda. Depois de uma perda cresce <b>depressa enquanto está longe</b> de W<sub>max</sub> e <b>devagar perto dele</b>. Vantagem: recupera o débito mais rapidamente sem provocar logo outra perda.</p>`,
  key: 'AIMD = dente de serra; K ligações → R/K cada. CUBIC: rápido longe de Wmax, lento perto.' },
{ id: 'c-table', t: 'cong', title: 'Como preencher a tabela de slow start do exame',
  html: `<p>O problema grande de TCP pede uma tabela com, para cada segmento: <b>t</b> (instante), <b>SN</b>, <b>D</b> (dados, em MSS), <b>AN</b> e <b>cwnd</b>. Método:</p>
  <ol><li><b>Handshake</b> (t = 0 até 1 RTT): SYN com SN = ISN do cliente; SYN+ACK com SN = ISN do servidor e AN = ISN cliente + 1; ACK com AN = ISN servidor + 1. D = 0.</li>
  <li><b>Rondas</b>: em cada RTT o emissor envia min(cwnd, rwnd, dados que faltam) segmentos, todos “ao mesmo tempo” (RTT ≫ L/R).</li>
  <li><b>SN</b> de cada segmento = SN do anterior + bytes do anterior. O primeiro byte de dados é ISN + 1.</li>
  <li><b>AN</b> de cada ACK = SN do segmento confirmado + bytes dele (sem delayed ACK: um ACK por segmento).</li>
  <li><b>cwnd</b> sobe 1 MSS por ACK recebido: 1 → 2 → 4 → 8…</li></ol>
  <p>Exemplo: 7000 bytes, MSS 1000, ISN do emissor 49. Dados de 50 a 7049 = 7 segmentos. Ronda 1 (cwnd 1): SN 50. Ronda 2 (cwnd 2): 1050, 2050. Ronda 3 (cwnd 4): 3050, 4050, 5050, 6050. Último ACK: <b>7050</b>.</p>
  <p>Se o recetor anunciar rwnd = 2000 (2 MSS), a janela efetiva nunca passa de 2 segmentos por RTT, por maior que seja cwnd.</p>`,
  key: 'Por ronda: min(cwnd, rwnd) segmentos. SN = anterior + bytes. AN = SN confirmado + bytes. cwnd +1 MSS por ACK.' },
]);

/* --- courses/rc/lessons/network.js --- */
/* ===== RC lessons: network layer (data plane: IP, addressing, NAT, DHCP, ICMP, IPv6; control plane: routing, SDN) ===== */
STUDY.lessons('rc', [
/* ---------------- DATA PLANE ---------------- */
{ id: 'i-fwd', t: 'ip', title: 'Expedição vs encaminhamento',
  html: `<p>Uma viagem de carro: em cada rotunda escolhes a saída olhando para as placas (<b>expedição</b>, uma decisão local e rápida). Antes de sair de casa, planeaste o percurso no mapa (<b>encaminhamento</b>, uma decisão sobre a rede toda).</p>
  <ul><li><b>Expedição (forwarding)</b> — <b>plano de dados</b>: num encaminhador, mover o datagrama da porta de entrada para a porta de saída certa, consultando a <b>tabela de expedição</b>. Decisão <b>local</b>, em nanossegundos, feita em hardware.</li>
  <li><b>Encaminhamento (routing)</b> — <b>plano de controlo</b>: calcular os caminhos fim-a-fim e preencher/atualizar as tabelas de expedição. Algoritmos como estado-da-ligação e vetor-distância, em segundos.</li></ul>
  <p>Duas formas de fazer o plano de controlo: <b>tradicional</b> (cada encaminhador corre o algoritmo e conversa com os outros) ou <b>SDN</b> (um controlador logicamente centralizado calcula e instala as tabelas; os encaminhadores só fazem o plano de dados).</p>`,
  key: 'Expedição = decisão local, por datagrama (plano de dados). Encaminhamento = calcular as tabelas (plano de controlo).' },
{ id: 'i-router', t: 'ip', title: 'Dentro de um encaminhador',
  html: `<ul><li><b>Portas de entrada</b>: recebem a trama, retiram o datagrama e consultam a tabela de expedição (<b>maior prefixo</b>) para escolher a saída.</li>
  <li><b>Matriz de comutação</b> (switching fabric): liga entradas a saídas (memória, barramento ou rede de interligação).</li>
  <li><b>Portas de saída</b>: filas onde os datagramas esperam pela ligação; se enchem, há <b>perdas</b>. A política de escalonamento (FIFO, prioridades, round robin) decide quem sai primeiro.</li>
  <li><b>Processador de encaminhamento</b>: corre o plano de controlo (ou fala com o controlador SDN).</li></ul>
  <p>Também pode haver filas nas <b>entradas</b>, se a matriz for mais lenta do que as entradas juntas: aí aparece o <b>bloqueio head-of-line</b> (um datagrama à frente, à espera de uma saída ocupada, bloqueia os de trás que iam para saídas livres).</p>`,
  key: 'Entrada (consulta a tabela) → matriz de comutação → saída (fila). As filas, e as perdas, estão nas portas.' },
{ id: 'i-addr', t: 'ip', title: 'Endereços IPv4, máscaras e sub-redes',
  html: `<p>Uma morada: <b>rua</b> + <b>número da porta</b>. Todas as casas da mesma rua partilham o nome da rua. No IP, a “rua” é a <b>sub-rede</b> e a “porta” é o <b>host</b>.</p>
  <p>Um endereço IPv4 tem <b>32 bits</b> e pertence a uma <b>interface</b> (um encaminhador tem vários). A <b>máscara</b> (ou o prefixo /n) diz quantos bits da esquerda são da <b>rede</b>:</p>
  <ul><li>/24 = 255.255.255.0 · /25 = 255.255.255.128 · /26 = .192 · /27 = .224 · /23 = 255.255.254.0 · /22 = 255.255.252.0 · /21 = 255.255.248.0</li></ul>
  <p><b>Endereço de rede</b> = IP AND máscara (bits de host a 0). <b>Broadcast</b> = bits de host a 1. Hosts utilizáveis = 2<sup>32−n</sup> − 2.</p>
  <p>Truque para o octeto “partido”: o bloco tem tamanho <b>256 − valor da máscara</b> nesse octeto. Ex.: 193.136.143.89/25 → máscara .128 → blocos de 128 (0–127, 128–255) → 89 está no primeiro → rede <b>193.136.143.0/25</b>.</p>
  <p>Uma <b>sub-rede</b> = interfaces que se alcançam <b>sem passar por um encaminhador</b>. <b>CIDR</b>: a parte de rede tem tamanho arbitrário (a.b.c.d/x), em vez das antigas classes A/B/C.</p>
  <p>Gamas privadas (não circulam na Internet): <b>10.0.0.0/8</b>, <b>172.16.0.0/12</b>, <b>192.168.0.0/16</b>.</p>`,
  key: 'Rede = IP AND máscara. Bloco no octeto partido = 256 − máscara. Hosts = 2^(32−n) − 2.' },
{ id: 'i-same', t: 'ip', title: 'Entregar direto ou ao default gateway?',
  html: `<p>Antes de enviar um datagrama, o host faz uma pergunta: <b>o destino está na minha sub-rede?</b> Compara (IP destino AND a <b>sua</b> máscara) com (o seu IP AND a sua máscara).</p>
  <ul><li><b>Mesma sub-rede</b> → envia diretamente ao destino: a trama leva o <b>MAC do destino</b> (obtido por ARP).</li>
  <li><b>Sub-rede diferente</b> → envia ao <b>default gateway</b> (o encaminhador): a trama leva o <b>MAC do encaminhador</b>, mas o datagrama mantém o <b>IP do destino final</b>.</li></ul>
  <p>Se a tabela ARP estiver vazia, a <b>primeira mensagem</b> enviada é um <b>pedido ARP em broadcast</b> a perguntar o MAC do IP de destino (mesma rede) ou do <b>gateway</b> (rede diferente).</p>
  <p>Exemplo: 10.0.0.100 quer enviar para 10.0.0.130. Com /24 estão na mesma rede → direto. Com /25 (.0–.127 e .128–.255) estão em redes diferentes → gateway.</p>
  <p>Ao longo do caminho os <b>IPs</b> (origem e destino) mantêm-se; os <b>MACs</b> mudam em cada salto entre encaminhadores. Os comutadores (switches) são transparentes: não mudam nem o IP nem o MAC.</p>`,
  key: 'Mesma sub-rede: MAC do destino. Outra sub-rede: MAC do gateway. O IP de destino é sempre o final.' },
{ id: 'i-alloc', t: 'ip', title: 'Dividir o bloco de um ISP',
  html: `<p>O problema que sai na Parte III: um ISP tem um bloco (ex.: 194.24.160.0/19) e atribui blocos a organizações, pela ordem dos pedidos, “sempre o endereço base mais baixo disponível”.</p>
  <ol><li><b>Tamanho</b>: arredonda o pedido à potência de 2 seguinte. 500 → 512 = 2⁹ → /23. 1000 → 1024 → /22. 2000 → 2048 → /21.</li>
  <li><b>Alinhamento</b>: um bloco de 2<sup>k</sup> endereços tem de começar num múltiplo de 2<sup>k</sup>. No 3.º octeto: /23 → múltiplo de 2; /22 → múltiplo de 4; /21 → múltiplo de 8.</li>
  <li><b>Base mais baixa</b> livre e alinhada. Podem ficar buracos, que os pedidos seguintes preenchem.</li></ol>
  <p>Exemplo (exame 2022/23): 194.24.160.0/19; A = 500, B = 2000, C = 1000.</p>
  <ul><li>A: /23 em <b>194.24.160.0/23</b> (160.0–161.255).</li>
  <li>B: /21 tem de começar num múltiplo de 8 → 162 não serve → <b>194.24.168.0/21</b> (168.0–175.255).</li>
  <li>C: /22, múltiplo de 4, o mais baixo livre → <b>194.24.164.0/22</b> (164.0–167.255). (162–163 fica livre.)</li></ul>
  <p>Máscaras: /23 = 255.255.254.0; /22 = 255.255.252.0; /21 = 255.255.248.0.</p>`,
  key: 'Arredonda a 2^k, alinha a múltiplo de 2^k, escolhe a base livre mais baixa. B pode “saltar” por cima de C.' },
{ id: 'i-lpm', t: 'ip', title: 'Expedição pelo maior prefixo',
  html: `<p>Um carteiro com instruções: “tudo para Lisboa vai pela carrinha A; mas o que for para a Rua Augusta vai pela bicicleta B”. A instrução mais <b>específica</b> ganha.</p>
  <p>A tabela de expedição tem entradas (rede, máscara, interface). Para cada destino, procuram-se as entradas que o contêm e escolhe-se a de <b>prefixo mais longo</b>. A entrada 0.0.0.0/0 (default) apanha tudo o que não bater com nenhuma outra.</p>
  <p>Exemplo (exame 2020/21): destino 193.136.143.26, rotas 193.136.0.0/16, 193.136.143.0/24 e 193.136.143.0/25 → todas contêm o destino (26 &lt; 128), ganha a <b>/25</b>.</p>
  <p>Método rápido: para cada entrada, vê o <b>bloco</b> que ela cobre no octeto relevante. Ex.: 128.96.164.0/22 cobre 164–167 no 3.º octeto; 128.96.166.0/23 cobre 166–167. Destino 128.96.165.x → só a /22. Destino 128.96.166.x → as duas, ganha a /23.</p>`,
  key: 'Das entradas que contêm o destino, ganha a de prefixo mais longo. 0.0.0.0/0 é a última opção.' },
{ id: 'i-dhcp', t: 'ip', title: 'DHCP: obter um endereço',
  html: `<p>Chegas a um hotel sem reserva: gritas no átrio “alguém me dá um quarto?” (Discover), a receção responde “tens o 214” (Offer), tu dizes “fico com o 214” (Request) e eles confirmam (ACK). E o quarto é teu só até ao check-out (lease).</p>
  <ol><li><b>DHCP Discover</b>: o host ainda não tem IP: envia de 0.0.0.0 para <b>255.255.255.255</b> (broadcast), UDP 68 → 67.</li>
  <li><b>DHCP Offer</b>: o servidor propõe um IP (campo <b>yiaddr</b>) e um <b>lease time</b>.</li>
  <li><b>DHCP Request</b>: o host pede formalmente esse IP (em broadcast, porque podia haver vários servidores).</li>
  <li><b>DHCP ACK</b>: confirmado. <b>Só agora</b> o host tem o endereço.</li></ol>
  <p>Além do IP, o DHCP dá a <b>máscara</b>, o <b>default gateway</b> e o <b>servidor DNS</b>.</p>
  <p><b>Renovação</b>: o endereço é emprestado por um tempo (lease). A <b>50%</b> do lease o host pede a renovação ao mesmo servidor com um <b>DHCP Request</b>; se não tiver resposta, volta a tentar perto do fim (~85–87,5%); se o lease acabar, larga o endereço.</p>`,
  key: 'Discover → Offer → Request → ACK (só aqui tem IP). Renova com DHCP Request a 50% do lease.' },
{ id: 'i-nat', t: 'ip', title: 'NAT: uma casa, muitos moradores',
  html: `<p>Um prédio com uma só morada na rua: o porteiro recebe todas as cartas e sabe, pelo número que escreveu no envelope de resposta, a que apartamento cada uma pertence.</p>
  <p>A rede privada (ex.: 192.168.1.0/24) usa endereços privados; para fora, todos aparecem com o <b>IP público</b> do NAT. O NAT guarda uma <b>tabela de tradução</b>:</p>
  <div class="tbl-wrap"><table><tr><th>Lado privado</th><th>Lado público</th></tr><tr><td>192.168.0.10 : 3345</td><td>85.240.1.7 : 40001</td></tr></table></div>
  <ul><li><b>A sair</b>: troca (IP privado, porto) da <b>origem</b> por (IP público, porto novo).</li>
  <li><b>A entrar</b>: o servidor responde para (<b>IP público</b>, porto novo); o NAT consulta a tabela e troca o <b>destino</b> de volta para (IP privado, porto).</li></ul>
  <p>Uma mensagem do servidor web (porto 80) para o host atrás do NAT tem portanto: origem (IP do servidor, 80), destino (<b>IP público do NAT</b>, porto atribuído pelo NAT). O servidor <b>nunca vê</b> o IP privado.</p>
  <p><b>Capacidade</b>: o porto tem 16 bits → ~65 536 associações por IP público. Ex.: 3 IPs públicos, cada estação com até 96 processos a comunicar → 3 × 2¹⁶ / 96 = <b>2048</b> estações.</p>
  <p>Críticas: viola o fim-a-fim (o NAT mexe nos portos, que são da camada de transporte); servidores atrás de NAT precisam de <b>port forwarding</b> (lab 5).</p>`,
  key: 'Saída: o NAT troca a origem (IP privado:porto → IP público:porto novo). Entrada: troca o destino de volta.' },
{ id: 'i-fw', t: 'ip', title: 'Firewall e NAT com iptables (lab 5)',
  html: `<p>O iptables organiza regras em <b>tabelas</b> e <b>cadeias</b>. As regras de uma cadeia são testadas <b>por ordem</b>; a primeira que bate decide (ACCEPT, DROP…); se nenhuma bater, aplica-se a <b>política por omissão</b> da cadeia.</p>
  <ul><li>Tabela <b>filter</b>: <b>INPUT</b> (pacotes para a própria máquina), <b>OUTPUT</b> (gerados pela máquina), <b>FORWARD</b> (que só passam por ela, como num encaminhador).</li>
  <li>Tabela <b>nat</b>: <b>POSTROUTING</b> com SNAT/MASQUERADE (trocar a origem à saída: é o NAT da lição anterior) e <b>PREROUTING</b> com DNAT (trocar o destino à entrada: <b>port forwarding</b> para um servidor interno).</li></ul>
  <p><code>-I</code> insere no início da cadeia, <code>-A</code> acrescenta no fim; <code>-p tcp --dport 22</code> filtra protocolo e porto; <code>-j DROP</code> é a ação.</p>`,
  key: 'INPUT = para mim, OUTPUT = de mim, FORWARD = a passar. Primeira regra que bate decide. DNAT = port forwarding.' },
{ id: 'i-frag', t: 'ip', title: 'Cabeçalho IPv4 e fragmentação',
  html: `<p>Campos a conhecer: versão, comprimento do cabeçalho (normalmente 20 B), <b>comprimento total</b>, <b>identificador</b>, <b>flags</b> (MF = more fragments), <b>offset</b>, <b>TTL</b>, <b>protocolo</b> (6 = TCP, 17 = UDP), checksum do cabeçalho, IP origem e destino.</p>
  <p>Cada ligação tem um <b>MTU</b> (maior trama). Se o datagrama não cabe, um encaminhador IPv4 <b>fragmenta</b>:</p>
  <ul><li>Dados por fragmento ≤ MTU − 20, e <b>múltiplo de 8</b> (exceto o último).</li>
  <li><b>Offset</b> em unidades de <b>8 bytes</b>, a contar do início dos dados originais.</li>
  <li><b>MF = 1</b> em todos menos no último. Todos têm o mesmo identificador.</li>
  <li>A reconstrução só se faz no <b>destino final</b>; fragmentos podem voltar a ser fragmentados mais à frente.</li></ul>
  <p>Exemplo (exame 2020/21): 1200 B de dados, MTU1 = 1000, depois MTU2 = 500. Rede 1: 1000 − 20 = 980 → 976 (múltiplo de 8): fragmentos de 976 B (offset 0) e 224 B (offset 122). Rede 2: máximo 480 B: 976 → 480 + 480 + 16 (offsets 0, 60, 120); 224 passa inteiro (offset 122). Total length: <b>500, 500, 36, 244</b>; offsets <b>0, 60, 120, 122</b>; MF <b>1, 1, 1, 0</b>.</p>`,
  key: 'Dados por fragmento: ≤ MTU − 20 e múltiplo de 8. Offset = bytes/8. MF = 1 menos no último.' },
{ id: 'i-icmp', t: 'ip', title: 'TTL, ICMP, ping e traceroute',
  html: `<p>O <b>TTL</b> (time to live) é decrementado em cada encaminhador; quando chega a 0 o datagrama é <b>descartado</b>. Diz <b>quantos saltos</b> o datagrama ainda pode dar (não segundos), e evita que circule para sempre num ciclo.</p>
  <p>O <b>ICMP</b> é o protocolo de mensagens de controlo e erro do IP (viaja dentro de datagramas IP): <b>echo request/reply</b> (ping), <b>TTL exceeded</b>, <b>destination unreachable</b>…</p>
  <p><b>traceroute</b> (lab 2): envia pacotes com TTL = 1, 2, 3… O encaminhador onde o TTL chega a 0 descarta-o e devolve um ICMP <b>TTL exceeded</b>: a origem fica a saber o seu endereço. Continua até o destino responder (ICMP port unreachable). Assim descobre-se o caminho, salto a salto.</p>`,
  key: 'TTL = saltos que restam. traceroute usa TTL crescentes e as mensagens ICMP “TTL exceeded”.' },
{ id: 'i-v6', t: 'ip', title: 'IPv6 e a transição',
  html: `<p>Motivo: os 32 bits do IPv4 esgotaram-se. O IPv6 tem endereços de <b>128 bits</b> e um cabeçalho <b>fixo de 40 bytes</b>, mais simples de processar:</p>
  <ul><li>sem fragmentação nos encaminhadores (se não couber, devolve ICMPv6 “packet too big”);</li>
  <li>sem checksum do cabeçalho;</li><li>com <b>flow label</b> para identificar fluxos.</li></ul>
  <p>Não se pode mudar a Internet toda no mesmo dia. Duas formas de os pôr a conviver:</p>
  <ul><li><b>Dual stack</b> com tradução: encaminhadores que falam as duas versões convertem cabeçalhos IPv6 em IPv4. <b>Perde-se informação</b> (campos que não existem no IPv4, como o flow label).</li>
  <li><b>Túnel</b>: o datagrama IPv6 inteiro vai no <b>campo de dados</b> de um datagrama IPv4 a atravessar a zona IPv4. À saída é desembrulhado <b>sem perder nada</b>.</li></ul>
  <p>A mesma ideia de túnel serve para multicast em redes onde só alguns encaminhadores o suportam, e para VPNs (GRE, lab 8).</p>`,
  key: 'IPv6: 128 bits, cabeçalho fixo de 40 B, sem fragmentação nos encaminhadores. Túnel = IPv6 dentro de IPv4, sem perdas.' },

/* ---------------- CONTROL PLANE ---------------- */
{ id: 'r-ls', t: 'route', title: 'Estado da ligação: Dijkstra',
  html: `<p>Cada encaminhador faz uma fotografia da sua vizinhança (custos das suas ligações) e envia-a a <b>todos</b> (inundação). No fim, todos têm o <b>mapa completo</b> e cada um calcula sozinho os melhores caminhos com o algoritmo de <b>Dijkstra</b>. É o que faz o <b>OSPF</b>.</p>
  <p>Dijkstra a partir de u: em cada passo junta-se ao conjunto N' o nó com <b>menor distância</b> ainda não visitado e atualizam-se os vizinhos: D(v) = min(D(v), D(w) + c(w,v)). Ao fim de n passos, tem-se a árvore de caminhos mais curtos e daí a tabela (próximo salto para cada destino).</p>
  <p>Exemplo dos slides (u, v, w, x, y, z): a partir de u entram, por ordem, x (1), v (2) e y (2), w (3, via x-y), z (4, via x-y). Próximo salto de u para z: <b>x</b>.</p>
  <p>Propriedade útil: se o caminho mais curto de A para F passa por B, então o troço de B a F é um caminho mais curto <b>de B para F</b> — embora B possa usar <b>outro caminho com o mesmo custo</b>.</p>`,
  key: 'Estado da ligação: todos conhecem o mapa todo e correm Dijkstra. Complexidade O(n²) e muitas mensagens de inundação.' },
{ id: 'r-dv', t: 'route', title: 'Vetor-distância: Bellman-Ford',
  html: `<p>Ninguém tem o mapa. Cada encaminhador só sabe o custo para os <b>vizinhos</b> e o que os vizinhos lhe dizem: “eu chego a Z com custo 5”. Como perguntar o caminho a quem está ao lado.</p>
  <p style="text-align:center"><b>D<sub>x</sub>(y) = min<sub>v</sub> { c(x,v) + D<sub>v</sub>(y) }</b></p>
  <p>Cada nó guarda o seu vetor de distâncias (a todos os destinos) e os vetores dos vizinhos. Quando o seu vetor <b>muda</b>, envia-o aos vizinhos. É <b>iterativo, assíncrono e distribuído</b>, e converge. É o que faz o <b>RIP</b>.</p>
  <p>Exemplo (exame 2022/23): D<sub>Y</sub>(W) = min{ c(Y,X) + D<sub>X</sub>(W), c(Y,Z) + D<sub>Z</sub>(W), c(Y,W) + 0 } = min{5 + 1, 1 + 2, 4} = <b>3</b>, via Z.</p>
  <p>Tabela de encaminhamento: para cada destino, o vizinho que deu o mínimo.</p>`,
  key: 'Dx(y) = min sobre vizinhos v de c(x,v) + Dv(y). Envia o vetor quando muda.' },
{ id: 'r-cti', t: 'route', title: 'Contagem até ao infinito e envenenamento',
  html: `<p>No vetor-distância, <b>boas notícias</b> (um custo baixa) espalham-se depressa. <b>Más notícias</b> (uma ligação falha ou fica cara) espalham-se devagar: dois nós podem ficar a “enganar-se” um ao outro, cada um a julgar que o outro ainda chega ao destino, e a distância sobe aos poucos — a <b>contagem até ao infinito</b>.</p>
  <ul><li><b>Separação de horizontes</b> (split horizon): não anunciar uma rota ao vizinho por onde ela passa.</li>
  <li><b>Envenenamento de caminhos inversos</b> (poisoned reverse): anunciar-lhe essa rota com custo <b>∞</b>. Assim ele não volta a usar-nos para lá chegar.</li></ul>
  <p>Exemplo (exame 2021/22): X tem estimativas para Z de 15, 8, 16, 11 pelos vizinhos Y1, Y2, Y3, Y4. A ligação X–Y2 falha → novo melhor: <b>11 via Y4</b>.</p>
  <ul><li>Sem envenenamento: X anuncia 11 a Y1, Y3 e Y4.</li><li>Com envenenamento: anuncia 11 a Y1 e Y3, e <b>∞ a Y4</b> (porque vai por ele).</li></ul>
  <p>Limite: o envenenamento resolve ciclos entre <b>dois</b> nós, não ciclos maiores.</p>`,
  key: 'Más notícias viajam devagar (contagem até ao infinito). Envenenamento: anuncia ∞ ao vizinho por onde passas.' },
{ id: 'r-hier', t: 'route', title: 'Encaminhamento hierárquico: RIP, OSPF, BGP',
  html: `<p>A Internet tem milhões de redes: ninguém consegue correr Dijkstra sobre todas. Por isso organiza-se em <b>sistemas autónomos (AS)</b>, cada um com a sua administração.</p>
  <ul><li><b>Intra-AS</b>: cada AS escolhe o seu protocolo. <b>RIP</b>: vetor-distância, métrica = nº de saltos, máximo 15, para redes pequenas. <b>OSPF</b>: estado da ligação, várias métricas de custo, hierárquico (áreas), autenticação, para redes grandes.</li>
  <li><b>Inter-AS</b>: <b>BGP</b>, o mesmo para todos: anuncia a alcançabilidade de prefixos entre AS e escolhe rotas por <b>políticas</b> (comerciais), não só por desempenho.</li></ul>
  <p>Por isso A pode usar RIP e B e C OSPF: lá dentro cada um decide; entre eles falam BGP.</p>`,
  key: 'Dentro de cada AS, cada um escolhe (RIP pequeno/DV, OSPF grande/LS). Entre AS, todos usam BGP.' },
{ id: 'r-sdn', t: 'route', title: 'SDN: separar o controlo dos dados',
  html: `<p>Em vez de cada encaminhador decidir sozinho, um <b>controlador logicamente centralizado</b> vê a rede toda, corre as aplicações de rede (encaminhamento, balanceamento de carga, firewall) e instala regras nos equipamentos. Os encaminhadores/comutadores ficam só com o <b>plano de dados</b>.</p>
  <ul><li><b>Tabelas de fluxo</b> com regras <b>match + action</b>: o match pode olhar para campos de várias camadas (MAC, IP, portos); a ação pode ser encaminhar, descartar, modificar ou enviar ao controlador.</li>
  <li><b>OpenFlow</b>: o protocolo entre controlador e comutadores (interface “southbound”).</li>
  <li>Regras <b>reativas</b> (instaladas quando chega o primeiro pacote de um fluxo, que vai ao controlador) vs <b>proativas</b> (instaladas antes). Lab 7.</li></ul>
  <p>Melhor? Mais flexível e programável, mas o controlador é um ponto crítico (desempenho, fiabilidade, segurança). Depende.</p>`,
  key: 'SDN: controlador centralizado com o plano de controlo; os encaminhadores só fazem o plano de dados (match + action).' },
{ id: 'r-mcast', t: 'route', title: 'Broadcast e multicast',
  html: `<ul><li><b>Broadcast</b> na rede: inundação ingénua cria cópias infinitas em ciclos; soluções: inundação controlada (números de sequência) ou uma <b>árvore abrangente</b>.</li>
  <li><b>Multicast</b>: enviar para um <b>grupo</b>. Usa um <b>endereço IP especial de grupo</b> (classe D, 224.0.0.0/4), um protocolo local para os hosts aderirem ao grupo (<b>IGMP</b>) e protocolos de encaminhamento que constroem uma <b>árvore de distribuição</b> (por fonte ou partilhada, centrada num nó). A fonte não precisa de conhecer os destinatários.</li></ul>
  <p>Os encaminhadores só mantêm estado das árvores que passam por eles. Onde há encaminhadores que não falam multicast, usa-se um <b>túnel</b> (multicast dentro de unicast).</p>
  <p>IPTV (ex.: MEO): <b>PIM</b>, com modo denso (muitos membros, inundação e poda) e esparso (poucos membros, árvore centrada num ponto de encontro).</p>`,
  key: 'Multicast = endereço de grupo + IGMP + árvore de distribuição. Sem suporte no caminho: túnel.' },
]);

/* --- courses/rc/questions/net.js --- */
/* Store-and-forward drawing: N packets over the nodes in `cols`, transmission time 1 unit, propagation p per link. */
const sfDiagram = (cols, N, p, opt = {}) => {
  const M = cols.length - 1, m = [];
  for (let k = 0; k < N; k++) for (let j = 0; j < M; j++) { const s = k + j * (1 + p); m.push({ f: j, t: j + 1, a: s, b: s + p, w: 1, l: `P${k + 1}`, h: k === N - 1 }); }
  const end = (N - 1) + (M - 1) * (1 + p) + 1 + p;
  return { st: { c: cols, T: end * 1.04, u: opt.u || 'L/R', m, k: opt.k || [{ c: M, a: 0, b: end, l: opt.l || 'total' }], H: opt.H || 300 } };
};

  w: { 1: '1500 é em bytes/s. A pergunta é em bit/s: multiplica por 8.' } },
{ id: 'net-35', t: 'net', l: 3, les: 'n-switch', calc: true,
  q: 'Uma ligação de 1 Mbit/s é partilhada por utilizadores que precisam de 100 kbit/s quando ativos. Com comutação de circuitos, quantos utilizadores suporta?',
  o: ['10', '35', '100', '1'], a: 0,
  e: 'Com circuitos cada utilizador reserva 100 kbit/s, esteja ativo ou não: 1000/100 = **10**. Com pacotes (ativos 10% do tempo) suportaria cerca de 35 com baixíssima probabilidade de sobrecarga.' },
{ id: 'net-36', t: 'net', l: 3, les: 'n-tput', calc: true,
  q: 'Um sistema esteve a transmitir 50 minutos a 4 Mbit/s e houve 60 bits errados. Qual é a taxa de erros (BER)?',
  o: ['5×10⁻⁹', '5×10⁻⁸', '2,5×10⁻⁷', '3×10⁻¹⁰'], a: 0,
  e: 'Bits transmitidos = 50 × 60 × 4×10⁶ = 1,2×10¹⁰. BER = 60 / 1,2×10¹⁰ = **5×10⁻⁹**.' },

/* problema guiado 1: exame 2021/22, Parte II.1 */
{ id: 'net-40', t: 'net', l: 3, les: 'n-sf', calc: true, ch: 'sf-2122', step: '1/4', src: 'Exame 2021/22, Parte II.1',
  q: 'A envia a B 8 Mbit, em pacotes de 1 kByte, por um caminho com dois encaminhadores (1 Gbit/s, RTT 1 ms). Passo 1: quantos pacotes são?',
  o: ['1000', '8000', '1024', '125'], a: 0,
  e: '1 kByte = 8 kbit. 8 Mbit / 8 kbit = **1000 pacotes**.',
  w: { 1: '8000 seria com pacotes de 1 kbit. Converte bytes para bits.' } },
{ id: 'net-41', t: 'net', l: 3, les: 'n-sf', calc: true, ch: 'sf-2122', step: '2/4',
  q: 'Mesmo problema (pacotes de 1 kByte, ligações de 1 Gbit/s). Passo 2: tempo de transmissão de um pacote numa ligação?',
  o: ['8 µs', '1 µs', '8 ms', '0,8 µs'], a: 0,
  e: 'L/R = 8000 / 10⁹ = **8 µs**.' },
{ id: 'net-42', t: 'net', l: 3, les: 'n-sf', calc: true, ch: 'sf-2122', step: '3/4',
  q: 'Mesmo problema (dois encaminhadores entre A e B, L/R = 8 µs). Passo 3: quanto tempo extra paga o último pacote por causa do store-and-forward?',
  d: sfDiagram(['A', 'R1', 'R2', 'B'], 3, 0.25, { l: 'N·t + 2·t + prop' }),
  o: ['16 µs (2 retransmissões)', '24 µs (3 retransmissões)', '8 µs (1 retransmissão)', '0, porque a propagação domina'], a: 0,
  e: 'Há 3 ligações (A-R1, R1-R2, R2-B). O emissor transmite tudo na primeira; o último pacote ainda é retransmitido em **2** encaminhadores: 2 × 8 = **16 µs**.',
  w: { 1: 'A primeira transmissão já está contada em N·L/R. Só contam os encaminhadores (ligações − 1).' } },
{ id: 'net-43', t: 'net', l: 4, les: 'n-sf', calc: true, ch: 'sf-2122', step: '4/4',
  q: 'Mesmo problema: 1000 pacotes, L/R = 8 µs, dois encaminhadores, RTT 1 ms. Passo 4: quando recebe B o último bit?',
  o: ['8,516 ms', '9,016 ms', '8,016 ms', '8,524 ms'], a: 0,
  e: 't = N·L/R + 2·L/R + RTT/2 = 8 ms + 0,016 ms + 0,5 ms = **8,516 ms**.',
  w: { 1: 'A propagação de ida é RTT/2 = 0,5 ms, não o RTT inteiro.', 3: 'Contaste 3 retransmissões; com 2 encaminhadores são 2.' } },

/* problema guiado 2: exame 2022/23, Parte II.1 (ligações com ritmos diferentes) */
{ id: 'net-45', t: 'net', l: 3, les: 'n-sf', calc: true, ch: 'sf-2223', step: '1/3', src: 'Exame 2022/23 e 2021/22 2.ª época, Parte II.1',
  q: 'A envia a B um ficheiro de 2 Mbyte pelo caminho A-X-Y-B, em pacotes de 10 kbit. Passo 1: quantos pacotes?',
  o: ['1600', '200', '2000', '160'], a: 0,
  e: '2 Mbyte = 16 Mbit. 16 Mbit / 10 kbit = **1600 pacotes**.' },
{ id: 'net-46', t: 'net', l: 3, les: 'n-sf', calc: true, ch: 'sf-2223', step: '2/3',
  q: 'Mesmo problema: (A,X) e (Y,B) a 100 Mbit/s, (X,Y) a 10 Mbit/s, pacotes de 10 kbit. Passo 2: que ligação manda no tempo total, e quanto demora um pacote nela?',
  o: ['(X,Y), 1 ms por pacote', '(A,X), 0,1 ms por pacote', '(Y,B), 0,1 ms por pacote', 'Todas por igual, 0,4 ms'], a: 0,
  e: 'O gargalo é (X,Y): 10⁴ / 10⁷ = **1 ms** por pacote. Nas outras, 0,1 ms. Os pacotes chegam a X mais depressa do que X os consegue escoar: fazem fila e saem ao ritmo do gargalo.' },
{ id: 'net-47', t: 'net', l: 4, les: 'n-sf', calc: true, ch: 'sf-2223', step: '3/3',
  q: 'Mesmo problema: 1600 pacotes, 0,1 ms em (A,X), 1 ms em (X,Y), 0,1 ms em (Y,B), RTT 2 ms. Passo 3: tempo total até B receber tudo?',
  o: ['1601,2 ms ≈ 1,6 s', '1602,2 ms', '1920,0 ms', '161,2 ms'], a: 0,
  e: 'O 1.º pacote chega a X em 0,1 ms; X despeja os 1600 a 1 ms cada (1600 ms); o último ainda gasta 0,1 ms em (Y,B); + propagação RTT/2 = 1 ms. t = 0,1 + 1600 + 0,1 + 1 = **1601,2 ms**.',
  w: { 1: 'A propagação de ida é RTT/2 = 1 ms.', 2: '1920 ms seria somar 1600 × (0,1 + 1 + 0,1): os pacotes avançam em paralelo nas várias ligações.' } },

/* problema guiado 3: exame 2020/21 2.ª época, Parte II.1 */
{ id: 'net-48', t: 'net', l: 3, les: 'n-sf', calc: true, ch: 'sf-2021', step: '1/2', src: 'Exame 2020/21, 2.ª época, Parte II.1',
  q: 'Ficheiro de 200 kbit de A para B pelo caminho A-X-Y-B, pacotes de 10 kbit. (A,X) e (Y,B) a 40 Mbit/s, (X,Y) a 10 Mbit/s. Passo 1: tempo de transmissão de um pacote em cada ligação?',
  o: ['0,25 ms; 1 ms; 0,25 ms', '0,4 ms; 1 ms; 0,4 ms', '0,25 ms em todas', '2,5 ms; 10 ms; 2,5 ms'], a: 0,
  e: '10⁴ / 4×10⁷ = **0,25 ms**; 10⁴ / 10⁷ = **1 ms**.' },
{ id: 'net-49', t: 'net', l: 4, les: 'n-sf', calc: true, ch: 'sf-2021', step: '2/2',
  q: 'Mesmo problema (20 pacotes; 0,25 / 1 / 0,25 ms por ligação). Desprezando propagação e processamento, quanto tempo desde o 1.º bit em A até ao último bit em B?',
  o: ['20,5 ms', '30 ms', '21,25 ms', '20 ms'], a: 0,
  e: 't = 0,25 (1.º pacote até X) + 20 × 1 (X escoa tudo ao ritmo do gargalo) + 0,25 (último de Y a B) = **20,5 ms**.',
  w: { 1: '30 ms = 20 × (0,25 + 1 + 0,25): os pacotes avançam em paralelo nas várias ligações.' } },

/* --- nível 4: exames antigos --- */
{ id: 'net-50', t: 'net', l: 4, les: 'n-delay', src: 'Exame 2022/23 e 2021/22, P3',
  q: 'A e B estão ligados por uma ligação de R bit/s, a d metros, com velocidade de propagação v m/s. Como é afetado o RTT se o tamanho dos pacotes duplicar?',
  o: ['Mantém-se igual', 'Duplica', 'Diminui para metade', 'Aumenta 50%'], a: 0,
  e: 'RTT = 2·d/v (propagação). O tamanho L só afeta a **transmissão** L/R.' },
{ id: 'net-51', t: 'net', l: 4, les: 'n-sf', calc: true, src: 'Exame 2020/21, Parte II.2',
  q: 'A e B estão ligados a 100 Mbit/s por um caminho com dois encaminhadores; a propagação de A a B é 1 ms. A envia 40 kbit em pacotes de 10 kbit. Em que instante B recebe o último bit?',
  o: ['1,6 ms', '1,4 ms', '2,2 ms', '1,7 ms'], a: 0,
  e: 'N = 4, L/R = 0,1 ms. t = 4 × 0,1 + 2 × 0,1 + 1 = **1,6 ms**. (A propagação de 1 ms já é de A a B: soma-se uma vez.)',
  w: { 1: 'Faltam as 2 retransmissões do último pacote nos encaminhadores.', 3: 'Com 2 encaminhadores o último pacote é retransmitido 2 vezes, não 3.' } },
{ id: 'net-52', t: 'net', l: 4, les: 'n-sf', calc: true,
  q: 'A envia a B 4 Mbit em pacotes de 2 kByte por um caminho com três encaminhadores, todas as ligações a 200 Mbit/s, RTT 4 ms. Quando chega o último bit?',
  o: ['22,24 ms', '24,24 ms', '22,32 ms', '20,24 ms'], a: 0,
  e: 'L = 16 kbit, N = 4 Mbit / 16 kbit = 250. L/R = 16 000 / 2×10⁸ = 80 µs. t = 250 × 0,08 + 3 × 0,08 + 2 = 20 + 0,24 + 2 = **22,24 ms**.',
  w: { 1: 'Somaste o RTT inteiro; a ida é RTT/2 = 2 ms.', 2: 'Com 3 encaminhadores são 3 retransmissões (0,24 ms), não 4.' } },
{ id: 'net-53', t: 'net', l: 4, les: 'n-switch', src: 'Exame 2021/22, P2 (adaptada)',
  q: 'Porque é que, com o mesmo ritmo de ligação, enviar um ficheiro grande partido em pacotes chega mais cedo do que enviá-lo como uma só mensagem enorme, quando há encaminhadores pelo meio?',
  o: ['Porque os pacotes avançam em paralelo em ligações diferentes (pipelining), e só o último paga L/R em cada salto', 'Porque os pacotes pequenos se propagam mais depressa', 'Porque os encaminhadores não usam store-and-forward para pacotes pequenos', 'Não chega mais cedo: o tempo é sempre o mesmo'], a: 0,
  e: 'Com uma mensagem única de tamanho F, cada encaminhador espera os F bits todos: t ≈ M·F/R. Com pacotes, enquanto um pacote está na ligação 2 o seguinte já está na ligação 1: t ≈ F/R + (M−1)·L/R.' },
]);
